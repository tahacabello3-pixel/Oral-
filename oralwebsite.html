lp stones (denticles): Pulp stones or denticles are nodular, calcified masses appearing in either or both the coronal and root portions of the pulp. They are usually asymptomatic unless they imping on nerves or blood vessels."]},{"id":"pulp-27","type":"heading","title":"Pulp Stones (Denticles)","content":""},{"id":"pulp-28","type":"subheading","title":"Classification by Structure:","content":""},{"id":"pulp-29","type":"definition","title":"True denticles:","content":"Are similar in structure to dentin, they have dentinal tubules and contain the processes of the odontoblast that formed them.\nThey are rare and are usually located close to the apical foramen.\nA theory has been advanced that the development of the true denticles is caused by the inclusion of remnants of the epithelial root sheath within the pulp. These epithelial remnants induce the cells of the pulp to differentiate into odontoblasts, which then form the dentin masses called true pulp stones."},{"id":"pulp-30","type":"definition","title":"False denticles:","content":"They do not exhibit dentinal tubules but appear as concentric layers of calcified tissues.\nIn some cases these calcification sites appear within a bundle of collagen fibers.\nIn the center of these concentric layers of calcified tissue there may be remnants of necrotic and calcified cells.\nFalse denticles are usually found in the pulp chamber and often occur in groups."},{"id":"pulp-31","type":"definition","title":"Diffuse calcifications:","content":"Diffuse calcifications appear as irregular calcified deposits in the pulp tissue, usually following collagenous fiber bundles or blood vessels.\nSometimes they develop into larger masses but usually persist as calcified spicules.\nDiffuse calcifications are usually found in the root canal and less often in the coronal area.\nWhen diffuse calcification surrounds blood vessels, it is called dystrophic calcification."},{"id":"pulp-32","type":"subheading","title":"Classification by Relation to Dentin:","content":""},{"id":"pulp-33","type":"list","content":["Free denticles: are entirely surrounded by pulp tissue.","Attached denticles: are partly fused with the dentin.","Embedded denticles: are entirely surrounded by dentin."]}],"giveReasons":[{"reason":"Pulpitis causes severe, often poorly localized pain","explanation":"Because the pulp is enclosed within a rigid dentin chamber with no capacity for swelling, leading to rapid pressure buildup that compresses nerve fibers. The pulp contains predominantly C fibers (dull, aching pain — poor localization) making it difficult for the brain to identify the exact source.","cat":"clinical"},{"reason":"The pulp chamber decreases in size with age","explanation":"Because odontoblasts remain viable throughout the life of the tooth and continuously deposit secondary dentin on all pulpal walls. Over decades, this progressive deposition progressively narrows the pulp chamber and root canals, sometimes to near-obliteration.","cat":"histological"},{"reason":"Pulp stones (denticles) form within the pulp","explanation":"Because calcification can occur around degenerated cells, thrombi in blood vessels, or collagen fiber bundles that act as nuclei for mineral deposition. True denticles contain dentinal tubules (formed by entrapped odontoblast-like cells), while false denticles are irregular calcifications without tubular structure.","cat":"histological"},{"reason":"The Zone of Weil (cell-free zone) exists in the pulp","explanation":"Because odontoblasts actively migrate to the periphery of the pulp (toward the dentin), leaving a relatively cell-free space between the odontoblastic layer and the cell-rich zone. This zone is rich in unmyelinated nerve fibers (subodontoblastic plexus of Raschkow) and capillaries.","cat":"histological"},{"reason":"The dental pulp is classified as connective tissue","explanation":"Because it contains all the components of connective tissue: cells (fibroblasts, undifferentiated mesenchymal cells, odontoblasts, macrophages, dendritic cells), fibers (types I and III collagen), ground substance (glycosaminoglycans and glycoproteins), blood vessels, lymphatics, and nerves.","cat":"histological"},{"reason":"Pulp becomes more fibrous with advancing age","explanation":"Because aging fibroblasts gradually replace the gelatinous ground substance with more collagen fibers. This fibrosis is accompanied by decreased cell number, reduced vascularity, and decreased nerve fibers, collectively reducing the pulp's responsiveness, repair capacity, and pain sensitivity.","cat":"histological"}]},{"id":9,"slug":"pdl","title":"Periodontal Ligament (PDL)","subtitle":"2024 - Dr. Thouraya Milad Al-Hadi","category":"support","summary":"The periodontal ligament (PDL)is the soft, specialized connective tissue situated between the cementum covering the root of the tooth and the bone forming the socket wall.","keywords":["PDL","principal fibers","Sharpey's fibers","fibroblast","osteoblast","cementoblast","epithelial rests of Malassez","cementicles","oxytalan fibers","ground substance","dermatan sulfate","Ruffini","oxytalan","HERS","dental follicle"],"keyDefinitions":[{"term":"Periodontal Ligament","definition":"The periodontal ligament (PDL)is the soft, specialized connective tissue situated between the cementum covering the root of the tooth and the bone forming the socket wall."},{"term":"Sharpey's Fibers","definition":"At each end, all the principle collagen fiber bundles of the PDL are embedded in the cementum or bone. The embedded portion is referred to as Sharpey's fiber."},{"term":"Epithelial cell rests of Malassez","definition":"The epithelial cells in the PDL are remnants of HERS. Some cells from the fragmented root sheath from discrete masses surrounded by a basement membrane known as the epithelial cell rests of Malassez .they occur close to the cementum as cluster or strands of cells easily recognized in hematoxylin-eosin stained sections because their nuclei often stain deeply."},{"term":"Oxytalan Fibers","definition":"Oxytalan fibers are bundles of microfibrils. The Oxytalan fibers are numerous and dense in the cervical region of the ligament, where they run parallel to the gingival group of collagen fibers."},{"term":"Cementicles","definition":"Calcified bodies are sometimes found in the PDL. They may remain free in connective tissue, they may fuse into large calcified masses, or they may be joined with the cementum. As cementum thickness with the advancing age, it may envelope these bodies (embedded cementicles). When they are adherent to the cementum they from exocementoses."}],"importantPoints":["The periodontal ligament (PDL)is the soft, specialized connective tissue situated between the cementum covering the root of the tooth and the bone forming the socket wall.","PDL forms from cells of the dental follicle shortly after root formation begins.","Similar to all connective tissue the PDL consists of: cells. extracellular matrix (fibers and ground substance). Other structures: blood vessels, lymphatics, nerves. cementicles (calcified bodies).","Cells: a) synthetic cells (fibroblasts, cementoblasts, osteoblasts). b) Resorptive cells (fibroblasts, osteoclasts, in some situations cementoclasts). c) Undifferentiated mesenchymal cells. d) Defense cells. e) Epithelial rests of malassez.","The principle cells of the PDL are fibroblasts.","A single cell, the fibroblast, achieves remodeling of collagen, it is capable of simultaneously synthesizing and degrading collagen.","The oblique group is the most numerous in the periodontal ligament.","Ground substance of the PDL is made up of proteoglycans and glycoprotein. Dermatan sulfate is the principle molecule of the ligament. The PDL ground substance has been estimated to be 70% water."],"histologicalFeatures":["PDL fibroblasts are large cells with an extensive cytoplasm containing an abundance of organelles associated with protein synthesis and secretion (i.e. rough endoplasmic reticulum, golgi apparatus, and many secretory granules).","Ligament fibroblasts also have a well-developed cytoskeleton with a particularly prominent actin network.","Ligament fibroblasts also show frequent cell-to-cell contacts of the adherens and the gap junction types.","They are aligned along the general direction of the fiber bundles and have extensive processes that wrap around the bundles.","The collagen fibrils of the fiber bundles are being remodeled continuously.","Five gingival fiber groups: dentogingival, alveologingival, circular, dentoperiosteal, transseptal.","Oxytalan fibers: numerous and dense in cervical region, running parallel to gingival group of collagen fibers."],"clinicalNotes":["Importantly, in inflammatory situations, such as those associated with periodontal diseases, an increased expression of matrix metalloproteinases that aggressively destroys collagen.","Osteocasts degrade bone as a normal maintenance of bone however cementum do not normally remodel and can resorb the tissue under certain normal eruptive conditions (e.g. deciduous teeth) and under certain pathologic conditions including excessive physical forces and inflammation.","The epithelial cell rests of Malassez: It is possible that degenerated epithelial cells form calcified nodule."],"flashcards":[{"question":"What is the definition of the Periodontal Ligament?","answer":"The periodontal ligament (PDL)is the soft, specialized connective tissue situated between the cementum covering the root of the tooth and the bone forming the socket wall."},{"question":"What are the cells of the PDL?","answer":"a) synthetic cells (fibroblasts, cementoblasts, osteoblasts).\nb) Resorptive cells (fibroblasts, osteoclasts, in some situations cementoclasts)\nc) Undifferentiated mesenchymal cells.\nd) Defense cells.\ne) Epithelial rests of malassez."},{"question":"What are the characteristics of PDL fibroblasts?","answer":"The principle cells of the PDL are fibroblasts.\nPDL fibroblasts are large cells with an extensive cytoplasm containing an abundance of organelles associated with protein synthesis and secretion (i.e. rough endoplasmic reticulum, golgi apparatus, and many secretory granules).\nLigament fibroblasts also have a well-developed cytoskeleton with a particularly prominent actin network.\nLigament fibroblasts also show frequent cell-to-cell contacts of the adherens and the gap junction types.\nA single cell, the fibroblast, achieves remodeling of collagen, it is capable of simultaneously synthesizing and degrading collagen."},{"question":"Name the five principal fiber groups of the PDL and the force each resists.","answer":"1- The alveolar crest group: limits vertical and intrusive movements.\n2- The horizontal group: resist horizontal and tipping forces.\n3- The oblique group: most numerous — resist vertical and intrusive forces.\n4- The apical group: resist the vertical forces.\n5- The interradicular groups: resist vertical and lateral movements (found only between roots of multirooted teeth)."},{"question":"What are the five gingival fiber groups?","answer":"1- Dentogingival group: most numerous, extending from cervical cementum to lamina propria of the free and attached gingiva.\n2- Alveologingival group: radiate from the bone of the alveolar crest and extend into the lamina propria of the free and attached gingiva.\n3- Circular group: forms a band around the neck of the tooth, interlacing with other groups of fibers in the free gingival and helping to bind the free gingiva to the tooth.\n4- Dentoperiosteal group: Running apically from the cementum over the periosteum of the outer cortical plates of the alveolar process.\n5- Transseptal fiber system: runs interdentally from the cementum just apical to the base of the junctional epithelium of one tooth over the alveolar crest and insert into a comparable region of the cementum of the adjacent tooth."},{"question":"What are the four types of neural terminations in the PDL?","answer":"1- Free nerve endings: Tree-like configuration, along the length of the root, function: pain & mechanoreceptor.\n2- Ruffini's corpuscles: Dendritic shape, around the root Apex, function: Mechanoreceptors.\n3- Coiled Ending: Coiled form, mid-region of the PDL, function: not determined yet.\n4- Encapsulated spindle-like: spindle-like + capsule, root apex, function: Mechanoreceptors."},{"question":"What are the functions of the PDL?","answer":"1. Supportive: Failure of this function results in tooth loss. Every time the teeth are clenched, as in mastication, the periodontal fibers are stretched and then relaxed.\n2. Sensory: when receptors sense pressure, the nerves send signals to the brain to inform the masticatory apparatus, including the temporomandibular joint and muscles of mastication.\n3. Nutritive: The blood vessels of the ligament provide the essential nutrients for the ligaments vitality and the hard tissue of cementum and alveolar bone.\n4. Maintenance: Tissues are forming and responding rapidly in the masticatory apparatus."},{"question":"What are the age changes in PDL?","answer":"1- By age there is detachment of the cervical fibers of the PDL due to apical migration of the junctional epithelium.\n2- Decrease vascularity.\n3- The thickness becomes thinner due to decrease activity.\n4- Cementicles may be found."}],"blocks":[{"id":"pdl-1","type":"heading","title":"Periodontal Ligament (PDL)","content":"The periodontal ligament (PDL)is the soft, specialized connective tissue situated between the cementum covering the root of the tooth and the bone forming the socket wall."},{"id":"pdl-2","type":"subheading","title":"Development","content":""},{"id":"pdl-3","type":"paragraph","content":"The periodontal ligament forms shortly after root formation begins. The development of the ligament is from the cells of the dental follicle which differentiate into fibroblasts and synthesize the fibers and ground substance of the ligament.\nthe fibers become embedded in newly developed cementum and alveolar bone."},{"id":"pdl-4","type":"heading","title":"Structure","content":""},{"id":"pdl-5","type":"paragraph","content":"Similar to all connective tissue the PDL consists of:\ncells.\nextracellular matrix (fibers and ground substance)\nOther structures present in connective tissue :\nblood vessels, lymphatics, nerves.\ncementicles (calcified bodies)."},{"id":"pdl-6","type":"subheading","title":"1- Cells","content":""},{"id":"pdl-7","type":"list","content":["a) synthetic cells (fibroblasts, cementoblasts, osteoblasts).","b) Resorptive cells (fibroblasts, osteoclasts, in some situations cementoclasts)","c) Undifferentiated mesenchymal cells.","d) Defense cells.","e) Epithelial rests of malassez."]},{"id":"pdl-8","type":"subheading","title":"FIBROBLAST","content":""},{"id":"pdl-9","type":"paragraph","content":"The principle cells of the PDL are fibroblasts.\nPDL fibroblasts are large cells with an extensive cytoplasm containing an abundance of organelles associated with protein synthesis and secretion (i.e. rough endoplasmic reticulum, golgi apparatus, and many secretory granules).\nLigament fibroblasts also have a well-developed cytoskeleton with a particularly prominent actin network.\nLigament fibroblasts also show frequent cell-to-cell contacts of the adherens and the gap junction types.\nThey are aligned along the general direction of the fiber bundles and have extensive processes that wrap around the bundles.\nThe collagen fibrils of the fiber bundles are being remodeled continuously .A single cell, the fibroblast, achieves remodeling of collagen, it is capable of simultaneously synthesizing and degrading collagen.\nImportantly, in inflammatory situations, such as those associated with periodontal diseases, an increased expression of matrix metalloproteinases that aggressively destroys collagen."},{"id":"pdl-10","type":"subheading","title":"Bone and Cementum cells :","content":""},{"id":"pdl-11","type":"paragraph","content":"Although technically situated within the PDL, bone cells (osteoblasts, osteoclasts) and cementum cells (cementoblasts, occasionally cementoclasts) are properly associated with the hard tissues they form and are discussed with these tissues.\nOsteoblasts are the bone forming cells lining the tooth socket and cementoblasts are the cement - forming cells lining the surface of cementum. They are plump cells, rich in cytoplasm like fibroblasts they contain all the organelles necessary for protein sybthesis and secretion.\nOsteoclasts and occasional cementoclasts are found in areas where bone and cementum is being resorbed. Osteocasts degrade bone as a normal maintenance of bone however cementum do not normally remodel and can resorb the tissue under certain normal eruptive conditions (e.g. deciduous teeth) and under certain pathologic conditions including excessive physical forces and inflammation."},{"id":"pdl-12","type":"subheading","title":"Undifferentiated mesenchymal cells :","content":""},{"id":"pdl-13","type":"paragraph","content":"An important cellular constituent of the PDL is the undifferentiated mesenchymal cell or progenitor cell, these cells have a perivascular location. Although they have been demonstrated to be a source of new cells for the PDL, whether a single progenitor cell gives rise to daughter cells that differentiate into fibroblasts, osteoblasts, and cementoblasts."},{"id":"pdl-14","type":"subheading","title":"Defense cells :","content":""},{"id":"pdl-15","type":"paragraph","content":"Mast cells: relatively small, round or oval cells are characterized by numerous cytoplasmic granules (contain heparin and histamine). Mast cell plays a role in the inflammatory reaction.\nMacrophages: capable of phagocytosis, their cytoplasm contains numerous lysosomes and phagocytic vesicles."},{"id":"pdl-16","type":"subheading","title":"Epithelial cell rests of malassez :","content":""},{"id":"pdl-17","type":"paragraph","content":"The epithelial cells in the PDL are remnants of HERS. Some cells from the fragmented root sheath from discrete masses surrounded by a basement membrane known as the epithelial cell rests of Malassez .they occur close to the cementum as cluster or strands of cells easily recognized in hematoxylin-eosin stained sections because their nuclei often stain deeply."},{"id":"pdl-18","type":"heading","title":"2- Fibers","content":"The fibers in human PDL are made up of collagen and oxytalan."},{"id":"pdl-19","type":"subheading","title":"A) Collagen","content":""},{"id":"pdl-20","type":"paragraph","content":"The periodontal collagens of the periodontal ligament are types I, III, XII. Most collagen fibrils in the PDL are arranged in definite and distinct fiber bundle, individual strands can be remodeled continually, whereas the overall fiber maintains its architecture and function. In this way the fiber bundles are able to adapt to the continual stresses placed on them. these bundles are arranged in groups."},{"id":"pdl-21","type":"subheading","title":"1 - Principle Fiber Bundles of the PDL","content":"Those bundles running between the tooth and bone. They are as follows:"},{"id":"pdl-22","type":"list","content":["The alveolar crest group: attached to the cementum just below the cement enamel junction and running downward and outward to insert into the rim of the alveolus.these fibers limits vertical and intrusive movements.","The horizontal group: just apical to the alveolar crest group and running at right angles to the long axis of the tooth from cementum to bone just below the alveolar crest. these fibers resist horizontal and tipping forces.","The oblique group: most numerous in the periodontal ligament and running from the cementum in the oblique direction to insert in to the bone coronally. they resist vertical and intrusive forces.","The apical group: radiating from the cementum around the apex of the root to the bone, forming the base of the socket. They resist the vertical forces.","The interradicular groups: found only between the roots of multirooted teeth and running from the cementum into the bone, forming the crest of interradicular septum. They resist vertical and lateral movements."]},{"id":"pdl-23","type":"important","title":"Sharpey's Fibers","content":"At each end, all the principle collagen fiber bundles of the PDLare embedded in the cementum or bone. The embedded portion is referred to as Sharpey's fiber."},{"id":"pdl-24","type":"subheading","title":"II-Gingival ligament","content":"They are found in lamina propria of the gingiva. five groups of fiber bundles compose this ligament"},{"id":"pdl-25","type":"list","content":["1- Dentogingival group: These are the most numerous fibers ,extending from cervical cementum to lamina propria of the free and attached gingiva.","2- Alveologingival group: These fibers radiate from the bone of the alveolar crest and extend into the lamina propria of the free and attached gingiva.","3- Circular group: This small group of fibers forms a band around the neck of the tooth, interlacing with other groups of fibers in the free gingival and helping to bind the free gingiva to the tooth.","4- Dentoperiosteal group: Running apically from the cementum over the periosteum of the outer cortical plates of the alveolar process.","5- Transseptal fiber system: These fibers runs interdentally from the cementum just apical to the base of the junctional epithelium of one tooth over the alveolar crest and insert into a comparable region of the cementum of the adjacent tooth. Together these fibers constitute the trans septal fiber system, collectively forming an interdental ligament connecting all the teeth of the arch."]},{"id":"pdl-26","type":"subheading","title":"B) Oxytalan fibers","content":""},{"id":"pdl-27","type":"paragraph","content":"Oxytalan fibers are bundles of microfibrils. The Oxytalan fibers are numerous and dense in the cervical region of the ligament, where they run parallel to the gingival group of collagen fibers."},{"id":"pdl-28","type":"subheading","title":"Ground substance","content":""},{"id":"pdl-29","type":"paragraph","content":"Ground substance of the PDL is made up of proteoglycans and glycoprotein .Dermatan sulfate is the principle molecule of the ligament. The PDL ground substance has been estimated to be 70% water and is thought to have a significant effect on the ability of the tooth to withstand stress loads."},{"id":"pdl-30","type":"heading","title":"Blood Supply and Lymphatics","content":""},{"id":"pdl-31","type":"paragraph","content":"The PDL is well vascularized. The arterial vesseles of the PDL are derived from three sources:\nBranches from apical vesseles that supply the pulp.\nBranches from intra-alveolar vessels penetrating the alveolar bone.\nBranches from gingival vessels enter from coronal direction.\nThe PDL main blood supply is from the superior and inferior alveolar arteries."},{"id":"pdl-32","type":"heading","title":"Nerve Supply","content":""},{"id":"pdl-33","type":"paragraph","content":"The use of radioautographic and immunocytochemical labeling of neural proteins has greatly improved knowledge about the innervation of the PDL. A general pattern of ligament innervation seems to be present.\nThe general anatomic configuration is applicable to all teeth, with nerve fibers running from the apical region towared the gingival margin, the manner in which these nerve fibers terminate is being clarified. Four types of neural terminations have now been described."},{"id":"pdl-34","type":"list","content":["Free nerve endings — Shape: Tree-like configuration. Site: Along the length of the root. Function: pain & mechanoreceptor.","Ruffin's corpuscles — Shape: Dendritic. Site: Around the root Apex. Function: Mechanoreceptors.","Coiled ending — Shape: Coiled form. Site: mid-region of the PDL. Function: not determined yet.","Encapsulated spindle like — Shape: spindle-like + capsule. Site: Root apex. Function: Mechanoreceptors."]},{"id":"pdl-35","type":"heading","title":"Cementicles","content":""},{"id":"pdl-36","type":"paragraph","content":"Calcified bodies are sometimes found in the PDL. They may remain free in connective tissue, they may fuse into large calcified masses, or they may be joined with the cementum. As cementum thickness with the advancing age, it may envelope these bodies (embedded cementicles). When they are adherent to the cementum they from exocementoses. The origin of these calcified bodies is not established. It is possible that degenerated epithelial cells form calcified nodule."},{"id":"pdl-37","type":"heading","title":"Function of the Periodontal Ligament :","content":""},{"id":"pdl-38","type":"subheading","title":"1. Supportive","content":""},{"id":"pdl-39","type":"paragraph","content":"Possibly the most important function of the periodontal ligament is support of the teeth. Failure of this function results in tooth loss. Every time the teeth are clenched, as in mastication, the periodontal fibers are stretched and then relaxed. This system is highly efficient to compensate for the thousands of times this ligament is called into action."},{"id":"pdl-40","type":"subheading","title":"2. Sensory","content":""},{"id":"pdl-41","type":"paragraph","content":"The periodontal ligament is supplied with abundant receptors and nerves that sense any movement in function.when receptors sense pressure, the nerves send signals to the brain to inform the masticatory apparatus, including the temporomandibular joint and muscles of mastication."},{"id":"pdl-42","type":"subheading","title":"3. Nutritive","content":""},{"id":"pdl-43","type":"paragraph","content":"The blood vessels of the ligament provide the essential nutrients for the ligaments vitality and the hard tissue of cementum and alveolar bone .All cells such as fibroblasts, osteoblast, cementoblast, and even the resorptive osteoclasts and macrophage cells require nutrition, which is carried by the blood vessels to the ligament."},{"id":"pdl-44","type":"subheading","title":"4. Maintenance","content":""},{"id":"pdl-45","type":"paragraph","content":"Tissues are forming and responding rapidly in the masticatory apparatus. Interaction of cells with their intercellular environment is continuous. Theses tissues function for a lifetime, if health is maintained and appropriate care provided."},{"id":"pdl-46","type":"heading","title":"Age changes in PDL","content":""},{"id":"pdl-47","type":"list","content":["1- By age there is detachment of the cervical fibers of the PDL due to apical migration of the junctional epithelium.","2- Decrease vascularity.","3- The thickness becomes thinner due to decrease activity.","4- Cementicles may be found."]}],"giveReasons":[{"reason":"The PDL acts as an effective shock absorber for masticatory forces","explanation":"Because its principal fiber bundles (Sharpey's fibers) are oriented obliquely and in different directions, allowing them to convert compressive forces into tensile forces distributed to the alveolar bone. The high water content of PDL ground substance (70%) also provides hydraulic cushioning.","cat":"physiological"},{"reason":"Teeth that are not in function have a narrower PDL space","explanation":"Because functional mechanical stimulation from masticatory forces is required to maintain PDL width and metabolic activity. Without functional loading, collagen fiber production decreases, the fibroblast population reduces, and the PDL space narrows as alveolar bone slowly remodels inward.","cat":"physiological"},{"reason":"The PDL has the fastest collagen turnover rate of all periodontal tissues","explanation":"Because the PDL is constantly subjected to masticatory forces and must continuously remodel its collagen to maintain functional integrity. The same fibroblast cell can simultaneously synthesize new collagen and degrade old collagen via phagocytosis and collagenase secretion.","cat":"histological"},{"reason":"The PDL is important for proprioception and mastication control","explanation":"Because it contains a dense network of mechanoreceptors (Ruffini nerve endings) that detect the direction, magnitude, duration, and velocity of forces applied to the tooth. This proprioceptive information is relayed to the CNS to precisely control jaw movements during mastication, swallowing, and speech.","cat":"physiological"},{"reason":"The oblique fiber group is the most numerous in the PDL","explanation":"Because most masticatory forces are directed axially (along the long axis of the tooth), and the oblique fibers are ideally oriented to convert these compressive forces into tension on the alveolar bone, which bone resists much more effectively than compression. They bear the main functional load during mastication.","cat":"histological"},{"reason":"Epithelial rests of Malassez may form calcified nodules","explanation":"Because degenerated epithelial cells within the PDL can form calcified nodules (cementicles). These are remnants of HERS left behind after root formation and if stimulated (e.g. by inflammation), they can proliferate to form cysts.","cat":"histological"}]},{"id":10,"slug":"alveolar-bone","title":"Alveolar Bone","subtitle":"2024 - Dr: Thouraya Milad Al-Hadi","category":"support","summary":"It is the part of the maxilla and mandible that forms and support the crypts of the developing teeth and the sockets of the erupted teeth.","keywords":["alveolar bone proper","cribriform plate","lamina dura","Sharpey's fibers","bundle bone","supporting bone","cortical plates","cancellous bone","Volkmann's Canals","fenestration","dehiscence","interdental septum","inter-radicular septum","basal bone","bundle bone","Haversian system"],"keyDefinitions":[{"term":"Definition","definition":"It is the part of the maxilla and mandible that forms and support the crypts of the developing teeth and the sockets of the erupted teeth."},{"term":"Interdental Septum","definition":"The alveolar bone between the roots of adjacent teeth is known as the Interdental septum."},{"term":"Inter-radicular Septum","definition":"The alveolar bone between the root of multi-rooted teeth is called the Inter-radicular septum."},{"term":"Alveolar Margin","definition":"the free border of the socket or alveolus is the Alveolar margin. It is normally present opposite the cervical portion of the root about 2mm apical to the cervical line."},{"term":"Alveolar Crest","definition":"The alveolar crest is the coronal portion of the alveolar bone in the interdental space."},{"term":"Basal Bone","definition":"Basal bone is the unalterable part of the jaws which provide attachment to the muscles and houses the major nerves and vessels e.g. the body, of the mandible and that of the maxilla."},{"term":"Cribriform Plate","definition":"Anatomical name give to the alveolar bone proper because of the presence of holes in it and so it resembles a fine holed sieve."},{"term":"Lamina Dura","definition":"The term lamina dura (dura hard) is given to this layer of bone from its dense radio opaque (white) appearance in X-ray."},{"term":"Fenestration","definition":"Defect exposing part of the root with the alveolar margins intact is known as fenestration."},{"term":"Dehiscence","definition":"If the defect includes the alveolar margins it is called dehiscence."}],"importantPoints":["The alveolar process is called the functional bone because it is susceptible to functional changes and depends on the presence of teeth for its existence.","After tooth extraction bone is lost and in edentulous individuals the alveolar bone may be resorbed to basal bone.","The alv. bone develops with the formation and the eruption of teeth, when the teeth are congenitally messing (anodontia), the alv. bone do not develop at all. The maintenance of the alv. bone is dependent on the presence of the teeth. When the teeth are lost, it gradually resorbs.","Adult alveolar process is composed of parts: 1- Alveolar bone proper. 2- Supporting bone.","The alveolar bone proper is made up of: A. Bundle bone adjacent to the PDL where the principal fibers are attached (bone of attachment). B. Compact bone which consists of superficial parallel lamellae & deeper portions made up of Haversian system.","In anterior teeth the cortical plates are thin and are fused with the alveolar bone proper.","Cancellous bone is very sensitive to variation in functional forces, whereas increased function leads to formation of new bone. Decreased function leads to decrease in the volume of bone."],"histologicalFeatures":["The alveolar bone proper is made up of a cortical plate which consists partly of lamellated bone and partly of bundle bone.","The deeper portion of the cortical bone is made up of Haversian system or osteons.","The superficial layer is formed of parallel lamellae covered by areas of bundle bone where the principle fibers of the periodontal ligaments continue at right angles into the bone as sharpey's fibers.","Cortical plates: compact bone continuous with the compact layers of the body of the maxilla and mandible.","Cancellous bone passes between the alveolar bone proper and the cortical plates and between the alveolar bone proper of the interdental and inter radicular septa of the sockets."],"clinicalNotes":["After tooth extraction bone is lost and in edentulous individuals the alveolar bone may be resorbed to basal bone.","In the maxilla, the outer cortical plate is perforated by Volkmann's Canals and may show defects in the posterior teeth region. Defect exposing part of the root with the alveolar margins intact is known as fenestration. If the defect includes the alveolar margins it is called dehiscence.","Around isolated teeth which have antagonists and when the forces of mastication are excessive the cancellous bone is usually very dense, the trabeculae being numerous and thick.","The cancellous bone of teeth which have lost their antagonists: the cancellous bone around the alveolus is reduced and the trabeculea become less numerous and very thin."],"flashcards":[{"question":"What is the definition of alveolar bone?","answer":"It is the part of the maxilla and mandible that forms and support the crypts of the developing teeth and the sockets of the erupted teeth."},{"question":"Why is the alveolar process called the functional bone?","answer":"Because it is susceptible to functional changes and depends on the presence of teeth for its existence. After tooth extraction bone is lost and in edentulous individuals the alveolar bone may be resorbed to basal bone."},{"question":"What is the Cribriform plate?","answer":"Anatomical name give to the alveolar bone proper because of the presence of holes in it and so it resembles a fine holed sieve."},{"question":"What is the Lamina dura?","answer":"The term lamina dura (dura hard) is given to this layer of bone from its dense radio opaque (white) appearance in X-ray."},{"question":"What is the difference between fenestration and dehiscence?","answer":"Fenestration: Defect exposing part of the root with the alveolar margins intact.\nDehiscence: If the defect includes the alveolar margins it is called dehiscence."},{"question":"What are the two types of alveolar process trabeculea in X-ray?","answer":"Type I: the interdental and interradicular trabeculea are regularly horizontal in a ladder-like arrangements and interconnected by shorter and finer trabeculae. This type is more seen in the mandible.\nType II: the interdental and interradicular trabeculea are more numerous, delicate and irregularly arranged. This type is more seen in the maxilla."},{"question":"What are the age changes of the alveolar bone?","answer":"- The alveolar sockets appear jagged and scalloped.\n- The bone marrow shows fatty infiltration.\n- Osteoporosis indicates loss of some bony elements.\n- The internal trabecular arrangements is more open, which indicates bone loss."}],"blocks":[{"id":"ab-1","type":"heading","title":"Definition","content":"It is the part of the maxilla and mandible that forms and support the crypts of the developing teeth and the sockets of the erupted teeth."},{"id":"ab-2","type":"paragraph","content":"The alveolar bone between the roots of adjacent teeth is known as the Interdental septum.\nThe alveolar bone between the root of multi-rooted teeth is called the Inter-radicular septum.\nthe free border of the socket or alveolus is the Alveolar margin.\nIt is normally present opposite the cervical portion of the root about 2mm apical to the cervical line.\nThe alveolar crest is the coronal portion of the alveolar bone in the interdental space."},{"id":"ab-3","type":"important","title":"Functional Bone","content":"The alveolar process is called the functional bone because it is susceptible to functional changes and depends on the presence of teeth for its existence.\nAfter tooth extraction bone is lost and in edentulous individuals the alveolar bone may be resorbed to basal bone.\nBasal bone is the unalterable part of the jaws which provide attachment to the muscles and houses the major nerves and vessels e.g. the body, of the mandible and that of the maxilla."},{"id":"ab-4","type":"paragraph","content":"The alv, bone is a functional bone\nThe alv. bone develops with the formation and the eruption of teeth, when the teeth are congenitally messing (anodontia), the alv. bone do not develop at all. The maintenance of the alv. bone is dependent on the presence of the teeth. When the teeth are lost, it gradually resorbs."},{"id":"ab-5","type":"subheading","title":"Development","content":""},{"id":"ab-6","type":"paragraph","content":"Near the end of the second month of fetal life the maxilla as well as the mandible forms a groove that opens toward the surface of the oral cavity. This groove is formed by the growth of the outer and inner plates of the body of the maxilla or mandible. The tooth germs are contained in this groove together with the alveolar nerves and vessels. Gradually bony septa develop between the adjacent tooth germs."},{"id":"ab-7","type":"heading","title":"Structure of the alveolar process","content":"Adult alveolar process is composed of parts\n1- Alveolar bone proper.\n2- Supporting bone."},{"id":"ab-8","type":"subheading","title":"1- The alveolar bone proper (Cribriform plate or lamina dura)","content":""},{"id":"ab-9","type":"paragraph","content":"The alveolar bone proper is a thin lamella of bone that surrounds the root of the tooth and gives attachment to the principal fibers of the periodontal ligament. It is perforated by numerous minute foramina (Volkmann's Canals) that carry branches of the inter alveolar nerves and blood vessels from the marrow spaces to the periodontal ligament and that is why it is called the cribriform plate. The term lamina dura (dura hard) is given to this layer of bone from its dense radio opaque (white) appearance in X-ray."},{"id":"ab-10","type":"definition","title":"Cribriform plate","content":"Anatomical name give to the alveolar bone proper because of the presence of holes in it and so it resembles a fine holed sieve."},{"id":"ab-11","type":"subheading","title":"Histology","content":""},{"id":"ab-12","type":"paragraph","content":"The alveolar bone proper is made up of a cortical plate which consists partly of lamellated bone and partly of bundle bone. The deeper portion of the cortical bone is made up of Haversian system or osteons. The superficial layer is formed of parallel lamellae covered by areas of bundle bone where the principle fibers of the periodontal ligaments continue at right angles into the bone as sharpey's fibers."},{"id":"ab-13","type":"note","title":"The alveolar bone proper is made up of:","content":"A. Bundle bone adjacent to the PDL where the principal fibers are attached (bone of attachment)\nB. Compact bone which consists of superficial parallel lamellae & deeper portions made up of Haversian system"},{"id":"ab-14","type":"subheading","title":"2- The supporting bone","content":""},{"id":"ab-15","type":"paragraph","content":"The supporting bone consists of 2 parts:\nA) Cortical plates, which are made of compact bone.\nB) Spongy or cancellous bone, which fills the area between these plates and the alveolar bone proper."},{"id":"ab-16","type":"subheading","title":"A) The cortical plates","content":""},{"id":"ab-17","type":"paragraph","content":"The cortical plates of the alveolar process are continuous with the compact layers of the body of the maxilla and mandible. They are thinner in the maxilla than in the mandible. They are thickest in the premolar and molar regions of the lower jaw particularly in the buccal sides. In the regions of the anterior teeth of both jaws the cortical plates are very thin.\nIn anterior teeth the cortical plates are thin and are fused with the alveolar bone proper\nIn the region of the anterior tenth of both jaws the cortical plates are very thin and fused directly with the alveolar bone proper with no spongy bone in between."},{"id":"ab-18","type":"subheading","title":"B)The spongy or cancellous bone","content":""},{"id":"ab-19","type":"paragraph","content":"The cancellous bone passes between the alveolar bone proper and the cortical plates and between the alveolar bone proper of the interdental and inter radicular septa of the sockets. Its degree of development is related to the forces of mastication. It is absent in the sockets of the anterior region of both jaws where the walls of the sockets are very thin.\nCancellous bone is very sensitive to variation in functional forces, whereas increased function leads to formation of new bone. Decreased function leads to decrease in the volume of bone. This can be observed in the cancellous bone of teeth which have lost their antagonists. Here the cancellous bone around the alveolus is reduced and the trabeculea become less numerous and very thin. The alveolar bone proper is generally not affected because it continues to receive some stimuli from the tension of the periodontal ligament. Around isolated teeth which have antagonists and when the forces of mastication are excessive the cancellous bone is usually very dense, the trabeculae being numerous and thick."},{"id":"ab-20","type":"clinical","title":"FENESTRATION AND DEHISCENCE","content":"In the maxilla, the outer cortical plate is perforated by Volkmann's Canals and may show defects in the posterior teeth region. Defect exposing part of the root with the alveolar margins intact is known as fenestration. If the defect includes the alveolar margins it is called dehiscence.\nIn the maxilla, the outer cortical plate is perforated by Volkman's Canals and may show defects in the posterior teeth region. Larger defect exposing the root portion is known as fenestration. If the defect includes the coronal alveolar crest it is called dehiscence."},{"id":"ab-21","type":"heading","title":"Radiographic appearance of the alveolar bone","content":""},{"id":"ab-22","type":"subheading","title":"1- The alveolar bone proper or lamina dura","content":""},{"id":"ab-23","type":"paragraph","content":"The lamina dura appears as a radio opaque (white) line adjacent to the root and separated from it by a radiolucent line (dark) representing the space of the periodontal ligament."},{"id":"ab-24","type":"subheading","title":"2- Alveolar process trabeculea","content":""},{"id":"ab-25","type":"paragraph","content":"According to the arrangement, of the alveolar bone trabeculae in X-ray. The alveolar process is classified into two main types:\nType I: the interdental and interradicular trabeculea are regularly horizontal in a ladder-like arrangements and interconnected by shorter and finer trabeculae. This type is more seen in the mandible.\nType II: the interdental and interradicular trabeculea are more numerous, delicate and irregularly arranged. This type is more seen in the maxilla."},{"id":"ab-26","type":"subheading","title":"3- Alveolar crests","content":""},{"id":"ab-27","type":"paragraph","content":"the alveolar crest appears as a radio opaque line interproximally between adjacent teeth. The outline of the crest of the alveolar septa in X-ray is dependent on the position of the adjacent teeth. In a healthy mouth the distance between the cement enamel junction and the free border of the alveolar bone proper is fairly constant apical to the cervical line.\nThe shape of the outlines of the alveolar septa in the roentgenogram is dependant on the position of the adjacent teeth. In a healthy mouth, the distance between the CEJ and the free border o the alveolar bone proper is fairly constant. If the neighbouring teeth are inclined, therefore the alveolar crest is oblique.\nIn the anterior region the alveolar crests are horizontal, slightly rounded or pyramidal. In the posterior region the alveolar crests are oblique, because the teeth are inclined forward in the majority of individuals. The inclination is most pronounced in the premolar and molar region with the teeth being tipped mesially. Then the cemento-enamel junction of the mesial tooth is situated in a more occlusal plane than that of the distal tooth, and the alveolar crest slopes distally."},{"id":"ab-28","type":"heading","title":"Aging of the alveolar bone","content":""},{"id":"ab-29","type":"list","content":["The alveolar sockets appear jagged and scalloped.","The bone marrow shows fatty infiltration.","Osteoporosis indicates loss of some bony elements.","The internal trabecular arrangements is more open, which indicates bone loss."]}],"giveReasons":[{"reason":"The alveolar bone is called 'functional bone' or 'tooth-dependent bone'","explanation":"Because its existence is entirely dependent on the presence of teeth. It develops only in association with tooth formation and eruption, and undergoes resorption after tooth extraction. In congenital anodontia (complete absence of teeth), the alveolar bone does not develop at all.","cat":"histological"},{"reason":"Alveolar bone resorbs after tooth extraction","explanation":"Because the alveolar process is maintained by the functional stimulation transmitted through the PDL during mastication. After extraction, this stimulation is eliminated, leading to a predominance of osteoclastic activity. The resorption continues until only the basal bone remains.","cat":"clinical"},{"reason":"Cancellous bone is very sensitive to changes in functional forces","explanation":"Because cancellous bone is metabolically more active than cortical bone and remodels rapidly in response to mechanical demands (Wolff's law). Increased function leads to thicker, more numerous trabeculae; decreased function (as when teeth lose their antagonists) leads to thinner, fewer trabeculae and reduced bone volume.","cat":"physiological"},{"reason":"The lamina dura (alveolar bone proper) appears radiopaque on radiographs","explanation":"Because it is a dense layer of compact bone (bundle bone + compact bone) that surrounds the tooth socket, and its high mineral density makes it more radiopaque than the surrounding cancellous bone. Loss of the lamina dura on a radiograph is an early sign of periodontal disease or periapical pathology.","cat":"clinical"},{"reason":"Dehiscence and fenestration occur in the alveolar bone","explanation":"Because the outer cortical plate of the alveolar bone may be very thin, especially over the roots of anterior teeth. When the root is positioned too far buccally, or when thin cortical bone resorbs, defects develop: fenestration (window-like defect with intact alveolar margin) or dehiscence (defect extending to the alveolar margin, exposing the root).","cat":"clinical"}]},{"id":11,"slug":"maxillary-sinus","title":"Maxillary Sinus","subtitle":"2024 - Dr: Thouraya Milad Al-Hadi","category":"support","summary":"It is a pneumatic space, located in the body of the maxilla and opens into the nasal cavity. It is the largest bilateral air sinus in the skull bone.","keywords":["pneumatization","hiatus semilunaris","ostium maxillary","pseudostratified columnar ciliated epithelium","goblet cells","mucous membrane","zygomatic process","roots","sinus floor","septa","bactericidal enzyme","dental follicle"],"keyDefinitions":[{"term":"Maxillary Sinus","definition":"It is a pneumatic space, located in the body of the maxilla and opens into the nasal cavity. It is the largest bilateral air sinus in the skull bone."},{"term":"Hiatus Semilunaris","definition":"A recess in the middle meatus of the nasal cavity. The maxillary sinus communicates with it by means of an aperture, the ostium maxillary, which is located high on the nasal or mesial wall of the sinus."},{"term":"Ostium Maxillare","definition":"An aperture located high on the nasal or mesial wall of the sinus by which the sinus communicates with the hiatus semilunaris in the middle meatus of the nasal cavity."},{"term":"Pneumatization","definition":"Expansion of the maxillary sinus by resorption of surrounding bone. The expansion of the sinus is larger, following extraction of several adjacent posterior teeth."}],"importantPoints":["It is a pneumatic space, located in the body of the maxilla and opens into the nasal cavity. It is the largest bilateral air sinus in the skull bone.","There is a wide variation in size, shape, and position of the maxillary sinus, not only in different individuals, but also on the two sides of the same individual. Its average capacity in adults is about 15 ml.","The maxillary sinus is pyramidal in shape. The base of the pyramid is formed by the lateral wall of the nasal cavity. The apex extends into the zygomatic process. The anterior wall corresponds to the facial surface of the body of the maxilla. The posterior wall corresponds to its infra temporal surface, the roof is formed by the orbital surface and the floor reaches the alveolar process.","The maxillary sinus communicates with a recess in the middle meats of the nasal cavity called Hiatus semilunaris by means of an aperture, the ostium maxillary, which is located high on the nasal or mesial wall of the sinus.","The maxillary sinus begins development in the third month of fetal life.","The sinus is well developed when the permanent dentition has erupted, but it may continue to expand probably throughout life.","In the deciduous set the related teeth are the maxillary first and second molars rarely the canine. In the permanent set the teeth related to the sinus are maxillary molars and premolars, very rarely the canines. The maxillary 1st molar roots are the dental structures most intimately related to the sinus."],"histologicalFeatures":["The maxillary sinus is lined by a mucous membrane that is thinner and more delicate than that of the nasal cavity.","The epithelium of the sinus mucosa is typical of that of the respiratory passages, pseudostratified columnar ciliated epithelium, rich in goblet cells.","The goblet cells secrete mucus that moistens the surface of the sinus mucosa.","The cilia beat in such a way as to convey any surface materials toward the opening that communicate with the nasal cavity.","The lamina propria of the sinus mucosa is fused with the periosteum of the underlying bone and consists of loose bundles of collagen fibers with very few elastic fibers.","It is only moderately vascular.","Glands of the mucous and serous types are present."],"clinicalNotes":["Sometimes there are defects in the bone of the sinus floor and the roots protrude through these openings into the sinus cavity, here they are covered only by soft tissue composed of a combination of the periodontal ligament that surrounds the roots, and the mucous membrane that lines the sinus cavity.","The expansion of the sinus is larger, following extraction of several adjacent posterior teeth. If dental implant placement is planned in these cases, immediate implantation and/or immediate bone grafting should be considered to assist in preserving the 3-dimensional bony architecture of the sinus floor at the extraction site.","Elevations of the sinus floor are produced most frequently by roots of the maxillary molars and less frequently by those of the premolars."],"flashcards":[{"question":"What is the maxillary sinus?","answer":"It is a pneumatic space, located in the body of the maxilla and opens into the nasal cavity. It is the largest bilateral air sinus in the skull bone."},{"question":"Describe the shape and boundaries of the maxillary sinus.","answer":"The maxillary sinus is pyramidal in shape.\nThe base of the pyramid is formed by the lateral wall of the nasal cavity.\nThe apex extends into the zygomatic process.\nThe anterior wall corresponds to the facial surface of the body of the maxilla.\nThe posterior wall corresponds to its infra temporal surface.\nThe roof is formed by the orbital surface.\nThe floor reaches the alveolar process."},{"question":"How does the maxillary sinus communicate with the nasal cavity?","answer":"The maxillary sinus communicates with a recess in the middle meats of the nasal cavity called Hiatus semilunaris by means of an aperture, the ostium maxillary, which is located high on the nasal or mesial wall of the sinus."},{"question":"When does the maxillary sinus begin development?","answer":"The maxillary sinus begins development in the third month of fetal life, arising by lateral invagination of the mucous membrane of the middle nasal meats, forming a slit-like space. In the newborn the sinus is a very small groove. The sinus is well developed when the permanent dentition has erupted."},{"question":"What teeth are related to the maxillary sinus?","answer":"In the deciduous set the related teeth are the maxillary first and second molars rarely the canine.\nIn the permanent set the teeth related to the sinus are maxillary molars and premolars, very rarely the canines.\nThe maxillary 1st molar roots are the dental structures most intimately related to the sinus."},{"question":"Describe the histology of the maxillary sinus.","answer":"The maxillary sinus is lined by a mucous membrane that is thinner and more delicate than that of the nasal cavity. The epithelium of the sinus mucosa is pseudostratified columnar ciliated epithelium, rich in goblet cells. The goblet cells secrete mucus that moistens the surface of the sinus mucosa. The cilia beat in such a way as to convey any surface materials toward the opening that communicate with the nasal cavity. The lamina propria of the sinus mucosa is fused with the periosteum of the underlying bone and consists of loose bundles of collagen fibers with very few elastic fibers. It is only moderately vascular. Glands of the mucous and serous types are present."},{"question":"What are the five functions of the maxillary sinus?","answer":"1. Lightening the skull weight: to reduce the weight of the dense skull on the cervical musculature.\n2. Resonance of voice during speech.\n3. Conditioning of the inspired air: it participates in the regulation of the temperature of the air inspired either by humidification or warming.\n4. Craniofacial protection against the mechanical trauma: the paranasal sinuses are most frequently intervened between outer and inner cortical plates. However, it is believed that these sinuses may serve as cushions which can absorb and thus reduce the harmful effect of the mechanical trauma without causing injury to the vital underlying organs.\n5. Production of the bactericidal enzyme which is believed to exert its bacterial influence through the hydrolysis of the polysaccharides found in the bacterial cell well. This enzyme may be significant in protection against the bacterial infection of the nasal mucosa."}],"blocks":[{"id":"ms-1","type":"heading","title":"Maxillary Sinus","content":"It is a pneumatic space, located in the body of the maxilla and opens into the nasal cavity. It is the largest bilateral air sinus in the skull bone."},{"id":"ms-2","type":"paragraph","content":"There is a wide variation in size, shape, and position of the maxillary sinus, not only in different individuals, but also on the two sides of the same individual. Its average capacity in adults is about 15 ml. The walls of the sinus vary in thickness from 5 to 6mm to paper thin. The maxillary sinus is situated in the body of the maxilla. It is pyramidal in shape. The base of the pyramid is formed by the lateral wall of the nasal cavity. The apex extends into the zygomatic process. The anterior wall corresponds to the facial surface of the body of the maxilla. The posterior wall corresponds to its infra temporal surface, the roof is formed by the orbital surface and the floor reaches the alveolar process."},{"id":"ms-3","type":"paragraph","content":"The maxillary sinus communicates with a recess in the middle meats of the nasal cavity called Hiatus semilunaris by means of an aperture, the ostium maxillary, which is located high on the nasal or mesial wall of the sinus."},{"id":"ms-4","type":"heading","title":"Development and Growth","content":""},{"id":"ms-5","type":"paragraph","content":"The maxillary sinus begins development in the third month of fetal life, arising by lateral invagination of the mucous membrane of the middle nasal meats, forming a slit-like space. In the newborn the sinus is a very small groove. Thereafter, it gradually expands by pneumatization of the body of the maxilla. The sinus is well developed when the permanent dentition has erupted, but it may continue to expand probably throughout life. Enlargement of the maxillary sinus also result from its extension into the zygomatic process and even the zygomatic bone, the maxillary tuberosity, and the alveolar process. The extension of the floor of the maxillary sinus into the alveolar process may place the sinus floor not only between the roots of adjacent teeth, but also between the roots of an individual tooth, so that the root apices protrude into the sinus cavity. Usually the bone of the sinus floor is elevated in spots to accommodate the protruding roots, thus bone completely covers the root."},{"id":"ms-6","type":"clinical","title":"Root-Sinus Relations","content":"Sometimes there are defects in the bone of the sinus floor and the roots protrude through these openings into the sinus cavity, here they are covered only by soft tissue composed of a combination of the periodontal ligament that surrounds the roots, and the mucous membrane that lines the sinus cavity. Elevations of the sinus floor are produced most frequently by roots of the maxillary molars and less frequently by those of the premolars. The floor of the sinus is formed by the alveolar process lateral to the hard palate which forms the floor of the nasal fosse only. The floor of the sinus may be on the same level with the floor of the nose (palate) or on higher or lower level than it. This in turn depends upon the degree of pneumatization and expansion of the sinus. The cavity of the sinus may be partially divided into compartments by septa which arise from its walls."},{"id":"ms-7","type":"important","title":"Maxillary Sinus Pneumatization","content":"The expansion of the sinus is larger, following extraction of several adjacent posterior teeth. If dental implant placement is planned in these cases, immediate implantation and/or immediate bone grafting should be considered to assist in preserving the 3-dimensional bony architecture of the sinus floor at the extraction site."},{"id":"ms-8","type":"heading","title":"Relation of the teeth to the Maxillary Sinus:","content":""},{"id":"ms-9","type":"paragraph","content":"In the deciduous set the related teeth are the maxillary first and second molars rarely the canine. In the permanent set the teeth related to the sinus are maxillary molars and premolars, very rarely the canines. The maxillary 1st molar roots are the dental structures most intimately related to the sinus."},{"id":"ms-10","type":"heading","title":"Histology","content":""},{"id":"ms-11","type":"paragraph","content":"The maxillary sinus is lined by a mucous membrane that is thinner and more delicate than that of the nasal cavity. The epithelium of the sinus mucosa is typical of that of the respiratory passages, pseudostratified columnar ciliated epithelium, rich in goblet cells. The goblet cells secrete mucus that moistens the surface of the sinus mucosa. The cilia beat in such a way as to convey any surface materials toward the opening that communicate with the nasal cavity. And hence they act to clear the sinus cavity of inhaled substances and of mucus. The lamina propria of the sinus mucosa is fused with the periosteum of the underlying bone and consists of loose bundles of collagen fibers with very few elastic fibers. It is only moderately vascular. Glands of the mucous and serous types are present."},{"id":"ms-12","type":"heading","title":"Function of the Maxillary sinus:","content":""},{"id":"ms-13","type":"list","content":["Lightening the skull weight: to reduce the weight of the dense skull on the cervical musculature.","Resonance of voice during speech.","Conditioning of the inspired air: it participates in the regulation of the temperature of the air inspired either by humidification or warming.","Craniofacial protection against the mechanical trauma: the paranasal sinuses are most frequently intervened between outer and inner cortical plates. However, it is believed that these sinuses may serve as cushions which can absorb and thus reduce the harmful effect of the mechanical trauma without causing injury to the vital underlying organs.","Production of the bactericidal enzyme which is believed to exert its bacterial influence through the hydrolysis of the polysaccharides found in the bacterial cell well. This enzyme may be significant in protection against the bacterial infection of the nasal mucosa."]}],"giveReasons":[{"reason":"The maxillary sinus is the largest paranasal sinus","explanation":"Because it is located in the body of the maxilla, which is the largest bone of the mid-face. The sinus expands progressively with the growth of the maxilla, reaching an average capacity of about 15 ml in adults. It has the most space available for pneumatization compared to other paranasal sinuses.","cat":"anatomical"},{"reason":"The maxillary sinus drains poorly by gravity","explanation":"Because the ostium (opening) of the maxillary sinus is located high on its medial (nasal) wall — not at the lowest point of the sinus floor. This means secretions cannot drain by gravity alone and depend entirely on the mucociliary action of the ciliated pseudostratified columnar epithelium to propel mucus upward toward the ostium.","cat":"anatomical"},{"reason":"Maxillary sinusitis can cause referred pain mimicking toothache","explanation":"Because the floor of the maxillary sinus is in close anatomical proximity to the roots of the upper molars and premolars (especially the upper first molar). Inflammation and increased pressure within the sinus irritates the dental nerves, producing pain that resembles toothache via branches of the maxillary nerve.","cat":"clinical"},{"reason":"Extraction of upper posterior teeth can lead to oro-antral communication","explanation":"Because the roots of the upper molars (especially the first molar) are often in very close proximity to — or may even protrude into — the floor of the maxillary sinus. During extraction, the thin bony floor may fracture, creating a communication between the oral cavity and the sinus.","cat":"clinical"},{"reason":"The maxillary sinus begins as a small cavity and expands throughout life","explanation":"Because it develops through pneumatization — a process where air spaces replace the maxillary bone. It begins in the third month of fetal life, is small at birth, enlarges rapidly during tooth eruption (deciduous and permanent), and may continue to expand slowly even after the full dentition has erupted.","cat":"developmental"}]},{"id":12,"slug":"eruption-and-shedding","title":"Eruption and Shedding","subtitle":"Tooth Eruption — Development, Structure, Function & Age Changes","category":"special","summary":"Axial or occlusal movement of the tooth or tooth germ from its developmental position within the jaw to its functional position.","keywords":["eruption","pre-eruptive phase","eruptive phase","post-eruptive phase","active eruption","passive eruption","gubernacular canal","odontoclast","shedding","root resorption","axial movement","drifting","tilting","rotating"],"keyDefinitions":[{"term":"TOOTH ERUPTION Definition","definition":"Axial or occlusal movement of the tooth or tooth germ from its developmental position within the jaw to its functional position."},{"term":"ACTIVE ERUPTION","definition":"It is the actual movement of the tooth from its developmental site to its position in the dental arch."},{"term":"PASSIVE ERUPTION","definition":"Does not involve tooth movement but occurs due to apical recession of gingival tissue exposing more tooth structure into the oral cavity."},{"term":"ANATOMICAL CROWN","definition":"It is part of the tooth which is covered by enamel."},{"term":"CLINICAL CROWN","definition":"is the part of the tooth which is seen in the oral cavity."},{"term":"Gubernacular Canal","definition":"A small canal connecting the permanent tooth germ to the overlying gingiva. When permanent tooth germ first develops in the same crypt with its predecessor, bone surrounds both tooth germs but does not completely close over them."},{"term":"Odontoclast","definition":"The cells responsible for resorption of the tooth hard substances. (identical to the osteoclasts which are responsible for bone removal)."}],"importantPoints":["Axial or occlusal movement of the tooth or tooth germ from its developmental position within the jaw to its functional position.","The teeth move in different directions: a- Axial (Occlusal) movement: in the direction of the long axis of the tooth. b- Drifting (bodily) movement: in a distal, mesial, lingual or buccal direction. c- Tilting or (tipping) movement: around a transverse axis. d- Rotating movement: around a longitudinal axis.","Three phases: I- Pre-eruptive phase. II- Eruptive phase (prefunctional eruptive phase). III- Post eruptive phase (functional eruptive phase).","Pre-eruptive phase: starts from the end of early bell stage till the beginning of root formation. Aims to bring the tooth germ & crypt in a position preparatory to eruption.","Eruptive phase: starts with the beginning of root formation, ends when the tooth appears in the oral cavity just before function. The principal direction of movement is occlusal or axial.","Post-eruptive phase: starts when the teeth reach occlusion and continues for as long as each tooth remains in the oral cavity. Aims to: a- accommodate for further jaw growth. b- Compensate for occlusal wear and to prevent occlusal overclosure. c- Compensate for proximal wear.","Eruption is a gradual as well as intermittent process."],"histologicalFeatures":["Significant changes in the tissue covering the erupting tooth: 1- Bone resorption. 2- Desmolytic enzymes causes loss of connective tissue. 3- The tooth erupts from epithelium without hemorrhage.","The odontoclasts are the cells responsible for resorption of the tooth hard substances (identical to osteoclasts).","Root: resorbed by odontoclasts which appear due to pressure from the growing and erupting successor.","PDL: a programmed cell death (apoptosis).","The pulp plays a passive role.","Mesial drift histology: bone Deposition of bone occurs on the distal wall of the sockets. The mesial wall of the socket shows resorption."],"clinicalNotes":["Remnants of deciduous teeth: Parts of the roots of deciduous teeth may escape resorption. Found mostly near lower second premolars because the roots of the second deciduous molar are strongly curved. These remnants may: a- Become ankylosed to bone. b- Enclosed in cementum. c- exfoliated. d- Undergo progressive resorption.","Retained deciduous teeth: The deciduous teeth may be retained for long time due to: a- Congenital missing of a permanent teeth. b- Due to ankylosed or impacted permanent teeth. c- A supernumerary tooth or tumor may prevent the eruption of permanant tooth.","Submerged deciduous teeth: noticed below the occlusal level of the adjacent teeth. Cause: Trauma may lead to ankylosis of a deciduous tooth. → alveolar bone continues to grow, the tooth may become submerged. Submerged deciduous teeth prevent the eruption of their permanent successors or force them from their position. Therefore, they should be removed as soon as possible.","If the permanent lower incisor does not move apically, this permanent incisor may erupt lingual to deciduous, without shedding of deciduous."],"flashcards":[{"question":"What is the definition of Tooth Eruption?","answer":"Axial or occlusal movement of the tooth or tooth germ from its developmental position within the jaw to its functional position."},{"question":"What is the difference between Active and Passive eruption?","answer":"ACTIVE ERUPTION: It is the actual movement of the tooth from its developmental site to its position in the dental arch.\nPASSIVE ERUPTION: Does not involve tooth movement but occurs due to apical recession of gingival tissue exposing more tooth structure into the oral cavity."},{"question":"What is the difference between Anatomical Crown and Clinical Crown?","answer":"ANATOMICAL CROWN: It is part of the tooth which is covered by enamel.\nCLINICAL CROWN: is the part of the tooth which is seen in the oral cavity."},{"question":"In what directions do teeth move?","answer":"a- Axial (Occlusal) movement: in the direction of the long axis of the tooth.\nb- Drifting (bodily) movement: in a distal, mesial, lingual or buccal direction.\nc- Tilting or (tipping) movement: around a transverse axis.\nd- Rotating movement: around a longitudinal axis."},{"question":"Describe the Pre-eruptive phase.","answer":"1- It starts from the end of early bell stage till the beginning of root formation.\n2- Aims to bring the tooth germ & crypt in a position preparatory to eruption.\n3- Related to jaw growth: The rate of tooth movement = rate of growth of the jaw.\n4- Movements of deciduous tooth germs: drift forward (anterior), drift backward (posterior), move outward (vestibular) as jaw grows in width.\n5- Movements of permanent tooth germs: incisors/canines first develop lingual to deciduous, then move apically. Premolars develop between roots of deciduous molars, then below them. Molars develop in rami/tuberosities with tilting movements."},{"question":"Describe the Eruptive phase.","answer":"1- Starts with the beginning of root formation; ends when the tooth appears in the oral cavity just before function.\n2- Aim: the tooth moves to its functional position in occlusion (The rate of tooth eruption is more than the rate of jaw growth).\n3- The principal direction of movement is occlusal or axial.\nN.B: Eruption is a gradual as well as intermittent process.\nSignificant developmental changes in the floor of the bony crypt:\na- Roots grow toward floor of crypt → Bone resorption.\nb- By tooth movements, space is created for the forming root.\nc- Rapid tooth eruption → Bone growth.\nd- As teeth reach the occlusal plane, rapid eruptive movement stops."},{"question":"Describe the Post-eruptive phase.","answer":"1- Starts when the teeth reach occlusion and continues for as long as each tooth remains in the oral cavity.\n2- Aims: a- Accommodate further jaw growth. b- Compensate for occlusal wear and prevent occlusal overclosure. c- Compensate for proximal wear.\n3- Movements: A- Axial direction (active at age 14-18 years) — active deposition of bone. B- Later, occlusal wear compensated by hypercementosis. C- Mesial or proximal drift: Deposition of bone on distal wall of sockets; Resorption of mesial wall."},{"question":"What are the 4 theories of tooth movement mechanism?","answer":"1- Root formation theory: proliferating root impinges upon a fixed tissue converting apically directed force into occlusal movement. However, unlikely cause since some teeth move greater distance than root length, and experimental prevention of root formation does not stop eruption.\n2- Vascular pressure theory: increase in tissue fluid pressure in periapical region causes tooth movement.\n3- Bone remodeling theory: selective deposition and resorption of bone brings eruption. Not known if bony remodeling is cause or effect.\n4- Periodontal ligament traction theory: cells and fibers of the PDL pull the tooth into occlusion. When PDL is distorted experimentally, eruption is retarded."},{"question":"What is Shedding (exfoliation)?","answer":"Shedding (exfoliation) is the elimination of deciduous teeth by the resorption of their roots and their supporting tissue before eruption of successor at specific age.\nThe odontoclasts are the cells responsible for resorption of the tooth hard substances (identical to osteoclasts)."},{"question":"Describe the pattern of shedding for anterior teeth.","answer":"1- permanent anterior tooth germs are developed lingual to deciduous. So the resorption occurs on the lingual side of the root of deciduous (by pressure of the growing successor).\n2- Later, the developing successor is directly apical to the deciduous. So, the resorption occurs apically in the root of deciduous (by pressure of the erupting successor).\nIf the permanent lower incisor does not move apically, this permanent incisor may erupt lingual to deciduous, without shedding of deciduous."},{"question":"What are the clinical considerations of shedding?","answer":"(1) Remnants of deciduous teeth: Parts of the roots may escape resorption. Found mostly near lower second premolars. May: Become ankylosed, Enclosed in cementum, exfoliated, or Undergo progressive resorption.\n(2) Retained deciduous teeth: due to congenital missing permanent teeth, ankylosed/impacted permanent teeth, or supernumerary tooth/tumor.\n(3) Submerged deciduous teeth: below occlusal level. Cause: ankylosis after trauma → alveolar bone continues to grow → tooth submerges. Should be removed as soon as possible."}],"blocks":[{"id":"er-1","type":"heading","title":"TOOTH ERUPTION","content":""},{"id":"er-2","type":"definition","title":"Definition:","content":"Axial or occlusal movement of the tooth or tooth germ from its developmental position within the jaw to its functional position."},{"id":"er-3","type":"heading","title":"TERMINOLOGY OF ERUPTION:","content":""},{"id":"er-4","type":"list","content":["ACTIVE ERUPTION: It is the actual movement of the tooth from its developmental site to its position in the dental arch.","PASSIVE ERUPTION: Does not involve tooth movement but occurs due to apical recession of gingival tissue exposing more tooth structure into the oral cavity.","ANATOMICAL CROWN: It is part of the tooth which is covered by enamel.","CLINICAL CROWN: is the part of the tooth which is seen in the oral cavity."]},{"id":"er-5","type":"subheading","title":"The teeth move in different directions as follows:-","content":""},{"id":"er-6","type":"list","content":["a- Axial (Occlusal) movement: in the direction of the long axis of the tooth.","b- Drifting (bodily) movement: in a distal, mesial, lingual or buccal direction.","c- Tilting or (tipping) movement: around a transverse axis.","d- Rotating movement: around a longitudinal axis."]},{"id":"er-7","type":"note","title":"","content":"Besides, eccentric growth occurs leading to shift of the center."},{"id":"er-8","type":"heading","title":"Phases of eruption:","content":""},{"id":"er-9","type":"subheading","title":"I- Pre-eruptive phase:","content":""},{"id":"er-10","type":"list","content":["1- It starts from the end of early bell stage till the beginning of root formation.","2- Aims to bring the tooth germ & crypt in a position preparatory to eruption.","3- Related to jaw growth: The rate of tooth movement = rate of growth of the jaw."]},{"id":"er-11","type":"paragraph","content":"4- movements:\nA- Movements of the Deciduous tooth germs\n• As the infant jaws grow in length, the anterior deciduous tooth germs drift forward and the second deciduous molars germs drift backward\n• At the same time the jaws grow in width, and so the tooth germs also move outward (vestibular).\n• With the increase of the jaw height, the tooth germs move in a vestibular direction."},{"id":"er-12","type":"paragraph","content":"B- Movements of the permanent tooth germs:\nThe permanent incisors and canines: first develop lingual to the deciduous tooth germs at the level of their incisal surfaces. and in the same bony crypt. As the deciduous predecessors start eruption, the permanents move to: a more apical region of their deciduous predecessors and occupy their own bony crypts."},{"id":"er-13","type":"paragraph","content":"The permanent premolars: first develop lingual to their predecessors at the level of their occlusal surfaces and in the same bony crypt. Later, they are found between the divergent roots, and at the end of the pre-eruptive phase they are below roots of deciduous molars in their own crypt."},{"id":"er-14","type":"paragraph","content":"The permanent molars (with no deciduous predecessors):\nThe lower molars: develop in the base of the mandibular rami and their occlusal surfaces facing mesially. The movement is tilting if space becomes available.\nThe upper molars: develop in the maxillary tuberosities and their occlusal surfaces facing distally. The movement is tilting."},{"id":"er-15","type":"subheading","title":"II- Eruptive phase (prefunctional eruptive phase):","content":""},{"id":"er-16","type":"list","content":["1- Starts with the beginning of root formation; ends when the tooth appears in the oral cavity just before function.","2- Aim: the tooth moves to its functional position in occlusion (The rate of tooth eruption is more than the rate of jaw growth).","3- The principal direction of movement is occlusal or axial."]},{"id":"er-17","type":"note","title":"N.B:","content":"Eruption is a gradual as well as intermittent process, (The supporting tissues are able to make adjustments)."},{"id":"er-18","type":"subheading","title":"Significant developmental changes occurring in the floor of the bony crypt:","content":""},{"id":"er-19","type":"list","content":["a- The roots grow first toward the floor of the bony crypt → Bone resorption (room for the growing root).","b- By tooth movements, a space is created for the forming root → No resorption.","c- Rapid tooth eruption → Bone growth.","d- As the teeth reach the occlusal plane, rapid eruptive movement stops. However, root formation is not yet complete → bone resorption."]},{"id":"er-20","type":"subheading","title":"Significant changes in the tissue covering the erupting tooth:","content":""},{"id":"er-21","type":"list","content":["1- Bone resorption.","2- Desmolytic enzymes causes loss of connective tissue.","3- The tooth erupts from epithelium without hemorrhage."]},{"id":"er-22","type":"note","title":"N.B: in case of the permanent teeth with predecessors:","content":"When permanent tooth germ 1st develops in the same crypt with its predecessor, bone surrounds both tooth germs but does not completely close over them. There is a small canal (Gubernacular canal)."},{"id":"er-23","type":"subheading","title":"III- Post eruptive phase (functional eruptive phase):","content":""},{"id":"er-24","type":"list","content":["1- Starts when the teeth, reach occlusion and continues for as long as each tooth remains in the oral cavity, (until loss).","2- Aim: the tooth moves primarily to: a- accommodate for further jaw growth. b- Compensate for occlusal wear and to prevent occlusal overclosure. c- Compensate for proximal wear."]},{"id":"er-25","type":"paragraph","content":"3- Movements & histological changes:\nA- Axial direction to accommodate for further jaw growth (Active at age of 14-18 years). There is active deposition of bone.\nB- Later, the occlusal wear is compensated by hypercementosis.\nC- Mesial or proximal drift: takes place to maintain sharp contact of the teeth.\nHistologically: Deposition of bone occurs on the distal wall o
