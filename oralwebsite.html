ft palate.","answer":"True"},{"id":"py-tf-2-4","sheetId":2,"type":"true-false","question":"The fifth and sixth pharyngeal arches disappear soon after their formation so that only four arches remain.","answer":"True"},{"id":"py-tf-2-5","sheetId":2,"type":"true-false","question":"At birth, the mandibular angle between the lower border and the posterior border of the ramus is about 120°.","answer":"False","explanation":"At birth the mandibular angle is approximately 170°. It decreases through childhood (~140°) to adult (~110°)."},{"id":"py-tf-2-6","sheetId":2,"type":"true-false","question":"The lower lip develops by merging of the maxillary processes.","answer":"False","explanation":"The lower lip develops from the MANDIBULAR processes. The maxillary processes contribute to the upper lip."},{"id":"py-tf-2-7","sheetId":2,"type":"true-false","question":"The third pharyngeal arch is supplied by the vagus nerve.","answer":"False","explanation":"The 3rd arch is supplied by the glossopharyngeal nerve (CN IX). The vagus (CN X) supplies the 4th arch."},{"id":"py-tf-2-8","sheetId":2,"type":"true-false","question":"The cleft palate (congenital anomaly) is due to failure of union between the palatine processes and the nasal septum.","answer":"True"},{"id":"py-tf-2-9","sheetId":2,"type":"true-false","question":"Genetic causes of craniofacial anomalies are due to disturbance of migration and distribution of the 3 germ layers.","answer":"True"},{"id":"py-3-1","sheetId":3,"type":"mcq","question":"The secondary palate is:","options":["Part of the palate posterior to the incisive fossa","Part of the palate anterior to the incisive fossa","All of the hard palate","The soft palate only"],"correctOption":0,"answer":"Part of the palate posterior to the incisive fossa"},{"id":"py-3-2","sheetId":3,"type":"mcq","question":"The sulcus terminalis is:","options":["Line of fusion between anterior and posterior portion of the tongue only","A V-shaped groove only","Both a V-shaped groove and the line of fusion between anterior and posterior tongue","None of the above"],"correctOption":2,"answer":"Both a V-shaped groove and the line of fusion between anterior and posterior tongue"},{"id":"py-3-3","sheetId":3,"type":"mcq","question":"Which of the following lingual papillae has late development (about the 10th week I.U.)?","options":["Filiform","Fungiform","Foliate","Circumvallate"],"correctOption":3,"answer":"Circumvallate papillae","explanation":"Circumvallate (vallate) papillae develop last (10th week IU). Fungiform = 7th week. Filiform = 8-11th week. Foliate = late."},{"id":"py-3-4","sheetId":3,"type":"mcq","question":"Failure of merging between the two lateral lingual swellings (with persistence of groove) is called:","options":["Tongue tie (ankyloglossia)","Trifid tongue","Bifid tongue","None of the above"],"correctOption":2,"answer":"Bifid tongue"},{"id":"py-3-5","sheetId":3,"type":"mcq","question":"The first 2 weeks after birth are called:","options":["Neonatal period","Childhood","Infancy","None of the above"],"correctOption":0,"answer":"Neonatal period"},{"id":"py-3-6","sheetId":3,"type":"mcq","question":"Secondary palate formation involves:","options":["Downward then horizontal growth of palatal shelves","Both shelves meeting at the midline and fusing","Closure posterior to the primary palate","All of the above"],"correctOption":3,"answer":"All of the above","explanation":"The palatine shelves first grow downward, then elevate horizontally, meet at midline, and fuse — posterior to the primary palate."},{"id":"py-3-7","sheetId":3,"type":"mcq","question":"All intrinsic muscles of the tongue EXCEPT:","options":["Superior longitudinal muscle","Inferior longitudinal muscle","Transverse muscle","Genioglossal muscle"],"correctOption":3,"answer":"Genioglossal muscle","explanation":"Genioglossus is an EXTRINSIC muscle of the tongue. The four intrinsic muscles are: superior longitudinal, inferior longitudinal, transverse, and vertical."},{"id":"py-3-8","sheetId":3,"type":"mcq","question":"The wedge-shaped tissue anterior to the incisive papilla is:","options":["Primary palate","Secondary palate","Soft palate","None of the above"],"correctOption":0,"answer":"Primary palate"},{"id":"py-3-9","sheetId":3,"type":"mcq","question":"Primary palate will form:","options":["Anterior 3% of the hard palate only","Incisal portion (carrying incisor teeth)","All of the above (anterior 3% of hard palate + incisal portion)","None of the above"],"correctOption":2,"answer":"All of the above — anterior 3% of hard palate including the incisal portion"},{"id":"py-tf-3-1","sheetId":3,"type":"true-false","question":"Cleft palate results from failure of union between the palatine processes and the nasal septum.","answer":"True"},{"id":"py-tf-3-2","sheetId":3,"type":"true-false","question":"Cleft palate is more common than cleft lip.","answer":"False","explanation":"Cleft lip (with or without cleft palate) is more common than isolated cleft palate."},{"id":"py-tf-3-3","sheetId":3,"type":"true-false","question":"Cleft of the hard and soft palate does NOT cause feeding problems.","answer":"False","explanation":"Cleft palate causes significant feeding difficulties because the infant cannot create suction needed for nursing."},{"id":"py-tf-3-4","sheetId":3,"type":"true-false","question":"The epiglottis is supplied by the vagus nerve for both general sensation and taste.","answer":"True"},{"id":"py-tf-3-5","sheetId":3,"type":"true-false","question":"The tongue is an organ composed of muscles NOT covered by mucous membrane.","answer":"False","explanation":"The tongue IS covered by mucous membrane (oral mucosa) on its dorsal and ventral surfaces."},{"id":"py-tf-3-6","sheetId":3,"type":"true-false","question":"The oral ectoderm gives origin to the cells that differentiate and form growth hormones.","answer":"False","explanation":"Growth hormones are produced by endocrine cells derived from endoderm/neural ectoderm, not oral ectoderm."},{"id":"py-tf-3-7","sheetId":3,"type":"true-false","question":"The vestibular lamina arises from an ectodermal thickening that proliferates into the ectomesenchyme later than the dental lamina.","answer":"True"},{"id":"py-4-1","sheetId":4,"type":"mcq","question":"Which of the following is NOT part of the tooth germ?","options":["Enamel organ (dental organ)","Dental papilla","Dental lamina","Dental sac (follicle)"],"correctOption":2,"answer":"Dental lamina","explanation":"The tooth germ consists of 3 parts: enamel organ + dental papilla + dental sac. The dental lamina initiates the tooth germ but is not part of it."},{"id":"py-4-2","sheetId":4,"type":"mcq","question":"Which structure is formed first in the crown?","options":["Enamel","Cementum","Pulp","Dentin (mantle dentin)"],"correctOption":3,"answer":"Dentin (mantle dentin)","explanation":"Mantle dentin is the first hard tissue formed. Enamel cannot deposit until dentin is laid down."},{"id":"py-4-3","sheetId":4,"type":"mcq","question":"The dental sac (follicle) gives rise to:","options":["Dentin and pulp","Pulp only","Enamel only","Cementum, PDL, and alveolar bone"],"correctOption":3,"answer":"Cementum, PDL, and alveolar bone"},{"id":"py-4-4","sheetId":4,"type":"mcq","question":"The shape of the inner enamel epithelium in the cap stage is:","options":["Star shape","Tall columnar","Cuboidal","None of the above"],"correctOption":2,"answer":"Cuboidal","explanation":"IEE is cuboidal in the cap stage. In the bell stage it elongates to become columnar just before differentiating into ameloblasts."},{"id":"py-4-5","sheetId":4,"type":"mcq","question":"Formation of the first layer of dentin occurs in the:","options":["Cap stage","Early bell stage","Bud stage","Late bell stage (advanced bell stage)"],"correctOption":3,"answer":"Late bell stage (advanced bell stage)","explanation":"The advanced (late) bell stage is defined by the first deposition of dentin, which then triggers enamel formation."},{"id":"py-4-6","sheetId":4,"type":"mcq","question":"Direct contact between the inner enamel epithelium and dental papilla stimulates undifferentiated mesenchymal cells (UMCs) to differentiate into:","options":["Ameloblasts","Odontoblasts","The cervical loop","None of the above"],"correctOption":1,"answer":"Odontoblasts","explanation":"The IEE signals the peripheral cells of the dental papilla (UMCs) to differentiate into odontoblasts, which then form dentin."},{"id":"py-4-7","sheetId":4,"type":"mcq","question":"The advanced (late) bell stage is initiated by:","options":["Deposition of the first layer of enamel","Deposition of the first layer of dentin","Deposition of cementum","Root formation beginning"],"correctOption":1,"answer":"Deposition of the first layer of dentin"},{"id":"py-4-8","sheetId":4,"type":"mcq","question":"Which of the following structures develops from the inner enamel epithelium?","options":["Enamel","Dentin","Pulp","None of the above"],"correctOption":0,"answer":"Enamel","explanation":"Inner enamel epithelium cells differentiate into ameloblasts, which produce enamel."},{"id":"py-4-9","sheetId":4,"type":"mcq","question":"The actual movement of a tooth from its developmental site to its position in the dental arch is called:","options":["Passive eruption","Active eruption","Drifting","Tipping"],"correctOption":1,"answer":"Active eruption","explanation":"Active eruption = axial (occlusal) movement from developmental position to functional position."},{"id":"py-4-10","sheetId":4,"type":"mcq","question":"The principal direction of tooth movement during the eruptive phase is:","options":["Axial (occlusal)","Around a transverse axis","Mesiodistal","None of the above"],"correctOption":0,"answer":"Axial (occlusal)"},{"id":"py-4-11","sheetId":4,"type":"mcq","question":"The pre-eruptive phase starts from the:","options":["End of early bell stage","End of late bell stage","After root formation is complete","None of the above"],"correctOption":0,"answer":"End of early bell stage (beginning of late bell stage)"},{"id":"py-4-12","sheetId":4,"type":"mcq","question":"The cells responsible for resorption of tooth hard structure (dentin, cementum) are:","options":["Odontoclasts","Fibroclasts","Odontoblasts","Ameloblasts"],"correctOption":0,"answer":"Odontoclasts"},{"id":"py-4-13","sheetId":4,"type":"mcq","question":"Apposition is a histophysiological stage confined to the:","options":["Bud stage","Cap stage","Early bell stage","Late bell stage"],"correctOption":3,"answer":"Late bell stage","explanation":"Apposition (matrix deposition) begins in the late bell stage when odontoblasts and ameloblasts start forming their respective matrices."},{"id":"py-4-14","sheetId":4,"type":"mcq","question":"Which dental enamel organ is usually the FIRST to develop?","options":["First deciduous molar","Permanent central incisor","Deciduous central incisor","Deciduous canine"],"correctOption":2,"answer":"Deciduous central incisor","explanation":"The deciduous central incisor is the first tooth to initiate development, at approximately the 6th–7th week IU."},{"id":"py-4-15","sheetId":4,"type":"mcq","question":"Hertwig's epithelial root sheath (HERS) is composed of:","options":["Inner dental epithelium only","Outer dental epithelium only","Both inner and outer dental epithelium","None of the above"],"correctOption":2,"answer":"Both inner and outer dental epithelium"},{"id":"py-4-16","sheetId":4,"type":"mcq","question":"Odontogenesis of the primary dentition begins between:","options":["The 6th & 7th week I.U.","The 5th & 6th week I.U.","The 7th & 8th week I.U.","The 4th & 5th week I.U."],"correctOption":0,"answer":"The 6th & 7th week I.U."},{"id":"py-4-17","sheetId":4,"type":"mcq","question":"Which of the following is NOT a function of the inner dental epithelium?","options":["Determines the future morphology of the amelodentinal junction","Produces the primary enamel cuticle","Keeps space for the developing enamel (acts as mold)","Shares in forming the reduced enamel epithelium"],"correctOption":2,"answer":"Keeps space for the developing enamel — this is NOT a primary function","explanation":"IEE functions: determines ADJ morphology, produces primary cuticle, shares in REE. 'Keeps space for enamel' is not a recognized function."},{"id":"py-4-18","sheetId":4,"type":"mcq","question":"The dental lamina is induced to proliferate into a tooth bud by the:","options":["Basement membrane","Nerve endings","Neural crest cells","Oral epithelium"],"correctOption":2,"answer":"Neural crest cells"},{"id":"py-4-19","sheetId":4,"type":"mcq","question":"All of the following are involved in the formation of a tooth EXCEPT:","options":["Epithelial root sheath (HERS)","Successional lamina","Dental lamina","Vestibular lamina"],"correctOption":3,"answer":"Vestibular lamina","explanation":"The vestibular lamina forms the oral vestibule (cheek furrow), NOT the tooth. Tooth formation requires dental lamina, successional lamina, and HERS."},{"id":"py-4-20","sheetId":4,"type":"mcq","question":"Stratum intermedium is composed of:","options":["2–3 layers of cuboidal cells","2–3 layers of columnar cells","2–3 layers of round cells","2–3 layers of flat cells"],"correctOption":3,"answer":"2–3 layers of flat cells"},{"id":"py-4-21","sheetId":4,"type":"mcq","question":"The layer of the dental organ which differentiates into ameloblasts is:","options":["Outer enamel epithelium","Inner enamel epithelium","Stratum intermedium","Stellate reticulum"],"correctOption":1,"answer":"Inner enamel epithelium"},{"id":"py-4-22","sheetId":4,"type":"mcq","question":"Shedding is predominantly the:","options":["Physiologic loss of impacted teeth","Physiologic loss of permanent teeth","Physiologic loss of primary (deciduous) teeth","None of the above"],"correctOption":2,"answer":"Physiologic loss of primary (deciduous) teeth"},{"id":"py-4-23","sheetId":4,"type":"mcq","question":"Which of the following is true about ankylosis?","options":["Is a union of the tooth with the periodontal ligament","The active eruption of an ankylosed tooth continues normally","Is a bony union between the alveolar bone and the roots of deciduous teeth","None of the above"],"correctOption":2,"answer":"Is a bony union between the alveolar bone and the roots of deciduous teeth"},{"id":"py-4-24","sheetId":4,"type":"mcq","question":"The cells of the dental follicle are responsible for formation of:","options":["Complete enamel","Complete crown","Complete root (cementum, PDL, alveolar bone)","None of the above"],"correctOption":2,"answer":"Complete root — dental follicle cells form cementum, PDL, and alveolar bone"},{"id":"py-4-25","sheetId":4,"type":"mcq","question":"The early bell stage of tooth development:","options":["Started when root begins to develop","Is the first stage in tooth development","Is the stage following the cap stage","Occurs when cementoblasts begin producing cementum"],"correctOption":2,"answer":"Is the stage following the cap stage"},{"id":"py-4-26","sheetId":4,"type":"mcq","question":"During formation of a multi-rooted tooth:","options":["The cervical loop extends horizontally (epithelial diaphragm forms)","Epithelial diaphragm is formed","HERS covers the dentin of the root","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-4-27","sheetId":4,"type":"mcq","question":"Ankylosis will result in which new condition?","options":["Retained permanent teeth — crown at the same level as the occlusal line","Submerged deciduous teeth — crown located below the level of the occlusal line","Both of the above","None of the above"],"correctOption":2,"answer":"Both: retained permanent teeth at occlusal level AND submerged deciduous teeth"},{"id":"py-4-28","sheetId":4,"type":"mcq","question":"Histological changes during the eruptive phase (pre-functional phase) include:","options":["Root formation","Periodontal ligament formation","Dentogingival junction formation","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-4-29","sheetId":4,"type":"mcq","question":"Types of tooth movement in the post-eruptive phase include:","options":["Rotational movements only","Movements in a distal direction","Bodily movements only","Axial and mesial movements"],"correctOption":3,"answer":"Axial and mesial movements"},{"id":"py-4-30","sheetId":4,"type":"mcq","question":"The theories that explain the mechanism of tooth eruption/movement include all EXCEPT:","options":["Vascular pressure theory","Root resorption theory","Bone remodeling theory","Periodontal ligament traction theory"],"correctOption":1,"answer":"Root resorption theory — this is NOT a recognized theory of tooth movement/eruption","explanation":"Recognized eruption theories: vascular pressure, bone remodeling, PDL traction (gel contraction). Root resorption describes shedding, not eruption."},{"id":"py-4-31","sheetId":4,"type":"mcq","question":"Axial tooth movement is:","options":["Movement in the direction of the long axis of the tooth","Movement in distal, mesial, lingual or buccal direction","Movement around a transverse axis","Movement around a longitudinal axis"],"correctOption":0,"answer":"Movement in the direction of the long axis of the tooth"},{"id":"py-4-32","sheetId":4,"type":"mcq","question":"Retained deciduous teeth are caused by all EXCEPT:","options":["Congenital missing of permanent tooth","Osteoporosis","Ankylosed or impacted permanent tooth","Supernumerary tooth or tumor blocking permanent eruption"],"correctOption":1,"answer":"Osteoporosis"},{"id":"py-tf-4-1","sheetId":4,"type":"true-false","question":"Tooth development begins at the 2nd week of intrauterine life.","answer":"False","explanation":"Tooth development (dental lamina formation) begins at the 6th–7th week of intrauterine life."},{"id":"py-tf-4-2","sheetId":4,"type":"true-false","question":"The stellate reticulum is present in the portion of the dental organ that will form the root.","answer":"False","explanation":"The stellate reticulum is in the crown portion of the enamel organ, NOT in the root (which lacks stellate reticulum)."},{"id":"py-tf-4-3","sheetId":4,"type":"true-false","question":"Odontoblasts develop before ameloblasts.","answer":"True","explanation":"Odontoblasts differentiate first and deposit mantle dentin. This triggers ameloblast differentiation, then enamel formation begins."},{"id":"py-tf-4-4","sheetId":4,"type":"true-false","question":"The dental papilla gives rise to the periodontal ligament and cementum.","answer":"False","explanation":"The dental PAPILLA gives rise to the pulp and dentin. PDL and cementum come from the dental SAC (follicle)."},{"id":"py-tf-4-5","sheetId":4,"type":"true-false","question":"Enamel formation starts at the late bell stage.","answer":"True","explanation":"Enamel formation (amelogenesis) begins at the advanced (late) bell stage, just AFTER the first layer of dentin is deposited."},{"id":"py-tf-4-6","sheetId":4,"type":"true-false","question":"The outer dental epithelium plays an important role in active transport of materials before dentin formation.","answer":"True"},{"id":"py-tf-4-7","sheetId":4,"type":"true-false","question":"Both the 2nd and 3rd arches meet their left and right counterparts at the midline.","answer":"False","explanation":"Only the 1st (mandibular) arch pairs merge at the midline to form the mandible. The 2nd and 3rd arches do not meet at the midline."},{"id":"py-tf-4-8","sheetId":4,"type":"true-false","question":"The 3rd pharyngeal pouch will form the external auditory meatus and tympanic membrane.","answer":"True","explanation":"3rd pouch → inferior parathyroid + thymus. Wait — the question says 3rd pouch forms EAM. Correction: 1st pharyngeal CLEFT forms EAM; 1st pouch forms auditory tube. The exam answer shown is (T)."},{"id":"py-tf-4-9","sheetId":4,"type":"true-false","question":"The stomodeum is bounded laterally on both sides by the frontonasal process.","answer":"False","explanation":"The stomodeum is bounded: superiorly by the frontonasal process, laterally by the maxillary processes, and inferiorly by the mandibular processes."},{"id":"py-tf-4-10","sheetId":4,"type":"true-false","question":"Secretory cells of salivary glands develop from the mesoderm of the oral cavity.","answer":"False","explanation":"Salivary gland secretory cells (acinar cells) develop from ECTODERM of the oral cavity, not mesoderm."},{"id":"py-tf-4-11","sheetId":4,"type":"true-false","question":"In eruption, more than one factor shares in the eruptive movement.","answer":"True","explanation":"Multiple theories explain eruption: bone remodeling, vascular pressure, PDL traction, gel contraction — all may contribute."},{"id":"py-tf-4-12","sheetId":4,"type":"true-false","question":"The coronoid cartilage will disappear before birth.","answer":"True","explanation":"The coronoid cartilage is a transient secondary cartilage that disappears long before birth, unlike the condylar cartilage."},{"id":"py-tf-4-13","sheetId":4,"type":"true-false","question":"The cervical loop is the earliest indication of root formation.","answer":"True"},{"id":"py-tf-4-14","sheetId":4,"type":"true-false","question":"The dental lamina initiates deciduous teeth only.","answer":"False","explanation":"The dental lamina initiates BOTH deciduous and permanent teeth. A successional lamina from the dental lamina initiates permanent teeth."},{"id":"py-tf-4-15","sheetId":4,"type":"true-false","question":"By the end of enamel maturation, ameloblasts become part of the reduced enamel epithelium (REE).","answer":"True"},{"id":"py-tf-4-16","sheetId":4,"type":"true-false","question":"Movements of eruption begin in the cap stage.","answer":"False","explanation":"Eruptive movements begin at the end of the late bell stage, once crown formation is complete — NOT in the cap stage."},{"id":"py-tf-4-17","sheetId":4,"type":"true-false","question":"During shedding, odontoclasts are the cells responsible for resorption of soft tissue.","answer":"False","explanation":"Odontoclasts resorb HARD tissues (dentin, cementum). Soft tissue resorption is performed by macrophages/phagocytes."},{"id":"py-tf-4-18","sheetId":4,"type":"true-false","question":"The dental lamina is formed by proliferation of the basal layer of the oral epithelium into the underlying ectomesenchyme.","answer":"True"},{"id":"py-5-1","sheetId":5,"type":"mcq","question":"Age changes that occur in enamel include:","options":["Surface attrition","Chemical changes (increased fluoride, decreased carbonate)","Decreased permeability","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-5-2","sheetId":5,"type":"mcq","question":"The outer enamel surface of newly erupted teeth shows small indentations called:","options":["Rod ends","Rodless enamel","Incremental lines","All of the above"],"correctOption":0,"answer":"Rod ends"},{"id":"py-5-3","sheetId":5,"type":"mcq","question":"Perikymata are:","options":["Transverse wave-like grooves on outer enamel surface","The outer surface manifestation of the striae of Retzius","Prominent in the cervical portion of the crown","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-5-4","sheetId":5,"type":"mcq","question":"Cross striations (incremental lines) of enamel rods represent:","options":["Daily rhythmic appositional pattern (~4 µm intervals)","Longitudinal striation that demarcates rod segments","Rhythmic apposition of enamel matrix by ameloblasts","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-5-5","sheetId":5,"type":"mcq","question":"The striae of Retzius (brown striae) may reflect several phenomena:","options":["Variation in enamel structure and mineralization","Periodic changes/bending of enamel","All of the above","None of the above"],"correctOption":2,"answer":"All of the above"},{"id":"py-5-6","sheetId":5,"type":"mcq","question":"Hunter-Schreger bands are:","options":["An optical phenomenon due to alternating enamel rod direction","Seen in the inner 2/3 of enamel","All of the above","None of the above"],"correctOption":2,"answer":"All of the above — optical phenomenon, visible in inner 2/3 of enamel"},{"id":"py-5-7","sheetId":5,"type":"mcq","question":"Neonatal lines are found in all of the following EXCEPT:","options":["Enamel of primary incisors","Enamel of permanent first molars","Enamel of permanent second molars","Enamel of primary molars"],"correctOption":2,"answer":"Enamel of permanent second molars","explanation":"Neonatal lines form in teeth developing at birth. Permanent second molars begin mineralization after birth, so they lack neonatal lines."},{"id":"py-5-8","sheetId":5,"type":"mcq","question":"Enamel spindles are:","options":["Extensions of enamel rods into dentin","Terminal ends of odontoblastic processes that extend a short distance into enamel","Hunter-Schreger bands near the DEJ","Areas of prismatic enamel"],"correctOption":1,"answer":"Terminal ends of odontoblastic processes that extend a short distance into enamel"},{"id":"py-5-9","sheetId":5,"type":"mcq","question":"The direction of enamel rods in the cervical third of permanent teeth is:","options":["Vertical","Oblique occlusally","Horizontal","Oblique apically"],"correctOption":3,"answer":"Oblique apically","explanation":"In cervical 1/3 of permanent teeth, rods incline apically. In primary teeth, they incline occlusally in this region."},{"id":"py-5-10","sheetId":5,"type":"mcq","question":"The following structures are hypomineralized areas of enamel EXCEPT:","options":["Enamel tufts","Prismless enamel","Enamel lamellae","Rod sheath"],"correctOption":1,"answer":"Prismless enamel","explanation":"Prismless enamel is actually well-mineralized (just lacks rod structure). Tufts, lamellae, and rod sheaths are hypomineralized."},{"id":"py-5-11","sheetId":5,"type":"mcq","question":"The complex arrangement of enamel rods over the cusps is termed:","options":["Prismless enamel","Gnarled enamel","Prenatal enamel","Postnatal enamel"],"correctOption":1,"answer":"Gnarled enamel","explanation":"Gnarled enamel is the irregular, interlocking arrangement of rods in cusp areas — it increases resistance to fracture."},{"id":"py-5-12","sheetId":5,"type":"mcq","question":"Enamel tufts appear in transverse ground section as:","options":["Grass-like structures","Leaf-like structures","Plate-like structures","Sickle-like structures"],"correctOption":0,"answer":"Grass-like structures","explanation":"Enamel tufts are grass or bush-like hypomineralized structures extending from DEJ into enamel."},{"id":"py-5-13","sheetId":5,"type":"mcq","question":"Darkening of enamel (age change) is caused by all of the following EXCEPT:","options":["Change in the structure of enamel","Change in the structure of dentin","Absorption of organic material from the oral environment","Loss of inorganic material from enamel"],"correctOption":3,"answer":"Loss of inorganic material from enamel","explanation":"Enamel darkens with age due to structural changes, dentin yellowing showing through, and organic absorption. Loss of inorganic material causes white spot lesions, not darkening."},{"id":"py-5-14","sheetId":5,"type":"mcq","question":"Which of the following is TRUE about enamel?","options":["Enamel is the weakly mineralized tissue","Enamel is the highly mineralized tissue in the body","Enamel is completely non-permeable","Enamel is a non-brittle tissue"],"correctOption":1,"answer":"Enamel is the most highly mineralized tissue in the body (96–97% inorganic)"},{"id":"py-5-15","sheetId":5,"type":"mcq","question":"The dentinoenamel junction (DEJ) appears to be scalloped with convexities directed toward the:","options":["Enamel","Dentin","Cementum","None of the above"],"correctOption":0,"answer":"Enamel","explanation":"The DEJ is scalloped with the convexities (peaks) pointing toward the enamel — this interlocking increases the surface area and bond strength."},{"id":"py-5-16","sheetId":5,"type":"mcq","question":"Hunter-Schreger bands are found in which parts of enamel EXCEPT:","options":["Cervical third","Middle third","Inner two-thirds","Cuspal area"],"correctOption":0,"answer":"Cervical third","explanation":"Hunter-Schreger bands are found in the inner 2/3 of enamel, mainly in the middle and cuspal portions, not in the cervical third."},{"id":"py-tf-5-1","sheetId":5,"type":"true-false","question":"Enamel is produced by cells of mesodermal origin.","answer":"False","explanation":"Enamel is produced by ameloblasts derived from the ectoderm (inner enamel epithelium)."},{"id":"py-tf-5-2","sheetId":5,"type":"true-false","question":"The anatomical crown is the part of the tooth covered by enamel.","answer":"True"},{"id":"py-tf-5-3","sheetId":5,"type":"true-false","question":"Enamel is permeable due to the presence of dentinal tubules.","answer":"False","explanation":"Enamel has NO dentinal tubules. Its slight permeability is due to micropores (submicroscopic channels) between enamel rods."},{"id":"py-tf-5-4","sheetId":5,"type":"true-false","question":"If enamel is destroyed by caries or wear, it cannot regenerate.","answer":"True","explanation":"Ameloblasts are lost after tooth eruption, so enamel cannot self-repair or regenerate."},{"id":"py-tf-5-5","sheetId":5,"type":"true-false","question":"The outer surface of enamel is more permeable than the inner layer near the DEJ.","answer":"False","explanation":"The outer enamel surface is LESS permeable due to higher fluoride content and smaller pore size compared to the inner enamel."},{"id":"py-tf-5-6","sheetId":5,"type":"true-false","question":"Enamel rods (prisms) run in a wavy course and are generally perpendicular to the enamel surface.","answer":"True"},{"id":"py-tf-5-7","sheetId":5,"type":"true-false","question":"The period of activity between two striae of Retzius (brown striae) is about 6 days.","answer":"True","explanation":"Each stria of Retzius represents approximately 6–8 days of enamel formation, visible as regular cross-striations."},{"id":"py-tf-5-8","sheetId":5,"type":"true-false","question":"Fluorapatite crystals are more resistant to acid dissolution than hydroxyapatite crystals.","answer":"True","explanation":"Fluoride substitutes for hydroxyl in hydroxyapatite to form fluorapatite, which has a lower solubility in acid — this is the basis of fluoride's caries-protective effect."},{"id":"py-tf-5-9","sheetId":5,"type":"true-false","question":"Enamel over the cusps of permanent teeth reaches a maximum thickness of 1 mm.","answer":"False","explanation":"Enamel over cusps can reach 2.5–3 mm in thickness. Only 1 mm would be a very thin enamel."},{"id":"py-tf-5-10","sheetId":5,"type":"true-false","question":"Hunter-Schreger bands are found in the inner two-thirds of enamel.","answer":"True"},{"id":"py-tf-5-11","sheetId":5,"type":"true-false","question":"The difference between rod enamel and inter-rod enamel is not chemical but in the orientation of the crystals.","answer":"True"},{"id":"py-tf-5-12","sheetId":5,"type":"true-false","question":"In cross-section, enamel rods appear as hexagonal, oval, rounded, and fish-scale shapes.","answer":"True"},{"id":"py-tf-5-13","sheetId":5,"type":"true-false","question":"Enamel tufts are incremental lines reflecting rhythmic apposition of enamel formation.","answer":"False","explanation":"Enamel tufts are HYPOMINERALIZED structures extending from DEJ inward. They are NOT incremental lines. Striae of Retzius are the incremental lines."},{"id":"py-tf-5-14","sheetId":5,"type":"true-false","question":"The permanent maxillary molar develops with the occlusal surface facing mesially.","answer":"False","explanation":"The permanent maxillary molar develops with the occlusal surface facing DISTALLY. It then rotates to its final position."},{"id":"py-tf-5-15","sheetId":5,"type":"true-false","question":"Enamel contains 3% by weight of organic matrix.","answer":"False","explanation":"Enamel composition: 96% inorganic, 1% organic, 3% water (by weight). The organic component is ~1%, not 3%."},{"id":"py-6-1","sheetId":6,"type":"mcq","question":"Peritubular dentin is defined as:","options":["A ring of highly mineralized dentin immediately surrounding each dentinal tubule","The dentin between dentinal tubules","The first formed dentin at the DEJ","Dentin closest to the pulp"],"correctOption":0,"answer":"A ring of highly mineralized dentin immediately surrounding each dentinal tubule"},{"id":"py-6-2","sheetId":6,"type":"mcq","question":"Regarding the physical properties of dentin:","options":["Harder than bone and cementum, but softer than enamel","Harder than enamel","Softer than bone and cementum","Equal hardness to enamel"],"correctOption":0,"answer":"Harder than bone and cementum, but softer than enamel"},{"id":"py-6-3","sheetId":6,"type":"mcq","question":"Von Korff's fibers are characteristic of:","options":["Mantle dentin","Circumpulpal dentin","Peritubular dentin","Transparent (sclerotic) dentin"],"correctOption":0,"answer":"Mantle dentin","explanation":"Von Korff fibers are coarse type III collagen fibers in the matrix of mantle dentin, running spirally from pulp toward the DEJ."},{"id":"py-6-4","sheetId":6,"type":"mcq","question":"Dead tracts in dentin appear as:","options":["White in transmitted light only","Black in transmitted light, white (opaque) in reflected light","Transparent in both lighting conditions","Brown in ground sections only"],"correctOption":1,"answer":"Black in transmitted light, white (opaque) in reflected light","explanation":"Dead tracts are dentinal tubules filled with air after degeneration of odontoblastic processes — air appears black in transmitted light."},{"id":"py-6-5","sheetId":6,"type":"mcq","question":"The neonatal line is found in:","options":["Enamel only of primary teeth","Dentin only","Both enamel and dentin of teeth forming at birth","Cementum only"],"correctOption":2,"answer":"Both enamel and dentin of teeth forming at birth"},{"id":"py-6-6","sheetId":6,"type":"mcq","question":"Initiation of mineralization via matrix vesicles is limited to:","options":["Circumpulpal dentin","Mantle dentin","Peritubular dentin","Sclerotic dentin"],"correctOption":1,"answer":"Mantle dentin","explanation":"Mantle dentin mineralizes via matrix vesicles. Circumpulpal dentin mineralizes by direct nucleation on collagen fibers."},{"id":"py-6-7","sheetId":6,"type":"mcq","question":"Obturation (calcification) of dentinal tubules leads to formation of:","options":["Tertiary dentin","Dead tract","Secondary dentin","Transparent (sclerotic) dentin"],"correctOption":3,"answer":"Transparent (sclerotic) dentin","explanation":"Calcification of dentinal tubules by mineral salts obliterates them, resulting in sclerotic (transparent) dentin which appears glassy in ground sections."},{"id":"py-6-8","sheetId":6,"type":"mcq","question":"The hypocalcified area in root dentin is known as:","options":["Tomes' granular layer","Interglobular dentin","Apical fiber","None of the above"],"correctOption":0,"answer":"Tomes' granular layer","explanation":"Tomes' granular layer is found at the periphery of root dentin just deep to the cementum — caused by looping of terminal dentinal tubules."},{"id":"py-6-9","sheetId":6,"type":"mcq","question":"The first dentin formed below the enamel (outer crown dentin) is called:","options":["Primary dentin","Secondary dentin","Circumpulpal dentin","Mantle dentin"],"correctOption":3,"answer":"Mantle dentin"},{"id":"py-6-10","sheetId":6,"type":"mcq","question":"The hypomineralized areas of dentin found below the dentinoenamel junction (in crown dentin) are:","options":["Peritubular dentin","Interglobular dentin","Intertubular dentin","Tomes' granular layer"],"correctOption":1,"answer":"Interglobular dentin","explanation":"Interglobular dentin = areas between calcospherites in crown dentin that failed to fuse, resulting in unmineralized/hypomineralized patches."},{"id":"py-6-11","sheetId":6,"type":"mcq","question":"Dentin is classified as a variety of connective tissue because it:","options":["Is elastic and contains mucopolysaccharides","Contains collagen fibers and cell processes derived from mesenchyme","Contains inorganic cells","Has few cells and much intercellular material"],"correctOption":1,"answer":"Contains collagen fibers and cell processes derived from mesenchyme"},{"id":"py-6-12","sheetId":6,"type":"mcq","question":"Cementum deposition cervically on the enamel surface is due to:","options":["Premature degeneration of epithelial root sheath of Hertwig","Loss (premature separation) of the reduced enamel epithelium","Persistence of the epithelial root sheath of Hertwig","Cementoblasts coming from dental sac (normal pathway)"],"correctOption":1,"answer":"Loss (premature separation) of the reduced enamel epithelium","explanation":"When the REE separates prematurely before eruption, cementoblasts can deposit afibrillar cementum directly on enamel."},{"id":"py-6-13","sheetId":6,"type":"mcq","question":"Age changes that increase with aging include:","options":["Dentin sclerosis","Interglobular dentin","Increased cementum thickness","All of the above"],"correctOption":3,"answer":"All of the above — dentin sclerosis, interglobular dentin, and cementum thickness all increase with age"},{"id":"py-6-14","sheetId":6,"type":"mcq","question":"The interglobular dentin is:","options":["Hypermineralized","Seen in root dentin primarily","Hypomineralized, seen in crown dentin","None of the above"],"correctOption":2,"answer":"Hypomineralized, seen in crown dentin"},{"id":"py-6-15","sheetId":6,"type":"mcq","question":"Reparative (tertiary) dentin is formed:","options":["Continuously throughout life","As a localized response to severe stimuli (fast caries, attrition, cavity preparation)","Instead of secondary dentin","All of the above"],"correctOption":1,"answer":"As a localized response to severe stimuli at the pulp-dentin border"},{"id":"py-6-16","sheetId":6,"type":"mcq","question":"About the physical properties of dentin: which is correct?","options":["It has a high degree of resiliency compared to enamel","More radiolucent than enamel, more radiopaque than cementum","Softer than cementum","B and A are both correct"],"correctOption":3,"answer":"Dentin has resiliency AND is more radiolucent than enamel but more radiopaque than cementum"},{"id":"py-6-17","sheetId":6,"type":"mcq","question":"The uncalcified layer of dentin (10–20 µm) always present between odontoblasts and calcified dentin is called:","options":["Predentin","Tomes' granular layer","All of the above","None of the above"],"correctOption":0,"answer":"Predentin"},{"id":"py-6-18","sheetId":6,"type":"mcq","question":"The direct innervation theory of dentin sensitivity supposes that nerve endings reach the:","options":["Dentinoenamel junction","Periodontal ligament","All of the above","None of the above"],"correctOption":0,"answer":"Dentinoenamel junction","explanation":"The direct innervation theory proposes that nerve fibers extend all the way to the DEJ inside dentinal tubules. (The hydrodynamic theory is the most accepted.)"},{"id":"py-tf-6-1","sheetId":6,"type":"true-false","question":"Mantle dentin is both the first formed and the most mature (fully mineralized) dentin.","answer":"False","explanation":"Mantle dentin is the FIRST FORMED dentin but it is LESS mineralized than circumpulpal dentin."},{"id":"py-tf-6-2","sheetId":6,"type":"true-false","question":"Circumpulpal dentin is the first formed and most mature dentin.","answer":"False","explanation":"MANTLE dentin forms FIRST. Circumpulpal dentin forms later and makes up the bulk of dentin."},{"id":"py-tf-6-3","sheetId":6,"type":"true-false","question":"Dentinal tubules are small canals extending from the pulp surface to the DEJ.","answer":"True"},{"id":"py-tf-6-4","sheetId":6,"type":"true-false","question":"Peritubular dentin is a ring of mineralized dentin surrounding each dentinal tubule.","answer":"True"},{"id":"py-tf-6-5","sheetId":6,"type":"true-false","question":"Dead tracts represent complete degeneration of the odontoblastic processes due to severe stimuli.","answer":"True"},{"id":"py-tf-6-6","sheetId":6,"type":"true-false","question":"Dentin is more radiolucent than enamel and more radiopaque than cementum.","answer":"True"},{"id":"py-tf-6-7","sheetId":6,"type":"true-false","question":"Dentinal tubules in the crown run in an S-shaped course called the primary curvature.","answer":"True"},{"id":"py-7-1","sheetId":7,"type":"mcq","question":"Regarding cementum permeability:","options":["Cellular cementum is more permeable than acellular cementum","Acellular cementum is more permeable","Both types have equal permeability","Neither type is permeable"],"correctOption":0,"answer":"Cellular cementum is more permeable than acellular cementum"},{"id":"py-7-2","sheetId":7,"type":"mcq","question":"At the cemento-enamel junction (CEJ), cementum overlapping enamel occurs in approximately:","options":["60% of cases (most common)","30% of cases","10% of cases","50% of cases"],"correctOption":0,"answer":"60% of cases — the most common CEJ relationship","explanation":"CEJ types: 60% cementum overlaps enamel (most common), 30% edge-to-edge, 10% gap with exposed dentin."},{"id":"py-7-3","sheetId":7,"type":"mcq","question":"If the overgrowth of cementum improves the functional quality, it is termed:","options":["Cementum hyperplasia","Cementum hypertrophy","Mixed cementum","Intermediate cementum"],"correctOption":1,"answer":"Cementum hypertrophy","explanation":"Hypertrophy = functional adaptive thickening. Hyperplasia = non-functional excess cementum deposition."},{"id":"py-7-4","sheetId":7,"type":"mcq","question":"The incremental lines of Salter in cementum are:","options":["Higher in number in cellular than acellular cementum","Higher in acellular than cellular cementum","Represent hypomineralized areas in cementum","A and C only"],"correctOption":3,"answer":"A and C — higher number in cellular cementum AND represent hypomineralized areas"},{"id":"py-7-5","sheetId":7,"type":"mcq","question":"The hardness of cementum compared to dentin:","options":["Cementum is softer (less hard) than dentin","Cementum is harder than dentin","Equal hardness","Depends on tooth type"],"correctOption":0,"answer":"Cementum is softer (less hard) than dentin","explanation":"Hardness ranking: Enamel > Dentin > Cementum ≈ Bone."},{"id":"py-7-6","sheetId":7,"type":"mcq","question":"The main structural difference between cementum and bone is that cementum:","options":["Lacks Haversian systems only","Has no blood vessels or nerves (avascular, non-innervated)","Is more heavily calcified than bone","Contains more collagen than bone"],"correctOption":1,"answer":"Has no blood vessels or nerves — cementum is avascular and non-innervated"},{"id":"py-7-7","sheetId":7,"type":"mcq","question":"Cementum is a tissue that:","options":["Provides attachment of periodontal ligament fibers to the root","Is more easily resorbed than bone","Contains blood vessels","Contains neural receptors"],"correctOption":0,"answer":"Provides attachment of periodontal ligament fibers to the root"},{"id":"py-7-8","sheetId":7,"type":"mcq","question":"The type of cementum composed of ground substance and Sharpey's fibers (no cells) is:","options":["Cellular cementum","Acellular cementum","Intermediate cementum","None of the above"],"correctOption":1,"answer":"Acellular cementum","explanation":"Acellular (primary) cementum is found in the cervical 2/3 of the root and contains embedded Sharpey's fibers but no cells."},{"id":"py-7-9","sheetId":7,"type":"mcq","question":"Cementicles are:","options":["Uncalcified matrix of cementum","Calcified nodules found within the PDL space","Epithelial remnants in the cementum","All of the above"],"correctOption":1,"answer":"Calcified nodular bodies found within the PDL space"},{"id":"py-7-10","sheetId":7,"type":"mcq","question":"Cementum has the following property:","options":["Non-vital tissue","Highest fluoride content in all dental tissues","Is a vascular tissue","None of the above"],"correctOption":1,"answer":"Highest fluoride content of all dental tissues"},{"id":"py-tf-7-1","sheetId":7,"type":"true-false","question":"Acellular cementum contains embedded cementocytes (cementocyte lacunae).","answer":"False","explanation":"Only CELLULAR cementum contains cementocytes. Acellular cementum has no cells."},{"id":"py-tf-7-2","sheetId":7,"type":"true-false","question":"Cementum overlapping enamel at the CEJ can cause premature separation of the reduced enamel epithelium, resulting in afibrillar cementum.","answer":"True"},{"id":"py-tf-7-3","sheetId":7,"type":"true-false","question":"Acellular cementum is found at the middle two-thirds of the root.","answer":"True","explanation":"Acellular (primary) cementum is found at the cervical to middle portions (middle two-thirds) of the root."},{"id":"py-tf-7-4","sheetId":7,"type":"true-false","question":"The extrinsic fiber cementum is produced by fibroblasts.","answer":"True","explanation":"Extrinsic fibers = Sharpey's fibers from PDL fibroblasts embedded into cementum. Intrinsic fibers = made by cementoblasts."},{"id":"py-8-1","sheetId":8,"type":"mcq","question":"The plexus of Rashkow (subodontoblastic nerve plexus) is located in the:","options":["Odontoblastic layer","Cell-free zone (subodontoblastic zone)","Central pulp core","Apical region only"],"correctOption":1,"answer":"Cell-free zone (zone of Weil) — just deep to the odontoblastic layer"},{"id":"py-8-2","sheetId":8,"type":"mcq","question":"Which of the following is NOT a normal dental pulp cell?","options":["Fibroblast","Epithelial cell","Undifferentiated mesenchymal cell","Macrophage (histiocyte)"],"correctOption":1,"answer":"Epithelial cell","explanation":"The dental pulp is of mesenchymal origin and contains no epithelial cells under normal conditions."},{"id":"py-8-3","sheetId":8,"type":"mcq","question":"Free denticles (pulp stones) are:","options":["Entirely surrounded by dentin (embedded)","Entirely surrounded by pulp tissue (not touching dentin walls)","Attached to the dentin wall on one side","Embedded between dentin layers"],"correctOption":1,"answer":"Entirely surrounded by pulp tissue (not attached to dentin walls)"},{"id":"py-8-4","sheetId":8,"type":"mcq","question":"False denticles are characterized by ALL of the following EXCEPT:","options":["Concentric layers of mineralized tissue","No dentinal tubules within them","Usually found in the pulp chamber and canals","All features above are correct for false denticles"],"correctOption":3,"answer":"All features above are correct — all describe false denticles"},{"id":"py-8-5","sheetId":8,"type":"mcq","question":"The largest group and most numerous cells in the dental pulp are:","options":["Odontoblasts","Fibroblasts","Undifferentiated mesenchymal cells","Macrophages"],"correctOption":1,"answer":"Fibroblasts"},{"id":"py-8-6","sheetId":8,"type":"mcq","question":"Reticular atrophy of the dental pulp involves:","options":["Increase in number of pulp cells","Decreased size of pulp chamber only","Aggregation of pulp cells forming a collagen bundle-like (reticular) pattern","None of the above"],"correctOption":2,"answer":"Aggregation of pulp cells forming a collagen bundle-like reticular pattern"},{"id":"py-8-7","sheetId":8,"type":"mcq","question":"The cell of the pulp responsible for producing histamine and heparin is the:","options":["Fibroblast","Odontoblast","Mast cell","Macrophage"],"correctOption":2,"answer":"Mast cell"},{"id":"py-8-8","sheetId":8,"type":"mcq","question":"False denticle is more commonly located in the:","options":["Root canal","Apical foramen","Coronal pulp (pulp chamber)","None of the above"],"correctOption":2,"answer":"Coronal pulp (pulp chamber)"},{"id":"py-8-9","sheetId":8,"type":"mcq","question":"True denticles are characterized by:","options":["Similar structure to dentin with dentinal tubules","Contain processes of odontoblasts","Usually located close to the apical foramen","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-8-10","sheetId":8,"type":"mcq","question":"Some odontoblastic processes cross the dentinoenamel junction and extend into the enamel matrix. These are called:","options":["Enamel lamellae","Enamel tufts","Enamel spindles","Dead tracts"],"correctOption":2,"answer":"Enamel spindles"},{"id":"py-8-11","sheetId":8,"type":"mcq","question":"The type of pulp stone that occurs in the root canal is called:","options":["Free denticle","Attached denticle","Diffuse pulp calcification","Embedded denticle"],"correctOption":2,"answer":"Diffuse pulp calcification"},{"id":"py-8-12","sheetId":8,"type":"mcq","question":"Fibrocyte is considered as:","options":["Fibroblast that becomes round with short processes","Odontoblast that becomes vacuolated","Pulp undergoing fibrosis","All of the above"],"correctOption":0,"answer":"A fibroblast that becomes round with short processes (inactive form)"},{"id":"py-8-13","sheetId":8,"type":"mcq","question":"Functions of the dental pulp include:","options":["Inductive function","Reparative function","Nutritive function","All of the above"],"correctOption":3,"answer":"All of the above — dental pulp is inductive, reparative, and nutritive"},{"id":"py-8-14","sheetId":8,"type":"mcq","question":"The histological zones of dental pulp include all EXCEPT:","options":["Cell-free zone (zone of Weil)","Cell-rich zone","Pulp core","Ameloblastic zone"],"correctOption":3,"answer":"Ameloblastic zone — there are no ameloblasts in the pulp"},{"id":"py-8-15","sheetId":8,"type":"mcq","question":"The mineralized tissue with 70% inorganic content is:","options":["Enamel","Dentine","Cementum","Cementum and bone"],"correctOption":1,"answer":"Dentine (approximately 70% inorganic by weight)","explanation":"Dentin: ~70% inorganic, ~20% organic, ~10% water. Enamel: 96% inorganic."},{"id":"py-tf-8-1","sheetId":8,"type":"true-false","question":"The pulp chamber is the area of pulp located in the root.","answer":"False","explanation":"The pulp CHAMBER is in the crown (coronal portion). The pulp in the root is called the root canal."},{"id":"py-tf-8-2","sheetId":8,"type":"true-false","question":"Calcified structures within the dental pulp are called denticles (pulp stones).","answer":"True"},{"id":"py-tf-8-3","sheetId":8,"type":"true-false","question":"Pulp stones are usually asymptomatic unless they impinge on pulp nerves or blood vessels.","answer":"True"},{"id":"py-tf-8-4","sheetId":8,"type":"true-false","question":"Pulp stones are classified by their relation to dentin as: free, attached, and embedded.","answer":"True"},{"id":"py-tf-8-5","sheetId":8,"type":"true-false","question":"Pulp horns are horn-like extensions at the floor of the pulp chamber.","answer":"False","explanation":"Pulp horns project from the ROOF (ceiling) of the pulp chamber toward the cusps — not the floor."},{"id":"py-tf-8-6","sheetId":8,"type":"true-false","question":"Matrix vesicles essential for mineralization of dentin are secreted by the odontoblast process.","answer":"True"},{"id":"py-tf-8-7","sheetId":8,"type":"true-false","question":"Each dead tract is surrounded and isolated from the rest of dentin by sclerosed dentin.","answer":"True"},{"id":"py-tf-8-8","sheetId":8,"type":"true-false","question":"Some nerve fibers of the plexus of Rashkow lose their Schwann cell covering when passing among odontoblasts.","answer":"True"},{"id":"py-tf-8-9","sheetId":8,"type":"true-false","question":"The odontoblastic zone consists mainly of fibroblasts and undifferentiated mesenchymal cells (UMCs).","answer":"False","explanation":"The odontoblastic zone contains ODONTOBLASTS — the cells that produce dentin. Fibroblasts and UMCs are in the pulp core."},{"id":"py-9-1","sheetId":9,"type":"mcq","question":"The function of oxytalan fibers in the PDL is to:","options":["Prevent sudden collapse/closure of blood vessels during functional loading","Provide tensile strength to resist occlusal forces","Anchor Sharpey's fibers to cementum","Support osteoblast activity"],"correctOption":0,"answer":"Prevent sudden closure of blood vessels during functional loading"},{"id":"py-9-2","sheetId":9,"type":"mcq","question":"Transeptal fibers of the PDL extend from:","options":["Cementum to alveolar bone","Cementum of one tooth to cementum of the adjacent tooth over the alveolar crest","Free gingiva to cementum","Alveolar bone to alveolar bone"],"correctOption":1,"answer":"Cementum of one tooth to cementum of the adjacent tooth, running over the alveolar crest"},{"id":"py-9-3","sheetId":9,"type":"mcq","question":"The cells responsible for BOTH synthesis AND degradation of collagen fibers in the PDL are:","options":["Osteoblasts","Cementoblasts","Fibroblasts","Osteoclasts"],"correctOption":2,"answer":"Fibroblasts","explanation":"PDL fibroblasts are unique — they both synthesize and phagocytose collagen, enabling rapid fiber turnover."},{"id":"py-9-4","sheetId":9,"type":"mcq","question":"The PDL is classified histologically as:","options":["Hard connective tissue","Epithelial tissue","Dense fibrous connective tissue (soft connective tissue)","Loose areolar connective tissue"],"correctOption":2,"answer":"Dense fibrous connective tissue (soft connective tissue)"},{"id":"py-9-5","sheetId":9,"type":"mcq","question":"Cementicles are:","options":["Cementum-producing cells in the PDL","Calcified (mineralized) nodular bodies found within the PDL space","Resorption lacunae on cementum surface","Epithelial rests of Malassez"],"correctOption":1,"answer":"Calcified (mineralized) nodular bodies found within the PDL space"},{"id":"py-9-6","sheetId":9,"type":"mcq","question":"The alveolar crest fiber group of the PDL:","options":["Attaches from CEJ and runs downward and inward to the alveolar bone crest","Resists intrusive and vertical forces","A and B only","All of the above"],"correctOption":3,"answer":"All of the above — alveolar crest fibers attach at CEJ, run downward and inward, and resist intrusion"},{"id":"py-9-7","sheetId":9,"type":"mcq","question":"About the oblique group fiber bundles of the PDL:","options":["They resist vertical and intrusive forces","They resist tipping forces","All of the above","None of the above"],"correctOption":0,"answer":"They resist vertical and intrusive forces","explanation":"Oblique fibers are the most numerous PDL fibers — they suspend the tooth against vertical (intrusive) occlusal forces."},{"id":"py-9-8","sheetId":9,"type":"mcq","question":"Collagen fiber types found in the PDL are:","options":["Type I only","Type II only","Types I and III","Types I, II, and IV"],"correctOption":2,"answer":"Types I and III collagen"},{"id":"py-9-9","sheetId":9,"type":"mcq","question":"The types of alveo-dental ligament (PDL principal fiber groups) include:","options":["Alveolar crest fibers","Horizontal fibers","Interradicular fibers","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-9-10","sheetId":9,"type":"mcq","question":"The cells of the PDL include:","options":["Synthetic cells (fibroblasts, osteoblasts, cementoblasts)","Defense cells (macrophages, lymphocytes, mast cells)","Resorptive cells (osteoclasts)","All of the above"],"correctOption":3,"answer":"All of the above — synthetic, defense, resorptive, and epithelial rests"},{"id":"py-9-11","sheetId":9,"type":"mcq","question":"Periodontium is comprised of:","options":["Cementum and alveolar bone only","PDL and lamina propria of gingiva only","All of the above","None of the above"],"correctOption":2,"answer":"All of the above — cementum, alveolar bone, PDL, and gingival lamina propria"},{"id":"py-tf-9-1","sheetId":9,"type":"true-false","question":"Free nerve endings in the PDL serve as both pain receptors and mechanoreceptors.","answer":"True"},{"id":"py-tf-9-2","sheetId":9,"type":"true-false","question":"Interradicular fiber groups are found only between the roots of multi-rooted teeth.","answer":"True"},{"id":"py-tf-9-3","sheetId":9,"type":"true-false","question":"Collagen fibers in the PDL act as a cushion to absorb and distribute masticatory forces.","answer":"True"},{"id":"py-tf-9-4","sheetId":9,"type":"true-false","question":"Trauma to the PDL may cause tearing of the PDL fibers.","answer":"True"},{"id":"py-tf-9-5","sheetId":9,"type":"true-false","question":"All fibers of the periodontal ligament are collagen fibers except oxytalan fibers.","answer":"True","explanation":"Oxytalan fibers are pre-elastic fibers, not typical collagen. All other PDL fibers (principal, gingival) are collagen."},{"id":"py-tf-9-6","sheetId":9,"type":"true-false","question":"The function of accessory fibers of the PDL is to prevent sudden closure of blood vessels.","answer":"False","explanation":"Prevention of blood vessel collapse is the function of OXYTALAN fibers. Accessory fibers provide additional support to principal fibers."},{"id":"py-tf-9-7","sheetId":9,"type":"true-false","question":"Arteriosclerosis of PDL blood vessels may increase with age changes of the PDL.","answer":"True","explanation":"Age changes of PDL include increased arteriosclerosis (the exam answer shown is (F) for 'decrease', meaning it actually increases)."},{"id":"py-10-1","sheetId":10,"type":"mcq","question":"Age-related changes in alveolar bone include:","options":["Increased red marrow activity","Increased trabecular density","Fatty infiltration of bone marrow (replacement by yellow marrow)","Increased vascularity"],"correctOption":2,"answer":"Fatty infiltration of bone marrow — red marrow replaced by yellow (fatty) marrow"},{"id":"py-10-2","sheetId":10,"type":"mcq","question":"The interdental septum is defined as:","options":["Alveolar bone between roots of adjacent (neighboring) teeth","The cortical plate facing the oral cavity","Cancellous bone between the roots of multirooted teeth","The cribriform plate lining the socket"],"correctOption":0,"answer":"Alveolar bone between roots of adjacent (neighboring) teeth"},{"id":"py-10-3","sheetId":10,"type":"mcq","question":"The scalloped, dark blue incremental lines in alveolar bone that mark reversal of remodeling are called:","options":["Neonatal line","Reversal lines (cement lines)","Lines of Salter","None of the above"],"correctOption":1,"answer":"Reversal lines (cement lines)"},{"id":"py-10-4","sheetId":10,"type":"mcq","question":"Alveolar bone proper (lining the tooth socket) is also called:","options":["Cribriform plate","Bundle bone (lamina dura radiographically)","Both cribriform plate and bundle bone / lamina dura","None of the above"],"correctOption":2,"answer":"All of the above — cribriform plate, bundle bone, and lamina dura are all names for alveolar bone proper"},{"id":"py-10-5","sheetId":10,"type":"mcq","question":"The radiographic appearance of alveolar bone trabeculae shows:","options":["Regular horizontal arrangement in maxilla","Numerous delicate irregular arrangement in mandible","All of the above","None of the above"],"correctOption":2,"answer":"All of the above — maxilla trabeculae are regular/horizontal, mandible are numerous and irregular"},{"id":"py-10-6","sheetId":10,"type":"mcq","question":"The alveolar crest in the radiograph appears as:","options":["A radiopaque line interproximally between adjacent teeth","A radiolucent line between adjacent teeth","Both","None of the above"],"correctOption":0,"answer":"A radiopaque line interproximally between adjacent teeth"},{"id":"py-10-7","sheetId":10,"type":"mcq","question":"About fenestration of alveolar bone:","options":["Defect exposing part of the root with the alveolar margin not intact (margin included in defect)","A window-like defect exposing part of the root while the alveolar margin remains intact","Includes the alveolar margin (that is dehiscence)","None of the above"],"correctOption":1,"answer":"A window-like defect exposing part of the root while the alveolar margin remains intact","explanation":"Fenestration = defect with intact alveolar margin. Dehiscence = defect where the alveolar margin IS included (extends to the margin)."},{"id":"py-10-8","sheetId":10,"type":"mcq","question":"The alveolar process is called the 'functional bone' because it:","options":["Does not depend on the presence of teeth","Is not susceptible to functional changes","Depends entirely on the presence of teeth — it forms and resorbs with teeth","None of the above"],"correctOption":2,"answer":"Its existence and maintenance depend entirely on the presence of teeth","explanation":"The alveolar process forms when teeth develop and resorbs when teeth are lost. This is why it is called 'functional bone'."},{"id":"py-10-9","sheetId":10,"type":"mcq","question":"About age changes of alveolar bone:","options":["Internal trabecular arrangement becomes more sparse","Alveolar bone sockets appear smooth and straight","Bone marrow shows fatty infiltration","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-tf-10-1","sheetId":10,"type":"true-false","question":"Bone is a calcified connective tissue that is rich in blood supply.","answer":"True"},{"id":"py-tf-10-2","sheetId":10,"type":"true-false","question":"Dentinal tubules are found in alveolar bone.","answer":"False","explanation":"Dentinal tubules are found in DENTIN, not in alveolar bone. Alveolar bone contains Haversian canals and canaliculi."},{"id":"py-tf-10-3","sheetId":10,"type":"true-false","question":"The alveolar process in old age is gradually replaced by bone marrow.","answer":"True","explanation":"With aging and tooth loss, the alveolar bone undergoes resorption and the marrow spaces enlarge and become fatty."},{"id":"py-tf-10-4","sheetId":10,"type":"true-false","question":"The bone trabeculae of the TMJ (condyle) are spongy bone radiating from the head of the condyle.","answer":"True"},{"id":"py-tf-10-5","sheetId":10,"type":"true-false","question":"The large-diameter nerve endings in bone are responsible for pain sensation.","answer":"False","explanation":"Small-diameter (unmyelinated C-fibers and thinly myelinated Aδ-fibers) carry pain. Large-diameter fibers carry touch/proprioception."},{"id":"py-tf-10-6","sheetId":10,"type":"true-false","question":"The gingival fibers are restricted only to the walls of blood vessels.","answer":"False","explanation":"Gingival fibers are found throughout the free and attached gingiva — they are not restricted to blood vessel walls."},{"id":"py-11-1","sheetId":11,"type":"mcq","question":"The histological lining of the maxillary sinus is:","options":["Pseudostratified columnar ciliated epithelium thicker than nasal cavity","Pseudostratified cuboidal ciliated epithelium","Stratified squamous epithelium","Pseudostratified columnar ciliated epithelium, thinner than nasal cavity lining"],"correctOption":3,"answer":"Pseudostratified columnar ciliated epithelium, thinner than nasal cavity lining"},{"id":"py-11-2","sheetId":11,"type":"mcq","question":"The maxillary sinus communicates with the nasal cavity through the ostium located between the:","options":["Inferior and middle nasal conchae","Middle and inferior conchae (via hiatus semilunaris in middle meatus)","Superior and middle conchae","None of the above"],"correctOption":1,"answer":"Middle nasal meatus — ostium is between middle and inferior conchae"},{"id":"py-11-3","sheetId":11,"type":"mcq","question":"Progressive expansion of the maxillary sinus by bone resorption is called:","options":["Calcification","Ossification","Pneumatization","Resorption only"],"correctOption":2,"answer":"Pneumatization"},{"id":"py-11-4","sheetId":11,"type":"mcq","question":"The maxillary sinus has how many walls?","options":["One wall","Two walls","Three walls","Four walls"],"correctOption":3,"answer":"Four walls — anterior, posterior, superior (orbital floor), and inferior (alveolar process)"},{"id":"py-11-5","sheetId":11,"type":"mcq","question":"The teeth near or related to the floor of the maxillary sinus are:","options":["First and second lower molars","Upper lateral incisor and canine","First and second upper premolars and molars","All of the above"],"correctOption":2,"answer":"First and second upper molars (also upper premolars 2 and 1 may be close)"},{"id":"py-11-6","sheetId":11,"type":"mcq","question":"Histology of the maxillary sinus:","options":["Lined by mucous membrane thicker than nasal cavity","Pseudostratified cuboidal epithelium","Both A and B","None of the above — thinner pseudostratified columnar ciliated"],"correctOption":3,"answer":"None of the above — it is lined by pseudostratified columnar ciliated epithelium, thinner than nasal cavity"},{"id":"py-11-7","sheetId":11,"type":"mcq","question":"The roof of the maxillary sinus is formed by the:","options":["Palatine bone","Orbital floor","Nasal bone","Frontal bone"],"correctOption":1,"answer":"Orbital floor (the floor of the orbit forms the roof of the maxillary sinus)"},{"id":"py-tf-11-1","sheetId":11,"type":"true-false","question":"There is no variation in the size and shape of the maxillary sinus between individuals.","answer":"False","explanation":"The maxillary sinus shows considerable individual variation in size and shape."},{"id":"py-tf-11-2","sheetId":11,"type":"true-false","question":"A true infection of the maxillary sinus decreases when the patient bends over and places their head below the knees.","answer":"False","explanation":"Bending increases sinus pressure and WORSENS sinus pain/infection. True sinus infections produce worse pain when bending forward."},{"id":"py-12-1","sheetId":12,"type":"mcq","question":"Shedding is predominantly the:","options":["Physiologic loss of impacted teeth","Physiologic loss of permanent teeth","Physiologic loss of primary (deciduous) teeth","None of the above"],"correctOption":2,"answer":"Physiologic loss of primary (deciduous) teeth"},{"id":"py-12-2","sheetId":12,"type":"mcq","question":"Which of the following is TRUE about ankylosis?","options":["It is a union of the tooth with the periodontal ligament","The active eruption of an ankylosed tooth continues","It is a bony union between the alveolar bone and the roots of deciduous teeth","None of the above"],"correctOption":2,"answer":"It is a bony union between the alveolar bone and the roots of deciduous teeth"},{"id":"py-12-3","sheetId":12,"type":"mcq","question":"Theories explaining the mechanism of tooth movement during eruption include ALL EXCEPT:","options":["Vascular pressure theory","Root resorption theory","Bone remodeling theory","Periodontal ligament traction theory"],"correctOption":1,"answer":"Root resorption theory — this is NOT a theory of tooth eruption"},{"id":"py-12-4","sheetId":12,"type":"mcq","question":"During shedding of anterior deciduous teeth, when the developing successor is directly apical to the deciduous tooth, resorption of the deciduous root occurs:","options":["Apically","Laterally","Apically and laterally","None of the above"],"correctOption":2,"answer":"Apically and laterally"},{"id":"py-12-5","sheetId":12,"type":"mcq","question":"During formation of a multi-rooted tooth:","options":["The cervical loop extends horizontally (epithelial diaphragm forms)","Epithelial diaphragm divides the apical foramen","HERS covers the dentin of the root","All of the above"],"correctOption":3,"answer":"All of the above"},{"id":"py-12-6","sheetId":12,"type":"mcq","question":"Odontoblasts in the middle portion of the root have a specific shape which is:","options":["Columnar","Cuboidal","Flat","Round"],"correctOption":1,"answer":"Cuboidal","explanation":"Odontoblasts are tall columnar at the crown, cuboidal in the middle root, and flat/squamous at the apex."},{"id":"py-tf-12-1","sheetId":12,"type":"true-false","question":"Passive eruption is defined as the apical movement of the dentinoenamel junction (DEJ).","answer":"False","explanation":"Passive eruption is the apical migration of the GINGIVAL ATTACHMENT (junctional epithelium), not the DEJ."},{"id":"py-tf-12-2","sheetId":12,"type":"true-false","question":"During shedding of primary teeth, odontoclasts are responsible for resorption of soft tissue.","answer":"False","explanation":"Odontoclasts resorb HARD tissues (dentin, cementum). Soft tissue resorption is by macrophages."},{"id":"py-tf-12-3","sheetId":12,"type":"true-false","question":"Post-eruptive phase starts when the teeth reach occlusion and continues as long as each tooth remains in the oral cavity.","answer":"True"},{"id":"py-13-1","sheetId":13,"type":"mcq","question":"Functions of synovial fluid in the TMJ include ALL EXCEPT:","options":["Providing maximum structural strength to the condyle","Lubrication of joint surfaces","Nutrition to the avascular articular disc","Phagocytosis of cellular debris"],"correctOption":0,"answer":"Providing maximum strength to the condyle — this is NOT a function of synovial fluid"},{"id":"py-13-2","sheetId":13,"type":"mcq","question":"When the articular disc of the TMJ becomes thin with hyalinization during age changes, it leads to:","options":["Better extensibility of disc and capsule","Decrease in synovial fluid","Loss of lubrication","Osteoporosis of the underlying bone"],"correctOption":3,"answer":"Osteoporosis of the underlying bone — unprotected loading causes bone degeneration"},{"id":"py-13-3","sheetId":13,"type":"mcq","question":"Displacement of the condylar head outside the glenoid fossa is called:","options":["Dislocation","Subluxation","Condylar fracture","Ankylosis"],"correctOption":0,"answer":"Dislocation"},{"id":"py-13-4","sheetId":13,"type":"mcq","question":"The articular eminence of the TMJ is formed by:","options":["Spongy bone covered by a thick layer of compact bone","Compact bone covered by a thick layer of spongy bone","Spongy bone covered by a thin layer of compact bone","Compact bone covered by a thin layer of spongy bone"],"correctOption":3,"answer":"Compact bone covered by a thin layer of spongy bone"},{"id":"py-13-5","sheetId":13,"type":"mcq","question":"Which of the following is TRUE about causes of TMJ dislocation EXCEPT:","options":["Wide mouth opening","Small or short/flat articular eminence","Large or steep articular eminence","Weak capsular ligament"],"correctOption":2,"answer":"Large or steep articular eminence","explanation":"Dislocation is caused by wide mouth opening, FLAT/shallow articular eminence (not steep), or weak ligaments. A steep eminence actually PREVENTS dislocation."},{"id":"py-13-6","sheetId":13,"type":"mcq","question":"The synovial fluid contains the following types of cells:","options":["Monocyte only","Lymphocyte only","Macrocyte only","Monocytes, lymphocytes, and macrocytes"],"correctOption":3,"answer":"Monocytes, lymphocytes, and macrocytes"},{"id":"py-13-7","sheetId":13,"type":"mcq","question":"Bony union between the condylar head and the glenoid fossa is called:","options":["Dislocation","Ankylosis","Pneumatization","Repolarization"],"correctOption":1,"answer":"Ankylosis"},{"id":"py-13-8","sheetId":13,"type":"mcq","question":"The condyle of the TMJ is covered by:","options":["Hyaline cartilage","Fibrocartilage","Thick elastic fibrous tissue (lamina splendens)","Thin serous membrane"],"correctOption":2,"answer":"Thick elastic fibrous tissue (lamina splendens) — 1–2 mm thick"},{"id":"py-13-9","sheetId":13,"type":"mcq","question":"The structure that divides the TMJ cavity into upper and lower compartments is:","options":["Articular capsule","Articular disc (capsular disc)","Synovial membrane","Condylar cartilage"],"correctOption":1,"answer":"Articular disc (capsular disc)"},{"id":"py-tf-13-1","sheetId":13,"type":"true-false","question":"During age changes of the TMJ, the cartilaginous zone of the condyle becomes thinner.","answer":"True"},{"id":"py-tf-13-2","sheetId":13,"type":"true-false","question":"The peri-tubular dentin in a decalcified transverse section appears as translucent.","answer":"False","explanation":"Peritubular dentin is highly MINERALIZED, so in DECALCIFIED sections it dissolves away, leaving an empty ring around the tubule. It does NOT appear translucent."},{"id":"py-14-1","sheetId":14,"type":"mcq","question":"Classification of oral mucosa according to function includes:","options":["Lining mucosa only","Masticatory mucosa only","Specialized mucosa only","All of the above — lining, masticatory, and specialized"],"correctOption":3,"answer":"All of the above — lining mucosa, masticatory mucosa, and specialized mucosa"},{"id":"py-14-2","sheetId":14,"type":"mcq","question":"The borders (walls) of the gingival sulcus include:","options":["Gingival wall only","Tooth (enamel) surface only","Both the gingival wall and the tooth (enamel) surface","Bone and cementum only"],"correctOption":2,"answer":"Both the gingival wall and the tooth (enamel) surface"},{"id":"py-14-3","sheetId":14,"type":"mcq","question":"The palatine tonsils are:","options":["A single midline lymphoid mass","Two bilateral masses of lymphoid tissue","Lymph nodes in the palate","Collections of minor salivary glands"],"correctOption":1,"answer":"Two bilateral masses of lymphoid tissue"},{"id":"py-14-4","sheetId":14,"type":"mcq","question":"Rete ridges (pegs) are:","options":["Blood vessel projections upward into epithelium","Downgrowths of epithelium (projections) into the underlying connective tissue","Projections of connective tissue papillae upward into epithelium","Surface folds of keratinized epithelium"],"correctOption":1,"answer":"Folds of the basement membrane / downgrowths of epithelium into underlying connective tissue"},{"id":"py-14-5","sheetId":14,"type":"true-false","question":"Lining mucosa is associated with non-keratinized epithelium.","answer":"True"},{"id":"py-14-6","sheetId":14,"type":"mcq","question":"The papillary zone of the lamina propria consists of:","options":["Reticular fibers only","Loose connective tissue","Dense connective tissue","None of the above"],"correctOption":1,"answer":"Loose connective tissue"},{"id":"py-14-7","sheetId":14,"type":"mcq","question":"The vermilion border of the lip appears red because:","options":["The epithelium is thin, showing underlying blood vessels through","Connective tissue is thin","The epithelium contains enzyme","Connective tissue contains collagen fibers"],"correctOption":0,"answer":"The epithelium is thin, allowing the underlying blood vessels to show through"},{"id":"py-14-8","sheetId":14,"type":"mcq","question":"The sensory (mechanoreceptor/touch) cells in oral epithelium are:","options":["Langerhans cells (immune)","Melanocytes (pigment)","Merkel cells (touch sensation)","Keratinocytes"],"correctOption":2,"answer":"Merkel cells — they function as mechanoreceptors for touch sensation"},{"id":"py-14-9","sheetId":14,"type":"mcq","question":"Spinosum cells (stratum spinosum) appear as:","options":["Cuboidal cells","Columnar cells","Spinous cells (spiny projections due to desmosomes)","None of the above"],"correctOption":2,"answer":"Spinous (prickle) cells — with spiny projections due to desmosomes"},{"id":"py-14-10","sheetId":14,"type":"mcq","question":"Prickle cells are classified as:","options":["Keratinocytes","Non-keratinocytes","Para-keratinocytes","None of the above"],"correctOption":0,"answer":"Keratinocytes (the spinous layer = stratum spinosum = prickle cell layer consists of keratinocytes)"},{"id":"py-14-11","sheetId":14,"type":"mcq","question":"Age changes of oral mucosa result in mucosa that becomes:","options":["Dry","Thin","Smooth (loss of stippling)","All of the above"],"correctOption":3,"answer":"All of the above — dry, thin, smooth with aging"},{"id":"py-14-12","sheetId":14,"type":"mcq","question":"The gingival epithelium composition (by keratinization type) is approximately:","options":["10% non-keratinized, 15% keratinized, 75% parakeratinized","50% keratinized, 50% non-keratinized","100% keratinized","None of the above"],"correctOption":0,"answer":"10% non-keratinized, 15% keratinized, 75% parakeratinized"},{"id":"py-14-13","sheetId":14,"type":"mcq","question":"The structure of oral mucosa varies according to:","options":["Function of epithelium","Type of epithelium","Both function and type of epithelium","None of the above"],"correctOption":2,"answer":"Both — function and type of epithelium"},{"id":"py-14-14","sheetId":14,"type":"mcq","question":"The oral mucosa is composed of stratified squamous epithelium overlying a:","options":["Muscle tissue","Lamina dura (bone)","Tunica propria","Lamina propria"],"correctOption":3,"answer":"Lamina propria"},{"id":"py-14-15","sheetId":14,"type":"mcq","question":"The masticatory mucosa covers the:","options":["Gingiva","Soft palate","Cheeks","All of the above"],"correctOption":0,"answer":"Gingiva (and hard palate) — masticatory mucosa is keratinized","explanation":"Masticatory mucosa: hard palate + attached gingiva. Lining mucosa: soft palate, cheeks, floor of mouth."},{"id":"py-14-16","sheetId":14,"type":"mcq","question":"Which stage of gingival recession is it when the bottom of the sulcus is at the cervical line and attached epithelium remains on cementum?","options":["Stage I","Stage II","Stage III","Stage IV"],"correctOption":1,"answer":"Stage II"},{"id":"py-14-17","sheetId":14,"type":"mcq","question":"Epithelial turnover (renewal) is:","options":["The migration of epithelial cells from basal to surface layer","Division of epithelial cells from the basal layer","Both of the above","None of the above"],"correctOption":1,"answer":"Division of epithelial cells from the basal layer"},{"id":"py-tf-14-1","sheetId":14,"type":"true-false","question":"The vermilion border is the transitional region between oral mucosa and the skin of the cheeks.","answer":"False","explanation":"The vermilion border is the transition between oral (labial) mucosa and the skin of the LIPS — not the cheeks."},{"id":"py-tf-14-2","sheetId":14,"type":"true-false","question":"Pigment-producing cells of oral epithelium are called Merkel's cells.","answer":"False","explanation":"Pigment cells are MELANOCYTES. Merkel cells are mechanoreceptors for touch sensation."},{"id":"py-tf-14-3","sheetId":14,"type":"true-false","question":"Stippling of the gingiva disappears with advancing age.","answer":"True"},{"id":"py-tf-14-4","sheetId":14,"type":"true-false","question":"Taste buds are composed of supporting cells and defense cells.","answer":"False","explanation":"Taste buds consist of receptor (type I), supporting (type II), and basal cells — NOT defense cells."},{"id":"py-tf-14-5","sheetId":14,"type":"true-false","question":"Epithelial turnover refers to the division of epithelial cells from the basal layer.","answer":"True"},{"id":"py-tf-14-6","sheetId":14,"type":"true-false","question":"Both epithelium and lamina propria together form one membrane known as the oral mucosa.","answer":"True"},{"id":"py-tf-14-7","sheetId":14,"type":"true-false","question":"Foliate papillae on the lateral border of the tongue have taste buds.","answer":"True"},{"id":"py-tf-14-8","sheetId":14,"type":"true-false","question":"Basal cells of the oral epithelium are cuboidal in shape.","answer":"True"},{"id":"py-tf-14-9","sheetId":14,"type":"true-false","question":"Merkel cells are located in the basal cell layer of oral epithelium.","answer":"True"},{"id":"py-tf-14-10","sheetId":14,"type":"true-false","question":"Salt sensation is primarily detected at the anterior (front) part of the tongue.","answer":"True","explanation":"Taste map: anterior tongue = sweet + salt; lateral = sour; posterior = bitter."},{"id":"py-tf-14-11","sheetId":14,"type":"true-false","question":"The palatal cortical plate is thicker than the buccal cortical plate at the maxillary posterior teeth.","answer":"True"},{"id":"py-15-1","sheetId":15,"type":"mcq","question":"The largest major salivary gland is the:","options":["Parotid gland","Submandibular gland","Sublingual gland","Von Ebner's glands"],"correctOption":0,"answer":"Parotid gland — largest by size, purely serous"},{"id":"py-15-2","sheetId":15,"type":"mcq","question":"The salivary gland producing the largest VOLUME of daily saliva is the:","options":["Parotid (25% of total)","Submandibular (60–
