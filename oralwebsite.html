ture of gingiva:","content":""},{"id":"om-80","type":"paragraph","content":"i) Marginal gingiva has keratinized stratified squamus epithelium not attached to underlying bone, it is firm but mobile.\nThe gingival fiber groupe in the lamina properia of the marginal gingiva is the gingival groupe of the periodontal ligament."},{"id":"om-81","type":"paragraph","content":"ii) Attached gingiva has thick layer of keratinized and parakeratinized epithelium with extensive vascular supply in the lamina properia, it has narrow connective tissue papillae giving its stippling due to strong attachment. The lamina properia is firmly attached to underlying periosteum to serve as mucoperiosteum."},{"id":"om-82","type":"subheading","title":"Blood supply of gingiva:","content":"The main blood supply is derived from the interdental arteries which penetrate the interdental septa, performed the alveolar crest and ends in the gingiva. The additional blood supply to the gingiva are the superficial branches of lingual artery, buccal artery and mental artery."},{"id":"om-83","type":"heading","title":"Dentinogingival Junction DGJ, or Junctional epithelium JE","content":""},{"id":"om-84","type":"definition","title":"Definition:","content":"Is the junction between the tooth surface and the gingival tissue, the junctional epithelium is the deep extension of gingival sulcus. Clinically, it is firm attachment of both epithelium and lamina properia to the tooth surface. It is less resistant to force, it is highly turnover, it has few desmosomes, it has high metabolic activity."},{"id":"om-85","type":"subheading","title":"Histology of DGJ:","content":"This epithelium has 12-18 raws coronally, gradually decrease apically."},{"id":"om-86","type":"paragraph","content":"Under LM: it has different cells with presence of special organic material as following:\n1- external basal cells (normal basal layer): are cuboidal cells rest on smooth basement membrane attached to the underling lamina properia by hemidesmosomes as attaching plaque forming tonofilaments. They are highly permeable to defense cells as usual migrate to the gingival sulcus.\n2- internal basal cells (suprabasal layer): are spindle shape cells rest above the external basal layer, with wide intracellular space obliquely arranged.\n3- superficial flat cells: are known also epithelial atachement cells parallel to the enamel surface.\n4- atachement epithelium (organic material): when the superficial cells reach the enamel surface, they senthesize organic compound, this material is the mechanism of attachement of DGJ with the tooth surface."},{"id":"om-87","type":"subheading","title":"Under EM, DGJ shows:","content":""},{"id":"om-88","type":"paragraph","content":"i) external basal lamina: both of lamina lucida and lamin densa are forming one structure known as external basal lamina close to the lamina properia.\n1- lamina densa dark zone, adjacent to the lamina properia.\n2- lamina lucida is wide clear zone, separates between external basal cell layer and lamina densa.\nii) basal cell layers and superficial flat cells.\niii) internal basal lamina: both of lamina lucida and lamin densa are forming one structure known as intemal basal lamina close to the enamel surface.\na. lamina lucida wide clear zone, adjacent to the superficial flat cells.\nb. lamina densa is dark zone, separates between lamina lucida and enamel cuticle.\niv) enamel cuticle layer."},{"id":"om-89","type":"heading","title":"Development of DGJ","content":""},{"id":"om-90","type":"list","content":["After enamel maturation and before the tooth eruption, the REE retain the basal cell layer which serve as portion of the primary epithelial attachment with enamel surface.","As the tooth erupt, both coronal portion of REE and oral epithelium fused together, ameloblasts also develop the hemidesmosomes for the primary attachment all over the crown.","The epithelial cells at fusion area of REE with oral epithelium are degenerate and create a perforation near the incisal edge and cusp tip, this allow comming out of crown to the oral cavity without hemorrhage or connective tissue exposure.","After the tooth erupt, the cells at fusion area will serve as the initial or primary junctional epithelium create the first tissue attached the tooth surface (by REE), this tissue finally replaced by definitive or secondary junctional epithelium (by oral epithelium).","The REE remains attached to the part of enamel, once crown emerge it termed to attached epithelium, as tooth erupt the REE become short. Shallow groove develops between gingiva and tooth surface to form the gingival sulcus.","The coronal portion of the fused epithelium goes apically of crown leaving the cervical portion still attached to the neck of the tooth, this fused epithelium remain at the cervical line to be in future junctional epithelium (passive eruption).","The rim of oral mucosa that circumference the exposed part of crown now termed gingiva which has:\n1/ inner epithelial layer surrounds the crown surface (DGJ).\n2/ outer epithelial layer covers the alveolar bone (free gingiva)."]},{"id":"om-91","type":"subheading","title":"Migration or shift of junctional epithelium (passive eruption):","content":""},{"id":"om-92","type":"list","content":["Gingival epithelial cells migrate toward the cervical line to which they attach.","Primary JE consists of REE attached by hemidesmosomes to the tooth surface at cervical line.","Primary JE gradually degenerate and is replaced by secondary JE.","Cells of the two tissues are joined by desmosomes and tight junction, at the point of fusion, the mitotic activity is increased.","With the complete degeneration of the primary JE, the secondary JE will be in contact to the enamel, and continue to the steps of sulcus formation."]},{"id":"om-93","type":"subheading","title":"Function of DGJ:","content":""},{"id":"om-94","type":"list","content":["1- provide attachment of gingiva to the tooth surface.","2- forming epithelial lining of the floor of the sulcus.","3- absorption of the mastication force due to the presence of the dense fibrils of lamina properia.","4- wound repair is due to high turnover of DGJ cells, can be seen in:\ni) superficial repair: when epithelium is injured, the turnover of the cells and their migration will form new cells and repair took place by migration of underling cells.\nii) deep repair is due to the activity of fibroblast at lamina properia to form collagen fibers and ground substance can repair the deep wound.","5- the withstand of DGJ cells to the mastication force may influenced by the activity of defense cells against bacteria during inflammation."]},{"id":"om-95","type":"heading","title":"Gingival sulcus (or gingival crevice):","content":""},{"id":"om-96","type":"list","content":["is the fold of free gingiva developed at the time where the tip of the crown perforate the oral mucosa, and the connection between gingiva and crown occurs only at enamel surface.","extended coronally from the tip of the free gingiva and apically to the DGJ.","its epithelium is non-keratinized without rete ridges.","it has smooth epithelial surface with narrow lamina properia.","the sulcus epithelium stands away from the tooth creates gingival sulcus that filled with gingival fluid.","gingival sulcus is formed by tear in attached epithelium by apical shift of gingival epithelium."]},{"id":"om-97","type":"subheading","title":"Stages of passive tooth eruption:","content":""},{"id":"om-98","type":"list","content":["Stage I: the bottom of sulcus is remaining at enamel surface; the attached epithelium is remaining at cervical line, which took place during 1 year before shedding of deciduous, and from age of 20 to 30 years of permanent.","Stage II: the bottom of sulcus is remains at enamel surface; the attached epithelium is shifted to cementum, which took place during age of 30 to 40 years, this may be relatively long stage.","Stage III: the bottom of the sulcus is at cervical line, the attached epithelium remains at cementum, so the anatomic crown is fully exposed, which took place during age of 40 to 50 years. It is slow and not continues process to maintain the integrity of cervical line.","Stage IV: both of the bottom of the sulcus and the attached epithelium are at cementum, so the gingival recession is started by exposure of root due to the apical shift of gingiva. This stage is pathologic condition occurs over age of 50 years. Passive eruption never reach this stage."]},{"id":"om-99","type":"subheading","title":"Histology of gingival sulcus:","content":""},{"id":"om-100","type":"list","content":["i) The sulcus has the following borders:\n1- Gingival wall.\n2- Enamel surface wall.\n3- The bottom or the floor of sulcus formed by the cells of DGJ.","ii) gingival wall has the sulcus epithelium which consists of non-keratinized stratified squamus epithelium.","iii) lamina properia is thin layer of connective tissue under the epithelium, filled by collagen fibers, fibroblasts, and blood vessels with defence cells."]},{"id":"om-101","type":"heading","title":"Epithelial renewal:","content":"is the division of the epithelial cell from the basal layer in order to replace desquamated cells at the surface:"},{"id":"om-102","type":"list","content":["After basal cells division, they migrate superficially.","They undergo maturation, and take place in superficial cells which are already lost.","During cell division, one of daughter cell is differentiate and move upward termed keratinocytes, the others cells will remain at the basal cell layer."]},{"id":"om-103","type":"heading","title":"Epithelial turnover:","content":"is the time needed for the divided cells in order to differentiate, migrate and replace the desquamated cells at the surface."},{"id":"om-104","type":"list","content":["The cells of junctional epithelium have the highest renewal rate in the oral cavity from 3 to 5 days.","The sulcular epithelium has cell renewal from 4 to 6 days.","The buccal mucosa has cell renewal from 4 to 10 days.","The cells of non-keratinized epithelium has faster cell division than the cells of keratinized epithelium.","Taste buds have renewal time of 10 days."]},{"id":"om-105","type":"heading","title":"Age change of oral mucosa:","content":""},{"id":"om-106","type":"subheading","title":"I) Aging process shows increase of different structures:","content":""},{"id":"om-107","type":"list","content":["1- increase granulation tissue will cause fibrosis and scar formation.","2- increase Fordyce's spots in the labial and buccal mucosa.","3- enlargement of lingual veins to give lingual varicosity on the ventral surface of tongue and floor of the mouth."]},{"id":"om-108","type":"subheading","title":"II) And decrease of different structures:","content":""},{"id":"om-109","type":"list","content":["decrease cellular activity.","reduces the blood vessels.","reduce stippling on attached gingiva.","reduce number of lingual papillae especially the foliate type.","reduce the taste buds.","atrophy of salivary glands will cause dry mucosa.","reduction of the rete ridges of keratinized epithelium."]},{"id":"om-110","type":"note","content":"III) Finally mucosa becomes dry, thin, smooth and more fragile."}],"giveReasons":[{"reason":"The junctional epithelium has the highest turnover rate in the oral cavity","explanation":"Because it is constantly shed into the gingival sulcus and must be rapidly replaced to maintain the epithelial barrier. It is also heavily infiltrated by PMNs migrating from the sulcular capillaries toward the sulcus, which damages epithelial cells and accelerates their replacement. Turnover occurs every 4-6 days.","cat":"histological"},{"reason":"The buccal mucosa has the lowest turnover rate in the oral cavity","explanation":"Because the buccal mucosa (cheek lining) is non-keratinized and is subjected to minimal mechanical trauma and abrasion compared to masticatory mucosa (gingiva, hard palate). It has the most protected location in the oral cavity, requiring less frequent cell replacement.","cat":"histological"},{"reason":"Para-keratinized epithelium is the unique histological feature of healthy oral cavity","explanation":"Because parakeratinization is considered pathological when it occurs on skin (indicating abnormal keratinization), but it is the normal and expected form of keratinization in the attached gingiva and dorsal surface of the tongue. In these locations, it provides adequate surface protection while being a normal, healthy tissue type.","cat":"histological"},{"reason":"The granular layer may be absent in parakeratinized epithelium","explanation":"Because keratohyalin granules (which characterize the granular layer) are not fully developed in parakeratinized areas. Parakeratinization is an incomplete form of keratinization — the process does not proceed to full maturation, so the granules that would normally accumulate in the granular layer are fewer or absent.","cat":"histological"},{"reason":"The keratin layer in parakeratinized epithelium retains nuclei","explanation":"Because parakeratinization is an immature or incomplete form of keratinization. The full maturation process that leads to nuclear loss (karyolysis) in orthokeratinized epithelium does not complete in parakeratinized areas. As a result, the most superficial cells retain pyknotic or clear nuclei, distinguishing it from true (ortho)keratinization.","cat":"histological"},{"reason":"Fibroblasts migrate to form granulation tissue after deep injury to the lamina propria","explanation":"Because during wound healing, growth factors (PDGF, TGF-β, FGF) released by platelets and macrophages at the injury site attract fibroblasts from the surrounding connective tissue. These fibroblasts migrate into the fibrin clot, proliferate, and synthesize new collagen to form the immature connective tissue known as granulation tissue.","cat":"histological"},{"reason":"All forms of oral epithelium act as barriers to bacterial invasion","explanation":"Because the stratified squamous epithelium provides multiple layers of cells joined by tight junctions, desmosomes, and hemidesmosomes. The continuous desquamation (shedding) of surface cells removes bacteria mechanically. The keratin layer (in keratinized/parakeratinized types) adds chemical and mechanical resistance to bacterial penetration.","cat":"histological"}]},{"id":15,"slug":"salivary-glands","title":"Salivary Glands & Tonsils","subtitle":"Oral Histology / Chapter 8 Salivary Glands & Tonsils","category":"soft-tissue","summary":"Salivary glands are the glands that produce saliva secretion necessary for lubricate and cleaning of oral mucosa to protect it from dryness and caries. Includes major glands (parotid, submandibular, sublingual), minor glands, gland histology (stroma, acini, duct system), saliva composition and functions, tonsils, and thyroid gland.","keywords":["parotid","submandibular","sublingual","serous","mucous","mixed","Stenson's duct","Wharton's duct","Bartholin's duct","major salivary gland","minor salivary gland","extraoral","intraoral","acini","intercalated duct","striated duct","excretory duct","myoepithelial cells","demilune","von Ebner","Weber","Blandin Nuhn","saliva","amylase","tonsils","palatine tonsil","pharyngeal tonsil","lingual tonsil","adenoid","thyroid gland","Waldeyer's ring"],"keyDefinitions":[{"term":"Salivary Glands","definition":"Salivary glands are the glands that produce saliva secretion necessary for lubricate and cleaning of oral mucosa to protect it from dryness and caries."},{"term":"Parotid salivary gland","definition":"Is the largest capsulated major salivary gland, provides only 25% of total saliva volume, located behind ramus, anterior and inferior to the ear. It has a long excretory parotid duct (Stenson's duct) emerges from the gland and opens up into the oral cavity on the inner surface of the buccal mucosa opposite to maxillary second molar. Its secretion is pure serous in adult and mixed in infant."},{"term":"Submandible salivary gland","definition":"is the second largest capsulated major salivary gland, provide 60% of total saliva volume, it lay in the submandibular fossa, posterior to the sublingual salivary gland. Its secretion is mixed, it has excretory submandibular duct (Wharton's duct) opens at floor of the mouth at sublingual carbuncle. In healthy condition, it can be palpated as non tender firm mass."},{"term":"Sublingual salivary gland","definition":"is the smallest major salivary gland without capsule, provides only 10% of total saliva volume, located in the sublingual fossa, anterior to the submandibular salivary glands, in the floor of the mouth. Its secretion is mixed secretion, associated with short excretory duct (Bartholin's duct)."},{"term":"Acinus","definition":"Secretory cells found in cluster or groups known as Acini, each one acinus is connected to the ductal system. Each acinus consists of a single layer of cuboidal epithelial cells surrounded a lumen or central space, where the saliva is deposited after being produced by the secretory cells."},{"term":"Demilune of Von Ebner (Genuzzi)","definition":"In mixed (mucoserous) acini: the serous acinus is connected over the mucous acinus, surrounding single lumen in cap form — this crescent-shaped arrangement is called the demilune of Von Ebner or Genuzzi."},{"term":"Myoepithelial cells","definition":"Specialized epithelial cells with a contractile nature. When they contract, they squeeze the acini, forcing the saliva out of the lumen into the intercalated ducts. Each myoepithelial cell consists of a cell body with 4 to 8 long cytoplasmic processes radiating outward."},{"term":"Intercalated duct","definition":"The duct directly attached to the acini, lined with a single layer of cuboidal epithelial cells. Intralobular duct; serves as a saliva passage."},{"term":"Striated duct","definition":"Connected to the intercalated ducts; lined with a single layer of columnar epithelial cells with striations caused by enfolding of the basal membrane (entrapped mitochondria) which increases surface area and allows ion exchange. Intralobular duct."},{"term":"Excretory (secretory) duct","definition":"The outer portion of the duct system that empties into the oral cavity. Located in the septum of the gland (interlobular duct). Lined with simple columnar epithelium transitioning to simple cuboidal as the duct moves outward. Found in major salivary glands only."},{"term":"Tonsil","definition":"The tonsil is the largest lymphatic tissue of the oral cavity containing many lymphatic nodules with germinal centers. Tonsils are incompletely capsulated lymphatic organs located under the epithelium of the posterior region of the tongue and pharynx, surrounded by Waldeyer's ring."},{"term":"Waldeyer's Ring","definition":"A ring of lymphatic tissue surrounding the oropharynx, composed of: palatine tonsils (lateral walls), pharyngeal tonsil (adenoid — back of nasopharynx), and lingual tonsils (posterior 1/3 of tongue)."},{"term":"Thyroid gland","definition":"The largest endocrine gland, located in the anterior and lateral regions of neck, inferior to thyroid cartilage. Produces thyroxin hormone. Has 2 lobes connected by isthmus. Develops from foramen cecum at base of tongue and descends along the thyroglossal duct."}],"importantPoints":["Classification of salivary glands: i) According to size: major or large, minor or small. ii) According to branching of ducts: simple non-branching (minor), compound branching (major). iii) According to secretion: serous, mucous, mixed. iv) According to site: extraoral (only parotid), intraoral.","Serous glands: parotid adult, von Ebner.","Mucous glands: Weber, palatine, posterior lingual, glossopalatine.","Mixed glands: submandible (mainly serous), anterior lingual, sublingual, buccal (mainly mucous), labial (mainly mucous), parotid infant.","Extraoral location: only parotid gland.","Intraoral — oral cavity proper: palatine, glossopalatine, lingual, and sublingual submandible.","Intraoral — facial vestibule: labial and buccal.","Parotid: largest, capsulated, 25% saliva volume, Stenson's duct opens opposite maxillary 2nd molar, pure serous in adult, mixed in infant.","Submandibular: second largest, capsulated, 60% saliva volume, Wharton's duct opens at floor of mouth at sublingual carbuncle, mixed secretion (mainly serous).","Sublingual: smallest, no capsule, 10% saliva volume, Bartholin's duct, mixed secretion (mainly mucous).","Minor salivary glands: much smaller but more numerous, short unnamed ducts, provide only 5% of total saliva volume, scattered in all submucosa of oral cavity.","Von Ebner's gland: only serous minor gland, associated with circumvallate lingual papilla, posterior dorsum of tongue.","Weber glands: pure mucous, posterior 1/3 of tongue, associated with lingual tonsils.","Blandin and Nuhn glands: mixed, seen at tip of tongue.","Structure of salivary glands: 1. Connective tissue stroma (capsule, septum, CT cells). 2. Epithelium/parenchyma (secretory cells, myoepithelial cells, duct system).","Mucous cells: cloud-appearance cytoplasm, flat basal nucleus, wide lumen, 10-12 Golgi bodies, produce viscous mucin (lubrication and protection).","Serous cells: clear cytoplasm, round central nucleus, narrow lumen, 4-6 Golgi bodies, produce watery albumin rich in enzymes (digestion and defence).","Types of acini: mucous (wide lumen), serous (narrow lumen), mixed/mucoserous (demilune of Von Ebner — serous crescent cap over mucous).","Duct order: Acinus → Intercalated duct (cuboidal, intralobular) → Striated duct (columnar with basal striations, intralobular) → Excretory duct (columnar→cuboidal, interlobular, major glands only).","Striated duct: cells remove and add ions to modify saliva composition.","Parotid: longest intercalated duct, shortest striated duct. Submandibular: short intercalated, long striated. Sublingual: no intercalated, rare/no striated.","Saliva: 99% water + 1% other (amylase, ions: Cl, Ca, Mg, PO4, Ka, Na, urea, ammonia, glucose, buffers, lipids, sIgA, lysozyme, lactoferrin, peroxidase).","11 functions of saliva: buffer (pH 6.2-7.4), pellicle formation, mineral supply to enamel, soft tissue repair (epidermal growth factor from submandibular), digestion (amylase/lipase/lactase), antibacterial (peroxidase/lactoferrin/lysozyme/IgA), food solubilization, hormonal (parotin), lubrication, mastication protection, anticariogenic.","Saliva formation: endoplasmic reticulum → packaged in Golgi → granules accumulate at apical end → parasympathetic stimulation → exocytosis into lumen.","Parotin hormone (from parotid): stimulates mesenchyme growth, decreases calcium level, stimulates dentin calcification.","3 tonsils in Waldeyer's ring: 1-Palatine (largest, bilateral, below soft palate, non-keratinized SSE, branching narrow crypts). 2-Pharyngeal/Adenoid (single, above soft palate at midline, pseudostratified columnar ciliated epithelium, no crypts). 3-Lingual (bilateral, posterior 1/3 tongue, non-keratinized SSE, wide non-branching crypts).","Palatine tonsil: not washed by saliva → always inflamed, causes dysphagia.","Pharyngeal tonsil (adenoid): washed by saliva → rarely inflamed. Grows to surround auditory tube → tubular tonsil.","Lingual tonsil: rarely inflamed due to wash out by Weber mucous glands secretion.","4 functions of tonsils: filtration of lymph (antigens/cell debris), phagocytosis (macrophages/reticular cells), antibody production (plasma cells/B-lymphocytes), production and recirculation of lymphocytes.","Thyroid gland: largest endocrine gland, 2 lobes + isthmus, produces thyroxin, develops from foramen cecum. Parathyroid: 2-4 small glands on each side of thyroid."],"histologicalFeatures":["Capsule: connective tissue surrounding outer portion of gland; protect and support the gland.","Septum: extension of capsule dividing gland into large lobes and small lobules; carries nerves and blood vessels.","CT cells: fibroblasts, macrophages, mast cells, adipose cells and plasma cells embedded in extracellular matrix of collagen fibers and ground substance (glycoprotein and proteoglycan).","Oxytalan fibers: found in submandibular and minor salivary glands, around smaller intralobular ducts, substituting for elastic fibers that surround larger extralobular ducts.","Mucous cells: cloud-appearance cytoplasm, flat nucleus at base, produce viscous mucous saliva, wide lumen, 10-12 Golgi bodies, great carbohydrate ratio.","Serous cells: clear cytoplasm, round nucleus near center, produce watery serous saliva rich in enzymes, narrow lumen, 4-6 Golgi bodies, great protein ratio.","Myoepithelial cells: specialized epithelial cells, contractile, squeeze acini to force saliva into intercalated ducts, cell body with 4-8 long cytoplasmic processes radiating outward, more than one may be found on single acinus.","Intercalated duct: smallest duct, single layer cuboidal epithelium, directly attached to acinus, intralobular, saliva passage. Long in parotid; short in submandibular; absent in sublingual.","Striated duct: single layer columnar epithelium, striations = basal membrane enfolding + entrapped mitochondria (increase surface area for ion exchange), intralobular, modifies saliva ionic content. Long in submandibular; short in parotid; rare/absent in sublingual.","Excretory duct: simple columnar → simple cuboidal epithelium, interlobular (in septum), drains into oral cavity, present in major glands only.","Blood supply: arteries → arterioles (countercurrent direction around ducts) → dense capillaries around striated ducts. Increased blood flow = increased salivary secretion. Arteriovenous anastomoses near acinar circulation.","Nerve supply: postganglionic secretomotor nerves from sympathetic and parasympathetic. Unmyelinated axons in Schwann cell cytoplasm → distribute to arterioles, secretory cells, myoepithelial cells, intercalated and striated duct cells. Beta-adrenergic sympathetic → protein secretion. Alpha-adrenergic and cholinergic → water and electrolyte release.","Palatine tonsil: non-keratinized stratified squamous epithelium dips down forming deep branching tonsillar crypts dividing tonsil into lobules. Partial capsule of dense connective tissue. Largest bilateral tonsil. Trabeculae divide it into lobules.","Pharyngeal tonsil (adenoid): pseudostratified columnar ciliated epithelium with goblet cells. Epithelial folds appear as clefts without crypts. Single tonsil at back of nasopharynx. Thin partial capsule.","Lingual tonsil: non-keratinized stratified squamous epithelium. Wide crypts without branching. Supported by connective tissue septum around each lobule. Bilateral, posterior 1/3 of tongue.","Thyroid gland histology: Capsule → septa → lobes → lobules surrounded by follicles embedded in reticular fibers. Follicles lined by cuboidal epithelial cells filled with colloid material for hormone production.","Age changes of salivary glands: fatty degeneration, fibrosis, progressive accumulation of lymphatics and epithelial cells, alteration in mitochondrial structure."],"clinicalNotes":["Parotid: deep to overlying tissue, muscle and skin, only small portion is palpated.","Submandibular: in healthy condition, it can be palpated as non tender firm mass.","Palatine tonsil is not washed out by saliva, so it is always inflamed and causes difficulty in swallowing.","Pharyngeal tonsil may grow posteriorly to surround the auditory tube (known as Tubular tonsil) — may obstruct Eustachian tube causing hearing problems.","Lingual tonsil is rarely inflamed due to wash out by salivary secretion of Weber mucous salivary glands.","Epidermal growth factor produced by submandibular salivary gland → increases rate of wound contraction and healing in oral mucosa.","The parotid glands produce parotin hormone: stimulates mesenchyme growth, decreases calcium level, stimulates dentin calcification.","Saliva has slow flow at sleep and high flow during stimulus; controlled by salivary centre at brain and generated by taste sensation.","Anticariogenic activity of saliva: washing out of food stagnation + fluoride supply."],"flashcards":[{"question":"What is the classification of salivary glands according to size?","answer":"major or large, minor or small."},{"question":"What is the classification of salivary glands according to branching of ducts?","answer":"simple non-branching (minor).\ncompound branching (major)."},{"question":"What is the classification of salivary glands according to secretion?","answer":"serous: parotid adult, von Ebner.\nmucous: Weber, palatine, posterior lingual, glossopalatine.\nmixed: submandible (mainly serous), anterior lingual, sublingual, and buccal (mainly mucous) and labial (mainly mucous), parotid infant."},{"question":"What is the classification of salivary glands according to site?","answer":"1- Extraoral location: only parotid gland.\n2- Intraoral:\na) oral cavity proper: palatine, glossopalatine, lingual, and sublingual submandible.\nb) facial vestibule: labial and buccal."},{"question":"Describe the Parotid salivary gland.","answer":"Is the largest capsulated major salivary gland, provides only 25% of total saliva volume, located behind ramus, anterior and inferior to the ear.\nIt has a long excretory parotid duct (Stenson's duct) emerges from the gland and opens up into the oral cavity on the inner surface of the buccal mucosa opposite to maxillary second molar.\nBecause it is deep to the overlying tissue, muscle and skin, only small portion of parotid is palpated.\nIts secretion is pure serous in adult and mixed in infant."},{"question":"Describe the Submandible salivary gland.","answer":"is the second largest capsulated major salivary gland, provide 60% of total saliva volume, it lay in the submandibular fossa, posterior to the sublingual salivary gland.\nIts secretion is mixed, it has excretory submandibular duct (Wharton's duct) opens at floor of the mouth at sublingual carbuncle.\nIn healthy condition, it can be palpated as non tender firm mass."},{"question":"Describe the Sublingual salivary gland.","answer":"is the smallest major salivary gland without capsule, provides only 10% of total saliva volume, located in the sublingual fossa, anterior to the submandibular salivary glands, in the floor of the mouth.\nIts secretion is mixed secretion, associated with short excretory duct (Bartholin's duct)."},{"question":"Compare the three major salivary glands (Table 7).","answer":"PAROTID: Large size + capsule. Behind ramus antero-inferior to ear. Stenson's duct. Short striated d. Long intercalated d. Serous (adult)/Mucous (infant). 25% saliva.\nSUBMANDIBULAR: Middle size + capsule. Under mandible. Wharton's duct. Long striated d. Short intercalated d. Mixed mainly serous. 60% saliva.\nSUBLINGUAL: Small size + no capsule. Floor of mouth. Bartholin's duct. Rare/no striated d. No intercalated d. Mixed mainly mucous. 10% saliva.\nMINOR: Very small + no capsule. Scattered in all of the mouth. No excretory duct. No striated d. Long intercalated d. Serous/Mucous/Mixed. 5% saliva."},{"question":"What are the minor salivary glands? What do they secrete?","answer":"Minor salivary glands are much smaller but more numerous, with short unnamed ducts scattered in all the submucosa of the oral cavity. They provide only 5% of total saliva volume.\n1/ Serous: only Von Ebner's salivary gland associated with the large circumvallate lingual papilla on the posterior part of dorsum tongue.\n2/ Pure mucous: glossopalatine and palatine (posterior oral cavity), Weber glands (posterior tongue, associated with lingual tonsils).\n3/ Mixed: lips, cheek, anterior floor of mouth, and Blandin and Nuhn glands at tip of tongue."},{"question":"What is the structure (histology) of salivary glands?","answer":"1. Connective tissue (stroma):\n- Capsule: connective tissue surrounding outer portion\n- Septum: extension of capsule dividing gland into lobes and lobules; carries nerves and blood vessels\n- CT cells: fibroblasts, macrophages, mast cells, adipose cells, plasma cells in extracellular matrix\n\n2. Epithelium tissue (parenchyma):\n- Secretory cells: serous cells, mucous cells\n- Myoepithelial cells\n- Duct system: intercalated → striated → excretory duct"},{"question":"Compare mucous and serous cells (Table 7).","answer":"MUCOUS:\n- Light stained cytoplasm (cloud-appearance)\n- Cuboidal with distinct cell membrane\n- Flat nucleus at base\n- Viscous mucin secretion\n- Wide lumen\n- 10-12 Golgi bodies\n- No enzyme activity\n- Function: Lubrication and protection\n- Great carbohydrate content\n\nSEROUS:\n- Deep stained cytoplasm (clear)\n- Pyramidal with indistinct cell membrane\n- Round nucleus near center\n- Watery albumin rich in enzymes\n- Narrow lumen\n- 4-6 Golgi bodies\n- Great enzyme activity\n- Function: Digestion and defence\n- Great protein content"},{"question":"What are the types of acini?","answer":"a- Mucous acini: composed of mucous cells with wide lumen.\nb- Serous acini: composed of serous cells with narrow lumen.\nc- Mixed or mucoserous acini: have both mucous and serous cells. Two forms:\n1) Crescent shape (demilune of Von Ebner/Genuzzi): mucous is the main, serous acinus connected over mucous acinus in cap form surrounding single lumen.\n2) Group of mucous and serous acini separated without connection."},{"question":"What are myoepithelial cells? What is their function?","answer":"Myoepithelial cells are specialized epithelial cells with a contractile nature.\nWhen they contract, they squeeze the acini, forcing the saliva out of the lumen to facilitate the flow of saliva into the intercalated ducts.\nMore than one myoepithelial cell can sometimes be found on single acini.\nEach myoepithelial cell consists of a cell body with 4 to 8 long cytoplasmic processes radiating outward."},{"question":"Describe the duct system of salivary glands.","answer":"1) Intercalated duct: attached directly to acini. Lined with single layer of cuboidal epithelial cells. Intralobular. Serves as saliva passage. Long in parotid; short in submandibular; absent in sublingual.\n\n2) Striated duct: connected to intercalated ducts. Lined with single layer of columnar epithelial cells. Striations = basal membrane enfolding with entrapped mitochondria (increase surface area for ion exchange). Intralobular. Modifies saliva. Long in submandibular; short in parotid; rare/absent in sublingual.\n\n3) Terminal excretory duct: outer portion, drains into oral cavity. Interlobular (in septum). Major glands only. Simple columnar → simple cuboidal epithelium."},{"question":"What is saliva? What are its contents?","answer":"Saliva is the fluid secreted by salivary glands; it has slow salivary flow at sleep, and high salivary flow during stimulus. Salivary flow is controlled by salivary centre at brain and generated by taste sensation.\nSaliva has: 99% water and 1% of other contents:\n- Fewer protein and ions than blood\n- Amylase (major salivary protein)\n- Minerals: Cl, Ca, Mg, electrolytes, PO4, Ka, Na\n- Urea, ammonia, glucose, carbohydrate, buffers, lipids\n- Salivary immunoglobulins (sIg.A)\n- Uric acid, defensive enzymes, and metabolic wastes\n\nTypes of saliva:\n- Serous: mainly protein and enzymes as watery thin fluid\n- Mucous: mainly carbohydrate as thick viscous fluid due to mucin\n- Mixed of both serous and mucous secretion"},{"question":"How is saliva formed?","answer":"Saliva is formed by endoplasmic reticulum due to the control of DNA and some types of RNA. Saliva is packed in Golgi apparatus and move out to cytoplasm. These granules are accumulated at the apical end of the secretory cells.\nWhen gland is stimulated by parasympathetic stimuli, the granules move to apical end of cell membrane, fuse with it and release its substance into the lumen.\nAmylase breaks down starch in the mouth before it reaches the stomach."},{"question":"What are the functions of saliva?","answer":"1- Buffer function: balance the pH (6.2 to 7.4) and prevent acidity.\n2- Formation of pellicle: salivary protein covers enamel after eruption.\n3- Supply minerals to enamel (Ca, F, PO4): increase mineral content as age change.\n4- Soft tissue repair: a) reduction in bleeding time (highly vascular mucosa). b) Increase rate of wound contraction (epidermal growth factor from submandibular gland). c) Enhance rate of wound healing.\n5- Digestion of food: amylase, lipase, and lactase enzyme.\n6- Antibacterial function: a) Peroxidase (bactericidal). b) Lactoferrin (iron binding → inhibits bacterial growth). c) Lysozyme (hydrolysis of bacterial cell wall). d) Immunoglobulins (inhibit adherence of bacteria — mainly IgA, small IgM and IgG).\n7- Fluid medium for food solubilization.\n8- Hormonal secretion: parotin (from parotid) → stimulates mesenchyme growth, decreases calcium level, stimulates dentin calcification.\n9- Maintain cell integrity: moist and lubricant of oral mucosa.\n10- Reduce injury during mastication.\n11- Anticariogenic: washing out food stagnation + fluoride supply."},{"question":"What are tonsils? How are they classified?","answer":"Definition: The tonsil is the largest lymphatic tissue of the oral cavity containing many lymphatic nodules with germinal centers. Incompletely capsulated lymphatic organs located under the epithelium of the posterior region of the tongue and pharynx.\nTonsils are located surrounding the oropharynx in a ring called Waldeyer's ring.\n\nTypes:\n1- Palatine tonsils\n2- Pharyngeal tonsil\n3- Lingual Tonsils"},{"question":"Compare the three tonsils (Table 9).","answer":"PALATINE: The largest, bilateral. Below and back to soft palate. Non-keratinized stratified squamous epithelium. Branching and narrow crypts. Not washed by saliva → always inflamed → dysphagia.\n\nPHARYNGEAL (Adenoid): Less large, single. Above soft palate at midline (back of nasopharynx). Pseudostratified columnar ciliated epithelium with goblet cells. No crypts (folds appear as clefts). Washed by saliva → rarely inflamed. May surround auditory tube → Tubular tonsil.\n\nLINGUAL: Small, bilateral. Back (posterior 1/3) of tongue. Non-keratinized stratified squamous epithelium. Wide, not branching crypts. Rarely inflamed (washed by Weber gland secretion)."},{"question":"What are the functions of tonsils?","answer":"1/ Filtration site of lymph, by removing antigens and cell debris.\n2/ Site of phagocytosis by macrophages and reticular cells.\n3/ Production site of antibodies (immunoglobulins) by plasma cells (activated B-lymphocytes).\n4/ Responsible for production and recirculation of lymphocytes."},{"question":"Describe the thyroid gland.","answer":"Definition: The largest endocrine gland located in the anterior and lateral regions of neck, inferior to thyroid cartilage. Produces thyroxin hormone. Has 2 lobes connected by isthmus. Not seen but easy to palpate; mobile and seen during swallowing.\n\nParathyroid glands: 2 to 4 small glands on each side of thyroid gland in close contact.\n\nHistological structure:\n1/ Capsule: connective tissue cover.\n2/ Septa: extension of capsule dividing gland into large lobes and small lobules; each lobe surrounded by follicle and embedded in a network of reticular fibers.\n3/ Lobe filled by cuboidal epithelial cells, each cell filled by colloid material for production of hormone.\n\nDevelopment: Originates from foramen cecum at base of tongue and descends along thyroglossal duct to final position in neck."}],"blocks":[{"id":"sg-1","type":"heading","title":"1- SALIVARY GLANDS","content":"Salivary glands are the glands that produce saliva secretion necessary for lubricate and cleaning of oral mucosa to protect it from dryness and caries."},{"id":"sg-2","type":"subheading","title":"Classification of salivary glands (Table. 6):","content":""},{"id":"sg-3","type":"list","content":["i) According to the size of the gland: major or large, minor or small.","ii) According to the branching of ducts: simple non-branching (minor). compound branching (major).","iii) According to the secretion: serous: parotid adult, von Ebner. mucous: Weber, palatine. posterior lingual, glossopalatine. mixed: submandible (mainly serous). anterior lingual, sublingual, and buccal (mainly mucous) and labial (mainly mucous). parotid infant.","iii) According to the site: 1- Extraoral location: only parotid gland. 2- Intraoral: a) oral cavity proper: palatine, glossopalatine, lingual, and sublingual submandible. b) facial vestibule: labial and buccal."]},{"id":"sg-4","type":"heading","title":"I// Major salivary gland: 3 large paired glands associated with ducts:","content":""},{"id":"sg-5","type":"subheading","title":"1/ Parotid salivary gland.","content":""},{"id":"sg-6","type":"paragraph","content":"Is the largest capsulated major salivary gland, provides only 25% of total saliva volume, located behind ramus, anterior and inferior to the ear.\nIt has a long excretory parotid duct (Stenson's duct) emerges from the gland and opens up into the oral cavity on the inner surface of the buccal mucosa opposite to maxillary second molar.\nBecause it is deep to the overlying tissue, muscle and skin, only small portion of parotid is palpated.\nIts secretion is pure serous in adult and mixed in infant."},{"id":"sg-7","type":"subheading","title":"Submandible salivary gland:","content":""},{"id":"sg-8","type":"paragraph","content":"is the second largest capsulated major salivary gland, provide 60% of total saliva volume, it lay in the submandibular fossa, posterior to the sublingual salivary gland.\nIts secretion is mixed, it has excretory submandibular duct (Wharton's duct) opens at floor of the mouth at sublingual carbuncle.\nIn healthy condition, it can be palpated as non tender firm mass."},{"id":"sg-9","type":"subheading","title":"Sublingual salivary gland:","content":""},{"id":"sg-10","type":"paragraph","content":"is the smallest major salivary gland without capsule, provides only 10% of total saliva volume, located in the sublingual fossa, anterior to the submandibular salivary glands, in the floor of the mouth.\nIts secretion is mixed secretion, associated with short excretory duct (Bartholin's duct)."},{"id":"sg-11","type":"table","title":"Table 7: The different salivary glands","content":"| | Parotid | Submandible | Sublingual | Minor |\n|---|---|---|---|---|\n| Size | Large size + capsule | Middle size + capsule | Small size + no capsule | Very small + no capsule |\n| Site | Behind ramus antero-inferior to the ear | Under mandible | At floor of mouth | Scattered in all of the mouth |\n| Excretory duct | Stenson's | Wharton's | Bartholin's | no |\n| Striated duct | Short | Long | Rare or no | no |\n| Intercalated duct | Long | Short | No | long |\n| Secretion type | Serous in adult / Mucous in infant | Mixed mainly serous | Mixed mainly mucous | Serous, Mucous and Mixed |\n| Saliva volume | 25% | 60% | 10% | 5% |"},{"id":"sg-12","type":"heading","title":"II// Minor salivary glands:","content":"They are much smaller salivary glands but more numerous, with short unnamed ducts scattered in all the submucosa of the oral cavity.\nThey provide only 5% of total saliva volume."},{"id":"sg-13","type":"subheading","title":"Types of secretion of minor salivary glands:","content":""},{"id":"sg-14","type":"list","content":["1/ Serous: is the only Von Ebner's salivary gland associated with the large circumvallate lingual papilla on the posterior part of dorsum tongue.","2/ Pure mucous: at the posterior part of oral cavity such as glossopalatine and palatine, and posterior part of tongue as the Weber glands associated with lingual tonsils.","3/ Mixed: at the anterior part of oral cavity such as lips, cheek, anterior portion of floor of the mouth, and the Blandin and Nuhn glands seen at the tip of the tongue."]},{"id":"sg-15","type":"heading","title":"Structure or histology of salivary glands:","content":""},{"id":"sg-16","type":"list","content":["1. Connective tissue (stroma): capsule, septum, connective tissue cells","2. Epithelium tissue (parenchyma): secretory cells (serous cells, mucous cells), myoepithelial cells, duct system"]},{"id":"sg-17","type":"subheading","title":"1- Connective tissue stroma:","content":""},{"id":"sg-18","type":"list","content":["i/ Capsule: connective tissue surrounding the outer portion of the gland to protect and support the gland.","ii/ Septum: extension of capsule that helps divide the inner portion of the gland into large lobes and small lobules; both capsule and septum carry nerves and blood vessels.","iii/ Connective tissue cells and extracellular substance: Fibroblasts, macrophages, mast cells, adipose cells and plasma cells embedded in an extracellular matrix. Collagen fibers and ground substance of glycoprotein and proteoglycan. Oxytalan fibers are found in the submandibular and minor salivary glands, around the smaller intralobular ducts and substitute for the elastic fibers that surround the larger extralobular ducts."]},{"id":"sg-19","type":"subheading","title":"2- Epithelial cells or parenchyma:","content":""},{"id":"sg-20","type":"subheading","title":"A) Secretory cells — 2 types:","content":""},{"id":"sg-21","type":"list","content":["i- Mucous cells: have cloud-appearance cytoplasm, produce mucous saliva.","ii- Serous cells: have clear cytoplasm and produce serous saliva."]},{"id":"sg-22","type":"subheading","title":"iii- Arrangement of secretory cells (Acini):","content":""},{"id":"sg-23","type":"paragraph","content":"Secretory cells are found in cluster or groups known as Acini. Each acinus is connected to the ductal system. The acini are located within each lobule of the gland.\nEach acinus consists of a single layer of cuboidal epithelial cells surrounded a lumen or central space, where the saliva is deposited after being produced by the secretory cells."},{"id":"sg-24","type":"subheading","title":"Types of Acini:","content":""},{"id":"sg-25","type":"list","content":["a- Mucous acini: composed of mucous cells with wide lumen.","b- Serous acini: composed of serous cells with narrow lumen.","c- Mixed or mucoserous acini: have both mucous and serous cells. Two forms:\n1) Crescent shape: the mucous is the main, and serous acinus connected over the mucous acinus, surrounding single lumen in cap form — represents the demilune of Von Ebner or Genuzzi.\n2) Group of mucous and serous acini are separated without connection."]},{"id":"sg-26","type":"table","title":"Table 7: The difference between mucous and serous cells","content":"| | Mucous | Serous |\n|---|---|---|\n| Stain of cytoplasm | Light stained | Deep stained |\n| Shape | Cuboidal with distinct cell membrane | Pyramidal with indistinct cell membrane |\n| The nuclei | Flat and located at base | Round and located near center |\n| Type of secretion | Viscous mucin | Watery albumin rich in enzyme |\n| Lumen of acini | Wide | Narrow |\n| Golgi bodies | From 10 to 12 | From 4 to 6 |\n| Enzyme activity | No | Great |\n| Function | Lubrication and protection | Digestion of food and defence |\n| Ratio of content | Great carbohydrate | Great protein |"},{"id":"sg-27","type":"subheading","title":"B) Myoepithelial cells:","content":""},{"id":"sg-28","type":"paragraph","content":"The myoepithelial cells are specialized epithelial cells have a contractile nature.\nWhen these cells contract, they squeeze the acini, forcing the saliva out of the lumen to facilitate the flow of saliva out of each lumen into the intercalated ducts.\nMore than one myoepithelial cell can sometimes be found on single acini.\nEach myoepithelial cells consists of a cell body with 4 to 8 long cytoplasmic processes radiating outward."},{"id":"sg-29","type":"subheading","title":"C) Duct system:","content":"Hollow tubes connected initially with the acini and then with other ducts as the ducts grow larger from the inner to outer portions of the gland, each type of duct is lined by different epithelium depending on its location in the gland."},{"id":"sg-30","type":"list","content":["1) Intercalated duct: attached directly to acini. Lined with a single layer of cuboidal epithelial cells. Intralobular duct. Serves as a saliva passage. Long in parotid; short in submandibular; absent in sublingual.","2) Striated duct: connected to the intercalated ducts in the lobules. Lined with a single layer of columnar epithelial cells. Striations caused by enfolding of the basal membrane (entrapped mitochondria) — increases surface area, allows increased exchange of ions with blood vessels. Intralobular duct. Cells can remove and add ions to modify saliva. Long in submandibular; short in parotid; rare/absent in sublingual.","3) Terminal excretory duct: outer portion of duct system that empties into the oral cavity. Found in final portion of major salivary glands only. Located in the septum of the gland (interlobular duct). Lined initially as simple columnar epithelium, then transitions to simple cuboidal as duct moves to outer portion of gland."]},{"id":"sg-31","type":"heading","title":"Blood supply of salivary glands:","content":""},{"id":"sg-32","type":"paragraph","content":"The extensive blood supply is required for rapid saliva secretion; arteries enter the gland give rise to small arterioles, which run in countercurrent direction around the ducts and branch into dense capillaries around the striated ducts.\nVenous return is accomplished by small veins and by large veins, that drain directly to the periphery of the gland; arteriovenous anastomoses are found close to the acinar circulation.\nThe increase of blood flow normally accompanied by increase of salivary secretion."},{"id":"sg-33","type":"heading","title":"Nerve supply of salivary glands:","content":""},{"id":"sg-34","type":"list","content":["1/ Salivary glands are controlled by impulses reaching the cells via secretomotor nerves. In smaller glands a slow background of spontaneous secretion may occur independently of neural control.","2/ Salivary glands receive postganglionic secretomotor nerves from both sympathetic and parasympathetic sources. Nerve enters salivary gland follows the blood vessels and breaks up into smaller bundles until they form final plexus adjacent to the terminal epithelial cells and ducts.","3/ In these plexus the nerves consist of unmyelinated axons embedded in Schwann cell cytoplasm, then distribute to muscle arterioles, to secretory cells of the terminal end, to the myoepithelial cells and to the cells of intercalated and striated ducts.","4/ Secretory control of saliva comes from autonomic nervous system particularly parasympathetic, and there is no direct inhibitory innervation.","5/ The flow of saliva is controlled by nerve stimulation: Beta-adrenergic sympathetic stimulation induces protein secretory mechanism. Alpha-adrenergic and cholinergic stimulation regulate water and electrolyte release."]},{"id":"sg-35","type":"heading","title":"Age change of salivary glands:","content":"The function of salivary glands is reduced slowly with age, which may be due to the following histologic changes in the glands:"},{"id":"sg-36","type":"list","content":["1- Fatty degeneration.","2- Fibrosis.","3- Progressive accumulation of lymphatics and epithelial cells.","4- Alteration in mitochondrial structure."]},{"id":"sg-37","type":"heading","title":"SALIVA","content":"Saliva is the fluid secreted by salivary glands; it has slow salivary flow at sleep, and high salivary flow during stimulus. Salivary flow is controlled by salivary centre at brain and generated by taste sensation."},{"id":"sg-38","type":"subheading","title":"Salivary content:","content":""},{"id":"sg-39","type":"paragraph","content":"Saliva has: 99% water and 1% of other contents such as:\n- Saliva has fewer protein and ions than blood.\n- The amylase digestive enzyme is the major salivary protein.\n- It contains minerals Cl, Ca, Mg, electrolytes, PO4, Ka, Na, urea, ammonia, glucose, carbohydrate, buffers, lipids, salivary immunoglobulins (sIg. A), uric acid, defensive enzymes, and metabolic wastes."},{"id":"sg-40","type":"subheading","title":"Types of saliva:","content":""},{"id":"sg-41","type":"list","content":["Serous: mainly protein and enzymes as watery thin fluid.","Mucous: mainly carbohydrate as thick viscous fluid due to the presence of mucin.","Mixed of both serous and mucous secretion."]},{"id":"sg-42","type":"subheading","title":"Formation of saliva:","content":""},{"id":"sg-43","type":"paragraph","content":"It formed by endoplasmic reticulum due to the control of DNA and some types of RNA. Saliva is packed in Golgi apparatus and move out to cytoplasm, these granules are accumulated at the apical end of the secretory cells.\nWhen gland is stimulated by parasympathetic stimuli, the granules move to apical end of cell membrane fuse with it and release its substance into the lumen, amylase break down to starch in the mouth before reach to the stomach."},{"id":"sg-44","type":"subheading","title":"Function of saliva (Table. 8):","content":""},{"id":"sg-45","type":"list","content":["1- Serve as buffer function to balance the pH (6.2 to 7.4) and to prevent acidity.","2- Formation of pellicle as salivary protein covers enamel after eruption.","3- Supply minerals to enamel as an age change of enamel to have more mineral contents.","4- Soft tissue repair: a) reduction in bleeding time: oral mucosa is highly vascular than other tissues but it has less bleeding time. b) Increase in rate of wound contraction: due to the presence of epidermal growth factor produced by submandibule salivary gland. c) Enhance the rate of wound healing.","5- Help in digestion of food by amylase, lipase, and lactase enzyme.","6- Antibacterial function due to the presence of: a) Peroxidase which acts as bactericidal function, and kill bacteria directly. b) Lactoferrin which acts as iron binding protein inhibits bacterial growth. c) Lysozyme which plays role in hydrolysis of bacterial cell wall and act as bactericidal function. d) Immunoglobulins inhibit the adherence of bacteria to the oral tissue, mainly Ig. A and small amount of Ig M and Ig G.","7- It provides a fluid medium in which the food material becomes soluble.","8- Hormonal secretion: the parotid glands produce parotin hormone believed to: stimulate mesenchyme growth, decrease calcium level, stimulate dentin calcification.","9- Help to maintain cell integrity by moist and lubricant of oral mucosa.","10- Reduce the injury of the tissue during mastication process.","11- Act as anticariogenic activity by: washing out of food stagnation. Fluoride supply."]},{"id":"sg-46","type":"table","title":"Table 8: The function and mode of action of saliva","content":"| function | mode of action | its activity by |\n|---|---|---|\n| protection | lubrication, lavage, pellicle formation, water supply | glycoprotein, water, salivary protein and glycoprotein, water |\n| digestion | bolus formation, starch digestion | water, amylase |\n| buffering | neutralize esophageal content, maintain pH, neutralize acid | phosphate & bicarbonate |\n| antimicrobial | antibodies, hostile environment, barrier effect | Ig A. G. M, lysozyme & lactoferrin, glycoprotein |\n| tooth integrity | decrease permeability, increase hardness & resist caries | ions: Ca, F, PO4 |\n| soft tissue repair | reduce bleeding time, formation of blood clot | viscous fluid, epidermal growth factor by submandibular gland |"},{"id":"sg-47","type":"heading","title":"II/ TONSILS","content":""},{"id":"sg-48","type":"subheading","title":"Definition:","content":"The tonsil is the largest lymphatic tissue of the oral cavity containing many lymphatic nodules with germinal centers. The tonsil is incompletely capsulated lymphatic organs located under the epithelium of the posterior region of the tongue, and pharynx. Tonsils are located surrounding the oropharynx in a ring called Waldeyer's ring."},{"id":"sg-49","type":"subheading","title":"Types of Tonsils (Table. 9):","content":""},{"id":"sg-50","type":"list","content":["1- Palatine tonsils.","2- Pharyngeal tonsil.","3- Lingual Tonsils."]},{"id":"sg-51","type":"subheading","title":"1- Palatine tonsils:","content":""},{"id":"sg-52","type":"paragraph","content":"They are largest two lymphatic masses found in the lateral wall of the oropharynx; below the back of soft palate. They are more larger in children.\nThe surface is covered by non-keratinized stratified squamous epithelium. This epithelium dips down into the lymphatic tissue forming deep branching tonsilar crypts which divide it into different lobules. This tonsil is separated from the inner tissues by a partial capsule of dense connective tissue. This tonsil is not washed out by saliva, so it is always inflamed and causes difficult in swallowing."},{"id":"sg-53","type":"subheading","title":"2- Pharyngeal tonsil:","content":""},{"id":"sg-54","type":"paragraph","content":"Is a single tonsil has epithelial folds appear as clefts without crypts. It is located at the back of nasopharynx above the soft palate at the midline. Pharyngeal tonsils covered by pseudostratified columnar ciliated epithelium with goblet cells. It is separated from underlying structures by a thin partial capsule. This tonsil is called adenoid. This tonsil grows posteriorly to surround the auditory tube (known as Tubular tonsil). This tonsil may wash out by salivary secretion it is rarely inflamed."},{"id":"sg-55","type":"subheading","title":"3- Lingual Tonsils:","content":""},{"id":"sg-56","type":"paragraph","content":"They are numerous bilateral mass located at midline on the posterior 1/3 of the tongue surface, with wide crypt without branching. These tonsils are supported by connective tissue septum surround each lobule of the tonsil, covered with non-keratinized stratified squamous epithelium. This tonsil is rarely inflamed due to wash out by salivary secretion of Weber mucous salivary glands."},{"id":"sg-57","type":"table","title":"Table 9: The different tonsils","content":"| Tonsils | size & number | Location | surface epithelium | crypt form |\n|---|---|---|---|---|\n| Palatine | the largest bilateral | below and back to soft palate | non-keratinized stratified squamous | branching and narrow |\n| Pharyngeal | less large single | above soft palate at midline | pseudo-stratified columnar ciliated | not present |\n| Lingual | small bilateral | back to the tongue (posterior 1/3) | non-keratinized stratified squamous | wide not branching |"},{"id":"sg-58","type":"subheading","title":"Function of Tonsils:","content":""},{"id":"sg-59","type":"list","content":["1/ Filtration site of lymph, by removing antigens and cell debris.","2/ Site of phagocytosis by macrophages and reticular cells.","3/ Production site of antibodies (immunoglobulins) by plasma cells (activated B-lymphocytes).","4/ Responsible for production and recirculation of lymphocytes."]},{"id":"sg-60","type":"heading","title":"III/ THYROID GLAND","content":""},{"id":"sg-61","type":"subheading","title":"Definition:","content":"The largest endocrine gland located in the anterior and lateral regions of neck, inferior to thyroid cartilage, produce thyroxin hormone, this gland has 2 lobes connected by isthmus, it is not seen but easy to palpate, it is mobile and seen during swallow.\nParathyroid glands are 2 to 4 small glands on each side of thyroid gland in close contact."},{"id":"sg-62","type":"subheading","title":"Histological structure of thyroid gland:","content":""},{"id":"sg-63","type":"list","content":["1/ Capsule: connective tissue cover.","2/ Septa: are the extension of capsule to divide the gland to large lobes, and small lobules, each lobe surrounded by follicle and embedded in a network of reticular fibers.","3/ Lobe filled by cuboidal epithelial cells, and each cell is filled by colloid material for production of hormone."]}],"giveReasons":[{"reason":"The parotid duct (Stenson's duct) opens opposite to the maxillary second molar","explanation":"Because the duct emerges from the anterior surface of the parotid gland, passes horizontally over the masseter muscle, pierces the buccinator muscle, and enters the oral cavity at the point that corresponds anatomically to the maxillary second molar. This is a fixed anatomical landmark used clinically for gland palpation and duct catheterization.","cat":"anatomical"},{"reason":"The submandibular gland contributes 60% of total saliva volume","explanation":"Because it is the most productive of the major salivary glands in terms of resting (unstimulated) secretion. It has both serous and mucous secretory units, a large volume of secretory tissue, and maintains continuous secretion even at rest. The parotid (25%) and sublingual (10%) glands contribute less to resting saliva volume.","cat":"physiological"},{"reason":"The sublingual gland has no true capsule","explanation":"This is a developmental and structural characteristic unique to the sublingual gland. Unlike the parotid and submandibular glands which develop with a fibrous capsule, the sublingual gland remains as a diffuse collection of glandular tissue without a well-defined fibrous enclosure. This also means it cannot be easily palpated as a discrete mass.","cat":"histological"},{"reason":"The parotid gland is described as 'deep' and only partially palpable","explanation":"Because it is located deep to the overlying skin, subcutaneous tissue, and parotid fascia, and is partly covered by the masseter muscle and the ramus of the mandible. Only the superficial lobe's anterior and inferior portions can be felt during clinical palpation.","cat":"anatomical"},{"reason":"The parotid secretion is pure serous in adults but mixed in infants","explanation":"Because the composition of the gland changes with maturation. In infants, the glandular tissue has not yet fully differentiated into purely serous acini; mixed acini are present. As the gland matures and dietary demands change (from milk to solid food requiring more enzymatic digestion), it transitions to a purely serous secretion rich in amylase and other digestive enzymes.","cat":"histological"},{"reason":"Von Ebner's gland is the only serous minor salivary gland","explanation":"Because it is specifically associated with the circumvallate (vallate) papillae on the posterior dorsum of the tongue. Its watery serous secretion flows into the trench (sulcus) around the vallate papillae, washing away food particles so taste buds on the papillary walls can continuously sample new tastants — requiring a thin, enzyme-rich (amylase) fluid rather than the mucous secretion produced by other minor glands.","cat":"histological"},{"reason":"The striated duct has basal striations","explanation":"Because the basal cell membrane of striated duct cells is deeply infolded (enfolded), and mitochondria are entrapped between these folds. This greatly increases the surface area available for ion exchange with the surrounding blood vessels, allowing the duct cells to actively remove and add ions to modify the ionic composition of primary saliva (from isotonic to hypotonic).","cat":"histological"},{"reason":"The palatine tonsil is always inflamed","explanation":"Because it is not washed out by saliva — its deep branching crypts trap food debris, bacteria, and antigens that accumulate and are not removed by salivary flow. This persistent antigenic load continuously stimulates the lymphatic tissue, leading to chronic or recurrent inflammation and causing difficulty in swallowing.","cat":"clinical"},{"reason":"The pharyngeal tonsil (adenoid) is rarely inflamed","explanation":"Because it is covered by pseudostratified columnar ciliated epithelium with goblet cells, and is washed by salivary secretions. The ciliary action and salivary flow help remove antigens and bacteria from its surface, preventing the accumulation that drives chronic inflammation. It has no deep crypts, only epithelial folds.","cat":"histological"},{"reason":"Increase in blood flow to salivary glands increases salivary secretion","explanation":"Because greater blood flow delivers more substrate (water, electrolytes, proteins) to the secretory acinar cells for saliva production. The arterioles run in countercurrent direction around the ducts, and dense capillaries surround the striated ducts where ion exchange occurs. More substrate available means more saliva can be produced per unit time.","cat":"physiological"}]}];
const MIDTERM = [{"id":"mq-2-1","sheetId":2,"type":"mcq","question":"About mandibular process which of the following are true:","options":["Develop from first pharyngeal arch","Appear initially as bilateral structures but then merge in midline","Give rise to mandible, lower part of face and lower lip","Both B & C","All of the above"],"correctOption":4,"answer":"All of the above"},{"id":"mq-2-2","sheetId":2,"type":"mcq","question":"The ossification center of the developing mandible arise between:","options":["Mental and incisive nerves","Mandibular and maxillary nerves","Superior alveolar and infra-orbital nerve","None of above"],"correctOption":0,"answer":"Mental and incisive nerves"},{"id":"mq-2-3","sheetId":2,"type":"mcq","question":"The face develops from:","options":["Two primordial prominences","4 primordial prominences","6 primordial prominences","None of above"],"correctOption":3,"answer":"None of above"},{"id":"mq-2-4","sheetId":2,"type":"mcq","question":"About the median cleft lip all of the following are true except:","options":["It is common condition","Partial or complete failure of medial nasal processes to merge","It is called hare lip","Both B & C"],"correctOption":0,"answer":"It is common condition"},{"id":"mq-2-5","sheetId":2,"type":"mcq","question":"About cleft palate which of the following are true:","options":["Cleft of soft palate causes problems of speech and swallowing","Cleft palate more common than cleft lip","Cleft of primary palate anterior to incisive foramen result of failure of lateral palatine process","All of the above","None of the above"],"correctOption":0,"answer":"Cleft of soft palate causes problems of speech and swallowing"},{"id":"mq-2-6","sheetId":2,"type":"mcq","question":"All the muscles of the tongue innervated by hypoglossal nerve except palatoglossal nerve innervated by:","options":["Trigeminal nerve","Chorda tympani","Glossopharyngeal nerve","None of the above"],"correctOption":3,"answer":"None of the above"},{"id":"mq-2-7","sheetId":2,"type":"mcq","question":"The median rhomboid glossitis is:","options":["Failure of merging between two lateral lingual swellings","The tongue appears formed of three nodules","Small tongue in relation to size of oral cavity","None of the above"],"correctOption":1,"answer":"The tongue appears formed of three nodules"},{"id":"mq-2-8","sheetId":2,"type":"mcq","question":"All of the following are extrinsic muscles except:","options":["Superior longitudinal muscle","Styloglossus muscle","Palatoglossus muscle","None of the above"],"correctOption":0,"answer":"Superior longitudinal muscle"},{"id":"mq-2-9","sheetId":2,"type":"mcq","question":"About the tongue which of the following are true:","options":["The anterior 2/3 develops from three elevations in second pharyngeal arch","The posterior 1/3 develops by two elevation caudally to foramen cecum","All of the above","None of the above"],"correctOption":1,"answer":"The posterior 1/3 develops by two elevation caudally to foramen cecum"},{"id":"mq-2-10","sheetId":2,"type":"mcq","question":"About the secondary palate which of the following are true:","options":["It is called median palatine process and premaxillary bone","Part of palate posterior to incisive fossa","All of the above","None of the above"],"correctOption":1,"answer":"Part of palate posterior to incisive fossa"},{"id":"mq-2-11","sheetId":2,"type":"mcq","question":"About intrinsic muscles which of the following are true:","options":["They lie entirely within the tongue","Their function: repositioning of the tongue","Types: genioglossus, hyoglossus, palatoglossus","All of the above","None of the above"],"correctOption":0,"answer":"They lie entirely within the tongue"},{"id":"mq-2-12","sheetId":2,"type":"mcq","question":"About bifid tongue which of the following is true:","options":["Most common malformation of the tongue","Usually seen in mongolism","Tongue appear formed of three nodules","All of the above","None of the above"],"correctOption":4,"answer":"None of the above"},{"id":"mq-2-13","sheetId":2,"type":"mcq","question":"About development of lip which of the following is true:","options":["Lower lip develops by merging of mandibular processes","Upper lip formed from 2/3 medial nasal and 1/3 maxillary","Cleft lip is malformation of lower lip","All of the above"],"correctOption":0,"answer":"Lower lip develops by merging of mandibular processes"},{"id":"mq-2-14","sheetId":2,"type":"mcq","question":"About development of mandible which of the following is true:","options":["It develops as intracartilaginous bone","Meckel's cartilage share in ossification","It has two ossification center","Both A & B","None of the above"],"correctOption":4,"answer":"None of the above"},{"id":"mq-2-15","sheetId":2,"type":"mcq","question":"About development of maxilla which of the following is true:","options":["One center of ossification close to anterosuperior dental nerve","Two centers at canine fossa","None of the above","All of the above"],"correctOption":0,"answer":"One center of ossification close to anterosuperior dental nerve"},{"id":"mq-2-16","sheetId":2,"type":"mcq","question":"About age changes of mandible all true except:","options":["Mandible at birth differs from adult","In senility, resorption increases mandibular angle","Mandibular angle at childhood 110°","Both A & B"],"correctOption":3,"answer":"Both A & B"},{"id":"mq-3-1","sheetId":3,"type":"mcq","question":"About cleft palate true:","options":["Cleft of soft palate causes speech/swallowing problems","Cleft palate more common than cleft lip","Cleft primary palate anterior to incisive foramen failure","All","None"],"correctOption":0,"answer":"Cleft of soft palate causes speech/swallowing problems"},{"id":"mq-3-2","sheetId":3,"type":"mcq","question":"Muscles of tongue except palatoglossus innervated by:","options":["Trigeminal","Chorda tympani","Glossopharyngeal","None"],"correctOption":3,"answer":"None"},{"id":"mq-3-3","sheetId":3,"type":"mcq","question":"Media const PASTYEAR = [{"id":"py-1-1","sheetId":1,"type":"mcq","question":"Epiblast cells are characterized by being:","options":["Flat cells destined to become endoderm","Cuboidal cells forming the hypoblast","Columnar cells that become the future ectoderm","None of the above"],"correctOption":2,"answer":"Columnar cells that become the future ectoderm"},{"id":"py-1-2","sheetId":1,"type":"mcq","question":"The primitive streak is located at the:","options":["Cranial end of the embryonic disc","Caudal end of the embryonic disc","Lateral margin of the disc","Center of the disc"],"correctOption":1,"answer":"Caudal end of the embryonic disc"},{"id":"py-1-3","sheetId":1,"type":"mcq","question":"Growth of the face is directed:","options":["Superior and posterior to the cranial base","Superior and anterior only","Inferior and anterior to the cranial base","Lateral and posterior"],"correctOption":2,"answer":"Inferior and anterior to the cranial base"},{"id":"py-1-4","sheetId":1,"type":"mcq","question":"The first bone to ossify in the body is:","options":["Femur","Mandible","Clavicle","Maxilla"],"correctOption":2,"answer":"Clavicle","explanation":"The clavicle is the first bone to ossify (intramembranous) and also the last to complete ossification."},{"id":"py-2-1","sheetId":2,"type":"mcq","question":"Treacher Collins syndrome is characterized by:","options":["Delayed tooth eruption","Early tooth eruption","Supernumerary teeth","Anodontia"],"correctOption":0,"answer":"Delayed tooth eruption"},{"id":"py-2-2","sheetId":2,"type":"mcq","question":"The intermaxillary segment gives rise to the:","options":["Philtrum of the upper lip","Lower lip and chin","Hard palate only","Soft palate"],"correctOption":0,"answer":"Philtrum of the upper lip","explanation":"The intermaxillary segment (formed by merging medial nasal processes) forms the philtrum, premaxilla, and primary palate."},{"id":"py-2-3","sheetId":2,"type":"mcq","question":"The muscles of mastication are derived from:","options":["Mesenchyme of the 1st pharyngeal arch","Mesenchyme of the 2nd pharyngeal arch","Neural crest cells of the 3rd arch","Mesoderm of the 4th arch"],"correctOption":0,"answer":"Mesenchyme of the 1st pharyngeal arch"},{"id":"py-2-4","sheetId":2,"type":"mcq","question":"The mandibular processes give rise to:","options":["Upper lip and philtrum","Cheeks and zygomatic region","Mandible and most of lower face including the lower lip","Lower lip only"],"correctOption":3,"answer":"Lower lip (and lower face/mandible)"},{"id":"py-2-5","sheetId":2,"type":"mcq","question":"When the tongue is depressed to the floor of the stomodeum, the result is:","options":["Decrease in width of the face","Increase in height of the stomodeum","No change in facial dimensions","Decrease in height of the face"],"correctOption":1,"answer":"Increase in height of the stomodeum"},{"id":"py-2-6","sheetId":2,"type":"mcq","question":"The tuberculum impar (median tongue bud) arises from:","options":["Second pharyngeal arch","Fourth pharyngeal arch","First pharyngeal arch","Third pharyngeal arch"],"correctOption":2,"answer":"First pharyngeal arch"},{"id":"py-2-7","sheetId":2,"type":"mcq","question":"The copula of His is a median swelling formed by:","options":["2nd and 3rd branchial arches in the floor of the pharynx","1st and 2nd branchial arches","3rd and 4th branchial arches","5th arch only"],"correctOption":0,"answer":"2nd and 3rd branchial arches in the floor of the pharynx"},{"id":"py-2-8","sheetId":2,"type":"mcq","question":"The first pharyngeal pouches give rise to:","options":["Palatine tonsils and tonsillar fossa","External auditory tube and middle ear cavity","Parathyroid glands","Thymus"],"correctOption":1,"answer":"External auditory tube and middle ear cavity","explanation":"1st pouch → auditory tube + middle ear. 2nd pouch → tonsillar fossa. 3rd pouch → parathyroid inferior + thymus."},{"id":"py-2-9","sheetId":2,"type":"mcq","question":"The oblique facial cleft results from:","options":["Failure of maxillary processes to merge in the midline","Failure of both medial nasal processes to merge","Lack of fusion between the frontonasal process and maxillary process (upper lip)","Failure of mandibular processes"],"correctOption":2,"answer":"Lack of fusion between the frontonasal process and maxillary process (upper lip)"},{"id":"py-2-10","sheetId":2,"type":"mcq","question":"Unilateral cleft lip is caused by:","options":["Failure of maxillary processes to fuse in midline","Failure in meeting and fusion of the medial nasal processes with the maxillary process on one side","Failure of both medial nasal processes to merge","Failure of mandibular processes to merge"],"correctOption":1,"answer":"Failure in meeting and fusion of the medial nasal processes with the maxillary process on one side"},{"id":"py-2-11","sheetId":2,"type":"mcq","question":"Yellow spots scattered in the labial mucosa are called:","options":["Dentin islands","Enamel pearls","Fordyce's spots","Melanin spots"],"correctOption":2,"answer":"Fordyce's spots","explanation":"Fordyce's spots are ectopic sebaceous glands seen as yellow-white spots in the oral mucosa."},{"id":"py-2-12","sheetId":2,"type":"mcq","question":"The dental lamina is formed by proliferation of the:","options":["Basal layer of the oral epithelium into the underlying ectomesenchyme","Superficial layer of oral epithelium","Dental papilla mesenchyme","Neural crest cells directly"],"correctOption":0,"answer":"Basal layer of the oral epithelium into the underlying ectomesenchyme"},{"id":"py-2-13","sheetId":2,"type":"mcq","question":"During development of the face, the main structures that play a major role are:","options":["Maxillary processes only","Mandibular processes only","Frontonasal processes only","All of the above — maxillary, mandibular, and frontonasal processes"],"correctOption":3,"answer":"All of the above — maxillary, mandibular, and frontonasal processes"},{"id":"py-2-14","sheetId":2,"type":"mcq","question":"The intermaxillary segment gives rise to (complete answer):","options":["Philtrum only","Posterior part of maxilla","Primary palate only","Philtrum and primary palate"],"correctOption":3,"answer":"Philtrum and primary palate (A+C)"},{"id":"py-2-15","sheetId":2,"type":"mcq","question":"The specific cartilage of the 2nd branchial arch is:","options":["Meckel's cartilage","Tome's cartilage","Reichert's cartilage","Condylar cartilage"],"correctOption":2,"answer":"Reichert's cartilage"},{"id":"py-2-16","sheetId":2,"type":"mcq","question":"The cartilage that persists until puberty (mandibular growth center up to 21 years) is:","options":["Meckel's cartilage","Condylar cartilage","Coronoid cartilage","Symphyseal cartilage"],"correctOption":1,"answer":"Condylar cartilage","explanation":"Condylar cartilage is the primary growth center of the mandible, persisting until about 21 years of age."},{"id":"py-2-17","sheetId":2,"type":"mcq","question":"The internal growth of the medial nasal process gives rise to:","options":["Nasal septum only","Premaxilla only","Primary palate only","All of the above — nasal septum, nasal cavity, premaxilla, primary palate"],"correctOption":3,"answer":"All of the above — nasal septum, premaxilla, primary palate"},{"id":"py-2-18","sheetId":2,"type":"mcq","question":"When Tetracycline is taken during the second and third month of pregnancy it causes:","options":["Dentinogenesis imperfecta","Mandibulofacial dysostosis","Hypoplasia of enamel","Delayed tooth eruption"],"correctOption":2,"answer":"Hypoplasia of enamel"},{"id":"py-tf-2-1","sheetId":2,"type":"true-false","question":"Cleft lower lip results from failure of the mandibular processes to merge.","answer":"True"},{"id":"py-tf-2-2","sheetId":2,"type":"true-false","question":"The intermaxillary segment gives rise to the philtrum, premaxilla, and primary palate.","answer":"True"},{"id":"py-tf-2-3","sheetId":2,"type":"true-false","question":"The incisive foramen is the landmark between anterior and posterior cle
