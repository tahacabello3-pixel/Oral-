 of the stomodeum."},{"id":"mouth-5","type":"paragraph","content":"*The anterior 2/3 of the tongue (the body): develops from three elevations which appear in the first pharyngeal arches.First, a small centrally placed elevation, the tuberculum impar appears in the midline of the first pharyngeal arch just anterior to the formen cecum.\nSoon, two oval lateral lingual swellings develop on both sides of the tuberculum impar.\nVery quickly these lateral lingual swelling enlarge, merge with each other and cover the tuberculum impar to form a large mass from which the mucous membrane of the anterior 2/3 of the tongue is formed."},{"id":"mouth-6","type":"paragraph","content":"The posterior 1/3 of the tongue (the base )is initially indicated by two elevations that develop caudally to the foramen cecum.\nThe hypobranchial eminence which develops from the mesoderm of the third and fourth pharyngeal arches.\nThe mucous membrane of the base of the tongue develops from the anterior part of the hypobranchial eminence while, the lining of the epiglottis develops from its posterior part and the fourth pharyngeal arch."},{"id":"mouth-7","type":"paragraph","content":"The anterior and posterior portions of the tongue develop at the same time and the line of fusion between them is indicated by an inverted V shaped groove, the sulcus terminalis.\nits apex is the foramen cecum.\n*The body of the tongue separates from the floor of the mouth by a downward-growth of the ectoderm all around its periphery.\nThis is subsequently degenerated except at the region of the lingual frenulum to form the U shaped lingual sulcus which gives the tongue its mobility."},{"id":"mouth-8","type":"paragraph","content":"*The muscles of the tongue have a different origin, myotomes of the occipital migrate during the 5th and the 7th week I.U.\ninto the sac like structure, formed by the pharyngeal arches.\nAll the muscles of the tongue except the palatoglossal muscles are derived from the occipital myotomes and so, innervated with their nerve supply, the hypoglossal nerve.\nThe palatoglossal muscles are derived from the mesoderm of the fourth pharyngeal arches and are innervated by the vagus nerve."},{"id":"mouth-9","type":"definition","title":"Intrinsic muscles:","content":"• Superior longitudinal\n• Inferior longitudinal\n• Transverse\n• Vertical"},{"id":"mouth-10","type":"definition","title":"Extrinsic muscles:","content":"Styloglossus\nHyoglossus\nGenioglossus\nPalatoglossus"},{"id":"mouth-11","type":"paragraph","content":"The intrinsic muscles lie entirely within the tongue, while the extrinsic muscles attach the tongue to other structures.\nThe extrinsic muscles reposition the tongue, while the intrinsic muscles alter the shape of the tongue for talking and swallowing."},{"id":"mouth-12","type":"paragraph","content":"*In later stage of development various types of papillae differentiate on the dorsal mucosa of the body of the tongue.\nThe circumvallate and foliate papillae appear first at about 8 weeks I.U., followed by the fungiform papillae.\nwithin these papillae taste buds soon develop. the filiform papillae becomes apparent at about 10th week I.U."},{"id":"mouth-13","type":"paragraph","content":"The Von Ebner serous glands develop at about 4 months I.U.\nfollowed by the weber mucous glands in the posterior third of the tongue.\nThe lymphatic tissues forming the lingual tonsils develop at birth in the pharyngeal part or base of the tongue."},{"id":"mouth-14","type":"heading","title":"Innervation of the tongue :","content":""},{"id":"mouth-15","type":"paragraph","content":"The anterior 2/3 of the tongue is derived from the first arch, it is supplied by the lingual branch of the mandibular division of the trigeminal nerve for general sensation.\nwhile its supplied by the corda tympani of the facial nerve for taste sensation of the fungiform papillae and the anterior foliate papillae.\nThe mucosa of the posterior third of the tongue is supplied by the glossopharyngeal nerve of the third arch for both general and taste sensations.\nThe end of the tongue and the epiglottis are supplied by the vagus for both general and taste sensations\nThe muscles of the tongue (intrinsic and extrinsic) except the palatoglossal muscles are derived from the occipital myotomes and so, their motor supply is the hypoglossal nerve.\nThe palatoglossal muscles their motor supply is vagus nerve."},{"id":"mouth-16","type":"heading","title":"Abnormal development","content":""},{"id":"mouth-17","type":"clinical","title":"*Microglossia:","content":"small tongue in relation to the size of the oral cavity."},{"id":"mouth-18","type":"clinical","title":"*Macroglossia:","content":"big or large tongue it is sometimes seen at birth where the tongue slightly protrudes from the mouth.this condition soon corrects itself when the jaws grow at a more rapid rate to make the tongue appear normal.\nTrue macroglossia is usually seen in case of mongolism."},{"id":"mouth-19","type":"clinical","title":"*Bifid tongue:","content":"failure of merging between the two lateral lingual swellings."},{"id":"mouth-20","type":"clinical","title":"*Trifid tongue (median rhomboid glossitis):","content":"the presence of the tuberculum impar between the two lateral lingual swellings.\nSo, the tongue appear to be formed of three nodules."},{"id":"mouth-21","type":"clinical","title":"*tongue tie:","content":"it is the most common malformation of the tongue.the lingual frenum is short or attached anteriorly reaching to the tip of the tongue So, interferes with its mobility."},{"id":"mouth-22","type":"heading","title":"Development of the palate","content":""},{"id":"mouth-23","type":"paragraph","content":"The term palate is designated as the tissue which interposes between the oral and nasal cavities .It develops from two parts: the primary palate and the secondary palate."},{"id":"mouth-24","type":"subheading","title":"Development of the primary palate:","content":""},{"id":"mouth-25","type":"paragraph","content":"The primary palate is so named as it appears earlier than the secondary palate at the beginning of the 6th W.I.U.\nby merging of the two medial nasal processes. It is a wedge shaped tissue that represents only a small part of the hard palate anterior to the incisive papilla and supports the four maxillary incisors.\nThe primary palate is also called the median palatine process and the premaxillary bone.\nThe primary palate develop from the deep tissue of intermaxillary segment.\nIt develops during the deepening of the nasal pits to form the nasal sac.\nThe tissues beneath the nasal sac enlarge and grow inferiorly to form the primary palate."},{"id":"mouth-26","type":"paragraph","content":"It acquires the wedge shape appearance by the continuous growth of the maxillary processes in a medial direction .At the first the primary palate and the central part of the upper lip are formed as one unite.\nAt the 8th week I.U. the primary palate is separated from the upper lip by the formation of the vestibular lamina."},{"id":"mouth-27","type":"subheading","title":"Development of secondary palate","content":""},{"id":"mouth-28","type":"paragraph","content":"The secondary palate is that part of the palate posterior to the incisive fossa .It forms the remaining part of the hard palate and the soft palate.\nAt the end of the 6th week the lateral palatine process which form the secondary palate develop from the inferior-medial edges of the maxillary processes which bound the stomodeum.\nThe lateral palatine processes (shelves) grow first medially and downward or vertically on either side of the tongue."},{"id":"mouth-29","type":"heading","title":"Palatal shelf elevation:","content":""},{"id":"mouth-30","type":"paragraph","content":"From 8th to 9th weeks I.U. the lateral palatine shelves slide or roll over the tongue (shelf elevation).\nThe process of elevation occurs when the shelves have developed sufficient strength to slid over the tongue and acquire a horizontal position.\nIt is most probably the results of combined action of shelves and tongue movements\nShelf elevation occurs as rapidly as swallowing.\nThe most posterior end of the shelves is above the tongue because the base of the tongue is attached to the floor of the mouth.\nso, the palatal shelf elevation begins posteriorly possibly pressing the tongue downward to roll or to slid over it.\nAfter shelf elevation, the tongue is broadened to utilize the lateral space previously occupied by the shelves."},{"id":"mouth-31","type":"heading","title":"Fusion of the primary & secondary palates:","content":""},{"id":"mouth-32","type":"paragraph","content":"Palatine fusion begins during the 9th weeks I.U.\nand is completed by the 12th W.I.U. After the shelves are in in a horizontal position and attain their final growth, fusion occurs.\nPalatal fusion is the process of contact, loss of intervening epithelium and growth of connective tissue across the midline.\nFusion of palatine shelves occurs first just posterior to the primary palate .From this point of initial contact fusion proceeds in a Y shaped manner, anteriorly between the lateral palatine processes and the median palatine processes, and posteriorly between the two lateral palatine processes. Fusion of the lateral palatine processes also occurs with the nasal septum except posteriorly where the soft palate and uvula remain unattached."},{"id":"mouth-33","type":"paragraph","content":"Later the formed palate (anterior) is invaded by bone from the maxillary and palatal centers to form the hard palate, and in its posterior is invaded by muscles to form the soft palate.\nThe lines of fusion between the primary palate and the secondary palate is indicated in young skull by the incisive sutures, while the line of the union between the two palatine processes is indicated by the palatine raphe."},{"id":"mouth-34","type":"heading","title":"Developmental Anomalies","content":""},{"id":"mouth-35","type":"subheading","title":"Cleft palate","content":""},{"id":"mouth-36","type":"paragraph","content":"Cleft palate is less common than cleft lip.\nIt may be due to lack of complete growth or failure of fusion between the median and lateral palatine processes and the nasal septum, or may be due to initial fusion with interruption of growth at any point along its course .It may also be due to interference with the palatal shelves elevation.\ncleft of the palate is may be unilateral or bilateral and are classified into three groups:"},{"id":"mouth-37","type":"clinical","title":"1.Cleft of primary palate:","content":"clefts anterior to the incisive foramen.\nThese result from failure of the lateral palatine processes to meet and fuse with the median palatine processes or primary palate.since the four maxillary incisors develop in the median palatine segment, clefts of the primary palate are usually associated with missing or malformed teeth adjacent to the clefts such as lateral incisors and canines."},{"id":"mouth-38","type":"clinical","title":"2.Cleft of the secondary palate:","content":"cleft posterior to the incisive foramen.\nSince fusion of the secondary palate begins in the anterior region and progresses posteriorly, the degree of cleft may vary from the simplest form of a bifid uvula to a complete cleft involving both hard and soft palate.\nTherefore, clefts of the secondary palate are the result of partial or complete failure of the lateral palatine processes to meet, fuse with each other and with the nasal septum."},{"id":"mouth-39","type":"clinical","title":"3.Cleft of both primary and secondary palate (complete palatal cleft):","content":"This is a result of failure of growth or lack of fusion of the three palatine processes with each other and with the nasal septum."},{"id":"mouth-40","type":"paragraph","content":"Clefts of the palate create many problems. The severity of which vary according to the extent of the cleft.\nwhile a bifid uvula causes practically no discomfort and is usually accidentally discovered, a cleft of the soft palate causes varying degrees of speech difficulty and swallowing problems.\ncleft of the hard and soft palate usually produce a severe feeding problem as food may be aspirated into the lungs"},{"id":"mouth-41","type":"note","content":"(a) Bifid uvula\n(b) Unilateral cleft palate\n(c) Bilateral cleft palate"}],"giveReasons":[{"reason":"The tongue has dual nerve supply from different nerves for different functions","explanation":"Because the tongue develops from multiple branchial arches: the anterior 2/3 from the 1st arch (general sensation: lingual nerve V3; taste: chorda tympani VII) and the posterior 1/3 from the 3rd arch (both general and taste: glossopharyngeal nerve IX), each arch retaining its original nerve supply.","cat":"developmental"},{"reason":"The thyroid gland descends from the foramen cecum","explanation":"Because it originates as a proliferation of endodermal cells at the base of the tongue at the foramen cecum (between anterior 2/3 and posterior 1/3), then migrates inferiorly along the thyroglossal duct to its final position in the neck.","cat":"developmental"},{"reason":"Tongue tie (ankyloglossia) is the most common tongue malformation","explanation":"Because the lingual frenum is abnormally short or attached anteriorly reaching to the tip of the tongue, restricting the free movement of the tongue necessary for speech, swallowing, and breastfeeding.","cat":"clinical"},{"reason":"The palatal shelves elevate horizontally over the tongue at 8-9 weeks I.U.","explanation":"Because the tongue grows downward and forward, creating space above it, and the shelves develop sufficient inherent force to roll from their initial vertical position to a horizontal position. Shelf elevation begins posteriorly and proceeds anteriorly.","cat":"developmental"},{"reason":"Cleft palate is more severe functionally than cleft lip","explanation":"Because it causes serious feeding problems (food may be aspirated), severe speech difficulties, and problems with suckling due to inability to create negative pressure in the oral cavity.","cat":"clinical"},{"reason":"The palatine shelves fuse in a Y-shaped manner","explanation":"Because fusion begins at the incisive foramen and proceeds both anteriorly (to fuse with the primary palate) and posteriorly. This Y-shaped progression explains why clefts of the secondary palate can be partial (posterior) or complete.","cat":"developmental"}]},{"id":4,"slug":"tooth-development","title":"Tooth Development and Growth","subtitle":"د. عبدالعزيز عطية","category":"embryology","summary":"TOOTH DEVELOPMENT (ODONTOGENESIS). Tooth development start at 5th week of intrauterine life (W.I.U.L) and takes place in many morphologic stages. Morphological stages: Dental lamina, Bud stage, Cap stage, Bell stage (early and late).","keywords":["dental lamina","vestibular lamina","bud stage","cap stage","bell stage","enamel organ","dental papilla","dental sac","tooth follicle","tooth germ","inner dental epithelium","outer dental epithelium","stellate reticulum","stratum intermedium","enamel knot","enamel cord","cervical loop","ameloblast","odontoblast","HERS","epithelial rests of Malassez","epithelial rests of Serres","accessory root canal","intermediate cementum","enamel pearl"],"keyDefinitions":[{"term":"Primary Epithelial Bands","definition":"Formed when ectomesenchyme cells induce oral epithelium to proliferate and invaginate into mesenchyme during 6th W.I.U.L. By 7th week divides into dental lamina and vestibular lamina."},{"term":"Dental Lamina","definition":"Formed by proliferation of basal layer of oral epithelium in underlying ectomesenchyme. Neural crest cells → Induction → Proliferation of basal cell layer of oral epithelium → Dental lamina. Will give teeth."},{"term":"Vestibular Lamina","definition":"Arises from ectodermal thickening that proliferate into underlying ectomesenchyme later to dental lamina. Will form vestibule."},{"term":"Tooth Germ","definition":"Dental organ + dental papilla + dental sac together constitute the tooth germ."},{"term":"Enamel Organ (Dental Organ)","definition":"Bud-shaped round or ovoid epithelial structure. Labial cells of dental lamina proliferate to give 10 in each arch."},{"term":"Dental Papilla","definition":"Ectomesenchymal cells that condense beneath the tooth bud. Ability to produce dentin."},{"term":"Dental Sac (Tooth Follicle)","definition":"Ectomesenchymal condensation that encapsulates the dental organ. Outer circular fibres, inner vascular layer."},{"term":"Enamel Knot","definition":"Localized cellular condensation at the center of inner epithelium. Present in cap stage."},{"term":"Enamel Cord","definition":"Cellular strand running from the knot to outer epithelium. Present in cap stage."},{"term":"Stellate Reticulum","definition":"Several layers of star-shaped cells occupying central portion of enamel organ. Connected to each other, to outer, to inner epithelial by desmosomes."},{"term":"Stratum Intermedium","definition":"2-3 layers of flat cells between inner dental epithelium and stellate reticulum. Contains alkaline phosphatase enzyme essential for mineralization of enamel."},{"term":"Cervical Loop","definition":"Where inner and outer enamel epithelium meets together. Proliferates to form Hertwig's epithelial root sheath (HERS)."},{"term":"HERS (Hertwig's Epithelial Root Sheath)","definition":"Formed by horizontal then vertical proliferate of cervical loop. Functions: induce odontoblasts to form root dentin, mold shape of root."},{"term":"Epithelial Rests of Malassez","definition":"Remnants left after HERS loses its continuity by involving undifferentiated mesenchymal cells of dental sac."},{"term":"Epithelial Rests of Serres (Serres' Pearls)","definition":"Formed when mesenchymal invasion disintegrates dental lamina in late bell stage."},{"term":"Enamel Pearl","definition":"When part of ERSH fails to degenerate, cells differentiate into ameloblasts to produce enamel. Mainly happens at furcation areas. May prevent cementum formation leading to bare dentin."},{"term":"Accessory Root Canal","definition":"Connection between pulp & PDL other than apical foramen. Due to defective/early degeneration of ERSH, displaced blood vessels, or failure of fusion of tongue-like projection of epithelial diaphragm."},{"term":"Intermediate Cementum","definition":"Due to degeneration of ERSH after odontoblastic differentiation but before they lay down dentin."}],"importantPoints":["Tooth development starts at 5th week of intrauterine life (W.I.U.L)","During 6th W.I.U.L: ectomesenchyme induces oral epithelium → primary epithelial bands","By 7th week: primary epithelial bands divide into a) dental lamina (buccal, gives teeth) b) vestibular lamina (lingual, forms vestibule)","Bud stage: 10 buds per arch; dental organ + dental papilla + dental sac = tooth germ","Cap stage: outer dental epithelium (single layer cuboidal, convex), inner dental epithelium (single layer columnar, concave), stellate reticulum; enamel knot and enamel cord present","Early bell stage: stratum intermedium appears (contains alkaline phosphatase); lateral dental lamina carries deciduous tooth; successional lamina forms permanent successors; cervical loop present","Late bell stage: Serres' pearls formed; ameloblasts differentiate (reciprocal induction); stellate reticulum shrinks (space for enamel, nutrition); stratum intermedium retains alkaline phosphatase","Histophysiological stages: Initiation → Proliferation → Histodifferentiation → Morphodifferentiation → Apposition","Lack of initiation → anodontia; abnormally high initiation → supernumerary teeth","Morphodifferentiation: established by outlining future dentine enamel junction & cemento enamel junction; disturbance affects form & size of tooth","Root formation: starts when enamel and dentine reach future cervical line","HERS: horizontal proliferate → epithelial diaphragm; vertical proliferate → induces root dentin formation → degenerate → cementoblasts form cementum → leaves epithelial rests of Malassez","Multirooted teeth: epithelial diaphragm grows horizontally forming tongue-like projections (2 = double root, 3 = triple root)"],"histologicalFeatures":["Cap stage — Outer dental epithelium: single layer of cuboidal epithelial cells on outer convex surface","Cap stage — Inner dental epithelium: single layer of columnar epithelial cells on concave surface","Cap stage — Stellate reticulum: several layers of star-shaped cells connected by desmosomes; central portion","Cap stage — Cell free zone: area between dental papilla and dental organ","Early bell stage — Inner dental epithelium: cells elongate toward papilla, closing cell free zone; induce dental papilla cells → odontoblasts","Early bell stage — Stratum intermedium: 2-3 layers of flat cells; contains alkaline phosphatase essential for enamel mineralization","Late bell stage — Outer dental epithelium: develops microvilli and folds; sac forms capillary loops for nutrition (after first dentine layer cuts direct nutrition)","Late bell stage — Stellate reticulum: shrinks by loss of intercellular fluid → space for developing enamel; less distance between inner and outer epi for nutrition","Decalcified section (H&E) late bell stage shows: dental sac, outer dental epithelium, stellate reticulum, stratum intermedium, ameloblasts, odontoblasts, dental papilla, capillary loop, enamel matrix, dentin, predentin, cervical loop"],"clinicalNotes":["Enamel pearl and bare dentin: When part of ERSH fails to degenerate → cells differentiate to ameloblasts → produce enamel. Mainly at furcation areas. May remain covering dentin surface, preventing cementum formation → bare dentin.","Accessory root canal: Connection between pulp & PDL other than apical foramen due to: Defective formation of ERSH / Degenerated of ERSH before odontoblastic differentiation / Displaced B.V. / Failure of fusion of tongue like projection of E.D.","Intermediate cementum: Due to degenerate of the ERSH after odontoblastic differentiation but before they lay down dentin.","Anodontia: Lack of initiation may result in absence of one or more teeth.","Supernumerary teeth: Abnormally high initiation.","Disturbance in morphodifferentiation: affects form & size of tooth.","Incremental lines in all hard tissues: result of periods of activity & rest during apposition."],"flashcards":[{"question":"What are the morphological stages of tooth development?","answer":"Dental lamina.\nBud - stage.\nCap - stage.\nBell - stage (early and late)."},{"question":"What is the dental lamina and how does it form?","answer":"During 6th W.I.U.L, ectomesenchyme cells induce oral epithelium to proliferate and invaginate → primary epithelial bands.\nBy 7th week divides into:\na) buccally located dental lamina (will give teeth)\nb) lingually situated vestibular lamina (will form vestibule)\n\nNeural crest cells → Induction → Proliferation of basal cell layer of oral epithelium → Dental lamina"},{"question":"What is the tooth germ?","answer":"The dental organ + dental papilla + dental sac together constitute the tooth germ."},{"question":"What are the components of the cap stage enamel organ?","answer":"a) Outer dental (enamel) epithelium: single layer of cuboidal epithelial cells on outer convex surface.\nb) Inner dental (enamel) epithelium: single layer of columnar epithelial cells on concave surface.\nc) Stellate reticulum: several layers of star-shaped cells occupying central portion; connected by desmosomes.\n\nTwo structures in dental organ in cap stage:\ni) Enamel knot: localized cellular condensation at center of inner epi.\nii) Enamel cord: cellular strand running from knot to outer epi."},{"question":"What is stratum intermedium and why is it important?","answer":"Composed of 2-3 layers of flat cells between the inner dental epithelium and stellate reticulum.\nContains the enzyme alkaline phosphatase which is essential for mineralization of enamel."},{"question":"What happens in the early bell stage?","answer":"Dental lamina: main dental lamina breaks up by mesenchymal invasion into:\na) Lateral dental lamina carrying the deciduous tooth\nb) Dental lamina proper (Successional) forming permanent successors\n\nInner dental epithelium: cells elongate toward papilla, closing cell free zone; induce dental papilla cells → odontoblasts\nStratum intermedium: appears\nCervical loop: inner and outer enamel epithelium meets"},{"question":"What happens in the late bell stage?","answer":"Dental lamina: mesenchymal invasion disintegrates → epithelial rests of Serres (Serres' pearls)\nOuter dental epithelium: develops microvilli and folds; capillary loops form for nutrition\nInner dental epithelium: dental papilla induces IEE → ameloblasts → form enamel (reciprocal induction)\nStellate reticulum: shrinks by loss of intercellular fluid → 1. space for developing enamel 2. less distance for nutrition\nStratum intermedium: contains alkaline phosphatase for enamel mineralization"},{"question":"What are the histophysiological stages?","answer":"Initiation of Dental Lamina: D. Lamina & tooth bud. Lack = anodontia; excess = supernumerary teeth\nProliferation: active stage; regular change in size & proportion; D. lamina, bud, cap, early bell\nHistodifferentiation: stratum intermedium, odontoblasts, ameloblasts differentiated; early and advanced bell stage\nMorphodifferentiation: determined by differential growth; starts from early bell stage; disturbance affects form & size\nApposition: late bell stage; deposition of newly synthesized hard tooth structure; periods of activity & rest → incremental lines"},{"question":"Describe root formation steps.","answer":"(1) Root formation starts when enamel, dentine reaches future cervical line.\n(2) Cervical loop proliferates → Hertwig's epithelial root sheath (HERS).\n(3) Horizontal proliferate of cervical loop → epithelial diaphragm foramen {soft} primary closer to apical.\n(4) Cervical loop proliferates vertically:\na) IEE induces UM cells of dental papilla → odontoblasts → root dentin\nc) After first dentin layer: UMCs of dental sac → degeneration of inner, outer enamel epithelium → contact dentin → form cementoblasts → cementum secondary {hard}\nd) HERS loses continuity by involving UMCs of dental sac → leaves remnants: epithelial rests of Malassez\n(5) Epithelium molds shape of root."},{"question":"What are the clinical considerations related to HERS?","answer":"Enamel pearl and bare dentin: part of ERSH fails to degenerate → ameloblasts → enamel at furcation; may cause bare dentin.\nAccessory root canal: connection between pulp & PDL other than apical foramen — due to defective ERSH formation / degeneration before odontoblastic differentiation / displaced BV / failure of fusion of tongue-like projection.\nIntermediate cementum: degeneration of ERSH after odontoblastic differentiation but before dentin is laid down."}],"blocks":[{"id":"tooth-1","type":"heading","title":"TOOTH DEVELOPMENT AND GROWTH","content":"د. عبدالعزيز عطية\n1 OF 13"},{"id":"tooth-2","type":"heading","title":"TOOTH DEVELOPMENT (ODONTOGENESIS)","content":""},{"id":"tooth-3","type":"important","content":"■ Tooth development start at 5th week of intrauterine life (W.I.U.L) and takes place in many morphologic stages."},{"id":"tooth-4","type":"subheading","title":"Morphological stages of tooth development","content":""},{"id":"tooth-5","type":"paragraph","content":"The developmental stages is based on the shape of the developing tooth, which are:"},{"id":"tooth-6","type":"list","content":["Dental lamina.","Bud - stage.","Cap - stage.","Bell - stage (early and late)."]},{"id":"tooth-7","type":"heading","title":"(1) Dental lamina:","content":""},{"id":"tooth-8","type":"paragraph","content":"During 6th (W.I.U.L), in the region of the future alveolar processes, the underling ectomesenchyme cells induce the oral epithelium to proliferate and invaginate into the mesenchyme to form the primary epithelial bands.\nBy the 7th week the primary epithelial bands divides into two laminae:\na) a buccally located dental lamina(will give teeth)\nb) alingually situated vestibular lamina (will form vestibule)"},{"id":"tooth-9","type":"definition","title":"a) dental lamina","content":". dental lamina is formed by proliferation of the basal layer of the oral epithelium in the underlying ectomesenchyme.\n\nNeural crest cells -> Induction Proliferation of basal cell layer of oral epithelium → Dental lamina"},{"id":"tooth-10","type":"definition","title":"b)The vestibular lamina:","content":"The vestibular lamina arises from ectodermal thickening that proliferate into the underlying ectomesenchyme later to dental lamina"},{"id":"tooth-11","type":"heading","title":"(2) Bud stage:","content":""},{"id":"tooth-12","type":"paragraph","content":"labial cells of dental lamina proliferate to give bud- shaped round or ovoid epithelial structure called dental or enamel organ (10) in each arch.\nThe ectomesenchymal cells condense beneath the tooth bud to form dental papillae that encapsulating the dental organ is called dental sac (tooth follicle).\nThe dental organ, dental papilla and dental sac together constitute the tooth germ."},{"id":"tooth-13","type":"heading","title":"(3) Cap stage:","content":""},{"id":"tooth-14","type":"list","content":["Dental lamina:short and broad.",". The bud grows unequally to give concave free end to form cap shape."]},{"id":"tooth-15","type":"subheading","title":"Dental organ:","content":""},{"id":"tooth-16","type":"paragraph","content":"Basement membrane is continuous around it separating from the sac, papillae."},{"id":"tooth-17","type":"definition","title":"a) Outer dental(enamel) epithelial:","content":"Single layer of cuboidal epithelial cells.\nOn outer convex surface."},{"id":"tooth-18","type":"definition","title":"b) Inner dental(enamel) epithelial:","content":"Single layer of columnar epithelial cells.\nOn concave surface."},{"id":"tooth-19","type":"definition","title":"c) Stellate reticulum:","content":"several layers of star-shaped cells occupying the central portion.\nconnected to each other, to outer, to inner epithelial by desmosomes."},{"id":"tooth-20","type":"paragraph","content":"Two structure in dental organ in cap stage:"},{"id":"tooth-21","type":"definition","title":"i) Enamel knot:","content":". localized cellular condensation at the center of inner epi."},{"id":"tooth-22","type":"definition","title":"ii) Enamel cord:","content":"Cellular strand running from the knot to outer epi."},{"id":"tooth-23","type":"paragraph","content":"There is area of cell free zone between dental papilla and dental organ."},{"id":"tooth-24","type":"definition","title":"dental papilla:","content":"Ectomesenchymal condensation beneath the IEE, more cellular."},{"id":"tooth-25","type":"definition","title":"dental sac:","content":"Ectomesenchymal condensation around organ, papilla more fibrous."},{"id":"tooth-26","type":"heading","title":"(4) Bell stage:","content":""},{"id":"tooth-27","type":"paragraph","content":"The unequal growth continuous to give bell shape."},{"id":"tooth-28","type":"subheading","title":"The early Bell stage:","content":""},{"id":"tooth-29","type":"definition","title":"Dental lamina:","content":". The main dental lamina break up by mesenchymal invasion into:\na) Lateral dental lamina that that carrying the deciduous tooth.\nb)The dental lamina proper (Successional) forming the permanent successors."},{"id":"tooth-30","type":"subheading","title":"Enamel organ:","content":""},{"id":"tooth-31","type":"definition","title":"a) Outer dental epithelium:","content":"become low cuboidal."},{"id":"tooth-32","type":"definition","title":"b) Inner dental epithelium:","content":"These cells show elongate toward papilla and closing the cell free zone.\nThe cells of inner dental epithelial inducing cells of dental papilla to differentiate into odontoblasts."},{"id":"tooth-33","type":"definition","title":"c) Stellate reticulum:","content":"More intercellular fluid."},{"id":"tooth-34","type":"definition","title":"d) Stratum intermedium:","content":"It is composed of 2 - 3 layers of flat cells between the inner dental epithelium and stellate reticulum.\n⚫ contain the enzyme alkaline phosphatase which is essential for mineralization of enamel."},{"id":"tooth-35","type":"definition","title":"Dental papilla:","content":"• Ability to produce dentin."},{"id":"tooth-36","type":"definition","title":"Dental sac:","content":"• Outer circular fibres, inner vascular layer."},{"id":"tooth-37","type":"definition","title":"Cervical loop:","content":"The inner and outer enamel epithelium meets together."},{"id":"tooth-38","type":"subheading","title":"The Late Bell stage:","content":""},{"id":"tooth-39","type":"definition","title":"Dental lamina:","content":". mesenchymal invasion disintegrates dental lamina to give epithelial rests of Serres (Serres' pearls)."},{"id":"tooth-40","type":"paragraph","content":"Dental organ: The enamel organ shows an increase in size in the area apart from matrix deposition."},{"id":"tooth-41","type":"definition","title":"a) Outer dental epithelium:","content":"first layer of dentine formed cuts nutrition to dental organ through inner epithelial.\nOuter epithelial develop microvilli and folds on their outer surface to increasing surface area and sac form capillary loop for nutrition."},{"id":"tooth-42","type":"definition","title":"b) Inner dental epithelium:","content":"• Dental papilla induce inner enamel epithelial to become active cell and differentiate to ameloblast to form enamel(reciprocal induction)."},{"id":"tooth-43","type":"definition","title":"c) Stellate reticulum:","content":"• Shrinks by loss of intercellular fluid providing:\n1-space for developing enamel.\n2-less distance between inner, outer epi.\nFor nutrition."},{"id":"tooth-44","type":"definition","title":"d) Stratum intermedium:","content":"Contain alkaline phosphatase enzyme for the mineralization of the enamel."},{"id":"tooth-45","type":"heading","title":"A. Histolophysiological Stages","content":""},{"id":"tooth-46","type":"paragraph","content":"Except for initiation, there is an overlap off all stages but each tends to predominate in certain period."},{"id":"tooth-47","type":"definition","title":"Initiation of Dental Lamina","content":"D. Lamina & tooth bud is the representative of this stage.\nLack of initiation may result in absence of one or more teeth (anodotia).\nAbnormally high initiation result in formation of super numerary teeth or tooth."},{"id":"tooth-48","type":"definition","title":"Proliferation","content":"It's the active stage.\nProliferative growth cause regular change in size & proportion of the growing tooth.\nIt's found in D. lamina, bud, cap and early bell stages."},{"id":"tooth-49","type":"definition","title":"Histodifferentation","content":"Occurs when the stratum intermedium, odontoblasts and ameloblasts are differentiated.\nRepresented by the early and advanced bell stage."},{"id":"tooth-50","type":"definition","title":"Morphodifferentation","content":"Morphological pattern is determined by differential growth.\nStarts from early bell stage.\nEstablished by out lining the future dentine enamel junction & cemento enamel junction.\nDisturbance in this stage affect in the form & size of the tooth."},{"id":"tooth-51","type":"definition","title":"Apposition","content":"Present in late bell stage by deposition of newly synthesized hard tooth structure & their mineralization.\nPresence of periods of activity & rest result in formation of Incremental lines in all hard tissues."},{"id":"tooth-52","type":"heading","title":"Root formation","content":""},{"id":"tooth-53","type":"list","content":["(1) Root formation start when enamel, dentine reaches the future cervical line.","(2) The cervical loop proliferate to form Hertwig's epithelial root sheath (HERS).","(3) horizontal proliferate of cervical loop to form epithelial diaphragm foramen .{ soft }. primary closer to apical","(4) The cervical loop proliferate vertically:\na) inner enamel epithelium induce unmesnchym cells of dental papilla to differentiate into odontoblast to form root dentin.\nc) After first layer of dentin formation (UMCs) of dental sac degeneration of inner, outer enamel epithelium and contact to dentin and form cementoblast closer to apical foramen cementum secondary {hard }.\nd) (H.E.R.S) loss its continuity by involving UMCs of dental sac and leave remnant called {epithelial rest of malassez.","(5) function of epithelium mold shape of the root."]},{"id":"tooth-54","type":"subheading","title":"Multirooted teeth","content":""},{"id":"tooth-55","type":"paragraph","content":"Like single root.\nE. D. grows horizontally forming 2 tongue like projections double rooted teeth and 3 tongue like projections in triple rooted teeth.\nThese projections will grow towards each other unit dividing the wide apical foramen into 2 or 3 openings.\nOn the pulpal surface of the tongue like projection, dentin will be formed then the epithelium degenerate and cementum deposited on the outer surfaces of the united projection."},{"id":"tooth-56","type":"heading","title":"|- CLINICAL CONSIDERATION:","content":""},{"id":"tooth-57","type":"clinical","title":"Enamel pearl and bare dentin:","content":"When part of E. R. S. H. failure to degenerate so cells will diff. to Ameloblasts to produce enamel. It's mainly happens at the furcation areas sometime it will remain covering the dentin surface, thus preventing cementum to be formed leading to bare dentin."},{"id":"tooth-58","type":"clinical","title":"Accessory root canal","content":"It's connection between pulp & PDL other than apical foramen due to:-\nDeffective formation of E. R. S. H.\nDegenerated of E. R.S. H. before odontablastic differentiation\nDisplaced B. V.\nFailure of fusion of tongue like projection of E. D."},{"id":"tooth-59","type":"clinical","title":"Intermediate cementum","content":"Due to degenerate of the E.R.S.H. after odontoblastic differentiation but before they lay down dentin."}],"giveReasons":[{"reason":"Enamel cannot regenerate or repair itself after tooth eruption","explanation":"Because ameloblasts (the cells that produce enamel) are completely lost after enamel formation — they transform into the reduced dental epithelium and are shed during tooth eruption. With no remaining ameloblasts, enamel is incapable of self-repair; it is the only hard tissue without cells.","cat":"histological"},{"reason":"Dentin can be produced (deposited) throughout life","explanation":"Because odontoblasts remain viable in the dental pulp as long as the pulp is alive. They continuously deposit secondary dentin physiologically, and tertiary (reparative) dentin in response to injury. This is why the pulp chamber and root canals become progressively narrower with age.","cat":"histological"},{"reason":"The bell stage is considered the most important stage of tooth development","explanation":"Because it is during this stage that histodifferentiation (ameloblasts and odontoblasts differentiate) and morphodifferentiation (shape of the DEJ is determined, establishing final crown morphology) both occur. Disruptions during the bell stage cause the most significant tooth anomalies.","cat":"developmental"},{"reason":"HERS determines root shape and number","explanation":"Because HERS grows downward from the cervical loop, and its pattern of growth (straight for single root, with tongue-like projections for multiple roots) molds root shape. It also induces undifferentiated mesenchymal cells of the dental papilla to differentiate into odontoblasts that form root dentin.","cat":"developmental"},{"reason":"The dental lamina degenerates after tooth germ formation","explanation":"Because once the tooth germs are successfully established, the dental lamina is no longer needed. It undergoes mesenchymal invasion and programmed fragmentation. Its remnants (Rests of Serres) can later form dental cysts if stimulated.","cat":"developmental"},{"reason":"Incremental lines are seen in all dental hard tissues","explanation":"Because all hard tissues (enamel, dentin, cementum) are deposited rhythmically with alternating periods of activity and rest, creating periodic changes in composition and orientation of deposited matrix, visible as incremental lines.","cat":"histological"}]},{"id":5,"slug":"enamel","title":"Enamel","subtitle":"(1)","category":"hard-tissue","summary":"THE HARDEST CALCIFIED TISSUE IN HUMAN BODY, FORMING A PROTECTIVE COVERING OF ANATOMICAL CROWN. Enamel is a MINERALIZED EPITHELIAL TISSUE — TOTALLY ACELLULAR, AVASCULAR, NON SENSITIVE, HAS NO COLLAGEN FIBROUS. Its basic structural unit is the enamel rod (prism). Inorganic content: 96% by wt (hydroxyapatite). Two enamel proteins: AMELOGENIN (90%) and ENAMELIN (10%).","keywords":["enamel rod","prism","hydroxyapatite","ameloblast","Tomes process","enamel matrix","Hunter Schreger bands","incremental lines","neonatal line","DEJ","gnarled enamel","aprismatic enamel","keyhole model","amelogenin","enamelin","perikymata","enamel lamellae","enamel tufts","enamel spindle"],"keyDefinitions":[{"term":"Enamel","definition":"THE HARDEST CALCIFIED TISSUE IN HUMAN BODY, FORMING A PROTECTIVE COVERING OF ANATOMICAL CROWN."},{"term":"Aprismatic Enamel","definition":"Enamel lacking prismatic structure. Also called: structure less enamel, prismless enamel, rod less enamel. Found: inner 30 um adjacent to dentin {in all teeth} & outer 30 um in all deciduous & 70% of permanent."},{"term":"Gnarled Enamel","definition":"Complex arrangement of rods twisted around each other over cusps or incisal edges near dentin — this will strength."},{"term":"KEY HOLE MODEL (HEAD AND TAIL PATTERN)","definition":"IN CROSS SECTION APPEARANCE OF THE HUMAN ENAMEL PRISM AND INTERPRISMATIC SUBSTANCE IS SIMILAR TO THE KEY HOLE. E.PRISM (ROD) HEAD (Directed Occlusaly); INTER PRISMATIC SUBSTANCETAIL (POINTED CERVICALLY)."},{"term":"AMELOGENIN","definition":"SECRETARY STAGE: CONSTITUTES ABOUT 90% OF E.Protein. AFTER MATURATION: CONSTITUTES ABOUT 50% REMOVED SELECTIVELY WITH PROGRESSIVE MINERALIZATION. MOLECULAR WEIGHT: 22-30 KILODALTONS (KDA). RICE IN: PROLINE-GLUTAMIC ACID - HISTIDINE - LEUCIN."},{"term":"ENAMELIN","definition":"10% at secretary stage. 50% after maturation. MOLECULAR WEIGHT: 48-70 KDA. RICH IN: PROLINE - GLUTAMIC ACID - ALANINE-SERINE - ASPAETIC ACID."},{"term":"Cross Striations","definition":"Short increment lines. Cause: rhythmic human enamel deposition (rate about 4um daily); alternating constrictions & expansions of rod; or structural interrelation modification between groups of rods."},{"term":"Brown Stria of Retzius (Inc. lines of Retzius)","definition":"Lines indicating successive rhythmic (or daily) apposition of enamel layers during formation of crown. Cause: may be due to periodic bending of E. rods; variation in structure & mineralization related to daily increment."},{"term":"Neonatal Line","definition":"One accentuated inc. line separates prenatal E.(formed before birth) from postnatal E. (formed after birth). Present in all of deciduous teeth & only per 1st molar. Cause: abrupt change in nutrition environment at birth. N.B: prenatal E is more homogenous than postnatal E."},{"term":"Hunter Schreger Bands","definition":"Optical phenomenon caused by changes in prism direction, seen most clearly in longitudinal ground section viewed by oblique reflected light. Alternating dark & Light bands in inner 4/5 of enamel. Originate near DEJ (after the inner 30 um aprismatic E). Do not reach outer surface of Enamel."},{"term":"Enamel Tufts","definition":"Hypomineralized E. rode & inter prismatic substance. Contain more concentration of E.Protein than the rest of E. Radiating from DEJ to enamel in different directions, for about 1/5 to 1/3 of enamel thickness. Give impression of tuft of grass."},{"term":"Enamel Spindle","definition":"Before E. formation, some newly formed odontoblastic processes pushed between ameloblasts. When enamel formation begins the processes become trapped, forming E. Spindle (UNMINERALIZED) with rounded End. Do not follow direction of rods."},{"term":"DEJ (Dentinoenamel Junction)","definition":"Scalloped line between E & D (in L.S & T.S). Convexities towards Dentin. By E.M. the DEJ is seen as series of ridges. Leads to increase in Surface area & increase in adhesion between E&D."},{"term":"Enamel Lamellae","definition":"Thin organic bands leaf like structures. Extend from E.surface toward DEJ (end in E or penetrate Dentin). Develop in planes of tension. Type A: hypocalcified rod segment. Type B: cells of reduced epithelium / connective tissue. Type C: organic matter from saliva (after eruption, most common)."},{"term":"Perikymata","definition":"External manifestation of brown stria of Retzius. Wavy grooves run in linear horizontal plane across the face of crown, parallel to cervical line. More concentrated near the cementoenamel junction (CEJ)."},{"term":"1ry Enamel Cuticle (Nasmyths Membrane)","definition":"Delicate organic membrane covering the newly erupted teeth. It is the last product of Ameloblasts. Organically attached to the prisms & inter prismatic Substance. Thickness: 0.2 microns."}],"importantPoints":["THE HARDEST CALCIFIED TISSUE IN HUMAN BODY","UNIQUE: Mineralized Epithelial Tissue (N.B: bone, dentin & cementum are mineralized connective tissue)","TOTALLY ACELLULAR, AVASCULAR, NON SENSITIVE, HAS NO COLLAGEN FIBROUS","Inorganic substances: 96% by wt (main: hydroxyapatite crystals; minor: carbonate & magnesium increases solubility, fluoride zink &lead decreases solubility of ENAMEL crystals)","Water: 2-3%; Organic substances: 1-2% (TWO TYPES: AMELOGENIN 90% & ENAMELIN 10%)","Rod diameter: 4 um near dentin, 8 um at the surface (to compensate for increased surface area)","Number of rods: 5 million (lower incisors) to 12 million (upper 1st molar)","Neonatal line: present in ALL deciduous teeth & ONLY permanent 1st molar","Perikymata: more concentrated near CEJ; worn off by attrition and abrasion","in cervical Enamel -----straight course; over cusps or I. edges near dentin: GNARLED ENAMEL","rod is longer than thickness of E because of oblique direction & wavy course","Enamel Protein: is generally AMORPHOUS GEL with an ability to flow under pressure & Occupies all spaces between crystals"],"histologicalFeatures":["Enamel rod/prism: extends full thickness of enamel except inner 30um (all teeth) & outer 30um/70um aprismatic zones","Cross section under L/M: hexagonal, round or oval; in human: fish scales appearance","KEY HOLE MODEL: head (directed occlusally), tail (pointed cervically) — interprismatic substance minimum or even absent in human","PRISM SHEATH: contains more enamel protein because crystals are not tightly packed","Ultrastructure: key hole/paddle shaped prisms; 9µm length, 5µm breadth","Hunter Schreger Bands: alternating dark & Light bands; in inner 4/5; originate near DEJ; do not reach outer surface","Enamel tufts: radiating from DEJ, 1/5 to 1/3 of enamel thickness; better seen in Transverse Sections & rare in Longitudinal S.","Enamel spindles: at DEJ area; do not follow direction of rods; seen equally in T.S & L.S","DEJ: scalloped; convexities towards Dentin; series of ridges by E.M.","Enamel lamellae: thin, leaf-like; extend from surface toward DEJ; Types A, B, C"],"clinicalNotes":["Enamel is a non vital tissue & can not regenerate","Attrition: physiological wearing away of tooth hard substance during function. Site: mainly on occlusal and incisal surfaces; may be on proximal surfaces. men exhibit more severe attrition then woman (due to increase in masticatory force). permanent & deciduous but severe attrition not seen in deciduous due to their short life span","color changes of tooth: Teeth may become darker due to: deepening of dentin color seen through the thinning translucent enamel; addition of organic material from environment to enamel surface","Alteration in chemical composition: After eruption: ionic exchange between enamel & saliva....increase of certain elements (e.g. Fluorine)in superficial layer by age......increase in inorganic content to 98% (2ry maturation)","permeability: Enamel is semipermeable (allow ion exchange when crystals acquire ions); decrease or even disappearance of permeability from The outer surface; permeability from dentin may remain","Type C lamellae: after Eruption (most common); organic matter from saliva; may extend to Dentin","Perikymata & enamel rod ends: worn off from surfaces exposed to mastication (by attrition) & tooth brushing (by abrasion); may remain in protected areas (gingival sulcus, pit& fissure depth, around contact areas)"],"flashcards":[{"question":"What are the UNIQUE properties of enamel?","answer":"1-Mineralized Epithelial Tissue\n2-Totally Acellular.\n3-Avascular.\n4-Non Sensitive.\n5-Has No Collagen Fibrous\n\nN.B: bone, dentin & cementum are mineralized connective tissue."},{"question":"What are the PHYSICAL PROPERTIES of enamel?","answer":"1-EXTREMELY HARD: due to high inorganic content & crystalline arrangement; in permanent harder than in deciduous; harder in the surface & hardness decreases toward the DEJ.\n2-BRITTLE: But dentin is more resilient (maintains E integrity).\n3-SEMI PERMEABLE: Permits complete or partial passage of certain molecules.\n4-VARIABLE THICKNESS: maximum on cusps of (premolar & molar); minimum at cervical margin(almost knife edge).\n5-TRANSLUCENT: varies in color from light yellow to grayish white; thick Enamel: covers dentin---grayish white color; thin Enamel: dentin is seen through E---light yellow color."},{"question":"What are the TWO TYPES OF ENAMEL PROTEINS?","answer":"AMELOGENIN:\n- SECRETARY STAGE: CONSTITUTES ABOUT 90% OF E.Protein\n- AFTER MATURATION: CONSTITUTES ABOUT 50% REMOVED SELECTIVELY WITH PROGRESSIVE MINERALIZATION\n- MOLECULAR WEIGHT: 22-30 KILODALTONS (KDA)\n- RICE IN: PROLINE-GLUTAMIC ACID - HISTIDINE - LEUCIN\n\nENAMELIN:\n- 10% (secretary stage)\n- 50% (after maturation)\n- MOLECULAR WEIGHT: 48-70 KDA\n- RICH IN: PROLINE - GLUTAMIC ACID - ALANINE-SERINE - ASPAETIC ACID"},{"question":"What is GNARLED ENAMEL and where is it found?","answer":"over cusps or I. edges near dentin rods appear twisted around each other in a complex arrangement known as (GNARLED ENAMEL) this will strength."},{"question":"Describe the KEY HOLE MODEL of enamel structure.","answer":"IN CROSS SECTION APPEARANCE OF THE HUMAN ENAMEL PRISM AND INTERPRISMATIC SUBSTANCE IS SIMILAR TO THE KEY HOLE.\n\nE.PRISM (ROD)\nHEAD (Directed Occlusaly)\n\nINTER PRISMATIC SUBSTANCETAIL\n(POINTED CERVICALLY)"},{"question":"What is the Neonatal Line?","answer":"Def: one accentuated inc.line separates prenatal E.(formed before birth) from postnatal E. (formed after birth).\nN.B: prenatal.E is more homogenous than postnatal.E\n*Present in all of deciduous teeth & only per 1st molar\nCause: abrupt change in nutrition environment at birth."},{"question":"What are Hunter Schreger Bands?","answer":"Definition:\nOptical phenomenon caused by changes in prism direction, seen most clearly in longitudinal ground section viewed by oblique reflected light.\nCause: It may be due to:\n1-Zones of different permeability.\n2-Variation in enamel calcification.\n\nShape & site:\n1-Vary in width.\n2-Alternating dark & Light bands.\n3-In inner 4/5 of enamel it originate near DEJ (after the inner 30 um aprismatic E).\n4-Do not reach outer surface of Enamel."},{"question":"What are the THREE TYPES of Enamel Lamellae?","answer":"Type (A) lamella:\n*Time: before Eruption during E. mineralization.\n*Cause: Rode cross moderate tension.\n*Content: Hypocalcified rode segment.\n*Extent: Enamel only(do not extend Dentin).\n\nType (B) lamella:\n*Time: before Eruption.\n*Cause: Severe tension.\n*Content: 1-Cells of reduced Epithelium fill the crack. 2-Connective tissue (D.sac) invades crack in enamel.\nIn this case: cementum may be formed. or enamel may be resorbed.\n*Extent: may extent do Dentin according to severity of crack.\n\nType (C) lamella:\n*Time: after Eruption (most common).\n*Cause: moderate or severe tension.\n*Content: organic matter from saliva.\n*Extent: may extend to Dentin."},{"question":"What are the SIX STAGES of the Life Cycle of Ameloblast?","answer":"1-Morphogenic stage: inner D.epith. determines shape (morphology) of DEJ of the crown. Cell: columnar; Golgi&centrioles at proximal end(facing S.I).\n\n2-Organizing Stage: inner D.epith contacts UMCs of dental papilla → induce them to differentiate into ODONTOBLASTS. Cell: Tall columnar; reversal in polarity — Golgi & Centrioles migrate to distal end (near dentin); Nucleus & Mito migrate proximal.\n\n3-Scretory Stage: dentin contacts inner D.epith → induces to differentiate into AMELOBLAST → secretion of ENAMEL MATRIX. Cell: Tall columnar/highly polarized; develops TOMES-PROCESS (short conical projection; contains secretory granules only).\n\n4-Maturative Stage: matrix deposition completed → new function is E.maturation. Cell: decr in organelles; ruffle border; near completion: secretes 1ry E.cuticle & forms hemidesmosomes.\n\n5-Protective Stage: ameloblasts loose regularity → become cuboidal → called (reduced dental epithelium). Function: protects enamel; promoting tooth eruption; formation of attachment epithelium.\n\n6- Desmolytic Stage: RDE proliferates &secretes desmolytic enzymes → induce atrophy &destruction of connective tissue separating RDE from oral epithelium."},{"question":"What are the TYPES OF ENAMEL?","answer":"1-According to % of maturation (inorganic content):\na-enamel matrix (25-30% inorganic content)\nb-fully matured enamel (96% inorganic content)\nc-2ry matured enamel (98% inorganic content)\n\n2-According to prism pattern:\na-prismatic enamel.\nb-prism less enamel.\nc-gnarled enamel.\n\n3-According to time of formation:\na-prenatal.\nb-postnatal.\n\n4-Enamel pearl."},{"question":"What is PERIKYMATA?","answer":"*Def: External manifestation of brown stria of Retzius.\n*Site & Shape: Wavy grooves run in linear horizontal plane across the face of crown & they are parallel to cervical line.\n*N.B: more concentrated near the cementoenamel junction (CEJ).\n*Fate: gradually worn off:\n1-from surfaces exposed to mastication (by attrition).\n2-from surfaces exposed to tooth brushing (by abrasion).\n*It may remain in the protected areas:\n1-gingival sulcus. 2-pit& fissure depth. 3-around contact areas."}],"blocks":[{"id":"en-1","type":"heading","title":"ENAMEL(1)","content":""},{"id":"en-2","type":"subheading","title":"INTRODUCTION","content":""},{"id":"en-3","type":"definition","title":"DEFFENITION","content":"THE HARDEST CALCIFIED TISSUE IN HUMAN BODY, FORMING A PROTECTIVE COVERING OF ANATOMICAL CROWN."},{"id":"en-4","type":"important","title":"UENIQU","content":"1-Mineralized Epithelial Tissue.\n2-Totally Acellular.\n3-Avascular.\n4-Non Sensitive.\n5-Has No Collagen Fibrous\n\nN.B: bone, dentin & cementum are mineralized connective tissue."},{"id":"en-5","type":"heading","title":"PHYSICAL PROPERTIES","content":""},{"id":"en-6","type":"list","content":["1-EXTREMELY HARD.","2-BRITTLE.","3-SEMI PERMEABLE.","4-VARIABLE THICKNESS.","5-TRANSLUCENT."]},{"id":"en-7","type":"subheading","title":"1-Extremely Hard:","content":""},{"id":"en-8","type":"list","content":["A-due to: high inorganic content & crystalline arrangement.","B-in permanent harder than in deciduous.","C-harder in the surface & hardness decreases toward the DEJ."]},{"id":"en-9","type":"subheading","title":"2-BRITTLE:","content":""},{"id":"en-10","type":"paragraph","content":"But dentin is more resilient (maintains E integrity)"},{"id":"en-11","type":"subheading","title":"3-SEMI PERMEABLE:","content":""},{"id":"en-12","type":"paragraph","content":"Permits complete or partial passage of certain molecules."},{"id":"en-13","type":"subheading","title":"4-VARIABLE THICKNESS:","content":""},{"id":"en-14","type":"list","content":["A-maximum: on cusps of (premolar & molar).","B-minimum: at cervical margin(almost knife edge)."]},{"id":"en-15","type":"subheading","title":"5-TRANSLUCENT:","content":""},{"id":"en-16","type":"list","content":["*varies in color from light yellow to grayish white.","*this variation depends on thickness of Enamel (dentin is yellow).","*thick Enamel: covers dentin---grayish white color.","*thin Enamel: dentin is seen through E---light yellow color."]},{"id":"en-17","type":"heading","title":"CHEMICAL PROPERTIES","content":""},{"id":"en-18","type":"list","content":["A) Inorganic substances (96% by wt): 1-Main. 2- Minor.","B) Water (2-3%):","C) Organic substances (1-2%): 1-Nature NOT Completely Known. 2- Protein is NOT Fibrous Collagen:"]},{"id":"en-19","type":"subheading","title":"A-Inorganic substances:","content":""},{"id":"en-20","type":"list","content":["1-main: *calcium &phosphate in the form of hydroxyapatite crystals.","2-minor: *carbonate &magnesium increases solubility of ENAMMEL crystals.\n*fluoride, zink &lead decreases solubility of ENAMEL crystals."]},{"id":"en-21","type":"subheading","title":"C-Organic substances:","content":""},{"id":"en-22","type":"paragraph","content":"*The following investigations give an idea about nature of E.proteins:\n\n1-Histological: E. matrix during development resemble KERATINIZING epidermis.\n2-Chemical:analysis of mature E.matrix indicates that amino acid composition is not closely related to keratin.\n3-X-ray:protein is typical to a group of proteins called Cross-B-Proteins & the presence of glycoprotein & mucopolysaccharides."},{"id":"en-23","type":"important","title":"TWO TYPES OF E.PROTEINS","content":"AMELOGENIN:\n- SECRETARY STAGE: CONSTITUTES ABOUT 90% OF E.Protein\n- AFTER MATURATION: CONSTITUTES ABOUT 50% REMOVED SELECTIVELY WITH PROGRESSIVE MINERALIZATION.\n- MOLECULAR WEIGHT: 22-30 KILODALTONS (KDA).\n- RICE IN: PROLINE-GLUTAMIC ACID - HISTIDINE - LEUCIN.\n\nENAMELIN:\n- 10% (secretary stage)\n- 50% (after maturation)\n- MOLECULAR WEIGHT: 48-70 KDA\n- RICH IN: PROLINE - GLUTAMIC ACID - ALANINE-SERINE - ASPAETIC ACID."},{"id":"en-24","type":"note","title":"Note","content":"***Enamel Protein: is generally AMORPHOUS GEL with an ability to flow under pressure & Occupies all spaces between crystals"},{"id":"en-25","type":"heading","title":"Structure Unit","content":""},{"id":"en-26","type":"paragraph","content":"*Enamel is essentially a tightly packed mass of Crystals & most of its structural features are the result of highly organized pattern of crystal orientation.\n*Enamel is retained in ground sections & can be studied With light microscope (L/M) BY transmitted light."},{"id":"en-27","type":"subheading","title":"I-ENAMEL ROD or ENAMEL PRISM","content":"a-Extending b-Cross Section. c-Number. d-Diameter average. e-Direction. f- Course. g-Length."},{"id":"en-28","type":"subheading","title":"1-EXTENDING:","content":""},{"id":"en-29","type":"paragraph","content":"the full thickness of enamel except:\n*Inner 30 um adjacent to dentin {in all teeth}\n*outer 30 um in all deciduous & 70% of permanent.\n\n*lack the prismatic structure is called:\n-Aprismatic enamel\n-structure less enamel.\n-prismless enamel.\n-rod less enamel."},{"id":"en-30","type":"subheading","title":"2-Cross section:","content":""},{"id":"en-31","type":"paragraph","content":"Under L/M\n*Hexagonal, round or oval.\n*In human----fish scales.\nN.B: E rods have clear crystalline appearance permitting light to pass through them."},{"id":"en-32","type":"subheading","title":"3-Number:","content":""},{"id":"en-33","type":"list","content":["5 million (lower incisors).","12 million(upper 1st molar)."]},{"id":"en-34","type":"subheading","title":"4-Diameter average:","content":""},{"id":"en-35","type":"paragraph","content":"*4 um near dentin.\n*8 um at the surface.\nTo compensate for increased surface area of Enamel surface more than at DEJ.\nN.B: there are alternating expansions & constrictions in the rod in some regions."},{"id":"en-36","type":"subheading","title":"5-Direction:","content":""},{"id":"en-37","type":"list","content":["1-Rows arranged circumferentially around long axis of the tooth.","2-Prisms in each row run in a direction generally perpendicular to dentin surface."]},{"id":"en-38","type":"paragraph","content":"A-In deciduous :\n*cervical & middle E:almost horizontal.\n*then change gradually to an oblique direction.\n*in incisal ridge & cusp tip become vertical.\n\nB- in permanent: similar to deciduous except that:\n*in cervical E: tilted apically."},{"id":"en-39","type":"subheading","title":"6-Course:","content":""},{"id":"en-40","type":"paragraph","content":"*undulating course bending RT& LT transverse plane &UP& DOWN in vertical plane.\n\nin cervical Enamel -----straight course.\n\nover cusps or I. edges near dentin rods appear twisted around each other in a complex arrangement known as (GNARLED ENAMEL) this will strength."},{"id":"en-41","type":"subheading","title":"7-Length:","content":""},{"id":"en-42","type":"paragraph","content":"rod is longer than thickness of E because of oblique direction & wavy course."},{"id":"en-43","type":"important","title":"KEY HOLE MODEL OF ENAMEL STRUCTURE: (HEAD AND TAIL PATTERN)","content":"IN CROSS SECTION APPEARANCE OF THE HUMAN ENAMEL PRISM AND INTERPRISMATIC SUBSTANCE IS SIMILAR TO THE KEY HOLE.\n\nE.PRISM (ROD)\nHEAD (Directed Occlusaly)\n\nINTER PRISMATIC SUBSTANCETAIL\n(POINTED CERVICALLY)"},{"id":"en-44","type":"subheading","title":"II-INTER PRISMATIC SUBSTANCE (REGION):","content":""},{"id":"en-45","type":"paragraph","content":"SEPARATES E.rods.\n\nIN HUMAN IT IS MINIMUM OR EVEN ABSENT IN CERTAIN AREAS."},{"id":"en-46","type":"subheading","title":"III- PRISM SHEATH:","content":""},{"id":"en-47","type":"paragraph","content":"Contains more enamel protein because crystals are not tightly packed."},{"id":"en-48","type":"subheading","title":"ULTRASTRUCTURE/ ELECRONMICROSCOPY","content":""},{"id":"en-49","type":"list","content":["Shape of rod: Key hole/Paddle shaped prisms","Measurement: 9 µm - length; 5 µm - breadth","\"Bodies\" of rods near occlusal/incisal surface and \"Tails\" point cervically."]},{"id":"en-50","type":"heading","title":"STRUCTURES","content":""},{"id":"en-51","type":"list","content":["1-Incremental lines: a- cross striations (short increment). b-brown striations of Retzius. c-neonatal line.","2-Hunter schreger bands.","3-Enamel tufts.","4-Enamel spindle.","5-DEJ","6- Enamel lamellae."]},{"id":"en-52","type":"subheading","title":"1-Incremental Lines","content":""},{"id":"en-53","type":"subheading","title":"A-cross striations (short increment)","content":""},{"id":"en-54","type":"paragraph","content":"Cause:\na) rhythmic human enamel deposition (rate about 4um daily).\nb) By electron microscope revealed that it may be result from alternating constrictions & expansions of rod in some regions.\nc) Or it is often the result of structural interrelation modification between groups of rods."},{"id":"en-55","type":"subheading","title":"B) Brown stria of Retzius ( Inc. lines of Retzius):","content":""},{"id":"en-56","type":"paragraph","content":"Def: lines indicating successive rhythmic (or daily) apposition of enamel layers during formation of crown.\nCause: structural bases for Retzius lines production is still uncertain but may be due to :\na) periodic bending of E. rods.\nb) variation in structure & mineralization related to daily increment."},{"id":"en-57","type":"subheading","title":"C) neonatal line:","content":""},{"id":"en-58","type":"important","title":"Neonatal Line","content":"Def: one accentuated inc.line separates prenatal E.(formed before birth) from postnatal E. (formed after birth).\nN.B: prenatal.E is more homogenous than postnatal.E\n*Present in all of deciduous teeth & only per 1st molar\nCause: abrupt change in nutrition environment at birth."},{"id":"en-59","type":"subheading","title":"2- Hunter Schreger Bands:","content":""},{"id":"en-60","type":"paragraph","content":"Definition:\nOptical phenomenon caused by changes in prism direction, seen most clearly in longitudinal ground section viewed by oblique reflected light.\nCause: It may be due to:\n1-Zones of different permeability.\n2-Variation in enamel calcification."},{"id":"en-61","type":"paragraph","content":"Shape & site:\n1-Vary in width.\n2-Alternating dark & Light bands.\n3-In inner 4/5 of enamel it originate near DEJ (after the inner 30 um aprismatic E).\n4-Do not reach outer surface of Enamel."},{"id":"en-62","type":"subheading","title":"3- Enamel Tufts:","content":""},{"id":"en-63","type":"paragraph","content":"Cause, Structure & Shape:\n1- Hypomineralized E. rode & inter prismatic substance.\n2- Contain more concentration of E.Protein than the rest of E.\n3-Radiating from DEJ to enamel in different directions.\n4-For about 1/5 to 1/3 of enamel thickness.\n5-To give an impression of Tuft of grass.\nN.B: Extend in the direction of long axis of the crown so better seen in Transverse Sections & rare in Longitudinal S."},{"id":"en-64","type":"subheading","title":"4- Enamel Spindle:","content":""},{"id":"en-65","type":"paragraph","content":"Cause, Structure & Shape:\n1-Before E. formation, some newly formed odontoblastic processes pushed between ameloblasts.\n2-When enamel formation begins the processes become trapped.\n3-Forming E. Spindle (UNMINERALIZED) with rounded End.\nN.B:* Do not follow direction of rods.\n*Seen equally in T.S &L.S at area of DEJ."},{"id":"en-66","type":"subheading","title":"5-DEJ:","content":""},{"id":"en-67","type":"definition","title":"DEJ (Dentinoenamel Junction)","content":"*Scalloped line between E & D(in L.S&T.S).\n*Convexities towards Dentin.\n*By E.M. the DEJ is seen as series of ridges.\n*Leads to increase in Surface area & increase in adhesion between E&D\n\nScalloped suture-The surface of the dentin at DEJ is pitted, in shallow depression of dentin, fit rounded projection of enamel.\nIt appears scalloped due to the mixing of crystals of dentin and enamel with each other."},{"id":"en-68","type":"subheading","title":"6- Enamel lamellae:","content":""},{"id":"en-69","type":"paragraph","content":"Definition & Shape:\n*Thin organic bands leaf like structures.\n*Extend from E.surface toward DEJ (end in E or penetrate Dentin)\nCause:\nDevelop in planes of tension.\nWhere rods cross this plane.\nN.B: Confused with artificial cracks caused by grinding.\nWe can differentiate by careful decalcification:\n1-Artificial crack & type (C) lamellae will disappear.\n2-Type A & B (True lamellae) will persist & will be stained."},{"id":"en-70","type":"important","title":"*TYPES OF LAMELLA:","content":"Type (A) lamella:\n*Time: before Eruption during E. mineralization.\n*Cause: Rode cross moderate tension.\n*Content: Hypocalcified rode segment.\n*Extent: Enamel only(do not extend Dentin).\n\nType (B) lamella:\n*Time: before Eruption.\n*Cause: Severe tension.\n*Content: 1-Cells of reduced Epithelium fill the crack.\n2-Connective tissue (D.sac) invades crack in enamel.\nIn this case: cementum may be formed. or enamel may be resorbed.\n*Extent: may extent do Dentin according to severity of crack.\n\nType (C) lamella:\n*Time: after Eruption (most common).\n*Cause: moderate or severe tension.\n*Content: organic matter from saliva.\n*Extent: may extend to Dentin."},{"id":"en-71","type":"heading","title":"SURFACE STRUCTURES OF ENAMEL","content":""},{"id":"en-72","type":"list","content":["1-PERIKYMΑΤΑ.","2-ENAMEL ROD ENDS.","3-CRACKS.","4-1ry ENAMEL CUTICLE.","5-SALIVERY PELLICLE.","6- AFIBRILLAR CEMENTUM."]},{"id":"en-73","type":"subheading","title":"1-Perikymata:","content":""},{"id":"en-74","type":"paragraph","content":"*Def: External manifestation of brown stria of Retzius.\n*Site & Shape: Wavy grooves run in linear horizontal plane across the face of crown & they are parallel to cervical line.\n*N.B: more concentrated near the cementoenamel junction (CEJ).\n*Fate: *It gradually worn off:\n1-from surfaces exposed to mastication (by attrition).\n2-from surfaces exposed to tooth brushing (by abrasion).\n*It may remain in the protected areas:\n1-gingival sulcus. 2-pit& fissure depth. 3-around contact areas."},{"id":"en-75","type":"subheading","title":"2-Enamel Rod Ends:","content":""},{"id":"en-76","type":"paragraph","content":"*Def: concave, vary in depth & shape.\n*Site & Shape: Shallower in cervical region deeper in incisal & occ. region.\n*Fate: as Perikymata."},{"id":"en-77","type":"subheading","title":"3-Cracks:","content":""},{"id":"en-78","type":"paragraph","content":"*Def: Outer edges of lamellae.\n*Shape: Jagged lines extend for varying distances along the surface in different regions."},{"id":"en-79","type":"subheading","title":"4- 1ry enamel cuticle (Nasmyths membrane):","content":""},{"id":"en-80","type":"definition","title":"1ry Enamel Cuticle (Nasmyths Membrane)","content":"Def. & Structure:\n1- delicate organic membrane covering the neuely erupted teeth.\n2- It is the last product of Ameloblasts.\n3- organically attach to the prisms & inter prismatic Substance.\nThickness: 0.2 microns.\nFate: as Perikymata."},{"id":"en-81","type":"subheading","title":"5-Afibrillar Cementum:","content":""},{"id":"en-82","type":"paragraph","content":"In 60% of cases, the cervical E.covered by Afibrillar C.\n\n60% overlap\n30% meet\n10% gap"},{"id":"en-83","type":"subheading","title":"6-Salivery Pellicle & Dental Plaque:","content":""},{"id":"en-84","type":"paragraph","content":"1-pellicle:\nDef: Organic deposit on the tooth surface.\nFate:\n*Removed when teeth are mechanically polished. then reappears shortly after polishing.\n*within 1 or 2 days after pellicle formation it is colonized by micro organisms, to form a bacterial plaque.\n\n2- Bacterial plaque:\n*especially in protected areas (difficult in brushing)."},{"id":"en-85","type":"heading","title":"AMELOGENSESIS","content":""},{"id":"en-86","type":"paragraph","content":"Ameloblasts begin deposition after few Microns of dentin have been deposited."},{"id":"en-87","type":"subheading","title":"LIFE CYCLE OF AMELOBLAST","content":""},{"id":"en-88","type":"paragraph","content":"In the early development the inner enamel epithelium is formed of single layer of cuboidal cells supported by a basement membrane separating it from dental papilla.\nThese cells differentiate to active secretory ameloblasts\nThey exhibit morphological changes as they differentiate they Pass through the following functional stages:"},{"id":"en-89","type":"subheading","title":"1-Morphogenic stage :","content":""},{"id":"en-90","type":"paragraph","content":"The inner D.epith. Interact with the adjacent ecto- mesenchymal cells determining the shape (morphology) of the DEJ of the crown.\nThe cell shape:\n1- Columnar.\n2-Nucleus(large /oval) (almost fills cell body).\n3-cytoplasm.\n4-Golgi&centrioles are in proximal end(facing S.I).\n5-Mitochondria is dispersed throughout cytoplasm."},{"id":"en-91","type":"subheading","title":"2-Organizing Stage:","content":""},{"id":"en-92","type":"paragraph","content":"A-inner D.epith cells become tall columnar\n....inner D.epith contacts UMCs of dental papilla ...induce them ....(UMCs) to differentiate in to ODONTOBLASTS.\nN.B:odontoblasts begin dentin formation at the end of organizing stage..\n\nB-The cell shape:\n1-Tall columnar cell (elongation in direction of DEJ)\n2-reversal in function of cell:\nGolgi & Centrioles migrate to distal end (near dentin)\nNucleus & Mito migrate proximal (away from dentin)\n3-Desmosomal attachments at distal end &proximal end."},{"id":"en-93","type":"subheading","title":"3-Scretory Stage:","content":""},{"id":"en-94","type":"paragraph","content":"A- After 1st layer of dentin is formed ...dentin contacts inner D. epith...induces inner d. epith to differentiate into AMELOBLAST and it will begin secretion of ENAMEL MATRIX.\nB- the cell shape:\n*Tall columnar/highly polarized with most of organelles in cell body distal to nucleus.\n*6 characteristics:\n1-large open faced nucleus with prominent nucleoli & Peripheral chromatin condensation.\n2-abundant cytoplasm\n3-well developed Golgi complex (inc volume)\n4-numerous rER.\n5-numerous secretory vesicles.\n6-numerous mitochondria."},{"id":"en-95","type":"paragraph","content":"*ameloblasts begin formation of the enamel matrix (Aprismatic E)\n*as the 1st layer formed the cells migrate away From dentin surface and each ameloblast develops TOMES-PROCESS which is:\n*short conical projection\n*extends into newly formed E. giving the junction between E.& ameloblast saw tooth like appearance.\n*contains secretory granules only.\n*this phase it is characterized by:\n1-disappearance of Tomes process\n2-decr in organelles number.\n3-decr in height of the cell."},{"id":"en-96","type":"subheading","title":"4-Maturative Stage:","content":""},{"id":"en-97","type":"paragraph","content":"A- As matrix deposition is completed ameloblasts new function is E. maturation.\nB-The cell shape:\n1-decr in organelles\n2-shift of many of the remaining organelles to distal part of cell\n3- complex folding of distal plasma memb. To form a ruffle border\n4- There are cytoplasm vacuoles containing materials resembling E. matrix in cell body.\n5- near completion of maturation:\nA- no ruffled border (flattened cell membrane)\nB- ameloblasts will:\n*secrete 1ry E. cuticle\n*form hemidesmosomes"},{"id":"en-98","type":"subheading","title":"5-Protective Stage:","content":""},{"id":"en-99","type":"paragraph","content":"A- The cell shape :\nAmeloblasts loose their regularity & become cuboidal & can not be differentiated from the other cells of Dental organ.\nSo all these layers are called (reduced dental epithelium)or (reduced enamel epithelium)\nB- function of REE:\n1-protects enamel.\n2-promoting tooth eruption.\n3- formation of attachment epithelium."},{"id":"en-100","type":"subheading","title":"6- Desmolytic Stage:","content":""},{"id":"en-101","type":"paragraph","content":"At the time of eruption:RDE proliferates &secretes desmolytic enzymes which induce atrophy &destruction of the connective tissue separating RDE from oral epithelium."},{"id":"en-102","type":"heading","title":"AGE & FUNCTIONAL CHANGES IN ENAMEL","content":""},{"id":"en-103","type":"paragraph","content":"*Enamel is a non vital tissue & can not regenerate."},{"id":"en-104","type":"subheading","title":"1-Attrition:","content":""},{"id":"en-105","type":"paragraph","content":"Def: physiological wearing away of tooth hard substance during function.\nSite:\n*mainly on occlusal and incisal surfaces.\n*may be on proximal surfaces (slight teeth movement during mastication).\n\n*permanent & deciduous but severe attrition not seen in deciduous due to their short life span.\n*men exhibit more severe attrition then woman (due to increase in masticatory force).\nClinically: Nature of diet & some habits may influence the degree of attrition."},{"id":"en-106","type":"subheading","title":"2-color changes of tooth :","content":""},{"id":"en-107","type":"paragraph","content":"Teeth may become darker due to:\n1-deepening of dentin color seen through the thinning translucent enamel.\n2- addition of organic material from environment to enamel surface."},{"id":"en-108","type":"subheading","title":"3-Alteration in chemical composition:","content":""},{"id":"en-109","type":"paragraph","content":"After eruption: *ionic exchange between enamel & saliva....increase of certain elements (e.g. Fluorine)in superficial layer by age......increase in inorganic content to 98% (2ry maturation)."},{"id":"en-110","type":"subheading","title":"4- permeability:","content":""},{"id":"en-111","type":"paragraph","content":"*Enamel is semipermeable (allow ion exchange when crystals acquire ions.\n*decrease or even disappearance of permeability from The outer surface.\n\npermeability from dentin may remain."},{"id":"en-112","type":"heading","title":"TYPES OF ENAMEL:","content":""},{"id":"en-113","type":"list","content":["1-According to % of maturation (inorganic content):\na-enamel matrix (25-30% inorganic content)\nb-fully matured enamel (96% inorganic content)\nc-2ry matured enamel (98% inorganic content)","2-According to prism pattern:\na-prismatic enamel.\nb-prism less enamel.\nc-gnarled enamel.","3-According to time of formation:\na-prenatal.\nb-postnatal.","4-Enamel pearl."]}],"giveReasons":[{"reason":"Enamel is the hardest tissue in the human body","explanation":"Because it has the highest mineral content of any biological tissue — approximately 96% hydroxyapatite by weight. The hydroxyapatite crystals are the largest in any hard tissue, tightly packed and oriented for maximum hardness.","cat":"histological"},{"reason":"Enamel cannot repair itself (is non-vital / acellular)","explanation":"Because enamel is a totally acellular tissue — ameloblasts are lost after enamel maturation and are not present in the erupted tooth. There are no cells within mature enamel to synthesize new enamel matrix, making it the only hard tissue that cannot regenerate.","cat":"histological"},{"reason":"Hunter-Schreger bands (HSB) are formed in enamel","explanation":"Because enamel rods change direction in adjacent groups, running in alternating directions (decussation). This creates zones of different light reflection when viewed in oblique reflected light. The biological significance is resistance to fracture — the alternating rod directions prevent crack propagation through the full thickness of enamel.","cat":"histological"},{"reason":"The neonatal line is formed in deciduous teeth and the first permanent molar","explanation":"Because at birth, there is an abrupt change in the metabolic environment — the transition from placental nutrition to oral feeding, combined with the physiological stress of birth, causes a disturbance in enamel matrix deposition. This creates an accentuated incremental line separating pre-natal from post-natal enamel.","cat":"histological"},{"reason":"Enamel tufts are considered areas of weakness","explanation":"Because they contain a higher proportion of enamel proteins (sheathlin) and relatively less mineral content compared to normal enamel. These hypocalcified areas extend from the DEJ into the enamel and provide preferential pathways for early caries penetration.","cat":"histological"},{"reason":"Enamel is brittle despite being the hardest tissue","explanation":"Because enamel has very high mineral content (96%) but only about 1% organic matrix and 3% water. The lack of a significant organic framework means enamel lacks resilience — it cannot deform without fracturing. This is why it depends on the underlying dentin (which is more resilient) for support.","cat":"histological"},{"reason":"Gnarled enamel exists over cusps and incisal edges","explanation":"Because in areas of high masticatory stress, enamel rods twist and intertwine in complex arrangements. This complex orientation prevents crack propagation and provides additional strength specifically in areas subjected to the greatest occlusal forces.","cat":"histological"}]},{"id":6,"slug":"dentin","title":"Dentin","subtitle":"الشيت السادس","category":"hard-tissue","summary":"specialized calcified Connective tissue constitutes the main bulk of tooth, Covered by enamel in crown & by cementum in the root & surround pulp soft tissue. DENTIN IS A LIVING & VITAL TISSUE (CONTAINS ODONTOBLASTIC PROCESSES & NEURONS). Dentin & pulp form the DENTIN-PULP COMPLEX. Inorganic: 70%, Organic: 20% (90% collagen type I), Water: 10%.","keywords":["dentinal tubule","odontoblast process","predentin","peritubular dentin","intertubular dentin","mantle dentin","circumpulpal dentin","1ry dentin","2ry dentin","reparative dentin","sclerotic dentin","dead tract","incremental lines","Von Ebner","Owen","interglobular dentin","Tomes granular layer","Von Korff fibrils","dentinogenesis","globular calcification"],"keyDefinitions":[{"term":"Dentin","definition":"specialized calcified Connective tissue constitutes the main bulk of tooth, Covered by enamel i
