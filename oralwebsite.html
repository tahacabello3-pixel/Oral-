65% of total)","Sublingual (7–8% of total)","Minor salivary glands (~5% of total)"],"correctOption":1,"answer":"Submandibular gland — produces 60–65% of daily salivary volume"},{"id":"py-15-3","sheetId":15,"type":"mcq","question":"The cells lining the intercalated ducts of salivary glands are:","options":["Simple cuboidal epithelium","Simple columnar epithelium","Stratified squamous epithelium","Pseudostratified columnar epithelium"],"correctOption":0,"answer":"Simple cuboidal epithelium"},{"id":"py-15-4","sheetId":15,"type":"mcq","question":"Minor salivary glands contribute approximately what percentage of total daily saliva?","options":["~5%","~25%","~60%","~70%"],"correctOption":0,"answer":"~5% of total daily saliva"},{"id":"py-15-5","sheetId":15,"type":"mcq","question":"Von Ebner's (serous) minor salivary glands are located:","options":["In anterior tongue (Blandin and Nuhn glands)","Within the buccal mucosa","In association with circumvallate papillae (in trough)","In the labial mucosa"],"correctOption":2,"answer":"In association with circumvallate papillae — their ducts open into the trough around each papilla"},{"id":"py-15-6","sheetId":15,"type":"mcq","question":"The shape of serous secretory acinar cells is:","options":["Pyramidal (round basal nucleus, apical zymogen granules)","Cuboidal with central nucleus","Columnar with apical nucleus","Flat with compressed nucleus"],"correctOption":0,"answer":"Pyramidal — round basal nucleus and apical secretory (zymogen) granules"},{"id":"py-15-7","sheetId":15,"type":"mcq","question":"Functions of saliva include:","options":["Filtration","Production site of antibodies","Buffering (neutralizing acids)","All of the above"],"correctOption":3,"answer":"All of the above — saliva filters, contains immunoglobulins, and buffers acids"},{"id":"py-15-8","sheetId":15,"type":"mcq","question":"The long excretory duct of the parotid gland is called:","options":["Wharton's duct","Bartholin's duct","Stensen's (Stenson's) duct","Rivinus' duct"],"correctOption":2,"answer":"Stensen's (Stenson's) duct"},{"id":"py-15-9","sheetId":15,"type":"mcq","question":"The intercalated duct is attached to the:","options":["Acini","Capsule","Septum","None of the above"],"correctOption":0,"answer":"Acini — intercalated ducts connect acini to striated ducts"},{"id":"py-15-10","sheetId":15,"type":"mcq","question":"The contractile cells of salivary glands are called:","options":["Progenitor cells","Myoepithelial cells","Striated duct cells","Intercalated duct cells"],"correctOption":1,"answer":"Myoepithelial cells (basket cells)"},{"id":"py-15-11","sheetId":15,"type":"mcq","question":"The histological structure of the thyroid gland includes:","options":["Capsule and septa only","Septa and lobules","Lobules and capsule","Capsule, septa, and lobules — all of the above"],"correctOption":3,"answer":"Capsule, septa, and lobules — all of the above"},{"id":"py-15-12","sheetId":15,"type":"mcq","question":"The tonsil that has crypts but NO clefts (invaginations) is the:","options":["Palatine tonsil","Lingual tonsil","Pharyngeal tonsil (adenoid)","Tubal tonsil"],"correctOption":2,"answer":"Pharyngeal tonsil (adenoid) — it has irregular folds but no true crypts (unlike palatine tonsil)","explanation":"The file states: 'The tonsil which has clefts without crypt is known as pharyngeal tonsil.' This refers to its folds vs. crypts structure."},{"id":"py-15-13","sheetId":15,"type":"mcq","question":"Saliva is composed of approximately:","options":["99% water and 1% organic + inorganic solids","99% protein and 1% water","90% digestive enzymes","90% defensive enzymes"],"correctOption":0,"answer":"~99% water and ~1% organic and inorganic dissolved substances"},{"id":"py-15-14","sheetId":15,"type":"mcq","question":"The secretory (striated) duct is the outer portion of the duct system connected to:","options":["Acini directly","Intercalated ducts","Excretory duct only","None of the above"],"correctOption":1,"answer":"Intercalated ducts (acini → intercalated → striated → excretory duct)"},{"id":"py-15-15","sheetId":15,"type":"mcq","question":"The procementum is considered as:","options":["Cementoid tissue","Non-calcified layer","Cementum matrix","All of the above"],"correctOption":3,"answer":"All of the above — procementum is the uncalcified cementum matrix (cementoid)"},{"id":"py-tf-15-1","sheetId":15,"type":"true-false","question":"Palatine tonsils are bilateral structures.","answer":"True"},{"id":"py-tf-15-2","sheetId":15,"type":"true-false","question":"The submandibular salivary gland produces purely serous saliva.","answer":"False","explanation":"The submandibular gland is MIXED (predominantly serous with some mucous acini). Only the PAROTID gland is purely serous."},{"id":"py-tf-15-3","sheetId":15,"type":"true-false","question":"Serous secretory cells have flat (compressed) basal nuclei.","answer":"False","explanation":"Serous cells have ROUND, basally located nuclei. MUCOUS cells have flat, compressed, crescent-shaped nuclei displaced to the base."},{"id":"py-tf-15-4","sheetId":15,"type":"true-false","question":"The thyroid gland is the largest exocrine gland in the body.","answer":"False","explanation":"The thyroid is an ENDOCRINE gland (no duct system). The largest exocrine gland is the liver."},{"id":"py-tf-15-5","sheetId":15,"type":"true-false","question":"Mucous acini have a narrow lumen.","answer":"False","explanation":"Mucous acini have a WIDE lumen (mucus is viscous). Serous acini have a small/narrow lumen."},{"id":"py-tf-15-6","sheetId":15,"type":"true-false","question":"Saliva has a buffer function in the mouth.","answer":"True","explanation":"Saliva contains bicarbonate and other buffers that neutralize acids produced by bacteria, protecting teeth from caries."},{"id":"py-tf-15-7","sheetId":15,"type":"true-false","question":"The striated duct is connected to (and directly receives from) intercalated ducts.","answer":"True"},{"id":"py-tf-15-8","sheetId":15,"type":"true-false","question":"The secretory (striated) duct is the outer portion of the duct system.","answer":"True"},{"id":"py-tf-15-9","sheetId":15,"type":"true-false","question":"The contractile cells of salivary glands are known as progenitor cells.","answer":"False","explanation":"The contractile cells are MYOEPITHELIAL cells (basket cells). Progenitor cells are reserve/stem cells."},{"id":"py-tf-15-10","sheetId":15,"type":"true-false","question":"The largest amount of saliva is produced by the sublingual salivary gland.","answer":"False","explanation":"The SUBMANDIBULAR gland produces the most saliva (60–65%). Sublingual contributes only ~7–8%."}];

const PASTYEAR_WRITTEN = [{"id":"wr-13-1","sheetId":13,"type":"written","question":"What is the function of synovial fluid?","answer":"Lubrication, nutrient supply, and clearing tissue debris.","source":"Sheet 13 · TMJ"},{"id":"wr-8-1","sheetId":8,"type":"written","question":"What are the cells of the dental pulp?","answer":"Odontoblasts, fibroblasts, undifferentiated mesenchymal cells, and defense cells.","source":"Sheet 8 · Dental Pulp"},{"id":"wr-5-1","sheetId":5,"type":"written","question":"What is the incremental line of enamel?","answer":"Striae of Retzius (brown striae / incremental lines of enamel).","source":"Sheet 5 · Enamel"},{"id":"wr-14-1","sheetId":14,"type":"written","question":"Mucogingival junction is the periphery between attached gingiva and what tissue?","answer":"Alveolar mucosa.","source":"Sheet 14 · Oral Mucosa & Gingiva"},{"id":"wr-6-1","sheetId":6,"type":"written","question":"What is the incremental line of dentin?","answer":"Incremental line of von Ebner.","source":"Sheet 6 · Dentin"},{"id":"wr-4-1","sheetId":4,"type":"written","question":"What is the function of the outer enamel epithelium in the cap stage?","answer":"It forms the outer protective covering of the enamel organ; in the cap stage it is a single layer of cuboidal cells on the outer convex surface.","source":"Sheet 4 · Tooth Development and Growth"},{"id":"wr-6-2","sheetId":6,"type":"written","question":"What theory explains dentin sensitivity?","answer":"Hydrodynamic theory (Brännström).","source":"Sheet 6 · Dentin"},{"id":"wr-9-1","sheetId":9,"type":"written","question":"What are the types of cells in the periodontal ligament (PDL)?","answer":"Synthetic cells, resorptive cells, undifferentiated mesenchymal cells, defense cells, and epithelial rests of Malassez.","source":"Sheet 9 · Periodontal Ligament"},{"id":"wr-3-1","sheetId":3,"type":"written","question":"The palatine shelves are elevated and become horizontal in position above the tongue due to what?","answer":"Downward and forward displacement of the tongue as the mandible grows, creating space for shelf elevation.","source":"Sheet 3 · Development of the Mouth"},{"id":"wr-10-1","sheetId":10,"type":"written","question":"What does the supporting of the alveolar process consist of?","answer":"Cortical plates (compact bone) and spongy bone (cancellous bone).","source":"Sheet 10 · Alveolar Bone"},{"id":"wr-15-1","sheetId":15,"type":"written","question":"What are the major salivary glands?","answer":"Parotid, submandibular, and sublingual glands.","source":"Sheet 15 · Salivary Glands & Tonsils"},{"id":"wr-10-2","sheetId":10,"type":"written","question":"What are the age changes of alveolar bone?","answer":"Alveolar sockets appear jagged and scalloped; bone marrow shows fatty infiltration; osteoporosis indicates loss of bony elements; internal trabecular arrangement becomes more open.","source":"Sheet 10 · Alveolar Bone"},{"id":"wr-7-1","sheetId":7,"type":"written","question":"What are the age changes of cementum?","answer":"Hypercementosis, decreased permeability, alteration in physical/chemical/structural characteristics, and resorption with repair.","source":"Sheet 7 · Cementum"},{"id":"wr-5-2","sheetId":5,"type":"written","question":"What are the age changes of enamel?","answer":"Attrition, color change, alteration in chemical composition, and decreased permeability.","source":"Sheet 5 · Enamel"},{"id":"wr-8-2","sheetId":8,"type":"written","question":"What are the age changes of pulp?","answer":"Cell changes, fibrosis, blood vessel changes, and pulp stones (denticles).","source":"Sheet 8 · Dental Pulp"},{"id":"wr-9-2","sheetId":9,"type":"written","question":"What are the age changes of the PDL?","answer":"Detachment of cervical fibers, decreased vascularity, thinning due to decreased activity, and cementicles may be found.","source":"Sheet 9 · Periodontal Ligament"},{"id":"wr-11-1","sheetId":11,"type":"written","question":"What is the function of the maxillary sinus?","answer":"Lightens skull weight, resonates voice, conditions inspired air, protects against mechanical trauma, and produces bactericidal enzyme.","source":"Sheet 11 · Maxillary Sinus"},{"id":"wr-7-2","sheetId":7,"type":"written","question":"What are the types of hypercementosis?","answer":"Generalized and localized.","source":"Sheet 7 · Cementum"},{"id":"wr-13-2","sheetId":13,"type":"written","question":"What are the causes of dislocation of the temporomandibular joint?","answer":"Trauma or injury, excessive mouth opening, structural abnormalities, hypermobility, and connective tissue disorders.","source":"Sheet 13 · TMJ"}];

  "Serous demilunes in submandibular glands cap mucous acini and contribute to mixed saliva",
  "Cementum of one tooth fuses with cementum of an adjacent tooth (concrescence) running over alveolar crest",

  "Mucogingival junction is the border between attached gingiva and alveolar mucosa",
  "Periodontal ligament contains synthetic cells (fibroblasts, cementoblasts, osteoblasts), resorptive cells (clasts), and defense cells",
  "Salivary glands secrete primary saliva isotonic, modified by striated ducts to become hypotonic",
  "Nervous supply to the temporomandibular joint is via auriculotemporal and masseteric nerves",
  "Lubrication, nutrient supply, and clearance of tissue debris are primary functions of synovial fluid",
  "The articular disc of the TMJ is fibrocartilage dividing the joint into upper and lower compartments",
  "Segmental bone resorption and deposition drive tooth eruption according to the bone remodeling theory",
  "Tomes' granular layer represents hypomineralized areas of dentin located near the cementodentinal junction",
  "Dentinal tubules contain odontoblastic processes (Tomes' fibers) and fluid that transmits stimuli",
  "Mylohyoid muscle forms the floor of the mouth and supports the tongue",
  "Mechanoreceptors in Merkel cells of the oral epithelium detect light touch",
  "Stratum granulosum is absent in parakeratinized epithelium but present in orthokeratinized epithelium",
  "Sharpey's fibers are terminal ends of periodontal ligament fibers embedded in cementum and alveolar bone",
  "Pulp stones (denticles) are calcified bodies found within the dental pulp; false denticles form around blood vessels",
  "Primary palate forms from the medial nasal processes and gives rise to the premaxilla region of the maxilla",
  "The periodontal ligament functions as a shock absorber and sensory receptor for tooth movement",
  "Keratinocyte layers of oral epithelium include basal, spinous (prickle), granular (in keratinized), and superficial layers",
  "Taste buds are barrel-shaped sensory structures composed of supporting, sensory, and basal cells",
  "Dental pulp contains cells (odontoblasts, fibroblasts, undifferentiated mesenchymal cells, defense cells), fibers, ground substance, blood vessels, and nerves",
  "Intramembranous ossification forms alveolar bone whereas endochondral ossification forms the condylar cartilage",
  "Reduced enamel epithelium protects the crown until eruption and forms the initial junctional epithelium",
  "Microanatomy of enamel includes enamel rods, rod sheaths, interprismatic substance, and enamel tufts, spindles, lamellae",
  "The major salivary glands are the parotid, submandibular, and sublingual glands",
  "Intercellular canaliculi in ameloblasts increase the surface area for exchange during enamel formation",

  "Vermilion border is the junction between skin and oral mucosa on the lips",
  "Maxillary sinus functions include lightening skull, conditioning inspired air, and producing bactericidal enzyme"
];
const EXAM_HIGHLIGHT_REGEX = EXAM_HIGHLIGHT_TERMS.length
  ? new RegExp(EXAM_HIGHLIGHT_TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a,b)=>b.length-a.length).join('|'), 'gi')
  : null;

function hl(txt) {
  const s = String(txt ?? '');
  if (!EXAM_HIGHLIGHT_REGEX) return s;
  return s.replace(EXAM_HIGHLIGHT_REGEX, m => `<span class="exam-highlight">${m}</span>`);
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function hasExamHit(txt) {
  if (!EXAM_HIGHLIGHT_REGEX) return false;
  EXAM_HIGHLIGHT_REGEX.lastIndex = 0;
  return EXAM_HIGHLIGHT_REGEX.test(String(txt ?? ''));
}

function looksLikeTable(raw) {
  const s = String(raw ?? '').trim();
  return s.includes('\n|') && /^\s*\|/.test(s);
}

function renderMarkdownTable(raw) {
  const src = String(raw ?? '').replace(/\r/g, '').trim();
  const lines = src.split('\n').map(l => l.trim()).filter(Boolean);
  const tableLines = lines.filter(l => l.includes('|'));
  if (tableLines.length < 2) return null;

  const rows = tableLines.map(line =>
    line
      .replace(/^\|/, '')
      .replace(/\|$/, '')
      .split('|')
      .map(cell => cell.trim())
  );
  if (rows.length < 2) return null;

  const sepIdx = rows.findIndex(row => row.length && row.every(cell => /^:?-{3,}:?$/.test(cell)));
  const header = rows[0].slice();
  const body = (sepIdx >= 0 ? rows.slice(sepIdx + 1) : rows.slice(1)).map(r => r.slice());

  const maxCols = Math.max(header.length, ...body.map(r => r.length));
  while (header.length < maxCols) header.push('');
  body.forEach(r => { while (r.length < maxCols) r.push(''); });

  const hasRowLabels = header[0] === '';

  const thead = `<thead><tr>${
    header.map((cell, i) => `<th${i === 0 && hasRowLabels ? ' class="row-head"' : ''}>${hl(escapeHtml(cell))}</th>`).join('')
  }</tr></thead>`;

  const tbody = `<tbody>${
    body.map(row => `<tr>${
      row.map((cell, i) => `<td${i === 0 && hasRowLabels ? ' class="row-head"' : ''}>${hl(escapeHtml(cell))}</td>`).join('')
    }</tr>`).join('')
  }</tbody>`;

  return `<div class="data-table-wrap"><table class="data-table">${thead}${tbody}</table></div>`;
}

function wrapExamFocus(html, raw) {
  return hasExamHit(raw) ? `<div class="exam-focus-shell">${html}</div>` : html;
}

function renderBlocks(blocks) {
  if (!blocks || !blocks.length) return '<p style="color:#94a3b8;font-size:13px">No content available.</p>';
  return blocks.map((b,i) => {
    const content = b.content;
    const txt = c => Array.isArray(c) ? c.join(' ') : c;
    const raw = txt(content);
    const focusSource = `${b.title || ''}\n${raw}`;
    let inner;
    // Table or markdown-like table
    if (b.type === 'table' || looksLikeTable(raw)) {
      const tableHtml = renderMarkdownTable(raw);
      if (tableHtml) {
        const title = b.title ? `<div class="block-heading">📊 ${hl(b.title)}</div>` : '';
        inner = wrapExamFocus(`${title}${tableHtml}`, focusSource);
        return `<div id="block-${i}" class="content-block">${inner}</div>`;
      }
    }
    // Standard block types
    if (b.type === 'heading') {
      inner = wrapExamFocus(`<div class="block-heading">📌 ${hl(b.title || txt(content))}</div>`, focusSource);
    } else if (b.type === 'subheading') {
      inner = wrapExamFocus(`<div class="block-subheading">▸ ${hl(b.title || txt(content))}</div>`, focusSource);
    } else if (b.type === 'paragraph') {
      inner = wrapExamFocus(`<p class="block-paragraph">${hl(txt(content))}</p>`, focusSource);
    } else if (b.type === 'list') {
      const items = (Array.isArray(content) ? content : [content]).map(item => `<li>${hl(item)}</li>`).join('');
      inner = wrapExamFocus(`<ul class="block-list">${items}</ul>`, focusSource);
    } else if (b.type === 'definition') {
      inner = wrapExamFocus(`<div class="block-definition"><div class="def-title">🔑 ${hl(b.title || 'Definition')}</div><div class="def-content">${hl(txt(content))}</div></div>`, focusSource);
    } else if (b.type === 'clinical') {
      inner = wrapExamFocus(`<div class="block-clinical"><span class="bc-label">⚕ ${hl(b.title || 'Clinical Note')}</span><div class="bc-body">${hl(txt(content))}</div></div>`, focusSource);
    } else if (b.type === 'important') {
      inner = wrapExamFocus(`<div class="block-important"><span class="bi-label">⚠ ${hl(b.title || 'Important')}</span><div class="bi-body">${hl(txt(content))}</div></div>`, focusSource);
    } else if (b.type === 'note') {
      inner = wrapExamFocus(`<div class="block-note"><span class="bn-label">📝 ${hl(b.title || 'Note')}</span><div class="bn-body">${hl(txt(content))}</div></div>`, focusSource);
    } else {
      // Fallback to a plain paragraph with minimal styling
      inner = wrapExamFocus(`<p style="font-size:14px;color:var(--text2);line-height:1.9;white-space:pre-wrap">${hl(escapeHtml(txt(content)))}</p>`, focusSource);
    }
    return `<div id="block-${i}" class="content-block">${inner}</div>`;
  }).join('');
}

// ── Generate a table of contents from sheet blocks ──
function renderTOC(blocks) {
  const items = [];
  blocks.forEach((b, i) => {
    if (b.type === 'heading' || b.type === 'subheading') {
      // Use title or first line of content as label
      const getText = c => Array.isArray(c) ? c.join(' ') : c;
      const title = b.title || getText(b.content);
      items.push({ id: `block-${i}`, title });
    }
  });
  if (!items.length) return '';
  // Build a collapsible details element with smooth scrolling on click
  return `<details class="toc"><summary>Table of Contents</summary><ul>` +
    items.map(it => `<li><a href="#${it.id}" onclick="event.preventDefault();document.getElementById('${it.id}').scrollIntoView({behavior:'smooth'});">${hl(it.title)}</a></li>`).join('') +
    '</ul></details>';
}

function renderFlashcards(sheet) {
  const cards = sheet.flashcards||[];
  if(!cards.length) return '<p style="color:#94a3b8;font-size:13px">No flashcards for this sheet.</p>';
  const idx = state.flashcardIdx;
  const flipped = state.flashcardFlipped;
  const card = cards[idx];
  return `
  <div style="text-align:center;max-width:560px;margin:0 auto">
    <p style="font-size:12px;color:#94a3b8;margin-bottom:16px">Card ${idx+1} of ${cards.length}</p>
    <div onclick="flipCard()" style="background:${flipped?'#0d9488':'#fff'};color:${flipped?'#fff':'#0f172a'};border-radius:16px;border:2px solid ${flipped?'#0d9488':'#e2e8f0'};padding:36px 24px;min-height:160px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.08);transition:all .2s;text-align:center">
      <div>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;opacity:.7;margin-bottom:10px">${flipped?'ANSWER':'QUESTION — tap to reveal'}</div>
        <div style="font-size:14px;font-weight:700;line-height:1.6;white-space:pre-wrap">${flipped?hl(card.answer):hl(card.question)}</div>
      </div>

function quickSearch(q) {
  if (q.length > 1 && state.view !== 'search') {
    showView('search');
    requestAnimationFrame(() => {
      const input = document.getElementById('quick-search');
      if (input) {
        input.value = q;
        try { input.focus(); input.setSelectionRange(q.length, q.length); } catch(e) {}
      }
      renderSearch(q);
    });
    return;
  }
  if (state.view === 'search') renderSearch(q);
}

function renderSearch(query) {
  const q = (query !== undefined && query !== null ? query : (document.getElementById('quick-search') || {}).value) || '';
  const host = document.getElementById('view-search');
  if (!host) return;

  if (!host.dataset.ready) {
    host.innerHTML = `
      <div class="fade" style="max-width:800px;margin:0 auto;padding:24px">
        <h2 style="font-size:20px;font-weight:900;margin:0 0 16px">🔍 Search</h2>
        <input id="search-query-input" oninput="renderSearch(this.value)" placeholder="Search across all sheets, flashcards, definitions…" style="width:100%;border:2px solid #0d9488;border-radius:12px;padding:12px 16px;font-size:14px;outline:none;margin-bottom:16px"/>
        <div id="search-results"></div>
      </div>`;
    host.dataset.ready = '1';
  }

  const input = document.getElementById('search-query-input');
  if (input && input.value !== q) input.value = q;
  const resultsBox = document.getElementById('search-results');
  if (!resultsBox) return;

  const results = q.length > 1 ? searchAll(q) : [];
  resultsBox.innerHTML = q.length < 2
    ? '<p style="color:#94a3b8;font-size:13px">Type at least 2 characters to search.</p>'
    : results.length === 0
      ? '<p style="color:#94a3b8;font-size:13px">No results found.</p>'
      : `<p style="font-size:12px;color:#64748b;margin-bottom:12px">${results.length} results for "<b>${q}</b>"</p>
        ${results.map(r=>`<div onclick="showSheet(${r.sheetId})" class="card" style="padding:12px 14px;margin-bottom:8px;cursor:pointer" onmouseover="this.style.borderColor='#0d9488'" onmouseout="this.style.borderColor='#e2e8f0'">
          <div style="font-size:10px;font-weight:700;color:#0d9488;margin-bottom:3px">Sheet ${r.sheetId} — ${SHEET_NAMES[r.sheetId]} · ${r.type}</div>
          <p style="font-size:13px;color:#0f172a;margin:0;line-height:1.5">${r.text.substring(0,150)}${r.text.length>150?'…':''}</p>
        </div>`).join('')}`;
}

function searchAll(q) {
  const lq = q.toLowerCase();
  const results = [];
  SHEETS.forEach(sheet=>{
    const add=(type,text)=>{if(text&&text.toLowerCase().includes(lq)) results.push({sheetId:sheet.id,type,text});};
    add('Summary',sheet.summary);
    sheet.keyDefinitions.forEach(d=>{add('Definition: '+d.term,d.term+' — '+d.definition);});
    sheet.importantPoints.forEach(p=>add('Important Point',p));
    sheet.clinicalNotes.forEach(n=>add('Clinical Note',n));
    sheet.flashcards.forEach(f=>{add('Flashcard Q',f.question);add('Flashcard A',f.answer);});
    sheet.giveReasons.forEach(r=>add('Give Reason',r.reason+' — '+r.explanation));
    sheet.blocks.forEach(b=>{
      const c = Array.isArray(b.content)?b.content.join(' '):b.content;
      if(c) add('Content',(b.title?b.title+': ':'')+c);
    });
  });
  return results.slice(0,40);
}

    <button onclick="state.midtermView='sheet-select';renderMidterm()" style="border:none;background:#f1f5f9;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:16px">‹ Back</button>

        `<button onclick="midtermSubmit('${q.id}',${qs.length-1})" ${ua===undefined?'disabled':''} style="flex:1;height:38px;border-radius:8px;border:none;background:${ua!==undefined?'#8b5cf6':'#e2e8f0'};color:${ua!==undefined?'#fff':'#94a3b8'};font-size:13px;font-weight:700;cursor:${ua!==undefined?'pointer':'default'}">Submit Answer</button>` :

window.midtermSubmit = (id, last) => {
  const q = MIDTERM.find(x=>x.id===id);
  if(!q) return;
  const ua = state.midtermExamAns[id];
  if(ua===undefined) return;
  const correct = parseInt(ua)===q.correctOption;
  state.midtermExamSub.add(id);
  state.midtermExamRes[id]=correct;
  if(state.midtermExamIdx===last) setTimeout(()=>{state.midtermExamDone=true;renderMidterm();},600);
  renderMidterm();
};

function midtermResult(qs) {
  const score=Object.values(state.midtermExamRes).filter(Boolean).length;
  const pct=Math.round(score/qs.length*100);
  const gr=pct>=80?{bg:'linear-gradient(135deg,#059669,#0d9488)',msg:'Excellent! 🏆'}:pct>=60?{bg:'linear-gradient(135deg,#d97706,#ea580c)',msg:'Good effort!'}:{bg:'linear-gradient(135deg,#e11d48,#dc2626)',msg:'Keep studying!'};
  return `<div class="fade" style="max-width:500px;margin:0 auto;padding:24px">
    <div style="background:${gr.bg};border-radius:20px;padding:28px;color:#fff;text-align:center;margin-bottom:16px">
      <div style="font-size:40px;margin-bottom:6px">🏆</div>
      <div style="font-size:42px;font-weight:900">${pct}%</div>

// ═══════════════════════════════════════
function pySheets() { return [...new Set(PASTYEAR.map(q=>q.sheetId))].sort((a,b)=>a-b); }
function pyBySheet(sid) { return PASTYEAR.filter(q=>q.sheetId===sid); }
function pyWrittenBySheet(sid) { return PASTYEAR_WRITTEN.filter(q=>q.sheetId===sid); }

function renderPY() {
  const el = document.getElementById('view-pastyear');
  const v = state.pyView;
  if(v==='home') el.innerHTML = pyHome();
  else if(v==='sheet-select') el.innerHTML = pySheetSelect();
  else if(v==='study') el.innerHTML = pyStudy();
  else if(v==='exam') el.innerHTML = pyExam();
}


function renderWritten() {
  const el = document.getElementById('view-written');
  if(!el) return;
  el.innerHTML = writtenHome();
}

function writtenHome() {
  const total = PASTYEAR_WRITTEN.length;
  const sheets = [...new Set(PASTYEAR_WRITTEN.map(q=>q.sheetId))].sort((a,b)=>a-b);
  return `<div class="fade" style="max-width:920px;margin:0 auto;padding:24px">
    <div style="background:linear-gradient(135deg,#7c3aed,#8b5cf6,#a855f7);border-radius:20px;padding:28px;color:#fff;margin-bottom:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#e9d5ff;margin-bottom:6px">Written Questions</div>
          <h2 style="font-size:22px;font-weight:900;margin:0 0 6px">Separate written exam bank</h2>
          <p style="font-size:13px;color:#f3e8ff;margin:0">Questions grouped by sheet and answered from the sheet content.</p>
        </div>
        <div style="min-width:120px;text-align:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:14px 16px">
          <div style="font-size:28px;font-weight:900">${total}</div>
          <div style="font-size:11px;color:#ede9fe">Total written</div>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      ${sheets.map(sid=>{
        const qs = PASTYEAR_WRITTEN.filter(q=>q.sheetId===sid);
        return `<div class="card" style="padding:0;overflow:hidden;border:1px solid #e9d5ff">
          <div style="padding:14px 16px;background:#faf5ff;border-bottom:1px solid #e9d5ff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <div>
              <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:#7c3aed;margin-bottom:3px">Sheet ${sid}</div>
              <div style="font-size:15px;font-weight:900;color:#0f172a">${SHEET_NAMES[sid] || ('Sheet ' + sid)}</div>
            </div>
            <div style="font-size:11px;font-weight:800;color:#7c3aed;background:#ede9fe;border-radius:999px;padding:5px 10px">${qs.length} written</div>
          </div>
          <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
            ${qs.map((q,idx)=>`
              <div style="border:1px solid #e9d5ff;border-left:5px solid #7c3aed;border-radius:14px;padding:12px 14px;background:#fff">
                <div style="font-size:11px;font-weight:900;color:#7c3aed;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Written Question ${idx+1}</div>
                <div style="font-size:14px;font-weight:800;color:#111827;line-height:1.7;margin-bottom:10px">${q.question}</div>
                <div style="background:#faf5ff;border:1px dashed #c4b5fd;border-radius:10px;padding:10px 12px">
                  <div style="font-size:11px;font-weight:900;color:#6d28d9;margin-bottom:4px">Answer from sheet</div>
                  <div style="font-size:13px;color:#312e81;line-height:1.8">${q.answer}</div>
                  <div style="font-size:10px;color:#8b5cf6;margin-top:8px">${q.source || ''}</div>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}


function pyHome() {
  const mcq = PASTYEAR.filter(q=>q.type==='mcq').length;
  const tf = PASTYEAR.filter(q=>q.type==='true-false').length;
  const wr = PASTYEAR_WRITTEN.length;
  return `<div class="fade" style="max-width:600px;margin:0 auto;padding:24px">
    <div style="background:linear-gradient(135deg,#0d9488,#0891b2);border-radius:20px;padding:28px;color:#fff;text-align:center;margin-bottom:24px">
      <div style="font-size:36px;margin-bottom:8px">📚</div>
      <h2 style="font-size:22px;font-weight:900;margin:0 0 6px">Past Year Exams</h2>
      <p style="color:#99f6e4;font-size:13px;margin:0 0 16px">Real final exam questions — all 15 sheets</p>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        <div style="background:rgba(255,255,255,.15);border-radius:12px;padding:12px"><div style="font-size:22px;font-weight:900">${PASTYEAR.length}</div><div style="font-size:11px;color:#99f6e4">Total</div></div>
        <div style="background:rgba(255,255,255,.15);border-radius:12px;padding:12px"><div style="font-size:22px;font-weight:900">${mcq}</div><div style="font-size:11px;color:#99f6e4">MCQ</div></div>
        <div style="background:rgba(255,255,255,.15);border-radius:12px;padding:12px"><div style="font-size:22px;font-weight:900">${tf}</div><div style="font-size:11px;color:#99f6e4">T/F</div></div>
        <div style="background:rgba(255,255,255,.15);border-radius:12px;padding:12px"><div style="font-size:22px;font-weight:900">${wr}</div><div style="font-size:11px;color:#99f6e4">Written</div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <button onclick="state.pyMode='study';state.pyView='sheet-select';renderPY()" style="background:#fff;border:2px solid #99f6e4;border-radius:16px;padding:22px;text-align:left;cursor:pointer">
        <div style="font-size:28px;margin-bottom:8px">📖</div>
        <div style="font-weight:800;color:#0f172a;margin-bottom:4px">Study Mode</div>
        <div style="font-size:12px;color:#64748b">T/F in amber · MCQ in teal</div>
      </button>
      <button onclick="state.pyMode='exam';state.pyView='sheet-select';renderPY()" style="background:#fff;border:2px solid #fecaca;border-radius:16px;padding:22px;text-align:left;cursor:pointer">
        <div style="font-size:28px;margin-bottom:8px">⚡</div>
        <div style="font-weight:800;color:#0f172a;margin-bottom:4px">Exam Mode</div>
        <div style="font-size:12px;color:#64748b">Answer and get scored</div>
      </button>
    </div>
    <div style="margin-top:14px">
      <button onclick="showView('written')" style="width:100%;background:#fff;border:2px solid #e9d5ff;border-radius:16px;padding:18px;text-align:left;cursor:pointer">
        <div style="font-size:28px;margin-bottom:8px">✍️</div>
        <div style="font-weight:800;color:#0f172a;margin-bottom:4px">Written Questions</div>
        <div style="font-size:12px;color:#64748b">Separate bank of written questions with answers from the sheets</div>
      </button>
    </div>
  </div>`;
}

function pySheetSelect() {
  const isStudy = state.pyMode === 'study';
  const col = isStudy ? '#0d9488' : '#e11d48';
  const borderBase = isStudy ? '#99f6e4' : '#fecaca';
  return `<div class="fade" style="max-width:700px;margin:0 auto;padding:24px">
    <button onclick="state.pyView='home';renderPY()" style="border:none;background:#f1f5f9;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:16px">‹ Back</button>
    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:${col};margin-bottom:4px">${isStudy?'Study Mode':'Exam Mode'} — Select Sheet</div>
      <h2 style="font-size:18px;font-weight:900;margin:0">Choose a Sheet</h2>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
      ${pySheets().map(sid=>{
        const qs = pyBySheet(sid);
        const mcq = qs.filter(x=>x.type==='mcq').length;
        const tf = qs.filter(x=>x.type==='true-false').length;
        return `<button onclick="state.pySheetId=${sid};state.pyView='${state.pyMode==='study'?'study':'exam'}';state.pyOpenAns=new Set();state.pyExamIdx=0;state.pyExamAns={};state.pyExamSub=new Set();state.pyExamRes={};state.pyExamDone=false;renderPY()" style="text-align:left;border:2px solid ${borderBase};border-radius:12px;padding:14px;background:#fff;cursor:pointer;transition:all .12s" onmouseover="this.style.borderColor='${col}'" onmouseout="this.style.borderColor='${borderBase}'">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:10px;font-weight:800;color:${col}">Sheet ${sid}</span>
            <span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
              ${mcq?`<span class="badge badge-teal">${mcq} MCQ</span>`:''}
              ${tf?`<span class="badge badge-amber">${tf} T/F</span>`:''}
            </span>
          </div>
          <p style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 8px">${SHEET_NAMES[sid]||'Sheet '+sid}</p>
          <div style="background:${col}22;color:${col};font-size:11px;font-weight:700;padding:5px;border-radius:6px;text-align:center">${isStudy?'📖 Open in Study Mode':'⚡ Start Exam'}</div>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

function pyStudy() {
  const qs = pyBySheet(state.pySheetId);
  const tfQs = qs.filter(q=>q.type==='true-false');
  const mcqQs = qs.filter(q=>q.type==='mcq');
  const openAns = state.pyOpenAns;
  return `<div class="fade" style="max-width:760px;margin:0 auto;padding:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="state.pyView='sheet-select';renderPY()" style="border:none;background:#f1f5f9;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">‹ Back</button>
        <div><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:#0d9488">Study Mode · Past Year</div><h2 style="font-size:16px;font-weight:900;margin:0">${SHEET_NAMES[state.pySheetId]}</h2></div>
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="state.pyOpenAns=new Set(pyBySheet(state.pySheetId).map(q=>q.id));renderPY()" style="font-size:11px;padding:5px 10px;background:#ccfbf1;color:#0f766e;border:none;border-radius:6px;cursor:pointer;font-weight:700">Expand All</button>
        <button onclick="state.pyOpenAns=new Set();renderPY()" style="font-size:11px;padding:5px 10px;background:#f1f5f9;color:#475569;border:none;border-radius:6px;cursor:pointer;font-weight:700">Collapse All</button>
      </div>
    </div>
    <p style="font-size:12px;color:#94a3b8;margin-bottom:16px">${qs.length} questions${mcqQs.length?' · '+mcqQs.length+' MCQ':''}${tfQs.length?' · '+tfQs.length+' T/F':''}</p>

    ${tfQs.length?`
    <div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="flex:1;height:1px;background:#fde68a"></div>
        <span style="font-size:11px;font-weight:800;text-transform:uppercase;color:#b45309">🔀 True / False (${tfQs.length})</span>
        <div style="flex:1;height:1px;background:#fde68a"></div>
      </div>
      ${tfQs.map((q,i)=>{
        const open=openAns.has(q.id);
        const isTrue=q.answer.toLowerCase().startsWith('true');
        return `<div style="border-radius:12px;border:1px solid #fde68a;background:#fffbeb;overflow:hidden;margin-bottom:6px">
          <button onclick="pyToggle('${q.id}')" style="width:100%;text-align:left;padding:12px 14px;display:flex;align-items:flex-start;gap:8px;background:transparent;border:none;cursor:pointer">
            <span style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#fde68a;color:#92400e;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px">${i+1}</span>
            <p style="flex:1;font-size:13px;font-weight:600;color:#1e293b;margin:0;line-height:1.5">${q.question}</p>
            <span style="color:#d97706;font-size:13px">${open?'▲':'▼'}</span>
          </button>
          ${open?`<div style="padding:0 14px 12px;border-top:1px solid #fde68a">
            <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
              <span style="padding:5px 14px;border-radius:8px;font-size:13px;font-weight:800;${isTrue?'background:#d1fae5;color:#065f46;border:1px solid #6ee7b7':'background:#fee2e2;color:#991b1b;border:1px solid #fca5a5'}">${isTrue?'✓  True':'✗  False'}</span>
            </div>
            ${q.explanation?`<p style="font-size:12px;color:#64748b;margin:6px 0 0;line-height:1.6">${q.explanation}</p>`:''}
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`:''}

    ${mcqQs.length?`
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="flex:1;height:1px;background:#99f6e4"></div>
        <span style="font-size:11px;font-weight:800;text-transform:uppercase;color:#0f766e">❓ MCQ (${mcqQs.length})</span>
        <div style="flex:1;height:1px;background:#99f6e4"></div>
      </div>
      ${mcqQs.map((q,i)=>{
        const open=openAns.has(q.id);
        return `<div class="card" style="margin-bottom:8px;overflow:hidden">
          <button onclick="pyToggle('${q.id}')" style="width:100%;text-align:left;padding:14px 16px;display:flex;align-items:flex-start;gap:8px;background:transparent;border:none;cursor:pointer">
            <span style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#ccfbf1;color:#0f766e;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px">${i+1}</span>
            <div style="flex:1;min-width:0">
              <p style="font-size:13px;font-weight:600;color:#1e293b;margin:0 0 6px;line-height:1.5">${q.question}</p>
              ${q.options?`<div>${q.options.map((opt,oi)=>`<p style="font-size:12px;margin:1px 0;padding-left:6px;${open&&oi===q.correctOption?'color:#0f766e;font-weight:700':'color:#64748b'}">${String.fromCharCode(65+oi)}. ${opt}${open&&oi===q.correctOption?' ✓':''}</p>`).join('')}</div>`:''}
            </div>
            <span style="color:#94a3b8;font-size:13px">${open?'▲':'▼'}</span>
          </button>
          ${open?`<div style="padding:0 14px 12px;border-top:1px solid #f1f5f9">
            <div style="margin-top:8px;padding:10px;border-radius:8px;background:#f0fdf4;border:1px solid #86efac">
              <div style="font-size:10px;font-weight:800;text-transform:uppercase;color:#166534;margin-bottom:4px">✓ Correct</div>
              <p style="font-size:13px;color:#1e293b;margin:0">${q.answer}</p>
            </div>
            ${q.explanation?`<p style="font-size:12px;color:#475569;margin:6px 0 0;padding:8px;background:#eff6ff;border-radius:8px">${q.explanation}</p>`:''}
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`:''}
  </div>`;
}

window.pyToggle = (id)=>{
  if(state.pyOpenAns.has(id)) state.pyOpenAns.delete(id);
  else state.pyOpenAns.add(id);
  renderPY();
};

function pyExam() {
  const qs = pyBySheet(state.pySheetId);
  if(state.pyExamDone) return pyResult(qs);
  const q = qs[state.pyExamIdx];
  if(!q) return '';
  const sub = state.pyExamSub.has(q.id);
  const ua = state.pyExamAns[q.id];
  const pct = Math.round(((state.pyExamIdx+1)/qs.length)*100);
  return `<div class="fade" style="max-width:600px;margin:0 auto;padding:24px">
    <button onclick="state.pyView='sheet-select';renderPY()" style="border:none;background:#f1f5f9;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:16px">‹ Back</button>
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:6px">
        <span>Q ${state.pyExamIdx+1} of ${qs.length}</span>
        <span style="display:flex;align-items:center;gap:6px">${q.type==='true-false'?`<span class="badge badge-amber">T/F</span>`:`<span class="badge badge-teal">MCQ</span>`} ${state.pyExamSub.size} answered</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card" style="padding:22px;margin-bottom:12px">
      <p style="font-size:14px;font-weight:700;color:#0f172a;margin:0 0 18px;line-height:1.6">${q.question}</p>
      ${q.type==='mcq'&&q.options?`<div style="display:flex;flex-direction:column;gap:8px">
        ${q.options.map((opt,oi)=>{
          const sel=ua===String(oi);const cor=oi===q.correctOption;
          let bg='#f8fafc',border='#e2e8f0',col='#374151';
          if(sub){if(cor){bg='#f0fdf4';border='#4ade80';col='#166534';}else if(sel){bg='#fff1f2';border='#f87171';col='#991b1b';}else{col='#94a3b8';}}
          else if(sel){bg='#f0fdfa';border='#0d9488';col='#0f766e';}
          return `<button ${sub?'disabled':''} onclick="state.pyExamAns['${q.id}']='${oi}';renderPY()" style="text-align:left;padding:11px 14px;border-radius:10px;border:2px solid ${border};background:${bg};color:${col};font-size:13px;font-weight:600;cursor:${sub?'default':'pointer'}">
            <span style="font-weight:800;margin-right:6px">${String.fromCharCode(65+oi)}.</span>${opt}${sub&&cor?' ✓':''}${sub&&sel&&!cor?' ✗':''}
          </button>`;
        }).join('')}
      </div>`:''}
      ${q.type==='true-false'?`<div style="display:flex;gap:10px">
        ${['True','False'].map(val=>{
          const sel=ua===val;
          const correctAns=q.answer.toLowerCase().startsWith('true')?'True':'False';
          const isCorrect=val===correctAns;
          let bg='#f8fafc',border='#e2e8f0',col='#374151';
          if(sub){if(isCorrect){bg='#f0fdf4';border='#4ade80';col='#166534';}else if(sel){bg='#fff1f2';border='#f87171';col='#991b1b';}else{col='#94a3b8';}}
          else if(sel){bg='#fffbeb';border='#d97706';col='#92400e';}
          return `<button ${sub?'disabled':''} onclick="state.pyExamAns['${q.id}']='${val}';renderPY()" style="flex:1;padding:16px;border-radius:10px;border:2px solid ${border};background:${bg};color:${col};font-size:14px;font-weight:800;cursor:${sub?'default':'pointer'}">${sub&&isCorrect?'✓ ':''}${val}</button>`;
        }).join('')}
      </div>`:''}
      ${sub?`<div style="margin-top:12px;padding:10px;border-radius:8px;background:#f0fdf4;border:1px solid #86efac">
        <div style="font-size:10px;font-weight:800;text-transform:uppercase;color:#166534;margin-bottom:4px">✓ Correct</div>
        <p style="font-size:13px;color:#1e293b;margin:0">${q.answer}</p>
        ${q.explanation?`<p style="font-size:12px;color:#475569;margin:6px 0 0">${q.explanation}</p>`:''}
      </div>`:''}
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="if(state.pyExamIdx>0){state.pyExamIdx--;renderPY();}" ${state.pyExamIdx===0?'disabled':''} style="width:38px;height:38px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;opacity:${state.pyExamIdx===0?.4:1}">‹</button>
      ${!sub?
        `<button onclick="pySubmit('${q.id}',${qs.length-1})" ${ua===undefined?'disabled':''} style="flex:1;height:38px;border-radius:8px;border:none;background:${ua!==undefined?'#0d9488':'#e2e8f0'};color:${ua!==undefined?'#fff':'#94a3b8'};font-size:13px;font-weight:700;cursor:${ua!==undefined?'pointer':'default'}">Submit</button>` :
        `<button onclick="${state.pyExamIdx===qs.length-1?'state.pyExamDone=true;renderPY()':'state.pyExamIdx++;renderPY()'}" style="flex:1;height:38px;border-radius:8px;border:none;background:#059669;color:#fff;font-size:13px;font-weight:700;cursor:pointer">${state.pyExamIdx===qs.length-1?'Results ✓':'Next ›'}</button>`
      }
      <button onclick="if(state.pyExamIdx<${qs.length-1}&&state.pyExamSub.has('${q.id}')){state.pyExamIdx++;renderPY();}" ${state.pyExamIdx===qs.length-1||!sub?'disabled':''} style="width:38px;height:38px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;opacity:${state.pyExamIdx===qs.length-1||!sub?.4:1}">›</button>
    </div>
  </div>`;
}

window.pySubmit = (id, last) => {
  const q = PASTYEAR.find(x=>x.id===id);
  if(!q) return;
  const ua = state.pyExamAns[id];
  if(ua===undefined) return;
  let correct=false;
  if(q.type==='mcq') correct=parseInt(ua)===q.correctOption;
  else { const ca=q.answer.toLowerCase().startsWith('true')?'True':'False'; correct=ua===ca; }
  state.pyExamSub.add(id);
  state.pyExamRes[id]=correct;
  if(state.pyExamIdx===last) setTimeout(()=>{state.pyExamDone=true;renderPY();},600);
  renderPY();
};

function pyResult(qs) {
  const score=Object.values(state.pyExamRes).filter(Boolean).length;
  const pct=Math.round(score/qs.length*100);
  const gr=pct>=80?{bg:'linear-gradient(135deg,#059669,#0d9488)',msg:'Excellent! 🏆'}:pct>=60?{bg:'linear-gradient(135deg,#d97706,#ea580c)',msg:'Good effort!'}:{bg:'linear-gradient(135deg,#e11d48,#dc2626)',msg:'Keep studying!'};
  return `<div class="fade" style="max-width:500px;margin:0 auto;padding:24px">
    <div style="background:${gr.bg};border-radius:20px;padding:28px;color:#fff;text-align:center;margin-bottom:16px">
      <div style="font-size:40px;margin-bottom:6px">🏆</div>
      <div style="font-size:42px;font-weight:900">${pct}%</div>
      <p style="opacity:.9;margin:4px 0">${score}/${qs.length} correct · ${gr.msg}</p>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="state.pyExamIdx=0;state.pyExamAns={};state.pyExamSub=new Set();state.pyExamRes={};state.pyExamDone=false;renderPY()" style="flex:1;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px;font-weight:700;cursor:pointer">↺ Retry</button>
      <button onclick="state.pyView='sheet-select';renderPY()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#0d9488;color:#fff;font-size:13px;font-weight:700;cursor:pointer">Different Sheet</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════
//  DARK MODE
// ═══════════════════════════════════════
window.toggleDark = ()=>{
  const d = document.documentElement.classList.toggle('dark');
  document.getElementById('dark-btn').textContent = d ? '☀️' : '🌙';
  localStorage.setItem('theme', d ? 'dark' : 'light');
};
// Auto-apply saved theme or system dark preference
(()=>{
  const saved = localStorage.getItem('theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(saved==='dark' || (!saved && sysDark)){
    document.documentElement.classList.add('dark');
    setTimeout(()=>{ const b=document.getElementById('dark-btn'); if(b) b.textContent='☀️'; },50);
  }
})();

// ═══════════════════════════════════════
//  RESPONSIVE SIDEBAR
// ═══════════════════════════════════════
window.toggleSidebar = ()=>document.getElementById('sidebar').classList.toggle('open');

function checkMobile() {
  const mob = window.innerWidth<=768;
  document.getElementById('mob-toggle').style.display=mob?'flex':'none';
  document.getElementById('main').style.marginLeft=mob?'0':'260px';
}
window.addEventListener('resize',checkMobile);
checkMobile();

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
showView('dashboard');
</script>
</body>
</html>
