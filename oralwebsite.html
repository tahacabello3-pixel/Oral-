n crown & by cementum in the root & surround pulp soft tissue."},{"term":"DENTIN-PULP COMPLEX","definition":"dentin & pulp are related tissues embryologically, histologically, & functionally forming (DENTIN-PULP COMPLEX)."},{"term":"Predentin","definition":"organic matrix must be formed before mineral deposition so there is always a band of predentin between odontoblasts and the calcified dentin. 10-20 microns uncalcified dentin always present between odontoblasts & the calcified dentin."},{"term":"Mantle Dentin","definition":"outermost layer of primary dentin. Contains Von Korff fibrils (large diameter fibers — perpendicular to basement membrane of inner D.epith; in root Von Korff are parallel to B.M). Less mineralized than circumpulpal D. NO true mantle D in root."},{"term":"Circumpulpal Dentin","definition":"main bulk of primary dentin. One type of collagen: small diameter 0.05 um; more closely packed & interwoven; arranged perpendicular to D.T. Mineralization: globular calcification pattern & combination pattern."},{"term":"Intertubular Dentin","definition":"main body of D.(primary secretory of O.b). Site: between peritubular."},{"term":"Peritubular (Intratubular) Dentin","definition":"hyper mineralized ring of dentin around D.T. Site: In both mantle & circumpulpal D."},{"term":"Dentinal Tubule","definition":"small, canal like spaces extending through the entire thickness of dentin. D.T. number in inner side (near pulp) is 4 times of that of the outer surface. Number near pulpal side about (30000-75000 D.T). Course resembles (S) shape — 1ry curvature. In crown more than root."},{"term":"Von Korff Fibrils","definition":"Large diameter fibers in mantle dentin. Appear first. Below basement membrane of inner D.epith & perpendicular to this B.M. In root Von Korff are parallel to B.M. NO true mantle D in root."},{"term":"Incremental Line of Von-Ebner","definition":"Cause: reflect rhythmic formation of D (period of activity & rest). Distance between lines: 4-8 um daily & less in the root."},{"term":"Contour Line of Owen","definition":"Accentuated I. line (reflect disturbance in calcification). Hypocalcified band."},{"term":"Interglobular Dentin","definition":"Cause: vitamin D deficiency & increase fluoride intake during dentinogenesis → incomplete fusion → areas of deficient mineralization between globules. Site: Chiefly in coronal circumpulpal D close to DEJ (after mantle D). D.T pass uninterrupted through Interglobular dentin (but no peritubular D). Larger than Tomes granular layer."},{"term":"Tomes Granular Layer","definition":"Site: in root dentin only. Does not follow the incremental pattern of dentin. The D.T do not cross tomes granular layer. Common. Seen only in ground section."},{"term":"Sclerotic Dentin (Transparent Dentin)","definition":"Def: regressive alternation in 1ry dentin characterized by calcification of D.T. (defense mechanism). Cause: Mild stimulus (mild abrasion, attrition, caries, aging). In ground section: light in transmitted light, dark in reflected light. Significance: decrease sensitivity and permeability & increase hardness & density."},{"term":"Dead Tract","definition":"Cause: Severe injury or stimulus (severe abrasion, attrition, caries, cavity preparation). Od.process complete retraction or degeneration. D.T. filled with gas or fluid. In ground section: black in transmitted light, white in reflected light. Significance: decrease sensitivity & hardness & density."},{"term":"Reparative Dentin (Tertiary D) (Irregular 2ry Dentin)","definition":"localized dentin formation on pulp dentin border in reaction to severe stimuli as (caries, operative procedure, attrition, erosion). Types: great reduction in number of D.T; Atubular dentin; Osteodentin; Vasodentin."},{"term":"2ry Dentin (Regular Physiologic 2ry Dentin)","definition":"Any dentin formed after complete root formation. Site: All over the pulpal surface in uneven rate; increased in floor & roof of chamber of posterior teeth. Significance: protect from pulp exposure in older teeth."}],"importantPoints":["DENTIN IS A LIVING & VITAL TISSUE (CONTAINS ODONTOBLASTIC PROCESSES & NEURONS)","Inorganic Matter: 70% by wt; Water: 10%; Organic Matter: 20% (90% collagen mostly type I; 8% phosphoprotien, lipids, proteoglycans; 2% ground substance glycoproteins)","dentin & pulp are related tissues embryologically, histologically, & functionally forming (DENTIN-PULP COMPLEX)","Dentin is Resilient: respond to natural masticatory forces (support the brittle Enamel)","Hardness order: Enamel... Dentin...... Cementum & Bone","predentin 10-20 microns uncalcified dentin is always present between odontoblasts & the calcified dentin","D.T. number in inner side (near pulp) is 4 times of that of the outer surface. Number near pulpal side about (30000-75000 D.T)","dentinogenesis begins at the incisal edge or Cusp tip then spreads downward pulp","Neonatal line in dentin: In deciduous & 1st permanent molars","Interglobular Dentin: Site in coronal circumpulpal D close to DEJ; Larger than Tomes granular layer","Tomes granular layer: Site in root dentin only; D.T do not cross it","Pulp dentin complex only sensation is pain (irrespective of type of stimuli) due to presence of free N.endings only","Pain is often diffuse (difficult to locate); most sensitive at DEJ, quite sensitive close to pulp"],"histologicalFeatures":["Mantle dentin: Von Korff fibrils (large, perpendicular to B.M) + small diameter fibers; less mineralized; NO true mantle D in root","Circumpulpal dentin: one type collagen small diameter 0.05 um; perpendicular to D.T; globular & combination calcification patterns","Intertubular dentin: main body of D; between peritubular","Peritubular dentin: hyper mineralized ring around D.T; in both mantle & circumpulpal D","Dentinal tubules: course resembles (S) shape (1ry curvature); 2nd curvature: spiral track; number near pulp 30000-75000; terminal branching near DEJ","Odontoblast: in crown columnar, in middle root cuboidal, in apical part flat; Nucleus oval large basal (toward pulp)","Incremental lines: Von-Ebner (4-8 um daily); Owen (accentuated, hypocalcified); Neonatal line (deciduous & 1st permanent molars)","Interglobular dentin: seen in decalcified section & ground section (appears black); chiefly in coronal circumpulpal D close to DEJ","Tomes granular layer: only in ground section; root dentin only; D.T do not cross it","Sclerotic dentin: light in transmitted light, dark in reflected light (ground section); surrounds dead tract","Dead tract: black in transmitted light, white in reflected light (ground section); increase in coronal dentin, especially areas of narrow pulp horn"],"clinicalNotes":["Pulp dentin complex only sensation is pain (irrespective of type of stimuli) due to presence of free N.endings only. Pain is often diffuse (difficult to locate)","Dentin is not uniformly sensitive: In DEJ(most sensitive); Close to pulp (quite sensitive)","Sclerotic dentin: defense mechanism against mild stimulus (mild abrasion, attrition, caries); decrease sensitivity and permeability & increase hardness & density","Dead tract: caused by severe injury; Od.process complete retraction or degeneration; Reparative dentin is formed below dead tract, Seal of dentinal tubules at pulpal ends","Reparative dentin (Tertiary D): localized dentin formation on pulp dentin border in reaction to severe stimuli (caries, operative procedure, attrition, erosion). Types: great reduction in D.T; Atubular dentin; Osteodentin; Vasodentin","2ry dentin: protect from pulp exposure in older teeth; pulp horn may be obliterated & pulp chamber decrease in size","Ability to repair: Decreased by age (due to decrease in pulp cells metabolism). SO decrease potential of repair","Plexus of Raschkow: Present in permanent & deciduous. Doesn't appear until root is near completion. In roof & lateral wall of coronal pulp not in the root. More nerve fibers & endings in pulp horns"],"flashcards":[{"question":"What is the DEFINITION of Dentin?","answer":"specialized calcified Connective tissue constitutes the main bulk of tooth, Covered by enamel in crown & by cementum in the root & surround pulp soft tissue.\n\nN.B:\ndentin & pulp are related tissues embryologically, histologically, & functionally forming(DENTIN-PULP COMPLEX).\n\nDENTIN IS A LIVING & VITAL TISSUE\n(CONTAINS ODONTOBLASTIC PROCESSES & NEURONS)"},{"question":"What are the PHYSICAL PROPERTIES of Dentin?","answer":"1-very hard: Enamel... Dentin...... Cementum & Bone. Dentin in permanent teeth is harder than deciduous teeth.\n2-Resilient: respond to natural masticatory forces (support the brittle Enamel).\n3-Light yellow (enamel is translucent).\n4-Permeable: to certain molecules\na-from pulp to DEJ\nb-from enamel to dentin reaching the pulp."},{"question":"What are the CHEMICAL PROPERTIES of Dentin?","answer":"1-Inorganic Matter: 70% by wt. Calcium and phosphate in the form of Hydroxyapatite crystals.\n2-Water: 10% by wet.\n3*Organic Matter: 20% by wet & is divided as follows:\n*90% collagen (mostly type I).\n*8% phosphoprotien, lipids, proteoglycans.\n2% ground substance glycoproteins."},{"question":"What are the TYPES OF 1ry DENTIN?","answer":"1-MANTLE DENTIN.\n2-CIRCUMPULPAL DENTIN.\n3-INTERTUBULAR.\n4-PERITUBULAR (INTRATUBULAR) DENTIN."},{"question":"Compare Mantle vs Circumpulpal Dentin.","answer":"MANTLE DENTIN:\n- Von Korff fibrils (large diameter, perpendicular to B.M) + small diameter fibers\n- Less mineralized than circumpulpal\n- Mineralization: linear pattern\n- NO true mantle D in root\n\nCIRCUMPULPAL DENTIN:\n- One type collagen: small diameter 0.05 um\n- More closely packed & interwoven\n- Arranged perpendicular to D.T\n- Mineralization: Globular pattern & Combination pattern"},{"question":"What is the COURSE of the Dentinal Tubule?","answer":"1ry curvature:\nD.T. course resembles (S) shape.\nstarting at right angle from the pulpal surface.\n1st convexity toward apex.\n2nd convexity toward crown.\nN.B: D.T. of areas of incisal edge, cusp & root are almost straight.\n\n2nd curvature:\nD.T exhibit spiral track of odontoblast from the surface to the pulp."},{"question":"Compare Interglobular Dentin vs Tomes Granular Layer.","answer":"INTERGLOBULAR DENTIN:\n- Cause: vit D deficiency & increase fluoride intake → incomplete fusion → deficient mineralization\n- Uncommon\n- Seen in decalcified section & ground section (appears black)\n- Site: chiefly in coronal circumpulpal D close to DEJ (after mantle D)\n- Follows incremental pattern\n- D.T pass UNINTERRUPTED through it (but no peritubular D)\n- LARGER\n\nTOMES GRANULAR LAYER:\n- Common\n- Seen only in ground section\n- Site: root dentin ONLY\n- Does NOT follow incremental pattern\n- D.T do NOT cross it\n- SMALLER"},{"question":"Compare Sclerotic Dentin vs Dead Tract.","answer":"SCLEROTIC DENTIN (Transparent Dentin):\n- Cause: Mild stimulus (mild abrasion, attrition, caries, aging)\n- Od.process is vital & calcify D.T\n- Ground section: light in transmitted light, dark in reflected light\n- Site: surrounds dead tract\n- Significance: DECREASE sensitivity and permeability & INCREASE hardness & density\n\nDEAD TRACT:\n- Cause: Severe injury (severe abrasion, attrition, caries, cavity preparation)\n- Od.process complete retraction or degeneration\n- D.T. filled with gas or fluid\n- Ground section: BLACK in transmitted light, WHITE in reflected light\n- Site: increase in coronal dentin (especially areas of narrow pulp horn)\n- Significance: DECREASE sensitivity & hardness & density"},{"question":"What is Reparative Dentin (Tertiary D)?","answer":"Def: localized dentin formation on pulp dentin border in reaction to severe stimuli as (caries, operative procedure, attrition, erosion).\n\nCause:\nSevere stimuli....od.process is exposed or cut. odontoblast is severely damaged or may degenerate.\n\nTypes:\n1-great reduction in number of D.T.\n2-Atubular dentin.\n3-Osteodentin.\n4-Vasodentin."},{"question":"What is 2ry Dentin (Regular Physiologic 2ry Dentin)?","answer":"Def: Any dentin formed after complete root formation, but the 2ry dentin may be irregular (as in case of reparative dentin) or regular as in this type (regular physiologic 2ry dentin).\n\nSite:\n*All over the pulpal surface in uneven rate.\n*But increased in floor & roof of chamber of posterior teeth.\n*pulp horn may be obliterated & pulp chamber decrease in site.\n\nSignificance: protect from pulp exposure in older teeth."},{"question":"What are the Incremental Lines of Dentin?","answer":"1-Incremental line of Von-Ebner:\n*cause: reflect rhythmic formation of D (period of activity & rest).\n*Distance between lines: 4-8 um daily & less in the root.\n\n2-Contour line of Owen:\n*Accentuated I. line (reflect disturbance in calcification).\n*Hypocalcified band.\n\n3-Neonatal line:\nAccentuated I. Line, separate prenatal line from postnatal line. *In deciduous & 1st permanent molars."}],"blocks":[{"id":"dent-1","type":"heading","title":"DENTIN","content":""},{"id":"dent-2","type":"subheading","title":"INTRODUCTION","content":""},{"id":"dent-3","type":"definition","title":"Def:","content":"specialized calcified Connective tissue constitutes the main bulk of tooth, Covered by enamel in crown & by cementum in the root & surround pulp soft tissue."},{"id":"dent-4","type":"note","title":"N.B:","content":"dentin & pulp are related tissues embryologically, histologically, & functionally forming(DENTIN-PULP COMPLEX)."},{"id":"dent-5","type":"paragraph","content":"*Dentin Contains:\nThe hard tissue protection portion of (dentin-pulp- complex).\n\n*Pulp contains:\n1-odontoblast cell bodies (forming dentin)\n2-vascular system(nutrition of the a vascular dentin)\n3-nerves (sensitivity of dentin)\n4-UMCs (new dentin formation when necessary)"},{"id":"dent-6","type":"important","title":"Ν.Β:","content":"DENTIN IS A LIVING & VITAL TISSUE\n(CONTAINS ODONTOBLASTIC PROCESSES & NEURONS)"},{"id":"dent-7","type":"heading","title":"1* PHYSICAL PROPERTIES :","content":""},{"id":"dent-8","type":"list","content":["1-very hard: Enamel... Dentin...... Cementum & Bone. Dentin in permanent teeth is harder than deciduous teeth.","2-Resilient: respond to natural masticatory forces (support the brittle Enamel).","3-Light yellow (enamel is translucent).","4-Permeable: to certain molecules\na-from pulp to DEJ\nb-from enamel to dentin reaching the pulp."]},{"id":"dent-9","type":"heading","title":"2* CHEMICAL PROPERTIES:","content":""},{"id":"dent-10","type":"list","content":["1-Inorganic Matter: 70% by wt. Calcium and phosphate in the form of Hydroxyapatite crystals.","2-Water: 10% by wet.","3*Organic Matter: 20% by wet & is divided as follows:\n*90% collagen (mostly type I).\n*8% phosphoprotien, lipids, proteoglycans.\n2% ground substance glycoproteins."]},{"id":"dent-11","type":"heading","title":"DENTINOGENESIS","content":""},{"id":"dent-12","type":"subheading","title":"INTRODUCTION","content":""},{"id":"dent-13","type":"list","content":["1-Odontoblasts are differentiated from UMCs under induction of inner dental epithelium.","2-a-dentinogenesis begins at the incisal edge or Cusp tip then spreads downward pulp.\nb- in multicusped teeth -----dentinogenesis begins in the same time each cusp independently in a genetically determined pattern.\n*Then-spreads down the cusp slopes.\nThen-fusion of adjacent formative centers.","3-1ry Dentin is formed till completion of the external Form of tooth (root completion)\n2ry D-after root formation completion in a slower rate & continues after establishment of tooth anatomy."]},{"id":"dent-14","type":"paragraph","content":"*Any hard tissue formed by two steps:\n1-organic matrix formation (predentin).\na-collagen fibers.\nb-synthesis of ground substance.\n2-mineralization."},{"id":"dent-15","type":"important","title":"TYPES OF 1ry DENTIN","content":"1-MANTLE DENTIN.\n2-CIRCUMPULPAL DENTIN.\n3-INTERTUBULAR.\n4-PERITUBULAR (INTRATUBULAR) DENTIN."},{"id":"dent-16","type":"heading","title":"A-MANTLE DENTIN","content":""},{"id":"dent-17","type":"subheading","title":"I)Organic Matrix Formation (Predentin ):","content":""},{"id":"dent-18","type":"subheading","title":"1.Collagen Fibers:","content":""},{"id":"dent-19","type":"paragraph","content":"*collagen synthesis:\n*mRNA from Nucleus to Ribosome's on cisternae of rER where its transcript.\n*Protein Synthesis (procollagen)by Ribo & Transported to rEN cisternae.\n*This procollagen is transported in transport vesicles to Golgi complex packed in transport (secretory) vesicles.\n*secretory vesicles secretes the procollagen which is aggregated to form visibly banded collagen."},{"id":"dent-20","type":"paragraph","content":"The collagens in Mantle dentin are of 2 types:\n1-Von Korff fibrils (large diameter fibers)\n*appears first.\n*below basement mem of inner D.epith & perpendicular to this B.M.\n*in root vonkorff are parallel to B.M.\n*NO true mantle D in root\n\n2-Small diameter fibers:\n*after von korff\n*running randomly between odontoblasts (formed by newly differentiated odontoblast)"},{"id":"dent-21","type":"subheading","title":"2-Ground Substance(synthesis)","content":""},{"id":"dent-22","type":"paragraph","content":"a)similar synthetic pathway of collagen in odontoblasts.\nb)G. subst incorporates some of the preexisting G.subst of the dental papilla.\n\n*during collagen synthesis odontoblasts:\nincrease in size.\nDevelop alkaline phosphates activity along cell mem.(this activity probably associated with transport of calcium into cells)."},{"id":"dent-23","type":"subheading","title":"II) Mineralization:","content":""},{"id":"dent-24","type":"paragraph","content":"Calcification of predentin (begins when a fairly band of predentin is laid down).\nN.B.organic matrix must be formed before mineral deposition so there is always a band of predentin between odontoblasts and the calcified dentin."},{"id":"dent-25","type":"paragraph","content":"2)by matrix vesicles (M.V):\na- M.V.is secreted from odontoblast &contains 1 crystal.\nb- crystal grows rapidly ---rupture from M.V.\nc- crystals spread as cluster of crystallites.\nd-fusion of adjacent clusters ---forming small islands.\ne-fusion of adjacent islands---forming a continuous layer.\n\n*Calcification of mantle dentin occurs in a linear pattern.\n*Mantle D.is less mineralized than circumpulpal D."},{"id":"dent-26","type":"heading","title":"B-Circumpulpal dentin:","content":""},{"id":"dent-27","type":"subheading","title":"I-organic matrix formation:","content":""},{"id":"dent-28","type":"paragraph","content":"a.Collagen fibers:\n*synthesis:similar to mantle.d.\n*one type of collagen small diameter 0.05 um.\n\nOrganic matrix formation:\ncollagen fibers:\na-synthesis :similar to mantle.\nb-there is one type of collagen:\n-small diameter.\n-more closely packed & interwoven with each other.\n-arranged perpendicular to D.T.\n-collagen fibers in crown &roots are similar.\n\n2)Ground substance:\na-similar pathway as collagen.\nb-G.substance is a product of odontoblast only Because O.b are contact (no G.subst.from D.papilla)"},{"id":"dent-29","type":"subheading","title":"II) Mineralization:","content":""},{"id":"dent-30","type":"paragraph","content":"1- calcification of predentin (begins when a fairly wide band of predentin is laid down)\n2-Calcification occurs by 2 patterns:\na)Globular calcification pattern:\n*deposition of crystals in several areas in the same time.\n*with continuous mineralization globular masses develop then enlarge and fuse forming a single calcified mass.\n*seen principally in 1 layer of circumpulpal D(after mantle).\n\nb)Combination pattern:\n*globular phase alternating with linear phase.\n*in the rest of circumpulpal D."},{"id":"dent-31","type":"heading","title":"C-INTERTUBULAR DENTIN:","content":""},{"id":"dent-32","type":"paragraph","content":"definition: main body of D.(primary secretory of O.b) site: between peritubular."},{"id":"dent-33","type":"heading","title":"D-PERITUBULAR (INTRATUBULAR) DENTIN.","content":""},{"id":"dent-34","type":"paragraph","content":"Def: hyper mineralized ring of dentin around D.T. Site: In both mantle & circumpulpal D."},{"id":"dent-35","type":"heading","title":"Structure of dentin:","content":""},{"id":"dent-36","type":"list","content":["1-dentin is characterized by the presnce of closely packed dentinal tubules D.T. which contain one odontoblastic process in at least part of their length.","2-while the odontoblast cell bodies are on the periphery of the pulp, predentin 10-20 microns uncalcified dentin is always present between odontoblasts & the calcified dentin.","3-surrounding & enclosing the D.T. is an extracellular matrix of dentin:\n1-randomly arranged collagen.\n2-ground substance.\n3-hydroxyapatite crystals"]},{"id":"dent-37","type":"paragraph","content":"calcified matrix of dentin can be classified:\n1-According to relation to the D.T in to 2 types:\n*intertubular dentin.\n2-According to the site into :\n*peritubular dentin.\n*mantle dentin. *circumpulpal dentin."},{"id":"dent-38","type":"subheading","title":"***1-Dentinal tubule:","content":""},{"id":"dent-39","type":"paragraph","content":"1-Def: small, canal like spaces extending through the entire thickness of dentin.\n2-Branching:\n*terminal branching: Leads to increase in D.T per unit area in mantle dentin (near DEJ)\n*lateral branches (Canaliculi):\n1-branches at right angles to the main D.T.\n2-1um (micron) diameter.\n3-may have lateral Cytoplasmic extensions of od.process."},{"id":"dent-40","type":"paragraph","content":"3-number per unit area:\n*D.T. number in inner side (near pulp) is 4 times of that of the outer surface.\n*Number near pulpal side about (30000-75000 D.T)\n*In crown more than root.\n\n4-Course:\n1ry curvature:\nD.T. course resembles (S) shape.\nstarting at right angle from the pulpal surface.\n-1st convexity toward apex.\n2nd convexity toward crown.\nN.B: D.T. of areas of incisal edge, cusp & root are almost straight.\n\n2nd curvature:\nD.T exhibit spiral track of odontoblast from the surface to the pulp."},{"id":"dent-41","type":"paragraph","content":"6-Content:\n-D.T. is filled with tissue fluid.\nand occupied by odontoblastic process in part or all their length.\n-in early stages of development the od.process Occupies the entire length of D.T. while in adult dentin the process varies in extension SO D.T:\n*near perphial dentin: amorphous noncellular material.\n*intermediate dentin: some D.T. contain only noncellular material.\n-Others contain od. Process.\n-*inner dentin: all D.T.contain tissue fluid.\nall D.T.contain od.process.\nmost contain sensory nerve terminals."},{"id":"dent-42","type":"subheading","title":"2-Odontoblastic process:","content":""},{"id":"dent-43","type":"paragraph","content":"*Def: Cytoplasmic process of odontoblast occupying D.T.\n*Function: share in peritubular dentin formation, its terminal end may extend between ameloblasts & trapped in enamel...... E. spindle."},{"id":"dent-44","type":"subheading","title":"3-Odontoblast:","content":""},{"id":"dent-45","type":"paragraph","content":"Origin: UMCs of dental papilla.\nSite: on the periphery of the pulp(forming a layer) & extending their process in D.T.\nShape: in crown columnar, in middle root cuboidal, in apical part flat.\nNucleus: oval, large, basal (toward pulp).\nFunction: dentin matrix formation & dentin matrix calcification."},{"id":"dent-46","type":"subheading","title":"4-Incremental lines of dentin:","content":""},{"id":"dent-47","type":"paragraph","content":"1-Incremental line of Von- Ebner:\n*cause: reflect rhythmic formation of D (period of activity & rest).\n*Distance between lines: 4-8 um daily & less in the root.\n\n2-Contour line of Owen:\n*Accentuated I. line (reflect disturbance in calcification).\n*Hypocalcified band.\n\n3-Neonatal line:\nAccentuated I. Line, separate prenatal line from postnatal line. *In deciduous & 1st permanent molars."},{"id":"dent-48","type":"subheading","title":"5-Interglobular Dentin:","content":""},{"id":"dent-49","type":"paragraph","content":"A- Cause: in cases such as (vitamin D deficiency & increase fluoride intake) during dentinogenesis lead to in complete fusion, areas of deficient mineralization between globules.\nB- Uncommon.\nC-Seen in decalcified section. Seen in ground section(replaced by air appears black).\nD- Site: Chiefly in coronal circumpulpal D close to DEJ. (after mantle D).\nE- Follows the incremental pattern of dentin.\nF-D.T pass uninterrupted through Interglobular dentin (but no peritubular D).\nG- Larger then Tomes granular layer."},{"id":"dent-50","type":"subheading","title":"6-Tomes granular layer:","content":""},{"id":"dent-51","type":"paragraph","content":"A-cause:3 theories:\na-May be similar to mode of formation of Interglobular D (but smaller).\nb-interference with mineralization of the entire surface layer of root D before the beginning of cementum formation.\nc-Looping of the terminal portions of D.T.\nB-Common.\nC-Seen only in ground section.\nD-Site in root dentin only.\nF- Does not follow the incremental pattern of dentin.\nG-The D.T do not cross tomes granular layer."},{"id":"dent-52","type":"heading","title":"BLOOD SUPPLY & INNERVATION:","content":""},{"id":"dent-53","type":"paragraph","content":"A-Blood supply: in the pulp there is an extensive capillary network.\nsite:\n*Just below odontoblasts (in sub odontoblastic region).\n*Some terminal capillaries may extend upwards between od.blast.\n\nB-Innervation: nerves enter with afferent blood vessels & generally follow similar course.\nNerves are mixed: myelinated and unmyelinated.\n\n1-unmyelinated (sympathetic):\n*Run along B.V. have terminals on smooth muscle cells of large B.V. wall(control contraction).\n*Few sympathetic N.endings located among od. blasts may induce dentinogenesis.\nLater to reparative dentin in response to stimuli (e.g. cavity preparation).\n\n2-Myelinated (sensory):\nA-Mediate pain only (irrespective of type of stimuli) due to presence of free N. endings only.\nB- The majority follow distribution of B.V."},{"id":"dent-54","type":"paragraph","content":"Course of the myelinated nerves:\n1-Once entered pulp chamber increases branching forming interlacing network of Nerve fibers adjacent to cell rich zone it is called:\nPlexus of Raschkow or sub odontoblastic plexus or parietal layer of nerves.\n*Present in permanent &deciduous.\n*Doesn't appear until root is near completion.\n*In roof & lateral wall of coronal pulp not in the root.\n2-Theres more nerve fibers & endings in pulp horns than in other peripheral areas of pulp.\n3-Most of nerve bundles terminate in the plexus."},{"id":"dent-55","type":"heading","title":"Sensitivity of Dentin:","content":""},{"id":"dent-56","type":"paragraph","content":"1-Pulp dentin complex only sensation is pain (irrespective of type of stimuli) due to presence of free N.endings only.\n2-Pain is often diffuse (difficult to locate).\n\n*Dentin is not unitormly sensitive:\n-In DEJ(most sensitive).\n-Close to pulp (quite sensitive)."},{"id":"dent-57","type":"heading","title":"AGE AND FUNCTIONAL CHANGES IN DENTIN","content":""},{"id":"dent-58","type":"subheading","title":"1-Changes in 1ry Dentin:","content":""},{"id":"dent-59","type":"paragraph","content":"Remember that 1ry dentin is that formed till root completion\n*By age gradual decrease in diameter of D.T.( due to continuous peritubular D. formation).\nThis may decrease permeability & sensitivity."},{"id":"dent-60","type":"subheading","title":"2-Sclerotic dentin (transparent dentin):","content":""},{"id":"dent-61","type":"paragraph","content":"Def: regressive alternation in 1ry dentin which is characterized by calcification of D.T. (It is a defense mechanism)\ncause: Mild stimulus:\ne.g.:\n-Mild abrasion, attrition, caries, cav. Preparation.\n-Aging of the root (increase near apex) or crown (increase midway between DEJ & PULP).\n-These stimuli's lead to:\nThe od.process is vital & calcify D.T. either by:\n1-producing collagen &apatite crystals.\n2-od.process undergo fatty degeneration &then calcification occurs in the D.T. 3-D.T is occluded by dentin.\n\nShape:\n*in ground section:\n-light in transmitted light.\n-dark in reflected light.\nSite: surround dead tract.\nSignificance: decrease sensitivity and permeability & increase hardness & density."},{"id":"dent-62","type":"clinical","title":"3-Dead tract: (a pathological case)","content":"Cause:\nSever injury or stimulus:\n-Severe abrasion, attrition, caries, cavity preparation.\n-Od.process complete retraction or degeneration.\nReparative dentin is formed below dead tract, Seal of dentinal tubules at pulpal ends, D.T. filled with gas or fluid.\n\nShape: in ground section empty D.T. trap air so appear:\n*black in transmitted light.\n*white in reflected light.\nSite: increase in coronal dentin(especially areas of narrow pulp horn) Surrounded by bands of sclerotic dentin.\nSignificance: decrease sensitivity & hardness & density."},{"id":"dent-63","type":"clinical","title":"4-Reparative dentin (Tertiary D) (irregular 2ry dentin):","content":"Def: localized dentin formation on pulp dentin border in reaction to severe stimuli as (caries, operative procedure, attrition, erosion).\n\nCause:\nSevere stimuli....od.process is exposed or cut. odontoblast is severely damaged or may degenerate.\n\nTypes:\n1-great reduction in number of D.T.\n2-Atubular dentin.\n3-Osteodentin.\n4-Vasodentin."},{"id":"dent-64","type":"subheading","title":"5-2ry dentin (regular or physiologic 2ry dentin):","content":""},{"id":"dent-65","type":"paragraph","content":"Def: Any dentin formed after complete root formation, but the 2ry dentin may be irregular (as in case of reparative dentin )or regular as in this type (regular physiologic 2ry dentin).\n\nSite:\n*All over the pulpal surface in uneven rate.\n*But increased in floor & roof of chamber of posterior teeth.\n*pulp horn may be obliterated & pulp chamber decrease in site.\nSignificance: protect from pulp exposure in older teeth."},{"id":"dent-66","type":"subheading","title":"6-Ability to repair:","content":""},{"id":"dent-67","type":"paragraph","content":"*Decreased by age (due to decrease in pulp cells metabolism). SO decrease potential of repair."}],"giveReasons":[{"reason":"Dentin is sensitive despite having no nerve endings in most of its substance","explanation":"According to the Hydrodynamic Theory (Brannstrom), fluid movement within the dentinal tubules — caused by thermal, osmotic, tactile, or evaporative stimuli — displaces the fluid rapidly, stimulating mechanosensitive A-delta nerve fibers located at the pulp-dentin junction (plexus of Raschkow), which transmit pain signals.","cat":"physiological"},{"reason":"Secondary dentin is deposited throughout life","explanation":"Because odontoblasts remain viable in the pulp as long as the tooth is vital. After root formation is complete, they continue to deposit dentin on all pulpal walls at a slow but continuous rate, physiologically reducing the size of the pulp chamber and root canals with age.","cat":"physiological"},{"reason":"Tertiary (reparative/reactionary) dentin is formed in response to injury","explanation":"Because when odontoblasts are mildly stimulated by caries, cavity preparation, or attrition, they increase their dentin production rate. When odontoblasts are destroyed, undifferentiated mesenchymal cells differentiate into new odontoblast-like cells that form reparative (atubular) dentin — a protective barrier sealing off the pulp.","cat":"physiological"},{"reason":"Interglobular dentin occurs","explanation":"Because during dentin mineralization, calcium salts are deposited as small spherical calcification units (calcospherites). In vitamin D deficiency or excess fluoride, the calcospherites fail to fuse, leaving gaps of unmineralized dentin matrix between them, appearing as dark areas in ground sections.","cat":"histological"},{"reason":"Dead tracts form in dentin","explanation":"Because when odontoblastic processes degenerate completely (from severe abrasion, attrition, caries, or operative procedures), the tubules are evacuated and fill with gas (air). In transmitted light these air-filled tubules appear black; in reflected light they appear white. Reparative dentin forms beneath dead tracts to seal the pulp.","cat":"histological"},{"reason":"Sclerotic (transparent) dentin forms as a defense mechanism against mild chronic stimulation","explanation":"Because when odontoblasts are mildly and chronically stimulated, they deposit peritubular dentin progressively, occluding the tubule lumen with mineral. Completely obliterated tubules have the same refractive index as surrounding dentin, making them 'transparent' in ground sections. This decreases dentin sensitivity and permeability, protecting the pulp.","cat":"histological"}]},{"id":7,"slug":"cementum","title":"Cementum","subtitle":"الشيت السابع","category":"hard-tissue","summary":"Calcified C.T. covering the anatomical root. Part of periodontium (cementum, PDL, alveolar bone & gingiva). Cementum = Compact bone in physical, chemical & structural properties EXCEPT: avascular (no Haversian canals, no blood vessels, no nerves); can not remodel; highly resistant to resorption. Inorganic 45-50%, organic+water 50-55%.","keywords":["cementoblast","cementocyte","acellular cementum","cellular cementum","Sharpey's fibers","intermediate cementum","afibrillar cementum","hypercementosis","cementoid","CEJ","CDJ","incremental lines of Salter","reversal line","Hertwig","epithelial rests of Malassez","excementosis"],"keyDefinitions":[{"term":"Cementum","definition":"Calcified C.T. covering the anatomical root."},{"term":"Cementoid","definition":"Uncalcified matrix of Cementum. Continuous formation: Cementoid is formed while the previous layer is calcified and so on — so there is a cementoid layer all time. Structure: Fibers (Collagen: Extrinsic Sharpey's from PDL + Intrinsic from cementoblasts) + Ground substance (Proteoglycans/glycoproteins/phosphoproteins) + C.blast on surface."},{"term":"Acellular Cementum","definition":"The 1st formed C layer. Thin layer. Site: predominates in coronal 1/2 of the root. More calcified. Extrinsic fibers (Sharpey's) 90% + Intrinsic 10%. No cells inside. Less permeable. Slow rate of development."},{"term":"Cellular Cementum","definition":"Formed after acellular C. Gradually increased in thickness towards apex. Site: predominates in apical half. Less calcified. Extrinsic roughly = Intrinsic in proportion. Contains cementocytes in lacunae. More permeable. Rapid rate of development."},{"term":"Sharpey's Fibers","definition":"Extrinsic fibers from PDL embedded in C. matrix. Most fibers (90%) of Acellular C. The embedded portion of PDL fibers in C. is called Sharpey's fibers. Fully mineralized. Appear as dark lines in ground section (disintegrated & their spaces are filled with air)."},{"term":"Cementoblasts","definition":"Origin: UMCs of tooth follicle (D. sac) [Inner part of D. sac (near root)]. Site: On surface of cementum (cementoid) (between bundles of PDL fibers). Active shape: Round plump cells with Basophilic cytoplasm (RER) — organelles associated with protein synthesizing & secreting cells. Function: Synthesis of intrinsic F. & ground substance; Role in remodeling of the PDL & cementum."},{"term":"Cementocytes","definition":"Origin: Cementoblasts entrapped in mineralized matrix. Site: In lacunae (as osteocytes). Shape: oval/spiderlike with numerous cytoplasmic processes in canaliculi. Most processes directed to PDL surface (source of nutrition as C. is avascular). As cells are deeper → show signs of degeneration. Lacunae & Canaliculi best seen in ground sec. (black spaces with radiating canaliculi)."},{"term":"Intermediate Cementum","definition":"Intermediate layer of cement on surface of root Dentin (covers the mantle D.). Site: Between Tomes' granular layer & cementum; predominates in apical 2/3 of posterior teeth; rare in anterior & deciduous teeth. Structure: Amorphous hyaline layer 10 um thickness; Non cellular; Non collagenous; highly mineralized (nearly identical to aprismatic Enamel). Origin: formed by ERSH before its fragmentation."},{"term":"Afibrillar Cementum","definition":"Thin layer of well mineralized ground substance. Difficult to identify by light microscope. Site: randomly distributed; may cover cervical Enamel when UMC of sac contact E.; may intervene between fibrillar C. & Dentin. Origin: may be epithelial origin."},{"term":"Incremental Lines of Salter","definition":"Lines indicating successive formation of cementum (separating the increments). Structure: Highly mineralized / more G. substance / less collagen fibers than other portions of C. Best seen in decalcified sections by L.M. Difficult in EM."},{"term":"Reversal Line","definition":"Between old & new (repair) cementum. Seen by L/M. (2nd incremental line). It is scalloped where: convexities towards old cementum & concavities towards new (repair) cementum."},{"term":"Hypercementosis","definition":"Abnormal thickening of cementum. Types: Generalized (all teeth, eg. Paget's disease) Or Localized (one tooth: Diffuse whole root or limited area). Localized hypertrophy: seen in teeth exposed to stress — area for attachment of Sharpey's fibers → anchorage to alveolar bone. Excementosis: localized hyperplastic cementosis around degenerated epith rests → forming calcified knob like projections."},{"term":"CEJ relationships","definition":"30% of teeth: sharp line meeting between E & C. 10% (Gap) exposed D.: when part of ERSH of cervical portion delayed in degeneration → D. sac doesn't contact dentin → No C. formation → ERSH remain attached to dentin → Enamel pearl (E. drop) developed. 60%: Cementum overlaps cervical enamel — when RDE degenerates on cervical E., contact between C.T. & Enamel → afibrillar Cementum formation."}],"importantPoints":["Def: Calcified C.T. covering the anatomical root","Part of periodontium (cementum, PDL, alveolar bone & gingiva)","Cementum = Compact bone EXCEPT: (1) avascular — no Haversian canals, no blood vessels, no nerves; (2) can not remodel; (3) highly resistant to resorption","Chemical: Inorganic 45-50%; Water & Organic 50-55%. N.B: Cementum has the highest fluoride content of all mineralized tissues","Variable Thickness: 20-50 um at CEJ; 150-200 um at root tip (around apical foramen)","Acellular C: 1st formed; coronal 1/2; Sharpey's 90%; no cementocytes; slow; more calcified","Cellular C: formed after acellular; apical half; extrinsic=intrinsic; cementocytes in lacunae; rapid; less calcified","CEJ: 60% C overlaps E; 30% meeting; 10% gap (exposed dentin)","Most processes of cementocytes directed to PDL surface (PDL is source of nutrition of avascular cementum)","Deepest cementocytes (60 um or more from PDL) → signs of degeneration → empty lacunae (proof PDL is source of nutrition)","Reversal line: scalloped — convexities towards old cementum & concavities towards new repair cementum","C is more resistant to resorption than bone. No dentin repair — C is the major reparative tissue of the root"],"histologicalFeatures":["Acellular C: calcified G.substance + Sharpey's fibers (dark lines in ground section, disintegrated/air-filled) + intrinsic fibers (few, 10%) + cementoblasts on cementoid surface","Cellular C: calcified G.substance (less mineralized) + extrinsic=intrinsic fibers + cementoid + cementoblasts on surface + cementocytes in lacunae","Cementoid: uncalcified matrix; always present; extrinsic+intrinsic fibers + G.substance + cementoblasts on surface","Intermediate C: amorphous hyaline 10 um; non-cellular; non-collagenous; highly mineralized; between Tomes' layer & cementum","Afibrillar C: thin; well-mineralized G.substance; difficult in L.M.; cervical enamel or between fibrillar C & dentin","Cementodentinal Junction: relatively smooth in permanent; scalloped sometimes in deciduous; C more electron dense than D; distinct bundles vs haphazard arrangement","Incremental lines of Salter: highly mineralized; more G.substance; less collagen; best in decalcified sections","Lacunae & Canaliculi: best seen in ground section (black spaces with radiating canaliculi)"],"clinicalNotes":["C is more resistant to resorption than bone. Resorption can occur after: trauma; increased occlusal forces; orthodontic movements (to small extent)","After stop of resorption repair may occur by cellular or acellular cementum: Anatomical repair (restores previous outline); Functional repair (thin layer only, outline not repaired)","No dentin repair — C is the major reparative tissue of the root","Hypercementosis: abnormal thickening. Generalized: Paget's disease. Localized hypertrophy: stress/increased occlusal forces — adds Sharpey's fibers anchorage area. Excementosis: calcified knob projections around degenerated epith rests","CEJ gap (10%): exposed dentin → sensitivity at recession. Enamel pearl (E. drop) may develop from ERSH remaining attached","Permeability decreases by age; from PDL side is lost except most recently formed layer; from Dentin remains (apical region only)","Exposed cementum (periodontal pocket): Ca2+ & PO4 & F from saliva → hypermineralized surface"],"flashcards":[{"question":"What is Cementum? What are the EXCEPTIONS making it different from bone?","answer":"Def: Calcified C.T. covering the anatomical root.\nN.B. Part of periodontium (cementum, PDL, alveolar bone & gingiva)\n\nCementum = Compact bone in physical, chemical & structural properties.\nEXCEPT THAT CEMENTUM:\n1- Is avascular (No Haversian canals, no blood vessels) & No Nerves in its matrix.\n2- Can not remodel.\n3- Highly resistant to resorption."},{"question":"What are the PHYSICAL PROPERTIES of Cementum?","answer":"1- Less hard than Dentin.\n2- Light yellow & lacks luster.\n3- Semi Permeable.\n(Cellular C. more permeable than Acellular C.)\n4- Variable Thickness:\n20-50 um at CEJ.\n& increase gradually 150-200 um root tip (around apical foramen)"},{"question":"What is the CHEMICAL COMPOSITION of Cementum?","answer":"Inorganic Portion: 45-50% by wt.\nCa & PO4 (hydroxyapatite plate like crystals). Trace elements.\nN.B. (C. has the highest fluoride content of all mineralized tissues)\n\nWater & Organic portion: 50-55%\nFibers: Collagen (mostly type I).\nAmorphous Ground Substance (proteoglycans, glycoproteins & phosphoproteins)."},{"question":"Compare Acellular vs Cellular Cementum.","answer":"ACELLULAR:\n- 1st formed C. (during tooth eruption)\n- Thin layer; Slow development\n- Site: predominates in coronal 1/2 of the root\n- More calcified\n- Extrinsic fibers (Sharpey's) 90% + Intrinsic 10%\n- No cells inside\n- Less permeable\n\nCELLULAR:\n- Formed after acellular C. (tooth in occlusion)\n- Gradually increased in thickness towards apex; Rapid development\n- Site: predominates in apical half; thick in multirooted teeth\n- Less calcified\n- Extrinsic roughly = Intrinsic in proportion\n- Cementocytes in lacunae\n- More permeable"},{"question":"What is Intermediate Cementum? What are its features?","answer":"Def: Intermediate layer of cement on surface of root Dentin (covers the mantle D.).\nSite: Between Tomes' granular layer & cementum; predominates in apical 2/3 of posterior teeth; rare in anterior & deciduous teeth.\n\nStructure:\n→ Amorphous hyaline layer 10 um thickness.\n→ Non cellular (No od. process / No cementocytes)\n→ Non collagenous\n→ Highly mineralized more than adjacent D. or cementum. [Nearly identical to aprismatic Enamel]\n\nFunctions:\n1- Furnish attachment of Sharpey's fibers to root surface.\n2- Seal surface of sensitive root dentin.\n3- Cement cementum to Dentin."},{"question":"What are the THREE CEJ RELATIONSHIPS?","answer":"30% of teeth: sharp line meeting between E & C.\n\n10% (Gap) (exposed D.): when part of ERSH of cervical portion of root delayed in degeneration → D. sac doesn't contact dentin → No C. formation → ERSH Remain attached to dentin → Enamel pearl (E. drop) is developed.\n\n60%: Cementum overlaps cervical enamel. When RDE degenerates on cervical E. → contact between C.T. & Enamel → afibrillar Cementum formation.\nN.B. if this afibrillar contacts C.T. cells for enough time fibrillar C. is formed on it."},{"question":"What is Hypercementosis? List its types.","answer":"Def: Abnormal thickening of cementum.\n\nTypes: Generalized (all teeth) (eg. paget's disease) Or localized (one tooth).\nLocalized can be Diffuse (whole root) Or limited to smaller area of root.\n\nLocalized Cementum hypertrophy:\n- When: Overgrowth improves functional quality of cementum\n- Seen in: Teeth exposed to stress\n- Sharpey's: area for attachment of Sharpey's fibers → anchorage to alveolar bone\n\nN.B. Excementosis: Localized hyperplastic cementosis on top of Enamel drops. Or develop around degenerated epith rests → forming calcified knob like projections."},{"question":"What is Resorption & Repair of Cementum?","answer":"1- C is more resistant to resorption than bone.\nHowever C. resorption can occur after: Trauma; ↑ occ. Forces; orthodontic movements (to small extent).\n\n2- After stop of resorption Repair may occur by cellular or acellular cementum.\n\n3- Types of repair:\nAnatomical Repair: When the repair established the previous outline of the tooth.\nFunctional Repair: If only thin layer of cementum formed on deep resorption (outline not repaired).\n\nNB: no dentin repair — C is the major reparative tissue of the root.\n\n4- Reversal line is present: between old & new (repair) cementum. Scalloped: convexities towards old cementum & concavities towards new (repair) cementum."},{"question":"What are the FUNCTIONS of Cementum?","answer":"1- 1st function: medium for Attachment of fibers bundles that bind the tooth to bone.\n2- Serves as the major reparative tissue for root surface. (resorption or repair)\n3- Helps in functional adaptation of tooth (hypertrophy):\n• Cementum deposition apically compensates for the loss of tooth substance from occlusal wear.\n• growth of C. is essential for the continuous eruptive movement of the functioning teeth."}],"blocks":[{"id":"cem-1","type":"heading","title":"Cementum","content":""},{"id":"cem-2","type":"subheading","title":"Introduction:","content":""},{"id":"cem-3","type":"definition","title":"Def:","content":"\"Calcified C.T. covering the anatomical root\"."},{"id":"cem-4","type":"note","title":"N.B.","content":"It's a part of periodontium (cementum, PDL, alveolar bone & gingiva)"},{"id":"cem-5","type":"important","title":"N. B. Cementum = Compact bone in physical, chemical & structural properties.\nEXCEPT THAT CEMENTUM:","content":"1- Is avascular (No Haversian canals, no blood vessels) & No Nerves in its matrix.\n2- Can not remodel.\n3- Highly resistant to resorption."},{"id":"cem-6","type":"subheading","title":"* Physical properties:","content":""},{"id":"cem-7","type":"list","content":["1- Less hard than Dentin.","2- Light yellow & lacks luster.","3- Semi Permeable.\n(Cellular C. more permeable than Acellular C.)","4- Variable Thickness:\n20-50 um at CEJ.\n& increase gradually 150-200 um root tip (around apical foramen)"]},{"id":"cem-8","type":"subheading","title":"* Chemical Composition:","content":""},{"id":"cem-9","type":"paragraph","content":"organic Portion: 45-50% by wt.\nCa & PO4 (hydroxyapatite plate like crystals).\nTrace elements.\nN.B. (C. has the highest fluoride content of all mineralized tissues)\n\nWater & Organic portion: 50-55%\nFibers: Collagen (mostly type I).\nAmorphous Ground Substance (proteoglycans, glycoproteins & phosphoproteins)."},{"id":"cem-10","type":"important","title":"Comparison Table: Enamel / Dentin / Cementum / Bone","content":"Enamel — Inorganic: 96% | Organic+Water: 4% (organic 1-2%, water 2-3%)\nDentin — Inorganic: 65-70% | Organic+Water: 30-35% (organic 20%, water 10%)\nCementum — Inorganic: 45-50% | Organic+Water: 50-55%\nBone — similar to Cementum"},{"id":"cem-11","type":"heading","title":"Structure","content":""},{"id":"cem-12","type":"subheading","title":"أولا Types of cementum:","content":""},{"id":"cem-13","type":"heading","title":"A) Acellular Cementum:","content":""},{"id":"cem-14","type":"paragraph","content":"The 1st formed C layer.\n* thin layer\n* Site predominates in coronal 1/2 of the root.\nMay cover all of the root but often missed in apical 1/3\n\"apical 1/3 covered by cellular C. only\""},{"id":"cem-15","type":"subheading","title":"Structure.","content":""},{"id":"cem-16","type":"paragraph","content":"* Calcified ground substance.\n* Collagen fibers:\na) Extrinsic fibers (Sharpey's fibers):\n→ Most fibers (90%)\n→ From PDL (extrinsic)\n→ Fully mineralized.\n→ to cemento-dentinal junction.\n→ Appear as dark lines in ground section.\n(disintegrated & their spaces are filled with air)\n\nb) Intrinsic fibers:\n→ Few (10%)\n→ from cementoblasts (intrinsic)\n→ mineralized\n→ randomly between extrinsic fibers.\n\nOn the surface of Acellular C. there are (Cementoblast on cementoid)."},{"id":"cem-17","type":"subheading","title":"Cementoid:","content":""},{"id":"cem-18","type":"definition","title":"Cementoid","content":"Def. \"Uncalcified matrix of Cementum\"\nContinuous formation: Cementoid is formed formation of 2nd layer while the 1st layer is calcified and so on so there is a cementoid layer all time.\n\nStructure.\n→ Fibers (Collagen):\n• Extrinsic (Sharpey's) from PDL\n• Intrinsic (from cementoblasts).\n→ Ground substance (Proteoglycans/glycoproteins/phosphoproteins).\n→ C.blast on surface."},{"id":"cem-19","type":"subheading","title":"Cementoblasts:","content":""},{"id":"cem-20","type":"paragraph","content":"Origin. UMCs of tooth follicle (D. sac) [Inner part of D. sac (near root)]\nSite. On surface of cementum (cementoid) (between bundles of PDL fibers)\n\n* Shape of active C.blast.\nRound plump cells with Basophilic cytoplasm (RER).\nEM → organelles associated with protein synthesizing & secreting cells (صفات 7)\n\nN.B. Resting cementoblasts:\n(Rounded / smaller / little cytoplasm / few organelles)\n\nFunction.\n1- Synthesis of intrinsic F. & ground substance (mRNA rER Golgi vesicles...).\n2- Role in remodeling of the PDL & cementum in certain cases."},{"id":"cem-21","type":"heading","title":"B) Cellular Cementum:","content":""},{"id":"cem-22","type":"paragraph","content":"* formed after acellular C.\n* Gradually increased in thickness towards apex.\n* Site:\n• Predominates in apical half.\n• Usually seen on surface of Acellular cementum.\n• But the layers of cellular & Acellular C. may alternate in any pattern.\n• Less in anterior but thick in multirooted teeth."},{"id":"cem-23","type":"subheading","title":"* Structure.","content":""},{"id":"cem-24","type":"paragraph","content":"1- Calcified ground substance (Less mineralized than Acellular C.)\n2- Fibers (Extrinsic = Intrinsic in proportion)\n3- On the surface of cellular C. there are (Cementoid & Cementoblast on cementoid).\n4- there are Cells inside the cementum: (cementocytes).\na- Origin: Cementoblasts entrapped in mineralized matrix.\nb- Site: In lacunae (as osteocytes)\nc- Shape:\n• oval/spiderlike with numerous cytoplasmic processes present in canaliculi.\n• Processes may branch & occasionally anastomose with processes of neighboring cell.\n• Most of processes directed to PDL surface of C. (site of diffusion of nutrition from PDL as C. is avascular) (الدليل الأول PDL is the source of nutrition of cementum).\n• As the cells are deeper (away from PDL) → show signs of degeneration:\n1) Deep cells → ↓ organelles / dilated ER & cells are in stages of degeneration.\n2) 60 um or more → signs of degeneration (eg: Cytoplasmic clumping & vesiculation)\n3) Deepest layer → C., may contain empty lacunae (الدليل الثاني that PDL is the source of nutrition of cementum).\nN.B. Lacunae & Canaliculi best seen in ground sec. (black spaces with radiating canaliculi)."},{"id":"cem-25","type":"important","title":"Comparison Table: Acellular vs Cellular Cementum","content":"TIME:\nAcellular: The 1st formed C. (during tooth eruption)\nCellular: formed after acellular C. (tooth in occlusion)\n\nTHICKNESS:\nAcellular: thin layer\nCellular: Gradually increased in thickness towards apex.\n\nRATE OF DEVELOPMENT:\nAcellular: Slow\nCellular: Rapid\n\nSITE:\nAcellular: predominates in coronal 1/2 of the root. May cover all of the root but often missed in apical 1/3.\nCellular: Predominates in apical half. Less in anterior but thick in multirooted teeth. Usually seen on surface of Acellular cementum. But the layers may alternate in any pattern.\n\nCALCIFICATION:\nAcellular: More calcified.\nCellular: Less calcified\n\nCOLLAGEN FIBERS:\nAcellular: Extrinsic fibers (Sharpey's) 90% + Intrinsic fibers 10%\nCellular: Extrinsic roughly = intrinsic in proportion\n\nCELLS:\nAcellular: No cells inside\nCellular: Cementocytes in lacunae (as osteocytes); oval/spiderlike with cytoplasmic processes in canaliculi; most processes directed to PDL surface.\n\nPERMEABILITY:\nAcellular: Less permeable\nCellular: More permeable"},{"id":"cem-26","type":"heading","title":"(C) Intermediate Cementum:","content":""},{"id":"cem-27","type":"definition","title":"Def.","content":"\"Intermediate layer of cement on surface of root Dentin (covers the mantle D.)\".\n\nSite.\n• Between Tomes' granular layer & cementum.\n• Predominates in apical 2/3 of posterior teeth.\n• Rare in anterior & deciduous teeth.\n\nOrigin (suggestions):\n1- Layer formed by epith. root sheath of Hertwig (ERSH) before its fragmentation.\n2- Some investigators believed that these are areas where cells of ERSH trapped in rapidly formed Dentin or cementum matrix.\n\nStructure:\n→ Amorphous hyaline layer 10 um thickness.\n→ Non cellular (No od. process / No cementocytes)\n→ Non collagenous\n→ mineralizes (highly mineralized more than adjacent D. or cementum). [It's nearly identical to aprismatic Enamel]\n\nFunctions are probably:\n1- Furnish an attachment of Sharpey's fibers to root surface.\n2- Seal the surface of sensitive root dentin.\n3- Cement cementum to Dentin."},{"id":"cem-28","type":"heading","title":"(D) Afibrillar Cementum:","content":""},{"id":"cem-29","type":"paragraph","content":"* Thin layer of well mineralized ground substance.\n* Difficult identify by light microscope.\nSite. Randomly distributed.\n• May cover cervical Enamel when UMC of sac contact E.\n• May intervene between fibrillar C. & Dentin.\nOrigin. May be epithelial origin.\nBy contact of Afibrillar C. with C.T. cells for enough time Fibrillar C. may be deposited on the Afibrillar C."},{"id":"cem-30","type":"heading","title":"features","content":""},{"id":"cem-31","type":"subheading","title":"A) Incremental lines:","content":""},{"id":"cem-32","type":"paragraph","content":"1) Incremental lines of Salter:\n* Def. lines indicating successive formation of cementum (separating the increments)\n* Structure. Highly mineralized / more G. substance / less collagen fibers than other portions of C. Best seen in decalcified sections by L.M. Difficult in EM.\n\n2) Reversal line: will be discussed in age changes."},{"id":"cem-33","type":"subheading","title":"B) Cementodentinal Junction:","content":""},{"id":"cem-34","type":"paragraph","content":"Relatively smooth → in permanent.\nScalloped sometimes → in deciduous.\nSeen clearly in L.M. decalcified section clearly (C. is stained more than Dentin)\nNot well distinct in E.M. (because of interwine of collagen fibers of C & D).\n\nCementum (in decalcified preparation):\n→ more electron dense than D.\n→ Some collagen fibrils arranged in relatively distinct bundles.\n\nDentin (in decalcified preparation):\n→ less electron dense.\n→ arranged somewhat haphazardly"},{"id":"cem-35","type":"subheading","title":"C) CEJ:","content":""},{"id":"cem-36","type":"important","title":"CEJ Relationships","content":"30% of teeth sharp line meeting between E & C.\n\n10% (Gap) (exposed D.): when part of ERSH of cervical portion of root delayed in degeneration → D. sac doesn't contact dentin → No C. formation AMB Apically (especially in furcation area) → ERSH Remain attached to dentin (if stratum & stellate are present) Enamel pearl (E. drop) is developed.\n\n60% → Cementum overlaps cervical enamel. when RDE degenerates on cervical E. contact between C.T. & Enamel afibrillar Cementum formation.\nN.B. if this afibrillar contacts C.T. cells for enough time fibrillar C. is formed on it"},{"id":"cem-37","type":"heading","title":"Cementogenesis:","content":""},{"id":"cem-38","type":"paragraph","content":"* ERSH induces UMCs of dental papilla to differentiate to odontoblast → Just before ERSH fragmentation it forms 10 um hyaline layer (intermediate cementum) (similar to aprismatic Enamel) then\n\nFragmentation of Root Sheath\n(Remnants may Remain in C.T. of PDL (epith Rests of Malassez) (strands or clusters))\n↓\nUMCs of D. Sac contacts root dentin\n↓\nDifferentiate to cementoblasts\n↓\nCementogenesis (slower rate than adjacent D.)"},{"id":"cem-39","type":"paragraph","content":"1) Organic Matrix:\nA- Adjacent fibroblast form extrinsic fibers & embedded in C. matrix root surface (attach tooth to bone).\nN.B. The embedded portion of PDL fibers in C. is called (Sharpey's fibers).\nB- Additional Fibers (intrinsic fibers) // root surface → weave a lattice around extrinsic.\nN.B. Fibers of 1st formed C matrix may be entirely extrinsic. While in the following layers of C. matrix extrinsic roughly = intrinsic.\nC- cementoblasts also secrete the ground substance.\n\n2) Mineralization:\n1- Begins after some C matrix is formed.\n2- Ca & PO4 ions in tissue fluid are deposited in C. Matrix & arranged as hydroxyl apatite crystals along collagen fibrils.\n3- Crystals seen clustered into groups of nucleation centers (as in bone calcification)."},{"id":"cem-40","type":"paragraph","content":"The 1st formed C. is (Acellular) (tooth is erupting).\n1- Slow rate.\n2- covers at least coronal 2/3 or root.\n\nAfter tooth is in occlusion (cellular C.) is forming:\n1- more rapid rate\n2- around apical 2/3.\n\n* C. blasts trapped in developing C. in lacunae (cementocyte) or may remain on cementoid.\n* less calcified."},{"id":"cem-41","type":"heading","title":"Age changes:","content":""},{"id":"cem-42","type":"subheading","title":"A) Hypercementosis:","content":""},{"id":"cem-43","type":"definition","title":"Def:","content":"\"Abnormal thickening of cementum\".\n\nTypes: Generalized (all teeth) (eg. paget's disease) Or localized (one tooth).\nLocalized can be Diffuse (whole root) Or limited to smaller area of root.\n\nLocalized Cementum hypertrophy:\nWhen: Overgrowth improves functional quality of cementum\nSeen in: Teeth exposed to stress\nSharpey's: area for attachment of sharpey's fibers → anchorage to alveolar bone\n\nN.B. Localized hyperplastic cementosis on top of Enamel drops. Or develop around degenerated epith rests → forming calcified knob like projections called Excementosis."},{"id":"cem-44","type":"subheading","title":"B) Permeability:","content":""},{"id":"cem-45","type":"paragraph","content":"↓ by age gradually.\nFrom PDL side is lost except the most recently formed layer of C.\nFrom Dentin remains (in apical region only)."},{"id":"cem-46","type":"subheading","title":"C) Alteration in Physical, Chemical & Structural characteristics:","content":""},{"id":"cem-47","type":"paragraph","content":"due to periodontal pocket C. surface is pathologically exposed → Ca2+ & PO4 & F entry from Saliva to cementum → Hypermineralized surface."},{"id":"cem-48","type":"subheading","title":"D) Resorption & Repair","content":""},{"id":"cem-49","type":"paragraph","content":"1- C is more resistant to resorption than bone.\nHowever C. resorption can occur after:\n→ Trauma\n→ ↑ occ. Forces\n→ orthodontic movements (to small extent)\n\n2- After stop of resorption Repair may occur by cellular or acellular cementum.\n\n3- Types of repair:\nAnatomical Repair: When the repair Established the previous outline of the tooth\nfunctional Repair: If only thin layer of cementum formed on deep resorption (outline not repaired)\n\nNB: -no dentin repair C is the major reparative tissue of the root.\n\n4- Reversal line is present.\nBetween old & new (repair) cementum & seen by L/M. (2nd incremental line)\nIt is scalloped where: (convexities towards old cementum & concavities towards new (repair) cementum)"},{"id":"cem-50","type":"heading","title":"Functions of Cementum","content":""},{"id":"cem-51","type":"list","content":["1- 1st function: medium for Attachment of fibers bundles that bind the tooth to bone.","2- Serves as the major reparative tissue for root surface. (resorption or repair)","3- Helps in functional adaptation of tooth (hypertrophy):\n• Cementum deposition apically compensates for the loss of tooth substance from occlusal wear.\n• growth of C. is essential for the continuous eruptive movement of the functioning teeth."]}],"giveReasons":[{"reason":"Cementum is avascular (has no blood supply)","explanation":"Because cementum is a hard mineralized tissue whose cells (cementocytes) and surface cementoblasts receive nutrients by diffusion from the blood vessels of the adjacent periodontal ligament. There is no need for a direct blood supply within the cementum matrix itself.","cat":"histological"},{"reason":"Cementum can regenerate throughout life (unlike enamel)","explanation":"Because cementoblasts remain viable on the surface of cementum throughout the life of the tooth. They continue to deposit new cementum, and after injury, undifferentiated cells of the PDL can differentiate into new cementoblasts to repair the cementum — unlike ameloblasts, which are permanently lost after enamel formation.","cat":"histological"},{"reason":"Cementum is thicker at the apex than at the cervical region","explanation":"Because cementum is continuously deposited throughout life by cementoblasts in an appositional manner. The apex accumulates more deposits over the longest functional period. Additionally, hypercementosis at the apex compensates for loss of tooth substance from occlusal attrition.","cat":"histological"},{"reason":"Cellular cementum is found mainly at the apical third of the root","explanation":"Because at the apex, cementum is deposited rapidly to keep pace with root elongation and occlusal wear. The fast rate of deposition traps some cementoblasts within the matrix (they become cementocytes in lacunae). At the cervical area, the slower deposition rate allows all cementoblasts to retreat from the surface, resulting in acellular cementum.","cat":"histological"},{"reason":"Cementum is more resistant to resorption than bone","explanation":"Because cementum has a higher mineral content, a different organic matrix composition, and lacks the typical bone remodeling system (no Haversian canals, no osteoclastic remodeling under normal conditions). The hypermineralized surface layer and lack of remodeling signals make it inherently resistant to osteoclastic activity.","cat":"histological"},{"reason":"Cementum has the highest fluoride content of all mineralized tissues","explanation":"Because cementum is exposed to the oral environment and PDL fluids throughout the life of the tooth. Fluoride ions from these sources are continuously incorporated into the hydroxyapatite crystals, especially at the surface layers, making cementum the most fluoride-rich mineralized tissue.","cat":"histological"}]},{"id":8,"slug":"dental-pulp","title":"Dental Pulp","subtitle":"2024 - Dr: Thouraya Milad Al-Hadi","category":"hard-tissue","summary":"The dental pulp is a loose connective tissue derived from the ectomesenchymal cells of the dental papilla. It contains odontoblasts, fibroblasts, undifferentiated mesenchymal cells, and defense cells embedded in an extracellular matrix. The pulp performs inductive, formative, nutritive, protective, and reparative functions.","keywords":["pulp chamber","root canal","apical foramen","odontoblast","fibroblast","odontoblastic zone","cell-free zone of Weil","cell-rich zone","pulp core","blood vessels","lymphatics","plexus of Rashkow","age changes","calcification","pulp stones","denticles","true denticles","false denticles","diffuse calcification","free denticles","attached denticles","embedded denticles","dystrophic calcification","pericytes","Rouget cells","dendritic cells","T-lymphocytes","macrophages","ectomesenchymal cells","glycosaminoglycans","glycoproteins","laminin","fibronectin","neurovascular bundle"],"keyDefinitions":[{"term":"Pulp Chamber","definition":"The coronal portion of the dental pulp; corresponds to the general shape of the anatomic crown with pulp horns under each cusp."},{"term":"Root Canal","definition":"The radicular portion of the pulp; terminates at the apical foramen where pulp meets PDL."},{"term":"Cell-Free Zone of Weil","definition":"Acellular zone immediately beneath the odontoblastic layer in the coronal pulp; contains capillaries and unmyelinated nerves."},{"term":"Cell-Rich Zone","definition":"A zone of high cell density (fibroblasts and undifferentiated cells) beneath the cell-free zone; prominent in coronal pulp."},{"term":"Plexus of Rashkow","definition":"Dense subodontoblastic nerve plexus of unmyelinated and small myelinated fibers in the cell-rich zone; important for pulp innervation."},{"term":"Accessory Canal","definition":"Lateral communication between pulp and PDL along the root surface; formed by localized HERS failure."},{"term":"True Denticles","definition":"Pulp stones that are similar in structure to dentin — they have dentinal tubules and contain the processes of the odontoblasts that formed them. Rare, usually located close to the apical foramen. Caused by epithelial root sheath remnants that induce pulp cells to differentiate into odontoblasts."},{"term":"False Denticles","definition":"Pulp stones that do not exhibit dentinal tubules but appear as concentric layers of calcified tissues. May have remnants of necrotic and calcified cells in the center. Usually found in the pulp chamber, often occur in groups."},{"term":"Diffuse Calcifications","definition":"Irregular calcified deposits in pulp tissue, usually following collagenous fiber bundles or blood vessels. Usually found in the root canal. When diffuse calcification surrounds blood vessels, it is called dystrophic calcification."}],"importantPoints":["Dental pulp is a loose connective tissue of ectomesenchymal origin","Four histological zones from periphery inward: odontoblastic → cell-free (Weil) → cell-rich → pulp core","Odontoblasts are postmitotic — they cannot divide; injury causes death and replacement from subodontoblastic cells","Fibroblasts are the most numerous cells of the pulp","No elastic fibers in pulp except in walls of larger blood vessels","Collagen (types I and III) is the predominant fiber; greatest concentration at apical pulp","Apical foramen becomes smaller and more eccentric with tooth maturation","Pulp can only respond to injury by forming tertiary dentin (protective bridge)","Pulp stones classified by structure: True (have tubules) / False (no tubules, concentric layers) / Diffuse (irregular, follow fiber bundles)","Pulp stones classified by relation to dentin: Free (surrounded by pulp) / Attached (partly fused with dentin) / Embedded (entirely surrounded by dentin)","Diffuse calcification around blood vessels = dystrophic calcification","In normal pulp: T-lymphocytes present, B-lymphocytes absent","Dendritic cells are non-phagocytic, increase in carious teeth"],"histologicalFeatures":["Odontoblasts: columnar in crown, cuboidal in root, flat at apex; pseudostratified in pulp horns","Fibroblasts: stellate with long processes in young pulp; flat spindle-shaped in aged pulp","Undifferentiated mesenchymal cells: large polyhedral, perivascular location","T-lymphocytes present; B-lymphocytes absent in normal pulp","Macrophages: centrally located, involved in elimination of dead cells","Pericytes: on capillary walls — contractile function","Dendritic cells: non-phagocytic, antigen-presenting; increase in carious teeth"],"clinicalNotes":["Pulp necrosis: ischemia from inflammation-induced pressure → pulp death (irreversible)","Reversible pulpitis: hyperemia — responds to stimulus, settles quickly; no necrosis","Irreversible pulpitis: spontaneous pain, does not resolve — root canal treatment needed","Pulp stones (denticles): calcifications within pulp — type I (true, have tubules), type II (false, no tubules)","Diffuse calcifications (pulp fibrosis): age-related calcification of pulp ground substance","Accessory canals complicate endodontic therapy — can harbor bacteria"],"flashcards":[{"question":"What are the four histological zones of the dental pulp from periphery to center?","answer":"1. Odontoblastic zone (periphery): odontoblasts + predentin\n2. Cell-free zone of Weil: acellular, capillaries, unmyelinated nerves\n3. Cell-rich zone: dense fibroblasts and undifferentiated cells\n4. Pulp core (center): major blood vessels, nerves, fibroblasts"},{"question":"What are the five functions of the dental pulp?","answer":"1. Inductive: pulp interacts with oral epithelium → dental lamina differentiation\n2. Formative: odontoblasts produce dentin\n3. Nutritive: nourishes dentin via odontoblasts and interstitial fluid\n4. Protective: nerve-mediated pain response to stimuli\n5. Reparative: forms tertiary dentin in response to injury"},{"question":"How do accessory canals form?","answer":"Three mechanisms: (1) Localized failure of HERS formation; (2) Premature degeneration of HERS before odontoblast differentiation; (3) Lack of complete union of tongue-like extensions at floor of pulp chamber in multirooted teeth (more common in deciduous teeth)."},{"question":"Classify pulp stones by structure.","answer":"1. True denticles: similar to dentin, have dentinal tubules and odontoblast processes. Rare, located near apical foramen. Caused by epithelial root sheath remnants inducing odontoblast differentiation.\n2. False denticles: no tubules, appear as concentric layers of calcified tissue. May have necrotic/calcified cells at center. Found in pulp chamber, often in groups.\n3. Diffuse calcifications: irregular calcified deposits following collagen fiber bundles or blood vessels. Found mainly in root canal. When surrounding blood vessels = dystrophic calcification."},{"question":"Classify pulp stones by relation to the dentin.","answer":"1. Free denticles: entirely surrounded by pulp tissue.\n2. Attached denticles: partly fused with the dentin.\n3. Embedded denticles: entirely surrounded by dentin."},{"question":"What are the age changes of the dental pulp?","answer":"1. Cell changes: fewer cells, decrease in size and number of cytoplasmic organelles.\n2. Fibrosis: accumulation of diffuse fibrillar and bundle collagen, mainly in apical portion.\n3. Blood vessel changes: atherosclerotic plaques in pulpal vessels; calcification in vessel walls near apical foramen.\n4. Pulp stones (denticles): nodular calcified masses in coronal and/or root pulp; usually asymptomatic unless impinging on nerves/vessels."},{"question":"Describe the defense cells of the dental pulp.","answer":"a) T-lymphocytes: small cells, single large nucleus, narrow cytoplasm rim. Present in normal pulp (B-lymphocytes absent). Increase when pulp is injured.\nb) Macrophages (histiocytes): centrally located, large irregular cells, short blunt processes, dark nuclei, large lysosomes on EM. Involved in elimination of dead cells.\nc) Pericytes (Rouget cells): on capillary periphery, form circumferential sheath around endothelium. Thought to be contractile.\nd) Dendritic cells: ≥50 μm, 3+ branching processes, non-phagocytic, antigen-presenting, initiate primary immune response, increase in carious teeth."}],"blocks":[{"id":"pulp-1","type":"heading","title":"Dental Pulp","content":"The dental pulp is a loose connective tissue, derived from the ectomesenchymal cells of the dental papilla."},{"id":"pulp-2","type":"subheading","title":"Form and Relations","content":""},{"id":"pulp-3","type":"list","content":["The pulp is divided into a coronal portion (pulp chamber) and a radicular portion (root canal)","The pulp chamber corresponds to the general shape of the anatomic crown; under the cusps, it extends into pulp horns, especially prominent in young teeth","The root canal terminates at the apical foramen, where the pulp and PDL meet and the main nerves and vessels enter/leave the tooth","In the developing tooth the apical foramen is large and centrally located; as the tooth matures, it becomes smaller and more eccentric","Connections between pulp and periodontal tissues occur through accessory or lateral canals along the lateral root surface"]},{"id":"pulp-4","type":"subheading","title":"Mechanism of Accessory Canal Formation","content":""},{"id":"pulp-5","type":"list","content":["I. Localized failure of formation of root sheath (HERS)","II. Premature degeneration of root sheath before odontoblast differentiation","III. Lack of complete union of tongue-like extensions at the floor of pulp chamber in multirooted teeth (more common in deciduous teeth)"]},{"id":"pulp-6","type":"subheading","title":"Composition","content":""},{"id":"pulp-7","type":"paragraph","content":"The dental pulp is made up of a combination of cells embedded in an extracellular matrix. The extracellular matrix consists of fibers and a ground substance made up of proteins and a group of polysaccharides secreted by the cells of the tissue. The matrix forms a scaffold that stabilizes the structure of dental pulp. Collagen is the predominant component of the fibers, comprising 25–32% of the dry weight."},{"id":"pulp-8","type":"definition","title":"Pulp Matrix","content":"Fibers: principally type I and III collagen; irregular arrangement; greatest concentration in the most apical portion of the pulp. No elastic fibers except in walls of larger blood vessels. Ground substance: glycosaminoglycans (repeating disaccharide polysaccharide chains) and glycoproteins (adhesion molecules — laminin and fibronectin)."},{"id":"pulp-9","type":"heading","title":"Histological Structure of the Dental Pulp","content":"When the pulp is examined histologically, four distinct zones can be characterized:"},{"id":"pulp-10","type":"list","content":["1. The odontoblastic zone at the pulp periphery","2. A cell-free zone of Weil beneath the odontoblasts, prominent in the coronal pulp","3. A cell-rich zone, where cell density is high","4. The pulp core, characterized by the major vessels and nerves of the pulp"]},{"id":"pulp-11","type":"subheading","title":"Cells of the Pulp","content":""},{"id":"pulp-12","type":"definition","title":"1) Odontoblasts","content":"Responsible for the formation of dentin. A postmitotic cell — cannot divide. Insult or injury results in death of odontoblasts; subodontoblastic cells divide and differentiate into replacement odontoblasts to lay down protective tertiary dentin. In the crown: distinctly columnar. In the root: commonly cuboidal, becoming flat in the apical region. In the pulp horn: crowded nuclei create false appearance of multiple layers (pseudostratification). The odontoblast layer provides a controlled barrier between the pulp and dentin."},{"id":"pulp-13","type":"definition","title":"2) Fibroblasts","content":"Most prominent cells of the pulp; particularly numerous in the coronal portion forming the cell-rich zone. Typical pulp fibroblasts are stellate in shape with long processes. In young pulps: actively synthesizing matrix — open-faced nuclei, plump cytoplasm with abundant organelles. With age: appear as flattened spindle-shaped cells with closed-faced nuclei. Function: form and maintain pulp matrix (collagen and ground substance); can also ingest and degrade collagen when stimulated."},{"id":"pulp-14","type":"definition","title":"3) Undifferentiated Ectomesenchymal Cells","content":"Embryonic branched cells that can differentiate into other connective tissue cells. Large polyhedral cells with peripheral processes and large centrally placed nuclei. Found along walls of blood vessels throughout cell-rich zone and pulp core. Decrease in number in old age."},{"id":"pulp-15","type":"subheading","title":"4) Defense Cells","content":""},{"id":"pulp-16","type":"list","content":["T-lymphocytes: present in small numbers in normal pulp; increase when pulp is injured; small cell with single large nucleus; B-lymphocytes are absent in normal pulp","Macrophages (histiocytes): centrally located; large irregular cells with short blunt processes; dark-staining nuclei; large lysosomes on EM; involved in elimination of dead cells","Pericytes (Rouget cells): located in periphery of capillaries; form partial circumferential sheath around endothelial wall; thought to be contractile cells reducing vessel lumen size","Dendritic antigen-presenting cells: at least 50 μm long; 3+ main dendritic processes; non-phagocytic; initiate primary immune response; increase in number in carious teeth"]},{"id":"pulp-17","type":"subheading","title":"Blood Vessels","content":""},{"id":"pulp-18","type":"paragraph","content":"Arterioles and venules enter and exit the dental pulp via the apical foramen and lateral canals. They run longitudinally through the root canals, sending off side branches to the periphery. The vessels divide in the root canal but branch profusely in the coronal pulp. Capillary loops extend toward the dentin — present within and below the odontoblast layer and between odontoblasts and predentin."},{"id":"pulp-19","type":"subheading","title":"Lymph Vessels","content":""},{"id":"pulp-20","type":"paragraph","content":"Lymphatic vessels are thin-walled vessels. They arise in the coronal region of the pulp and pass apically through the middle and radicular regions to exit via one or two larger vessels through the apical foramen."},{"id":"pulp-21","type":"subheading","title":"Nerve Supply of the Pulp","content":""},{"id":"pulp-22","type":"paragraph","content":"The dental pulp is richly innervated. Nerves enter the pulp through the apical foramen along with afferent blood vessels, forming the neurovascular bundle. In the pulp chamber, nerves follow the course of afferent vessels, beginning as large nerve bundles that branch as they extend occlusally through the pulp core. The peripheral nerves form an extensive plexus of Rashkow. The nerves then lose their myelin sheath and pass through the cell-rich and cell-free zones to terminate among odontoblasts or adjacent to odontoblast processes in the dentinal tubules."},{"id":"pulp-23","type":"subheading","title":"Functions of the Pulp","content":""},{"id":"pulp-24","type":"list","content":["Inductive: primary role of pulp primordium is to interact with oral epithelial cells, leading to differentiation of dental lamina and enamel organ formation","Formative: pulpal odontoblasts produce the dentin that surrounds and protects the pulp","Nutritive: nourishes the dentin through the odontoblasts and their processes and by means of pulp interstitial fluid","Protective: high density of nerves transmits pain stimuli and regulates response of pulp-dentin complex to trauma","Reparative: pulp has excellent regenerative properties; if inflammation is not too severe, it will heal; if severe — pulp hyperemia and edema lead to pressure on apical vessels → ischemia → necrosis"]},{"id":"pulp-25","type":"subheading","title":"Age Changes of the Pulp","content":""},{"id":"pulp-26","type":"list","content":["1. Cell changes: In addition to the appearance of fewer cells in the aging pulp, the cells are characterized by a decrease in size and number of cytoplasmic organelles.","2. Fibrosis: In the aging pulp accumulation of both diffuse fibrillar components as well as bundles of collagen fibers usually concentrate in the most apical portion of the pulp.","3. Blood vessels: Vascular changes occure in the aging pulp as they do in any organ. Atherosclerotic plaques may appear in the pulpal vessel. Calcification in the walls of the blood vessels is found most often in the region near the apical foramen.","4. Pu
