<style>
/* ── CSS VARIABLES – Light & Dark ─────────── */
:root {
  --bg:        #f0f4f8;
  --bg2:       #ffffff;
  --bg3:       #f8fafc;
  --border:    #e2e8f0;
  --text:      #0f172a;
  --text2:     #334155;
  --text3:     #64748b;
  --teal:      #0d9488;
  --teal-dim:  #f0fdf9;
  --teal-border:#5eead4;
  --amber-bg:  #fffbeb;
  --amber-brd: #f59e0b;
  --amber-txt: #78350f;
  --red-bg:    #fff5f5;
  --red-brd:   #ef4444;
  --red-txt:   #7f1d1d;
  --blue-bg:   #eff6ff;
  --blue-brd:  #3b82f6;
  --blue-txt:  #1e3a8a;
  --def-bg:    #f0fdf9;
  --def-txt:   #1e3a30;
  --list-bg:   #f8fffe;
  --list-hover:#e6fdf9;
  --card-shadow:0 1px 4px rgba(0,0,0,.06);
  --topbar-bg: rgba(255,255,255,.93);
  --scrollbar: #c8d3e0;
  --input-bg:  #ffffff;
  --subhead-bg:#f0fdf9;
  --head-bg:   linear-gradient(135deg,#f0fdf9 0%,#fff 100%);
}

.dark {
  --bg:        #0f1117;
  --bg2:       #1a1d27;
  --bg3:       #13161f;
  --border:    #2a2d3a;
  --text:      #e8eaf0;
  --text2:     #c4c9d8;
  --text3:     #7c8299;
  --teal:      #2dd4bf;
  --teal-dim:  #0d2420;
  --teal-border:#0f766e;
  --amber-bg:  #1f1500;
  --amber-brd: #d97706;
  --amber-txt: #fcd34d;
  --red-bg:    #1f0505;
  --red-brd:   #ef4444;
  --red-txt:   #fca5a5;
  --blue-bg:   #050f1f;
  --blue-brd:  #3b82f6;
  --blue-txt:  #93c5fd;
  --def-bg:    #0a1f1c;
  --def-txt:   #6ee7b7;
  --list-bg:   #111820;
  --list-hover:#0d2420;
  --card-shadow:0 1px 6px rgba(0,0,0,.4);
  --topbar-bg: rgba(26,29,39,.95);
  --scrollbar: #2e3347;
  --input-bg:  #1e2130;
  --subhead-bg:#0d2420;
  --head-bg:   linear-gradient(135deg,#0d2420 0%,#1a1d27 100%);
}

*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--bg2);border-radius:14px;border:1px solid var(--border);box-shadow:var(--card-shadow);transition:box-shadow .18s,transform .18s,background .2s,border-color .2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(-1px)}

.sidebar{width:264px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);height:100vh;overflow-y:auto;position:fixed;left:0;top:0;z-index:40;transition:transform .25s,background .2s,border-color .2s}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-track{background:transparent}.sidebar::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}

.main{margin-left:264px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 0 rgba(0,0,0,.06);transition:background .2s,border-color .2s}

.prog-bar{height:5px;border-radius:999px;background:var(--border);overflow:hidden}
.prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0d9488,#06b6d4);transition:width .35s}

.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.badge-teal{background:#ccfbf1;color:#0f766e}.dark .badge-teal{background:#0a2e29;color:#2dd4bf}
.badge-amber{background:#fef3c7;color:#92400e}.dark .badge-amber{background:#2a1800;color:#fcd34d}
.badge-violet{background:#ede9fe;color:#6d28d9}.dark .badge-violet{background:#1e1040;color:#a78bfa}
.badge-blue{background:#dbeafe;color:#1d4ed8}.dark .badge-blue{background:#071232;color:#60a5fa}
.badge-rose{background:#ffe4e6;color:#be123c}.dark .badge-rose{background:#2a0510;color:#fb7185}

/* ── CONTENT BLOCKS ─────────────────────────────────── */
.block-heading{
  font-size:15px;font-weight:900;color:var(--text);
  padding:14px 16px 11px;
  border-bottom:3px solid var(--teal);
  margin:24px 0 12px;
  background:var(--head-bg);
  border-radius:10px 10px 0 0;
  letter-spacing:.01em;
}
.block-subheading{
  font-size:13px;font-weight:800;color:var(--teal);
  padding:10px 14px 8px 16px;
  margin:12px 0 6px;
  border-left:4px solid var(--teal-border);
  background:var(--subhead-bg);
  border-radius:0 8px 8px 0;
}
.block-paragraph{
  /* Improve readability and emphasis for paragraph content */
  font-size:15px;
  color:var(--text);
  line-height:1.85;
  white-space:pre-wrap;
  margin:12px 0;
  padding:10px 16px;
  /* Add a soft background and accent border */
  background:var(--bg2);
  border-radius:12px;
  border-left:3px solid var(--teal-border);
}
.block-list{padding-left:0;list-style:none;margin:8px 0 12px}
.block-list li{
  /* Increase font and contrast for list items */
  font-size:15px;
  color:var(--text);
  padding:12px 16px;
  border-left:3px solid var(--teal-border);
  margin:8px 0;
  line-height:1.85;
  white-space:pre-wrap;
  /* Use full card styling for better visibility */
  border-radius:12px;
  background:var(--bg2);
  transition:background .12s;
}
.block-list li:hover{background:var(--list-hover)}

/* ── DEFINITION – Teal ───── */
.block-definition{
  background:var(--def-bg);
  border:1.5px solid var(--teal-border);
  border-left:5px solid var(--teal);
  padding:0;
  border-radius:12px;
  margin:14px 0;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(13,148,136,.13);
}
.block-definition .def-title{
  font-size:10.5px;font-weight:900;color:var(--teal);
  text-transform:uppercase;letter-spacing:.09em;
  background:var(--subhead-bg);
  padding:8px 14px 7px;
  border-bottom:1px solid var(--teal-border);
  margin:0;
}
.block-definition .def-content{
  font-size:14px;font-weight:500;
  color:var(--def-txt);
  white-space:pre-wrap;
  line-height:1.9;
  padding:12px 16px;
}

/* ── IMPORTANT – Red / Critical ───── */
.block-important{
  background:var(--red-bg);
  border:1.5px solid var(--red-brd);
  border-left:5px solid var(--red-brd);
  border-radius:12px;
  margin:14px 0;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(239,68,68,.15);
}
.block-important .bi-label{
  font-size:10.5px;font-weight:900;color:var(--red-brd);
  text-transform:uppercase;letter-spacing:.09em;
  padding:8px 14px 7px;
  border-bottom:1px solid var(--red-brd);
  background:rgba(239,68,68,.07);
  display:block;
}
.block-important .bi-body{
  font-size:14px;font-weight:600;
  color:var(--red-txt);
  line-height:1.9;
  white-space:pre-wrap;
  padding:12px 16px;
}

/* ── CLINICAL – Amber / Gold ───── */
.block-clinical{
  background:var(--amber-bg);
  border:1.5px solid var(--amber-brd);
  border-left:5px solid var(--amber-brd);
  border-radius:12px;
  margin:14px 0;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(245,158,11,.15);
}
.block-clinical .bc-label{
  font-size:10.5px;font-weight:900;color:var(--amber-brd);
  text-transform:uppercase;letter-spacing:.09em;
  padding:8px 14px 7px;
  border-bottom:1px solid var(--amber-brd);
  background:rgba(245,158,11,.07);
  display:block;
  font-style:italic;
}
.block-clinical .bc-body{
  font-size:14px;font-weight:500;
  color:var(--amber-txt);
  line-height:1.9;
  white-space:pre-wrap;
  padding:12px 16px;
}

/* ── NOTE – Blue ───── */
.block-note{
  background:var(--blue-bg);
  border:1.5px solid var(--blue-brd);
  border-left:5px solid var(--blue-brd);
  border-radius:12px;
  margin:14px 0;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(59,130,246,.13);
}
.block-note .bn-label{
  font-size:10.5px;font-weight:900;color:var(--blue-brd);
  text-transform:uppercase;letter-spacing:.09em;
  padding:8px 14px 7px;
  border-bottom:1px solid var(--blue-brd);
  background:rgba(59,130,246,.07);
  display:block;
}
.block-note .bn-body{
  font-size:14px;font-weight:500;
  color:var(--blue-txt);
  line-height:1.9;
  white-space:pre-wrap;
  padding:12px 16px;
}


.exam-highlight{
  background:linear-gradient(transparent 58%, rgba(253, 224, 71, .95) 58%);
  border-radius:3px;
  padding:0 2px;
  font-weight:800;
  color:inherit;
}
.exam-legend{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#faf5ff;
  border:1px solid #e9d5ff;
  color:#6d28d9;
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  margin:0 0 12px;
}
.exam-legend .dot{
  width:10px;height:10px;border-radius:50%;background:#facc15;display:inline-block;
}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#4a5068}

/* Dark mode topbar text & input */
.dark #topbar-title{color:var(--text)!important}
.dark #quick-search{background:var(--input-bg)!important;border-color:var(--border)!important;color:var(--text)!important}
.dark #quick-search::placeholder{color:var(--text3)!important}
.dark #dark-btn{background:#1e2130!important;color:#e8eaf0!important}

/* Dark sidebar */
.dark .sidebar-btn{color:var(--text2)!important}
.dark .sidebar-btn:hover,.dark .sidebar-btn.active{background:var(--teal-dim)!important;color:var(--teal)!important}
.dark .sidebar-btn[style*="color:#8b5cf6"]{color:#a78bfa!important}
.dark .sidebar-btn[style*="color:#0d9488"]{color:#2dd4bf!important}

/* Dark cards */
.dark .card{background:var(--bg2)!important;border-color:var(--border)!important}

/* Dark general elements with inline styles */
.dark [style*="background:#fff"]{background:var(--bg2)!important}
.dark [style*="background:#f8fafc"]{background:var(--bg3)!important}
.dark [style*="background:#f1f5f9"]{background:#1e2130!important}
.dark [style*="background:#f0fdf4"]{background:#0a1f10!important}
.dark [style*="background:#f0fdfa"]{background:var(--teal-dim)!important}
.dark [style*="color:#0f172a"]{color:var(--text)!important}
.dark [style*="color:#1e293b"]{color:var(--text)!important}
.dark [style*="color:#334155"]{color:var(--text2)!important}
.dark [style*="color:#374151"]{color:var(--text2)!important}
.dark [style*="color:#475569"]{color:var(--text3)!important}
.dark [style*="color:#64748b"]{color:var(--text3)!important}
.dark [style*="color:#94a3b8"]{color:#5a617d!important}
.dark [style*="border:1px solid #e2e8f0"]{border-color:var(--border)!important}
.dark [style*="border-color:#e2e8f0"]{border-color:var(--border)!important}
.dark [style*="border:2px solid #e2e8f0"]{border-color:var(--border)!important}
.dark [style*="color:#166534"]{color:#4ade80!important}
.dark [style*="color:#991b1b"]{color:#f87171!important}
.dark [style*="background:#e2e8f0"]{background:#2a2d3a!important}

/* Progress bar in dark */
.dark .prog-bar{background:var(--border)}

/* Dark sidebar divider */
.dark [style*="background:#e2e8f0;margin:8px 0"]{background:var(--border)!important}

/* ── Responsive & Accessibility Enhancements ─────────────────────────── */
html {
  /* Smooth scrolling for anchor and internal navigation */
  scroll-behavior: smooth;
  /* Prevent automatic text inflation on iOS */
  -webkit-text-size-adjust: 100%;
}
body {
  /* Respect device safe areas (e.g. iPhone notch) */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  /* Prevent double-tap zoom on mobile */
  touch-action: manipulation;
}
/* Small screen adjustments (phones) */
@media (max-width: 640px) {
  /* Stack topbar content vertically */
  .topbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    height: auto;
    padding: 10px 14px;
  }
  .topbar > div:first-child {
    margin-bottom: 4px;
  }
  /* Make search input full-width and easier to tap */
  #quick-search {
    width: 100% !important;
    margin-top: 4px;
    font-size: 14px !important;
    padding: 8px 12px !important;
  }
  /* Increase dark toggle size for better tap target */
  #dark-btn {
    width: 36px !important;
    height: 36px !important;
    font-size: 18px !important;
  }
  /* Increase sidebar button touch targets */
  .sidebar-btn {
    font-size: 14px !important;
    padding: 12px 14px !important;
  }
}
/* Reduce motion for users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
/* Focus styles for keyboard navigation */
.sidebar-btn:focus {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}


.exam-focus-shell{
  margin:14px 0;
  padding:0;
  border:1.5px solid #f59e0b;
  border-left:5px solid #0d9488;
  border-radius:14px;
  background:linear-gradient(135deg,rgba(255,247,237,.95),rgba(255,255,255,.92));
  box-shadow:0 2px 10px rgba(245,158,11,.14);
  overflow:hidden;
}

/* Content blocks get a scroll offset so headings are not hidden behind the top bar */
.content-block{
  scroll-margin-top:80px;
}

/* Table of contents styling */
.toc summary{
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  color:var(--teal);
  margin:8px 0 6px;
  outline:none;
}
.toc ul{
  list-style:none;
  margin:0 0 8px;
  padding-left:16px;
}
.toc li{
  margin:4px 0;
}
.toc a{
  color:var(--teal);
  text-decoration:underline;
  font-size:13px;
}
.toc a:hover{
  text-decoration:none;
}
.exam-focus-shell .block-heading{margin-top:0}
.exam-focus-shell .block-subheading{margin-top:0}
.exam-focus-shell .block-paragraph,
.exam-focus-shell .block-list,
.exam-focus-shell .block-definition,
.exam-focus-shell .block-important,
.exam-focus-shell .block-clinical,
.exam-focus-shell .block-note{margin:0}
.data-table-wrap{
  overflow-x:auto;
  margin:12px 0 14px;
  border:1.5px solid var(--border);
  border-radius:14px;
  background:var(--bg2);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.data-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:13px;
}
.data-table th,
.data-table td{
  padding:10px 12px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  vertical-align:top;
  line-height:1.55;
}
.data-table th{
  background:var(--subhead-bg);
  font-weight:900;
  color:var(--text);
}
.data-table td{
  background:var(--bg2);
  color:var(--text2);
}
.data-table tr:last-child td{border-bottom:none}
.data-table th:last-child,
.data-table td:last-child{border-right:none}
.data-table .row-head{
  background:var(--list-bg);
  font-weight:800;
  color:var(--text);
}
.dark .data-table th,
.dark .data-table td{
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.dark .data-table th{background:var(--subhead-bg)}
.dark .data-table td{background:var(--bg2)}
.dark .data-table .row-head{background:var(--list-hover)}

@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{padding:0 14px}}
</style>
</head>

<script>

const SHEETS = [{"id":1,"slug":"embryology","title":"Embryology","subtitle":"by Dr.Gada Gusbi","category":"embryology","summary":"Fetal life is 280 days. Development is divided into: Period of Ovum (conception → 7th day), Embryonic period (2nd week → end 2nd month), Fetal period, and Branchial arches. All major features are established during the embryonic period including blood circulation, face, heart, and body elongation.","keywords":["zygote","morula","blastocyst","trophoblast","embryoblast","ectoderm","mesoderm","endoderm","neural crest cells","ectomesenchyme","somite","stomodeum","buccopharyngeal membrane","branchial arches","Meckel's cartilage"],"keyDefinitions":[{"term":"Zygote","definition":"1st cell of the new organism formed by fusion of spermatozoon + ovum in the distal 1/3 of fallopian tube."},{"term":"Morula","definition":"Multicellular mass reached by the zygote by 4 days as it moves towards the uterine cavity."},{"term":"Blastocyst","definition":"Embryo after morula gains a fluid-filled inner cavity (Blastocoel). Formed by outer cell mass (Trophoblast) enclosing fluid, and inner cell mass (Embryoblast)."},{"term":"Trophoblast","definition":"Outer cell mass enclosing the fluid of the blastocyst."},{"term":"Embryoblast","definition":"Cluster of cells (inner cell mass) that project into the cavity of the blastocyst."},{"term":"Primitive Streak","definition":"A groove appearing on 15th day on the surface in midline of dorsal aspect of ectoderm of embryonic disk."},{"term":"Notochordal Process","definition":"Cells arising from the primitive knot (node) at cephalic end of primitive streak; serves as axial skeleton till replaced by vertebrae."},{"term":"Ectomesenchyme","definition":"Tissue formed by neural crest cells — ectodermal in origin but migrate to mesenchyme and exhibit some properties of mesenchyme."},{"term":"Somite","definition":"Block of condensed mass of cells adjacent to neural tube; differentiates into Dermatome (dermis), Myotome (muscles), and Foregut."},{"term":"Stomodeum","definition":"Primitive oral cavity — below the forebrain, above the developing heart. Separated from foregut by buccopharyngeal membrane."},{"term":"Buccopharyngeal Membrane","definition":"Double epithelial membrane separating stomodeum from foregut. Soon breaks down and stomodeum communicates with foregut at beginning of face development."},{"term":"Meckel's Cartilage","definition":"Cartilage of the 1st (mandibular) branchial arch. Covered by fibrous perichondrium."},{"term":"Reichert Cartilage","definition":"Cartilage of the 2nd (hyoid) branchial arch."}],"importantPoints":["Fetal life is 280 days","Fertilization occurs in distal 1/3 of fallopian tube","Zygote reaches uterus by 4 days as Morula","Implantation of zygote into uterine wall on 6th day","Primitive streak appears on 15th day in midline of dorsal ectoderm of embryonic disk","Primitive knot (node) appears at cephalic end of primitive streak on 16th day","Neural crest cells are ectodermal in origin but migrate to mesenchyme → form Ectomesenchyme","Most congenital malformations occur in Somite period (21→31 day)","Complete closure of neural tube at 4th week I.U.","Neural tube enlarges anteriorly to form 3 vesicles: Forebrain, Midbrain, Hindbrain","1st arch (mandibular) & 2nd arch (hyoid) meet each other in midline; 3rd, 4th, 5th & 6th do not","1st arch is covered externally & internally by ectoderm (unique — others have endoderm internally)","Human increases from 140 microns to more than 50 cm; from few milligrams to about 3 kilograms"],"histologicalFeatures":["Embryonic disk (Germ disk): double cell layer — 1st layer ectoderm (floor of amnion), 2nd layer endoderm (roof of yolk sac)","Neural plate: ectodermal thickening on dorsal surface at 18th day — primordium of nervous system","Neural groove: formed when neural plate bends at central axis","Neural folds: raised margins along both sides of neural groove; crests contain neural crest cells","Neural tube: formed when neural folds fuse in midline; fusion starts from center → caudal & cephalic","Somites: each differentiates into Dermatome (dermis of skin), Myotome (muscles), Foregut","Branchial arches separated externally by ectodermal clefts & internally by endodermal pouches"],"clinicalNotes":["Most congenital malformations occur in the Somite period (21→31 day) — when organ systems are being established","Failure of neural tube closure at 4th week can cause severe CNS malformations","Neural crest cell migration defects affect skeletal and connective tissues of head and neck"],"flashcards":[{"question":"What are the 4 periods of development?","answer":"I) Period of Ovum: conception → 7th day\nII) Embryonic period: 2nd week → end 2nd month\nIII) Fetal period\nIV) Branchial arches"},{"question":"What is the sequence: Zygote → Morula → Blastocyst?","answer":"Zygote: fertilized ovum (1st cell)\nMorula: multicellular mass reached at 4 days in uterus\nBlastocyst: morula gains fluid-filled cavity (Blastocoel); outer = Trophoblast, inner = Embryoblast"},{"question":"What are the 3 sub-periods of the Embryonic period?","answer":"A) Presomite period: beginning of 2nd week → end of 3rd week\nB) Somite Period: 21 → 31 day\nC) Post somite"},{"question":"What happens on day 15 and day 16?","answer":"Day 15: Primitive streak appears — groove on surface in midline of dorsal ectoderm of embryonic disk\nDay 16: Primitive knot (node) appears at cephalic end of primitive streak; gives rise to notochordal process"},{"question":"What are the derivatives of Ectoderm, Mesoderm, and Endoderm?","answer":"Ectoderm: Epidermis & appendages (hair, nail, glands), epithelial lining of oral & nasal cavity sinuses, sensory of eye/ear/nose, neural structures (CNS–PNS)\nMesoderm: Muscles; C.T. structures (Bone, cartilage, blood, D, C, Pulp, & PDL)\nEndoderm: Epithelial lining of GIT & respiratory system; secretory cells of liver & pancreas"},{"question":"What do neural crest cells give at the head & neck region vs trunk region?","answer":"Head & neck: Most Neural, Endocrine & pigment cells + Skeletal tissue + C.T. including C.T of dental structure (Dentine/pulp/PDL), cartilage of branchial arches, dermis\nTrunk: Most Neural, Endocrine & pigment cells — but NOT skeleton & C.T (formed by mesoderm)"},{"question":"What are the 25 derivatives of the Mandibular arch (1st branchial arch)?","answer":"I- Meckel's cartilage (6): Lingual, Mental ossicles, Incus bone, Malleus bone, Anterior ligament of malleus, Sphenomandibular ligament\nII- Mesoderm (10): Masseter, Temporalis, Medial pterygoid, Lateral pterygoid, Mylohyoid, Tensor palate, Tensor tympani, Anterior belly of digastric, Mandible, Maxilla proper\nIII- Artery (2): Maxillary artery in part, External carotid artery in part\nIV- Nerve (1): Trigeminal nerve\nV- Other (6): Lower lip, Part of upper lip, Cheek, Anterior 2/3 of tongue, Teeth, Salivary glands"},{"question":"What is the nerve supply of each branchial arch?","answer":"1st arch: Trigeminal (V)\n2nd arch: Facial (VII)\n3rd arch: Glossopharyngeal (IX)"}],"blocks":[{"id":"emb-1","type":"heading","title":"EMBRIOLOGY","content":"by Dr.Gada Gusbi"},{"id":"emb-2","type":"subheading","title":"Early development","content":""},{"id":"emb-3","type":"paragraph","content":"(Fetal life is 280 days)"},{"id":"emb-4","type":"list","content":["I) Period of Ovum:\n(from conception → 7th day of fetal life)","II) Embryonic period:\n(beginning at 2th week → end 2nd month)","III) Fetal period.","IV) Branchial arches."]},{"id":"emb-5","type":"heading","title":"I) Period of Ovum:","content":""},{"id":"emb-6","type":"subheading","title":"1st step:","content":""},{"id":"emb-7","type":"paragraph","content":"Fertilization in distal 1/3 of fallopian tube.\n(Spermatozoon + ovum) fuse giving 1st cell of the new organism (Zygote).\n\nZygote undergoes series of cell division as it moves towards the uterine cavity.\n\nBy 4 days zygote reaches uterus (it is multicellular mass) called (Morula).\n\n↑ division & Morula gained fluid filled inner cavity (Blastocoel)."},{"id":"emb-8","type":"paragraph","content":"Embryo now called (Blastocyst).\n\nEccentric accumulation of fluid.\n\nFormation of outer cell mass (Trophoblast) enclosing the fluid.\n\nCluster of cells project into the cavity (Embryoblast) or (inner cell mass)."},{"id":"emb-9","type":"paragraph","content":"6th day:\n\nImplantation of zygote into uterine wall & formation of placenta."},{"id":"emb-10","type":"heading","title":"II) Embryonic period:","content":""},{"id":"emb-11","type":"subheading","title":"Characterized by:","content":""},{"id":"emb-12","type":"paragraph","content":"Rapid growth & differentiation of 3 germ layers\n(ecto / meso / endo) to form organs & system.\n\nAll major features established:\nBlood begin to circulate / face develops / heart / body elongate."},{"id":"emb-13","type":"list","content":["A) Presomite period:\n(beginning of 2nd week → end of 3rd week)","B) Somite Period:\n(21 → 31 day)","C) Post somite"]},{"id":"emb-14","type":"heading","title":"A) Presomite period:","content":""},{"id":"emb-15","type":"list","content":["1- Characterized by formation of fetal membranes.","2- Amnion (amniotic cavity) & yolk sac:\nAre 2 fluid accumulations which are separated by plate of double cell layer (embryonic disk or Germ disk).\n→ 1st layer is ectoderm → floor of Amnion\n→ 2nd layer is endoderm → roof of yolk sac","3- On 15 day:\nA groove (primitive streak) appears on surface in midline of dorsal aspect of ectoderm of embryonic disk.","4- On 16 day:\nA primitive Knot (node) of cells appears at cephalic end of primitive streak.","5- Knot:\nGive rise to cells that form (notochordal process)."]},{"id":"emb-16","type":"note","title":"N.B:","content":"Notochordal serves as axial skeleton till replaced by vertebrae."},{"id":"emb-17","type":"list","content":["6- Cells from primitive streak & notochordal process migrate laterally between ecto & endo → forming mesoderm layer.","7- At end of 3rd W.I.U → Mesoderm migrate laterally between ectoderm & endoderm.\n→ Anterior part of disk forms future Bucco pharyngeal membrane."]},{"id":"emb-18","type":"heading","title":"8- Derivatives of 3 germ layers","content":""},{"id":"emb-19","type":"definition","title":"1) Ectoderm:","content":"Epidermis & its appendages including hair, nail & glands (sebaceous - sweat)\nEpithelial lining of oral cavity & nasal cavity sinuses\nSensory of eye, ear, nose\nNeural structures (CNS – PNS)"},{"id":"emb-20","type":"definition","title":"2) Mesoderm:","content":"Muscles\nC.T. structures (Bone, cartilage, blood, D, C, Pulp, & PDL)"},{"id":"emb-21","type":"definition","title":"3) Endoderm:","content":"Epithelial lining of GIT & respiratory system\nSecretory cells of liver & pancreas"},{"id":"emb-22","type":"heading","title":"Development of the nervous tissue:","content":""},{"id":"emb-23","type":"list","content":["1- At 18th day, the developing notochord & adjacent mesoderm induce the overlying ectoderm to form ectodermal thickening on dorsal surface of the embryo.\nThis thickening is called (neural plate) which is the primordium of the nervous system.","2- The neural plate bends at the central axis to form (neural groove).","3- The raised margins along both side of the neural groove are called (neural folds).","4- The crests of neural folds contain (Neural crest cells).","5- Neural folds gradually approach each other in midline → they fuse to form neural tube below the surface.\nN.B: The fusion starts from the center of the body then proceeds in caudal & cephalic direction.","6- Neural tube sinks below the surface & detached from ectoderm.","7- Complete closure of neural tube at the 4th week I.U.","8- Then the greatest growth & differentiation of neural tube is present anteriorly (head region), so the tube enlarges to form 3 rounded prominences (vesicles):\nForebrain\nMidbrain\nHindbrain"]},{"id":"emb-24","type":"heading","title":"Neural crest cells:","content":""},{"id":"emb-25","type":"list","content":["1- Separated from the crests of neural folds.","2- Ectodermal in origin but migrate to mesenchyme, exhibit some properties of mesenchyme, so the tissue they form is called Ectomesenchyme.","3- They migrate extensively under the ectoderm especially in the head & neck region."]},{"id":"emb-26","type":"definition","title":"A - At the head & neck region they give:","content":"Most of Neural, Endocrine & pigment cells\nSkeletal tissue\nConnective tissue, including:\na- C.T of the dental structure → (Dentine / pulp / PDL)\nb- Cartilage of branchial arches\nc- Dermis, etc."},{"id":"emb-27","type":"definition","title":"B - At the trunk region they form:","content":"Most of Neural, Endocrine & pigment cells\n\nBut not skeleton & C.T (they are formed by mesoderm not neural crest)"},{"id":"emb-28","type":"heading","title":"B) Somite Period: (21 → 31 day)","content":""},{"id":"emb-29","type":"list","content":["1- Characterized by establishment of organ systems.","2- Mesoderm adjacent to neural tube divides into series of block of condensed masses of cells (somites).\nEach somite differentiates into 3 parts:\nDermatome → dermis of skin\nMyotome → muscles of trunk & limbs (upper & lower) & contribute to some muscles\nForegut → develops into pharynx & pharyngeal pouches"]},{"id":"emb-30","type":"important","title":"Most congenital malformations occur in this stage.","content":"Most congenital malformations occur in the Somite period (21 → 31 day)."},{"id":"emb-31","type":"heading","title":"C) Post somite:","content":""},{"id":"emb-32","type":"list","content":["1- Head development dominates","2- Neck becomes defined & elongated","3- Early muscle movements are 1st seen now"]},{"id":"emb-33","type":"heading","title":"III) Fetal period:","content":""},{"id":"emb-34","type":"list","content":["1- Slower growth by (cell division & cell growth & ↑ intercellular substance)","2- Growth of systems & organs","3- Gradual formation of external features","4- Ossification centers appear in most bones"]},{"id":"emb-35","type":"heading","title":"From ovum to birth:","content":""},{"id":"emb-36","type":"list","content":["1- Human increases from 140 microns to more than 50 cm","2- Increases from few milligrams to about 3 kilograms"]},{"id":"emb-37","type":"heading","title":"Embryo at 3 W.I.U","content":""},{"id":"emb-38","type":"list","content":["1- 3 mm length","2- Formed mainly of 3 prominences:\nForebrain\nMidbrain\nHindbrain\n\nThese prominences are covered by ectoderm & thin layer of mesoderm.","3- Stomodeum (primitive oral cavity):\nBelow the forebrain\nAbove the developing heart\n\nSeparated from foregut by oropharyngeal membrane (buccopharyngeal membrane), which is double epithelial membrane."]},{"id":"emb-39","type":"paragraph","content":"The buccopharyngeal membrane soon breaks down and the stomodeum communicates with the foregut at the beginning of face development."},{"id":"emb-40","type":"heading","title":"IV) Branchial arches","content":""},{"id":"emb-41","type":"subheading","title":"A- Development:","content":""},{"id":"emb-42","type":"list","content":["1- At the 4th week (during somite period), 5 or 6 pairs of outgrowths are formed called the branchial arches / oropharyngeal arches.","2- Separating stomodeum from developing heart.","3- 1st arch (mandibular arch) & 2nd arch (hyoid arch) meet each other in the midline, but 3rd, 4th, 5th & 6th do not meet in midline."]},{"id":"emb-43","type":"subheading","title":"B- Structure:","content":""},{"id":"emb-44","type":"list","content":["1- Covered by ectoderm externally & lined by endoderm internally.\nExcept: 1st arch is covered externally & internally by ectoderm.\nN.B: The arches are separated externally by ectodermal clefts & internally by endodermal pouches.","2- Mesoderm augmented by neural crest cells.","3- Nerve:\nTrigeminal (V) for 1st arch\nFacial (VII) for 2nd arch\nGlossopharyngeal (IX) for 3rd arch","4- Artery: Stapedial for 1st arch","5- Cartilage:\nMeckel's cartilage for 1st arch\nReichert cartilage for 2nd arch","6- The cartilage is covered by fibrous covering (perichondrium)"]},{"id":"emb-45","type":"heading","title":"Mandibular arch (the largest)","content":""},{"id":"emb-46","type":"subheading","title":"A- Structure:","content":""},{"id":"emb-47","type":"list","content":["1- Covered by ectoderm externally & internally","2- Mesoderm augmented by neural crest cells","3- Nerve: Trigeminal (V)","4- Artery: Stapedial","5- Meckel's cartilage in center","6- Fibrous covering: Perichondrium"]},{"id":"emb-48","type":"heading","title":"B- Derivatives (25)","content":""},{"id":"emb-49","type":"definition","title":"I- Hyaline cartilage (Meckel's cartilage): (6)","content":"Anterior part forms:\n1- Lingual\n2- Mental ossicles\n\nPosterior part persists as:\n3- Incus bone\n4- Malleus bone (middle ear)\n\nFibrous perichondrium gives:\n5- Anterior ligament of malleus\n6- Sphenomandibular ligament"},{"id":"emb-50","type":"definition","title":"II- Mesoderm: (10)","content":"Gives all muscles supplied by nerve of the arch:\n1- Masseter\n2- Temporalis\n3- Medial pterygoid\n4- Lateral pterygoid\n5- Mylohyoid\n6- Tensor palate\n7- Tensor tympani\n8- Anterior belly of digastric\n\nAlso gives:\nMandible\nMaxilla proper"},{"id":"emb-51","type":"definition","title":"III- Artery (Stapedial): (2)","content":"1- Maxillary artery in part\n2- External carotid artery in part"},{"id":"emb-52","type":"definition","title":"IV- Nerve: Trigeminal nerve (1)","content":"A- Mandibular branch:\n(Has 2 divisions)\n\n1st:\nMotor for muscles of mastication\n\n2nd:\nSensory for:\nMandibular mucosa\nTeeth\nGingiva\nAnterior 2/3 of tongue\nFloor of mouth\n\nB- Maxillary branch:\nSupplies corresponding structures of maxilla"},{"id":"emb-53","type":"definition","title":"V- Other derivatives: (6)","content":"1- Lower lip\n2- Part of upper lip\n3- Cheek\n4- Anterior 2/3 of tongue\n5- Teeth\n6- Salivary glands"}],"giveReasons":[{"reason":"Fetal life is considered 280 days","explanation":"Because it is calculated from the last menstrual period (LMP), which adds approximately 10 days to the actual fertilization period of 270 days.","cat":"developmental"},{"reason":"The embryonic period (2nd week to end of 2nd month) is considered the most critical period","explanation":"Because all major organ systems are being established during this time. Teratogenic agents acting during the embryonic period cause the most severe and widespread malformations.","cat":"developmental"},{"reason":"Ectoderm is the most important germ layer in dentistry","explanation":"Because it gives rise to the enamel organ (which forms enamel) and the oral epithelium. Neural crest cells (derived from ectoderm) give rise to the ectomesenchyme, which forms dentin, cementum, PDL, alveolar bone, and dental pulp.","cat":"developmental"},{"reason":"Neural crest cells are critical for craniofacial development","explanation":"Because they migrate from the neural folds to form the ectomesenchyme, which differentiates into virtually all the connective tissues of the face and most of the dental hard and soft tissues (dentin, cementum, PDL, alveolar bone, pulp).","cat":"developmental"},{"reason":"The buccopharyngeal membrane ruptures at the end of the 4th week","explanation":"To establish communication between the stomodeum (primitive oral cavity) and the pharynx (foregut), allowing the developing embryo to eventually feed and breathe through the oral cavity.","cat":"developmental"},{"reason":"The period of ovum is the most susceptible to teratogenic agents","explanation":"Because the embryo is undergoing rapid cell division during this period; any disruption can cause the entire embryo to die (all-or-nothing principle).","cat":"developmental"}]},{"id":2,"slug":"development-of-the-face","title":"Development of the Face","subtitle":"Dr.Thuraya Milad Elhady","category":"embryology","summary":"The face develops from five primordial prominences that surround a central depression (the primitive oral pit). At the fourth week the ectomesenchymal cells migrate in two streams. A cranial stream that causes mesodermal enlargement at the frontal area to form the frontonasal process, and a caudal stream that enters the first pharyngeal arches and form two bilaterally located maxillary and mandibular processes. Thus the five primordial of the face are established.","keywords":["frontonasal process","maxillary process","mandibular process","medial nasal process","lateral nasal process","nasal placode","olfactory placode","intermaxillary segment","bucconasal groove","naso-lacrimal groove","Meckel's cartilage","condylar cartilage","cleft lip","primary palate","philtrum"],"keyDefinitions":[{"term":"Frontonasal Process","definition":"Formed by cranial stream ectomesenchymal migration causing mesodermal enlargement at the frontal area."},{"term":"Nasal Placodes (Olfactory Placodes)","definition":"Develop bilaterally on the inferior lateral part of the frontonasal process at the fifth week where it borders the oral cavity. Mesenchyme proliferates rapidly transforming them into nasal pits."},{"term":"Medial Nasal Processes","definition":"Formed by the long arms of the horseshoe-shaped mesodermal proliferations around the nasal pits."},{"term":"Lateral Nasal Processes","definition":"Formed by the short arms of the horseshoe-shaped mesodermal proliferations around the nasal pits."},{"term":"Lateral Labial Grooves (Bucconasal Grooves)","definition":"The grooves between the median nasal processes and maxillary processes."},{"term":"Naso-optic Grooves (Naso-lacrimal Groove)","definition":"The grooves between the lateral nasal processes and the maxillary processes. Floor epithelium forms a solid cord eventually canalized to form the naso-lacrimal duct."},{"term":"Intermaxillary Segment (Globular Process)","definition":"Formed at middle of sixth week by merging of the two medial nasal processes in the midline. Gives rise to nasal septum, philtrum, and primary palate."},{"term":"Primary Palate","definition":"That part of the alveolar process carrying the incisor teeth. Formed by the intermaxillary segment."},{"term":"Meckel's Cartilage","definition":"A typical hyaline cartilage covered by fibrous tissue extending as a curved rod from cartilaginous otic capsule at base of skull to midline. Mandible develops lateral to it."},{"term":"Condylar Cartilage","definition":"Forms most of the developing ramus and condyle. Acts as the very important growth center of the mandible up to 21 years of age."},{"term":"Coronoid Cartilage","definition":"Forms the coronoid process and disappears long before birth (transient growth cartilage)."},{"term":"Symphyseal Cartilage","definition":"Appears in connective tissue between ends of Meckel's cartilage (independent of it) and becomes ossified within first year after birth."},{"term":"Premaxilla","definition":"A piece of bone which supports the maxillary incisor teeth and forms the anterior part of the hard palate up to the incisive foramen. Develops in mesenchyme of median nasal processes."}],"importantPoints":["Five primordial of the face: Stomodeum, 1 Frontonasal prominence, 2 Maxillary prominences, 2 Mandibular prominences","Mandibular processes merge at midline eliminating the depression between them — give rise to mandible, lower part of face (lower lip & lower cheek)","Nasal placodes develop bilaterally on inferior lateral part of frontonasal process at 5th week","Horseshoe-shaped elevations: long arms = medial nasal processes; short arms = lateral nasal processes","Eyes develop during 5th week — 1st sign: lens placodes between maxillary and frontonasal processes at lateral sides","By 6th week maxillary processes proliferate → eyes enlarge and grow medially","At middle of 6th week: two medial nasal processes merge → intermaxillary segment → nasal septum + philtrum + primary palate","Upper lip = one third medial nasal processes + two thirds maxillary processes","Ossification of mandible begins at 6th week I.U. lateral to Meckel's cartilage at bifurcation of inferior alveolar nerve (future mental foramen region)","Condylar cartilage is main mandibular growth center up to 21 years of age","Mandible grows in 3 planes: vertically, anteroposteriorly, and transversally","Mandibular angle: ~170° at birth → ~140° in childhood → ~110° in adult","Mental foramen near lower border at birth; near upper border in old age (due to alveolar resorption)","Maxilla ossification commences at 7th W.I.U. near anterosuperior dental nerve (future canine fossa)","Maxilla has 2 types of growth: 1. Growth at the suture 2. Growth by surface apposition","Lower lip develops during 4th or 5th week I.U. by merging of mandibular processes","Upper lip develops from maxillary processes and medial nasal processes beginning at 6th week I.U."],"histologicalFeatures":["Mandible ossifies intramembranously lateral to Meckel's cartilage","Meckel's cartilage: typical hyaline cartilage covered by fibrous tissue (perichondrium)","Dorsal end of Meckel's cartilage ossifies → malleus and incus of inner ear","Ventral end at symphysis forms accessory endochondral ossicles in chin region","Rest of Meckel's cartilage disappears without contributing to mandibular bone — leaving mylohyoid groove","Fibrous sheath of Meckel's cartilage remains as sphenomandibular and sphenomalleolar ligaments","Condylar cartilage is a secondary cartilage — not primary hyaline cartilage","Coronoid cartilage is transient — disappears long before birth","Symphyseal cartilage ossifies within first year after birth","Secondary cartilage (zygomatic/malar) appears in developing zygomatic process of maxilla","Naso-lacrimal duct: floor epithelium of naso-lacrimal groove → solid cord of epithelial cells → canalized to form duct → invested by bone during maxillary ossification"],"clinicalNotes":["Median cleft of the mandible: rare condition — failure of mesenchymal masses of mandibular processes to merge at five weeks I.U. Mandible may develop with no bony union in midline. A dimple of the chin is the slightest form.","Unilateral cleft lip: failure of maxillary process on one side to meet and fuse with intermaxillary segment. Results in persistence of labial groove. Causes nasal distortion as lip and nasal tissues pulled toward attached side.","Bilateral cleft lip: failure of maxillary processes on both sides to meet and fuse with intermaxillary segment. May be symmetrical or asymmetrical.","Median cleft lip: extremely rare — partial or complete failure of medial nasal processes to merge together. Only type that may be called 'hare lip' (rabbits normally have cleft in middle of lip).","In senility: resorption of alveolar bone with loss of teeth results in increasing mandibular angle and backward inclination of condyle."],"flashcards":[{"question":"What are the five primordial of the face?","answer":"Stomodeum\n1 Frontonasal prominence\n2 Maxillary prominences\n2 Mandibular prominences"},{"question":"What do the mandibular processes give rise to?","answer":"The mandible, the lower part of the face (lower lip & lower cheek)."},{"question":"What are the lateral labial grooves and naso-optic grooves?","answer":"Lateral labial grooves (bucconasal grooves): grooves between median nasal processes and maxillary processes.\nNaso-optic grooves (naso-lacrimal groove): grooves between lateral nasal processes and maxillary processes."},{"question":"What is the intermaxillary segment and what does it give rise to?","answer":"Formed at middle of 6th week by merging of two medial nasal processes in midline. Gives rise to: central part of nose including nasal septum, center of upper lip (philtrum), and primary palate (carries incisor teeth)."},{"question":"What is the composition of the upper lip?","answer":"One third medial nasal processes + two thirds maxillary processes."},{"question":"When and where does mandibular ossification begin?","answer":"6th week I.U., in fibrous tissue lateral to Meckel's cartilage, by single ossification center for each half at bifurcation of inferior alveolar nerve into mental and incisive branches — region of future mental foramen."},{"question":"What are the 3 accessory cartilages of the mandible?","answer":"1. Condylar cartilage: forms most of ramus and condyle; growth center up to 21 years\n2. Coronoid cartilage: forms coronoid process; disappears before birth (transient)\n3. Symphyseal cartilage: between ends of Meckel's cartilage; ossifies within 1st year after birth"},{"question":"What are the 3 planes of mandibular growth?","answer":"1. Vertical: (a) growth at condyle (b) vertical growth of body\n2. Antero-posterior: bone apposition on posterior border of ramus + resorption on anterior border\n3. Transverse: periosteal apposition on external surface + internal resorption"},{"question":"What is the location of mental foramen at different ages?","answer":"1. Birth/early childhood: very near lower border\n2. Childhood (after deciduous eruption): just above midway line\n3. Adult (permanent teeth in position): just below midway line\n4. Old age (loss of teeth): very near upper border (resorption of alveolar process)"},{"question":"What are the 2 types of maxillary growth?","answer":"1. Growth at the suture: between maxilla and other facial bones (palatine, nasal, lacrimal, zygomatic) during first few years after birth\n2. Growth by surface apposition: periosteal apposition on outer surface, posterior surface of tuberosity, alveolar process, oral surface of hard palate — compensated by bone resorption internally"},{"question":"What are the types of cleft lip and their causes?","answer":"Unilateral: failure of maxillary process on one side to fuse with intermaxillary segment\nBilateral: failure of maxillary processes on both sides to fuse with intermaxillary segment (symmetrical or asymmetrical)\nMedian: extremely rare — failure of medial nasal processes to merge (the only 'hare lip')"}],"blocks":[{"id":"face-1","type":"heading","title":"DEVELOPMENT OF THE FACE.","content":"December 12\nDr.Thuraya Milad Elhady"},{"id":"face-2","type":"heading","title":"DEVELOPMENT OF THE FACE","content":""},{"id":"face-3","type":"paragraph","content":"The face develops from five primordial prominences that surround a central depression (the primitive oral pit). At the fourth week the ectomesenchymal cells migrate in two streams. A cranial stream that causes mesodermal enlargement at the frontal area to form the frontonasal process, and a caudal stream that enters the first pharyngeal arches and form two bilaterally located maxillary and mandibular processes. Thus the five primordial of the face are established."},{"id":"face-4","type":"list","content":["Stomodeum","1 Frontonasal prominence","2 Maxillary prominences","2 Mandibular prominences"]},{"id":"face-5","type":"paragraph","content":"The mandibular processes appear initially as bilateral structures but soon merge with each other at the midline, eliminating the depression or the groove between them. These processes will give rise to the mandible, the lower part of the face (lower lip &lower cheek)."},{"id":"face-6","type":"clinical","title":"Developmental Anomalies:","content":"Median cleft of the mandible. This is a rare condition which results from failure of the mesenchymal masses of the mandibular processes to merge together at five weeks I.U. The mandible may then develop with no bony union in the midline. A dimple of the chin is the slightest from of incomplete merging of the two mandibular processes."},{"id":"face-7","type":"paragraph","content":"In the fifth week: The nasal placodes (olfactory placodes) develop bilaterally on the inferior lateral part of the frontonasal process where it borders the oral cavity. At the margins of the nasal placodes. the mesesnchyme proliferates rapidly transforming the nasal placodes into nasal pits. The mesodermal proliferation is in the form of two horseshoe shaped elevations. The long arms of the horseshoes form the medial nasal processes and the short arms form the lateral nasal processes. The region of the frontal process where these changes take place and the nose will develop is called the frontonasal process."},{"id":"face-8","type":"paragraph","content":"The grooves between the median nasal processes and maxillary processes are called the lateral labial grooves or bucconasal grooves and the grooves between the lateral nasal processes and the maxillary processes are called the naso-optic grooves or naso-lacrimal groove."},{"id":"face-9","type":"paragraph","content":"The eyes develop during the 5th week. The first external sign of eye development is the appearance of the lens placodes between the maxillary and the frontonasal processes at the lateral sides of the face."},{"id":"face-10","type":"paragraph","content":"By the sixth week, the mesoderm of maxillary processes proliferates rapidly causing the eyes to enlarge and grow medially. This medial migration of the maxillary processes moves the medial nasal processes toward the midline and toward each other. At the same time the mesoderm around the nasal pits continues its proliferation and enlarges bringing the medial nasal processes more anteriorly. The maxillary processes now approach the medial nasal processes but remain separated from them by the bucconasal grooves on both sides."},{"id":"face-11","type":"paragraph","content":"The maxillary and lateral nasal processes are initially separated by a deep furrow or groove called naso-lacrimal groove. The epithelium in the floor of this groove forms a solid cord of epithelial cells, and is eventually canalized to form the naso-lacrimal duct. Later, this duct becomes invested by bone during the ossification of the maxilla. After birth it functions to drain excess tears from the eye to the nasal cavity."},{"id":"face-12","type":"important","title":"Intermaxillary Segment","content":"At the middle of the sixth week, the two medial nasal processes merge in the midline to form the inter-maxillary segment. This will give rise to the central part of the nose including the nasal septum, the center of the upper lip (the philtrum and the primary palate). *The primary palate is that part of the alveolar process carrying the incisor teeth."},{"id":"face-13","type":"heading","title":"DEVELOPMENT OF FACIAL FEATURES","content":""},{"id":"face-14","type":"paragraph","content":"The facial features develop at the fetal period. By the seventh week, the face has acquired a more human appearance. The facial features are accomplished by the differential growth of the different facial processes."},{"id":"face-15","type":"paragraph","content":"There is a decreased growth in breadth of the medial and lateral nasal processes and an increased growth of the maxillary processes. So, the eyes move from the lateral aspects of the head, into a position on either side of the nose. The orbital cavities attain their adult dimensions at about seven years of age."},{"id":"face-16","type":"paragraph","content":"The medial part of the face now increases in an anterior direction and at the same time the vertical height increases. The face grows in a forward direction to form the nasal bridge so that the nostrils and eyes are not on the same plane. The nose is not fully developed in the new born infant, as a baby has a flat nose. the nose acquires its inherited size shape at puberty."},{"id":"face-17","type":"paragraph","content":"The vertical growth of the face moves the ears cranially from the lower part of the face to be positioned laterally in the middle third of the face."},{"id":"face-18","type":"paragraph","content":"During early development until 8 weeks the mandible is small relative to upper face, and the lower lip is positioned behind the upper one. By 9 weeks the head is raised up and is lifted away from the thorax and thus permits the mandible to grow forward"},{"id":"face-19","type":"heading","title":"Development and ossification of the mandible","content":""},{"id":"face-20","type":"paragraph","content":"The mandible develops as an intramembranous bone lateral to Meckel's cartilage (a typical hyaline cartilage covered by fibrous tissue). It extends as a curved rod from the cartilaginous otic capsule at the base of the skull to the midline; where its ventral end turns upward in contact with the cartilage of the opposite side, to which its joined by mesenchyme."},{"id":"face-21","type":"paragraph","content":"The dorsal end of Meckel's cartilage ossifies to form the malleus and incus of the inner ear. The ventral end at the symphysis forms accessory endochondral ossicles in the chin region. the rest of the cartilage disappears without contributing to the formation of the bone of the mandible leaving the mylohyoid groove in which it lays. the fibrous sheath surrounding the cartilage remains as the sphenomandibular and the sphenomalleolar ligaments."},{"id":"face-22","type":"important","title":"Ossification Center","content":"Ossification of the mandible begins during the 6th week I. U. in the fibrous tissue lateral to Meckel's cartilage, by the appearance of single ossification center for each half of the mandible in the region of the bifurcation of the inferior alveolar nerve into mental and incisive branches; that is in the region of the future mental foramen. from this center bone formation spreads rapidly to embrace the inferior alveolar nerve and to form the body proper of the mandible."},{"id":"face-23","type":"paragraph","content":"It extends in the anterior posterior direction from the symphysis to the mandibular foramen. The alveolar process of the mandible develop by the upward growth of the outer and inner plates of mandibular bone thus the tooth germ are contained in a groove of bone which opens towards the surface of the oral cavity. this groove is later divided by the development of bony septa between the tooth germs."},{"id":"face-24","type":"paragraph","content":"The backward extension of the mandible to form the ramus is produced by spread of ossification from the body, behind and above the mandibular foramen mapping the ramus and its two processes. At the 10th and 16th W.I.U., further growth of these processes occurs by the appearance of accessory cartilages forming secondary centers at the condyle and coronoid processes. A third accessory cartilage, the symphyseal cartilage or cartilage appears at the symphysis."},{"id":"face-25","type":"paragraph","content":"The condylar cartilage forms most of the developing ramus and condyle and acts as the very important growth center of the mandible up to 21 years of age. The coronoid cartilage forms the coronoid process and disappears long before birth (transient growth cartilage). The symphyseal cartilage or cartilages appear in the connective tissue between the ends of Meckel's cartlage (independent of it )and become ossified within the first year after the birth."},{"id":"face-26","type":"heading","title":"Growth of the mandible:","content":"the main sites of postnatal mandibular growth are at the condylar cartilage, the posterior border of the ramus and the alveolar ridge. These areas of bone apposition for the increased in the height, length and width of the mandible. They are however, accompanied by selective resorption which results in modeling and remodeling of the growing bone. The mandible grows in three planes, vertically, anteroposteriorly and trnsversally"},{"id":"face-27","type":"subheading","title":"Vertical Growth: is the result of","content":""},{"id":"face-28","type":"list","content":["a) Growth at the condyle.","b)Vertical growth of the body."]},{"id":"face-29","type":"paragraph","content":"a). growth at the condyle: the condyle cartilage serves as an important center of growth, for the ramus and the body of the mandible. The continuous proliferation of this cartilage until the age of 21 years produces an increase in mandibular length as measured from condyle to symphysis and at the same time an increase in the height of the ramus. Growth at the condyle usually occurs in a backward upward and outward direction, thus increasing the length of each half of the mandible."},{"id":"face-30","type":"paragraph","content":"The upward and backward growth of the condyle leads to moving the mandible downward and forward, thus providing the space into which the growth of the mandibular and maxillary alveolar processes can occur. While the outward growth of the condyles increase the distance between the two condyles to accommodate the increasing width of the base of the skull."},{"id":"face-31","type":"paragraph","content":"b.Vertical growth of the body of the mandible: This occurs by surface apposition of bone and results in an increase in height of the mandibular body."},{"id":"face-32","type":"paragraph","content":"2.Antero-posterior growth: bone apposition occurs on the posterior border of the ramus. This is accompanied with resorption on the anterior border to maintain the proportion of the ramus and to give room for the eruption fo the subsequent molars particularly the permanent ones."},{"id":"face-33","type":"paragraph","content":"3.Transverse growth: The growth here occurs by periosteal apposition on the external surface of the mandible which results in an increase in thickness of the mandible. This periosteal apposition of bone is accompanied by internal resorption and reconstruction of bone."},{"id":"face-34","type":"heading","title":"Age changes of the mandible:","content":""},{"id":"face-35","type":"list","content":["✓ A birth the mandible differs from adult bone.","the mandibular angle between the lower border and the posterior border of the ramus is about 170º at birth","the ramus is small and short and the coronoid process is higher than the condyle process. The chin is usually poorly developed and the two halves of the mandible are joined by fibrous tissue in the midline.","The mental foramen is near the lower border below the crypt of the first deciduous molar and the tooth germs lie in a groove of bone with no bone overlying them at this stage.","The growth and modeling changes occurring during infancy and childhood serve to alter the mandibular angle from about 140º in childhood to about 110º in adult.","The condylar process becomes higher than the coronoid process.","In senility the resorption of the alveolar bone with the loss of teeth results in increasing the angle and in backward inclination of the condyle."]},{"id":"face-36","type":"heading","title":"Location of mental foramen from birth to old age:","content":""},{"id":"face-37","type":"list","content":["1.At birth and early childhood, the mental foramen is very near to the lower border of the mandible.","2. In childhood, after eruption of the deciduous set the foramen is just above the midway line.","3. In adult, when all the permanent teeth are in position, the foramen is just below the midway line. This is because of the higher permanent sockets.","4. In old age, after the loss of teeth, the foramen is very near to the upper border. This is because of the resorption and nearly complete disappearance of the alveolar process."]},{"id":"face-38","type":"heading","title":"DEVELOPMENT AND OSSIFICATION OF THE MAXILLA","content":""},{"id":"face-39","type":"paragraph","content":"The human maxilla is composed of two bones, the maxilla proper and the premaxilla. In adult no line of demarcation is seen between them. However, this union is indicated on the palatal aspects of young skulls by the incisive fissure extending form the incisive foramen to the alveolus of the canine. On the facial aspects all trace of union between maxilla and premaxilla disappears before birth."},{"id":"face-40","type":"paragraph","content":"Ossification in the maxilla commences at the 7th W.I.U., by the appearance of one center of ossification close to the anterosuperior dental nerve (at the future canine fossa). From this center ossification spreads upward, downward, backward, inward and anterior to form frontal, the alveolar, the zygomatic and the palatine processes respectively and to spread the ossification anteriorly, to the premaxilla. There are two premaxilla, one on either side of the midline of the face. they develop in the mesenchyme of the median nasal processes. Each premaxilla is a piece of bone which supports the maxillary incisor teeth and forms the anterior part of the hard palate up to the incisive foramen. A secondary cartilage (zygomatic or malar )appears in the developing zygomatic process, and contributes to the development of the maxilla."},{"id":"face-41","type":"important","title":"***Growth of maxilla: they are 2 types","content":"1.Growth at the suture. 2. Growth by surface apposition."},{"id":"face-42","type":"paragraph","content":"1.Growth at the sutures :\nDuring the first few years after birth, there is certain amount of growth at the sutures between the maxilla and the other facial bones (palatine, nasal, lacrimal and zygomatic)"},{"id":"face-43","type":"paragraph","content":"2.Growth by the surface apposition:\nIt occurs by periosteal apposition of bone on the outer surface of the maxilla, on the posterior surface of the maxillary tuberosity, the alveolar process and the oral surface of the hard palate. This periosteal apposition is compensated for by bone resorption in the interior of the maxilla and in the nasal surface of the hard palate thereby increasing the size of the sinuses and the depth of the nasal cavities. In general the balance between osteoblastic apposition and osteoclastic resorption has a large effect on determining the final shape and size of the bones of the face."},{"id":"face-44","type":"heading","title":"Development of lips","content":""},{"id":"face-45","type":"paragraph","content":"The lower lip develops during the fourth or fifth week I.U. by merging of the mandibular processes. The upper lip develops from the maxillary processes and the medial nasal processes. It begins to develops at the sixth week I.U. when the maxillary processes approach the medial nasal processes but remain separated from them by the bucconasal grooves."},{"id":"face-46","type":"paragraph","content":"By the middle of the sixth week, the two medial nasal processes merge in the midline to form the inter-maxillary segment (globular process). This will give rise to the central part of the upper lip (the philtrum). At the seventh week merging takes place between the two maxillary processes and the lateral boundaries of the intermaxillary segment eliminating the bucconasal grooves in between. *So, the upper lip is formed from one third medial nasal processes and two thirds maxillary processes."},{"id":"face-47","type":"paragraph","content":"At the same time the mesoderm of the first pharyngeal arches with its sensory innervations from the maxillary divisions of the trigeminal nerve invade the upper lip and cheeks, while the mesoderm of the first pharyngeal arches with its mandibular divisions of the trigeminal nerve invades the lower lip."},{"id":"face-48","type":"heading","title":"Developmental Anomalies","content":""},{"id":"face-49","type":"clinical","title":"CLEFT LIP:","content":"This is a malformation of the upper lip .It may be unilateral or bilateral. The cleft varies from a notch in the vermilion border to a cleft extending into the floor of the nostril and through the alveolar ridges."},{"id":"face-50","type":"clinical","title":"Unilateral cleft lip:","content":"Unilateral cleft lip results from failure of the maxillary process on one side to meet and fuse with the intermaxillary segment. This results in the persistence of the labial groove which is stretched and breaks down leading to the division of the lip into medial and lateral parts. Unilateral cleft lip results in nasal distortion as the lip and nasal tissues are pulled toward the attached side."},{"id":"face-51","type":"clinical","title":"Bilateral cleft lip:","content":"results from failure of the maxillary processes on both sides to meet and fuse with the intermaxillary segment. The defect may be symmetrical or asymmetrical."},{"id":"face-52","type":"clinical","title":"Median cleft lip:","content":"is extremely rare and results from partial or complete failure of the medial nasal processes to merge together. This is the only type of cleft lip that may be called a \"hare lip \". Rabbits normally have a cleft in the middle of the lip and this is where this term came from."}],"giveReasons":[{"reason":"Cleft lip is more common on the left side","explanation":"Because the right nasomedial process fuses earlier than the left with the maxillary process, leaving the left side more vulnerable to failure of fusion.","cat":"clinical"},{"reason":"Cleft palate is more common in females while cleft lip is more common in males","explanation":"Because the palatal shelves elevate later in female embryos (due to the larger and longer-persisting tongue), giving a wider window of vulnerability. Males develop cleft lip more because their nasal processes fuse later on average.","cat":"clinical"},{"reason":"The frontonasal process is the most important process for facial development","explanation":"Because it gives rise to the middle third of the face: the forehead, the nose (via medial and lateral nasal processes), the philtrum of the upper lip, and the premaxilla with the four upper incisor teeth.","cat":"developmental"},{"reason":"Failure of merging of facial processes leads to clefts","explanation":"Because when the epithelial groove between two processes fails to break down and the underlying mesenchyme fails to penetrate and merge, the groove persists as a cleft. Mesenchyme proliferation is essential to eliminate the groove between processes.","cat":"clinical"},{"reason":"The condylar cartilage is the most important mandibular growth center","explanation":"Because it acts as a secondary cartilage and is the primary growth center of the mandible, remaining active until approximately 21 years of age. It forms most of the developing ramus and condyle.","cat":"developmental"},{"reason":"The alveolar bone resorbs after tooth loss","explanation":"Because the alveolar process is tooth-dependent — it develops with tooth formation and eruption, and resorbs when teeth are lost due to the absence of functional stimulation through the PDL.","cat":"clinical"}]},{"id":3,"slug":"development-of-the-mouth","title":"Development of the Mouth","subtitle":"Dr: Thouraya Milad Al-Hadi","category":"embryology","summary":"Development Of The Mouth (tongue & palate). The tongue is an organ composed of muscles covered by a mucous membrane. It consists of the body (the anterior movable part) and the base (the posterior firmly attached part). The Tongue begins to develop near the end of the 4th week I.U. It is formed in the floor of the stomodeum.","keywords":["tongue","tuberculum impar","lateral lingual swellings","sulcus terminalis","foramen cecum","hypobranchial eminence","lingual frenulum","occipital myotomes","hypoglossal nerve","palate","primary palate","secondary palate","lateral palatine process","shelf elevation","cleft palate","bifid uvula","palatine fusion"],"keyDefinitions":[{"term":"Tuberculum Impar","definition":"A small centrally placed elevation in the midline of the first pharyngeal arch just anterior to the foramen cecum. Covered by lateral lingual swellings to form mucous membrane of anterior 2/3 of tongue."},{"term":"Lateral Lingual Swellings","definition":"Two oval swellings that develop on both sides of the tuberculum impar. They enlarge, merge with each other and cover the tuberculum impar to form the mucous membrane of the anterior 2/3 of tongue."},{"term":"Hypobranchial Eminence","definition":"Develops from mesoderm of third and fourth pharyngeal arches. Anterior part → mucous membrane of base of tongue. Posterior part → lining of epiglottis."},{"term":"Sulcus Terminalis","definition":"An inverted V shaped groove indicating the line of fusion between anterior and posterior portions of tongue. Its apex is the foramen cecum."},{"term":"Foramen Cecum","definition":"The apex of the sulcus terminalis."},{"term":"Lingual Sulcus","definition":"U shaped sulcus formed by degeneration of ectoderm around periphery of tongue (except at lingual frenulum). Gives the tongue its mobility."},{"term":"Primary Palate","definition":"Wedge shaped tissue appearing at beginning of 6th W.I.U. by merging of two medial nasal processes. Represents only small part of hard palate anterior to incisive papilla. Supports four maxillary incisors. Also called median palatine process and premaxillary bone."},{"term":"Secondary Palate","definition":"Part of palate posterior to incisive fossa. Forms remaining part of hard palate and soft palate. Develops from lateral palatine processes at end of 6th week."},{"term":"Lateral Palatine Process (Shelves)","definition":"Develop from inferior-medial edges of maxillary processes bounding stomodeum. Grow first medially and downward (vertically) on either side of tongue. Later elevate horizontally over tongue."},{"term":"Palatal Fusion","definition":"Process of contact, loss of intervening epithelium and growth of connective tissue across the midline. Occurs in Y shaped manner. Begins 9th week, completed by 12th W.I.U."}],"importantPoints":["Tongue mucous membrane develops mainly from 1st and 3rd pharyngeal arches, partly from 4th; muscles from occipital myotomes","Anterior 2/3 of tongue (body): 3 elevations in 1st arch — tuberculum impar + 2 lateral lingual swellings","Posterior 1/3 of tongue (base): hypobranchial eminence (3rd and 4th arch mesoderm)","Sulcus terminalis: inverted V shaped groove; apex = foramen cecum","Body of tongue separates from floor of mouth by lingual sulcus — ectoderm degenerates except at lingual frenulum","Tongue muscles (except palatoglossus): from occipital myotomes → innervated by hypoglossal nerve","Palatoglossus muscle: from mesoderm of 4th pharyngeal arch → innervated by vagus nerve","Circumvallate and foliate papillae: appear first ~8 weeks I.U. (with taste buds), followed by fungiform papillae","Filiform papillae: apparent ~10th week I.U.","Von Ebner serous glands: develop ~4 months I.U.; Weber mucous glands in posterior 1/3","Lingual tonsils: develop at birth in pharyngeal part (base) of tongue","Tongue tie is the most common malformation of the tongue","Primary palate: beginning of 6th W.I.U., anterior to incisive papilla, supports 4 maxillary incisors","Palatine shelves: grow vertically on either side of tongue then elevate horizontally 8th-9th weeks I.U.","Shelf elevation begins posteriorly and proceeds anteriorly","Palatine fusion: begins 9th week, completed by 12th W.I.U., proceeds in Y shaped manner","Anterior palate invaded by bone → hard palate; posterior invaded by muscles → soft palate","Cleft palate classified into: 1. Cleft of primary palate 2. Cleft of secondary palate 3. Cleft of both"],"histologicalFeatures":["Circumvallate and foliate papillae appear first at about 8 weeks I.U., followed by the fungiform papillae — within these papillae taste buds soon develop","Filiform papillae becomes apparent at about 10th week I.U.","Von Ebner serous glands develop at about 4 months I.U.","Weber mucous glands develop in posterior third of tongue","Lingual tonsils (lymphatic tissue) develop at birth in pharyngeal part (base) of tongue","Intrinsic muscles lie entirely within the tongue; extrinsic muscles attach tongue to other structures","Palatal fusion = contact + loss of intervening epithelium + growth of connective tissue across midline"],"clinicalNotes":["*Microglossia: small tongue in relation to the size of the oral cavity.","*Macroglossia: big or large tongue it is sometimes seen at birth where the tongue slightly protrudes from the mouth.this condition soon corrects itself when the jaws grow at a more rapid rate to make the tongue appear normal. True macroglossia is usually seen in case of mongolism.","*Bifid tongue: failure of merging between the two lateral lingual swellings.","*Trifid tongue (median rhomboid glossitis): the presence of the tuberculum impar between the two lateral lingual swellings. So, the tongue appear to be formed of three nodules.","*tongue tie: it is the most common malformation of the tongue.the lingual frenum is short or attached anteriorly reaching to the tip of the tongue So, interferes with its mobility.","Cleft palate: less common than cleft lip. May be due to lack of complete growth or failure of fusion between palatine processes and nasal septum, or due to initial fusion with interruption, or interference with palatal shelf elevation.","Bifid uvula: simplest form of secondary palate cleft — causes practically no discomfort, usually accidentally discovered.","Cleft of soft palate: causes varying degrees of speech difficulty and swallowing problems.","Cleft of hard and soft palate: usually produce severe feeding problem as food may be aspirated into the lungs.","Clefts of primary palate: associated with missing or malformed teeth adjacent to clefts such as lateral incisors and canines."],"flashcards":[{"question":"What forms the anterior 2/3 of the tongue?","answer":"*The anterior 2/3 of the tongue (the body): develops from three elevations which appear in the first pharyngeal arches.\nFirst, a small centrally placed elevation, the tuberculum impar appears in the midline of the first pharyngeal arch just anterior to the formen cecum.\nSoon, two oval lateral lingual swellings develop on both sides of the tuberculum impar.\nVery quickly these lateral lingual swelling enlarge, merge with each other and cover the tuberculum impar to form a large mass from which the mucous membrane of the anterior 2/3 of the tongue is formed."},{"question":"What forms the posterior 1/3 of the tongue?","answer":"The posterior 1/3 of the tongue (the base) is initially indicated by two elevations that develop caudally to the foramen cecum.\nThe hypobranchial eminence which develops from the mesoderm of the third and fourth pharyngeal arches.\nThe mucous membrane of the base of the tongue develops from the anterior part of the hypobranchial eminence while, the lining of the epiglottis develops from its posterior part and the fourth pharyngeal arch."},{"question":"What is the sulcus terminalis?","answer":"The anterior and posterior portions of the tongue develop at the same time and the line of fusion between them is indicated by an inverted V shaped groove, the sulcus terminalis. its apex is the foramen cecum."},{"question":"What is the innervation of the tongue?","answer":"Anterior 2/3: lingual branch of mandibular division of trigeminal nerve for general sensation; corda tympani of facial nerve for taste sensation of fungiform papillae and anterior foliate papillae.\nPosterior 1/3: glossopharyngeal nerve (3rd arch) for both general and taste sensations.\nEnd of tongue and epiglottis: vagus for both general and taste sensations.\nMuscles (except palatoglossus): hypoglossal nerve.\nPalatoglossus: vagus nerve."},{"question":"What are the tongue muscles and their origins?","answer":"All muscles of the tongue except the palatoglossal muscles are derived from the occipital myotomes → innervated by hypoglossal nerve.\nThe palatoglossal muscles are derived from the mesoderm of the fourth pharyngeal arches → innervated by the vagus nerve.\nIntrinsic: Superior longitudinal, Inferior longitudinal, Transverse, Vertical\nExtrinsic: Styloglossus, Hyoglossus, Genioglossus, Palatoglossus"},{"question":"What is the sequence of tongue papillae development?","answer":"The circumvallate and foliate papillae appear first at about 8 weeks I.U., followed by the fungiform papillae. within these papillae taste buds soon develop. the filiform papillae becomes apparent at about 10th week I.U.\nThe Von Ebner serous glands develop at about 4 months I.U. followed by the weber mucous glands in the posterior third of the tongue.\nThe lymphatic tissues forming the lingual tonsils develop at birth in the pharyngeal part or base of the tongue."},{"question":"What are the developmental anomalies of the tongue?","answer":"*Microglossia: small tongue in relation to the size of the oral cavity.\n*Macroglossia: big or large tongue. True macroglossia is usually seen in case of mongolism.\n*Bifid tongue: failure of merging between the two lateral lingual swellings.\n*Trifid tongue (median rhomboid glossitis): the presence of the tuberculum impar between the two lateral lingual swellings. So, the tongue appear to be formed of three nodules.\n*tongue tie: it is the most common malformation of the tongue.the lingual frenum is short or attached anteriorly reaching to the tip of the tongue So, interferes with its mobility."},{"question":"Describe primary palate development.","answer":"Development of the primary palate: The primary palate is so named as it appears earlier than the secondary palate at the beginning of the 6th W.I.U. by merging of the two medial nasal processes. It is a wedge shaped tissue that represents only a small part of the hard palate anterior to the incisive papilla and supports the four maxillary incisors.\nThe primary palate is also called the median palatine process and the premaxillary bone.\nThe primary palate develop from the deep tissue of intermaxillary segment.\nIt develops during the deepening of the nasal pits to form the nasal sac.\nThe tissues beneath the nasal sac enlarge and grow inferiorly to form the primary palate."},{"question":"Describe palatal shelf elevation.","answer":"From 8th to 9th weeks I.U. the lateral palatine shelves slide or roll over the tongue (shelf elevation).\nThe process of elevation occurs when the shelves have developed sufficient strength to slid over the tongue and acquire a horizontal position.\nIt is most probably the results of combined action of shelves and tongue movements\nShelf elevation occurs as rapidly as swallowing.\nThe most posterior end of the shelves is above the tongue because the base of the tongue is attached to the floor of the mouth.\nso, the palatal shelf elevation begins posteriorly possibly pressing the tongue downward to roll or to slid over it.\nAfter shelf elevation, the tongue is broadened to utilize the lateral space previously occupied by the shelves."},{"question":"What are the 3 types of cleft palate?","answer":"1.Cleft of primary palate: clefts anterior to the incisive foramen. Result from failure of lateral palatine processes to meet and fuse with median palatine processes or primary palate. Associated with missing or malformed teeth adjacent to the clefts such as lateral incisors and canines.\n2.Cleft of the secondary palate: cleft posterior to the incisive foramen. Since fusion of the secondary palate begins anteriorly and progresses posteriorly, degree of cleft may vary from simplest form of bifid uvula to complete cleft involving both hard and soft palate.\n3.Cleft of both primary and secondary palate (complete palatal cleft): failure of growth or lack of fusion of the three palatine processes with each other and with the nasal septum."}],"blocks":[{"id":"mouth-1","type":"heading","title":"Development Of The Mouth (tongue & palate).","content":"Development of the mouth 2023\nDr: Thouraya Milad Al-Hadi."},{"id":"mouth-2","type":"heading","title":"Development of the tongue:","content":""},{"id":"mouth-3","type":"paragraph","content":"The tongue is an organ composed of muscles covered by a mucous membrane .It consists of the body (the anterior movable part) and the base (the posterior firmly attached part).\nThe Tongue begins to develop near the end of the 4th week I.U.\nIt is formed in the floor of the stomodeum"},{"id":"mouth-4","type":"paragraph","content":"It is mucous membrane develops mainly from the first and third pharyngeal arches and partly from the fourth pharyngeal arches while the muscles develop from the occipital myotomes.\nThe tongue develop from local proliferations of the mesenchyme that give rise to a number of swellings in the floor
