f the sockets. The mesial wall of the socket shows resorption."},{"id":"er-26","type":"heading","title":"Mechanism of tooth movements","content":""},{"id":"er-27","type":"paragraph","content":"The mechanisms that determine tooth movement are not fully known."},{"id":"er-28","type":"list","content":["1- Root formation theory: postulates that proliferating root impinges upon a fixed tissue thus converting an apically directed force into occlusal movement. However, root formation is unlikely the cause of tooth eruption since: a- Some teeth move a greater distance than the length of their roots. B- Experimental prevention of further root formation does not stop eruption. C- No fixed base (Initial root formation results in bone resorption).","2- Vascular pressure theory: proposes that an increase in tissue fluid pressure in periapical region causes tooth movement. But tissue fluid pressure is one of eruptive forces.","3- Bone remodeling theory: proposed that selective deposition and resorption of bone brings eruption. It is not known if bony remodeling is the cause or the effect of tooth movement.","4- Periodontal ligament traction theory: proposes that the cells and fibers of the PDL pull the tooth into occlusion. When the PDL is distorted experimentally, the eruption is retarded. But it is still not known how a force is generated within this tissue."]},{"id":"er-29","type":"paragraph","content":"Posteruptive tooth movement:\nA- Axial movement mechanism is by PDL theory.\nB- Mesial drift involves combination of 2 separate forces resulting from: 1- occlusal contact of teeth. 2- and contraction of the transseptal ligaments between teeth."},{"id":"er-30","type":"heading","title":"Shedding of Deciduous Teeth","content":""},{"id":"er-31","type":"paragraph","content":"Shedding (exfoliation) is the elimination of deciduous teeth by the resorption of their roots and their supporting tissue before eruption of successor at specific age."},{"id":"er-32","type":"subheading","title":"Pattern of Shedding","content":""},{"id":"er-33","type":"paragraph","content":"A- Anterior:\n1- permanent anterior tooth germs are developed lingual to deciduous. So the resorption occurs on the lingual side of the root of deciduous (by pressure of the growing successor).\n2- Later, the developing successor is directly apical to the deciduous. So, the resorption occurs apically in the root of deciduous (by pressure of the erupting successor).\nIf the permanent lower incisor does not move apically this permanent incisor may erupt lingual to deciduous, without shedding of deciduous."},{"id":"er-34","type":"paragraph","content":"B- Posterior:\n1- premolars tooth germs are developed between roots of deciduous molars. So the resorption occurs on the inner side of the roots of deciduous (by pressure of the growing successor).\n2- Later, the developing successor is directly apical to the deciduous. So, the resorption occurs apically in the root of deciduous (by pressure of the erupting successor)."},{"id":"er-35","type":"subheading","title":"Histology of Shedding","content":""},{"id":"er-36","type":"paragraph","content":"The odontoclasts are the cells responsible for resorption of the tooth hard substances. (identical to the osteoclasts which are responsible for bone removal)."},{"id":"er-37","type":"subheading","title":"Mechanism of Resorption and Shedding :-","content":""},{"id":"er-38","type":"list","content":["A) Root: resorbed by odontoclasts which appear due to: 1- pressure from the growing and erupting successor.","B) PDL and pulp: Very little is known. 1- PDL: a programmed cell death (apoptosis). 2- forces of mastication.","2- The pulp plays a passive role."]},{"id":"er-39","type":"heading","title":"Clinical Considerations","content":""},{"id":"er-40","type":"paragraph","content":"(1) Remnants of deciduous teeth:\nParts of the roots of deciduous teeth may escape resorption.\nFound mostly near lower second premolars because the roots of the second deciduous molar are strongly curved.\nThese remnants may:\na- Become ankylosed to bone. b- Enclosed in cementum. c- exfoliated. d- Undergo progressive resorption."},{"id":"er-41","type":"paragraph","content":"(2) Retained deciduous teeth\nThe deciduous teeth may be retained for long time due to:\na- Congenital missing of a permanent teeth:\nb- Due to ankylosed or impacted permanent teeth.\nc- A supernumerary tooth or tumor may prevent the eruption of permanant tooth.\nThe fate of the retained deciduous teeth are:\na- They may persist for many years in good functional condition.\nb- More often the occlusal trauma leads to their loosening and final loss."},{"id":"er-42","type":"clinical","title":"(3) Submerged deciduous teeth","content":"noticed below the occlusal level of the adjacent teeth.\n• Cause: Trauma may lead to ankylosis of a deciduous tooth.\n→ alveolar bone continues to grow, the tooth may become submerged\nSubmerged deciduous teeth prevent the eruption of their permanent successors or force them from their position.\nTherefore, they should be removed as soon as possible."}],"giveReasons":[{"reason":"Teeth erupt in a specific sequence and at specific ages","explanation":"Because the timing and sequence of tooth eruption are genetically programmed and coordinated with jaw growth. The eruption sequence ensures that antagonistic teeth erupt at similar times to establish proper occlusion, and that the permanent teeth have sufficient room as they replace the deciduous teeth.","cat":"physiological"},{"reason":"Primary (deciduous) teeth are shed (exfoliated)","explanation":"Because the permanent tooth follicle generates signals (pressure, inflammatory mediators, RANKL) that stimulate osteoclast-like cells (odontoclasts) to resorb the roots of the deciduous tooth progressively from the apex upward. As root support is lost, the tooth becomes mobile and eventually exfoliates.","cat":"physiological"},{"reason":"Premature loss of primary teeth is clinically significant","explanation":"Because primary teeth serve as natural space maintainers for the permanent successors. Early loss causes adjacent teeth to drift into the space, reducing arch length and potentially causing impaction, ectopic eruption, or malocclusion of the permanent teeth.","cat":"clinical"},{"reason":"The eruption rate is faster than the rate of jaw growth","explanation":"Because during the eruptive phase, the tooth must traverse a significant distance from its developmental position to its functional position. The rate of eruption must exceed jaw growth rate for the tooth to emerge into the oral cavity within the normal developmental time frame.","cat":"physiological"},{"reason":"Mesial drift occurs throughout life","explanation":"Because the approximal contact areas of teeth gradually wear down with time (proximal attrition), and the elastic recoil of the transseptal fibers of the PDL continuously draws adjacent teeth together to maintain contact. This results in a slow but progressive mesial migration of all teeth in the arch throughout life.","cat":"physiological"},{"reason":"Submerged deciduous teeth should be removed as soon as possible","explanation":"Because ankylosis of a deciduous tooth halts its eruption while the surrounding alveolar bone continues to grow, causing the tooth to sink below the occlusal plane. The submerged tooth prevents the eruption of the permanent successor or forces it out of position.","cat":"clinical"}]},{"id":13,"slug":"tmj","title":"Temporomandibular Joint (TMJ)","subtitle":"The mandibular articulation — Histology, Structure & Age Changes","category":"special","summary":"The mandibular articulation [The temporo-mandibular joint (TMJ)] is a bilateral joint that permits the mandible to move as a unit with two functional patterns (glinding and hinge movements).","keywords":["condyle","mandibular fossa","articular eminence","articular disc","synovial membrane","synovial fluid","upper compartment","lower compartment","hinge movement","translatory movement","temporomandibular ligament","stylomandibular ligament","sphenomandibular ligament","hyaluronic acid"],"keyDefinitions":[{"term":"TMJ Definition","definition":"The mandibular articulation [The temporo-mandibular joint (TMJ)] is a bilateral joint that permits the mandible to move as a unit with two functional patterns (glinding and hinge movements)."},{"term":"Upper Compartment","definition":"Upper compartment between the disc and temporal bone. The upper compartment is larger than the lower since the upper articular surface is wider."},{"term":"Lower Compartment","definition":"Lower compartment between the condyl and the disc."},{"term":"Hinge Movement","definition":"In The inferior portion of the joint between the head of the condyle and the lower surface of the disc to permit opening of the mandible."},{"term":"Translatory Movement","definition":"In the superior part of the joint as the disc and the condyle traverse anteriorly along the inclines of the anterior tubercle to provide an anterior and inferior movement of the mandible."},{"term":"Articular Disc","definition":"An oval fibrous biconcave disc with thin central part. The central and anterior part of the disc is covered by thick fibrous tissue devoid of blood vessels and nerves, containing variable number of chondrocytes."},{"term":"Synovial Fluid","definition":"The synovial fluid consists of small amount of a clear, straw colored viscus fluid. It is an infilterate of the blood diffused out from the rich capillary network of the synovial membrane; and contains hyaluronic acid secreted by the synovial cells. The hyaluronic acid has a high viscosity and provides the lubricating property of the fluid."}],"importantPoints":["The mandibular articulation [The temporo-mandibular joint (TMJ)] is a bilateral joint that permits the mandible to move as a unit with two functional patterns (glinding and hinge movements).","Four anatomical parts are concerned with the mandibular articulation: The mandibular condyle. The mandibular fossa and articular eminence. The articular disc. The articular capsule.","An articular disc separates the articular surfaces so that two cavities are present: Upper compartment between the disc and temporal bone. Lower compartment between the condyl and the disc.","The upper compartment is larger than the lower since the upper articular surface is wider.","Hinge movement in the inferior portion. Translatory movement in the superior part.","During the period of growth, a layer of hyaline cartilage lies underneath the fibrous covering of the condyle. At the same time its deep surface is replaced by bone nearly at the age of 21 years.","Type A (light) synovial cells secrete hyaluronic acid. Type B (dark) produce protein - rich secretion.","The nerve supply to the TMJ is from the mandibular division of the trigeminal nerve (the same nerve that supplies the muscles of mastication)."],"histologicalFeatures":["Histologically, the condyle is composed of cancellous bone covered by a thin layer of compact bone. The trabeculae are arranged in such a way that they radiate from the neck of the mandible and reach the cortex at right angles, thus giving maximal strength to the condyle.","The fibrous connective tissue layer covering the condyle: a- A superficial layer formed of a network of strong collagenous fibers and fibroblasts beside few chondrocytes that increase with age. b- A deeper layer which is rich in chondroid cells as long as growing cartilage is present in the condyle and few thin collagen fibers.","The fibrous layer covering the articulating surface of the temporal bone is arranged into three zones: a- In the inner zone the fibers are arranged at right angles to the bony suface. b- In the outer zone, the fibers run parallel to the bony surface. c- The intermediate layer is a small transitional zone.","The articular disc is composed of densely packed collagen fibers arranged in three zones. In the upper and lower zones, they run parallel to the suface in an antero posterior direction. The middle zone constitute collagen fibers that interlace with each other forming a network.","Articular capsule consists of two layers: a- Outer fibrous layer that is strengthend on the lateral suface to form the Temporomandibular ligament. b- Inner synovial layer of thin connective tissue lined by a layer of synovial cells.","Two types of synovial cells by EM: Type A (light) secretes hyaluronic acid. Type B (dark) produce protein-rich secretion."],"clinicalNotes":["The stylomandibular ligament attaches to the styloid process and to the posterior border of the ramus.","The sphenomandibular ligament extends between the spine of the sphenoid bone and the lingula of the mandible.","These ligaments limit the range of movement of the condyle preventing it from coming in contact with the tympanic plate behind and passing beyond the articular emineneee in front.","The thin central portion of the disc is free of nerves and only free nerve endings, probably for pain have been found in the peripheral region of the disc."],"flashcards":[{"question":"What is the TMJ?","answer":"The mandibular articulation [The temporo-mandibular joint (TMJ)] is a bilateral joint that permits the mandible to move as a unit with two functional patterns (glinding and hinge movements)."},{"question":"What are the four anatomical parts of the mandibular articulation?","answer":"1- The mandibular condyle\n2- The mandibular fossa and articular eminence\n3- The articular disc\n4- The articular capsule"},{"question":"What are the two movements of the TMJ and where do they occur?","answer":"• Hinge movement: In The inferior portion of the joint between the head of the condyle and the lower surface of the disc to permit opening of the mandible.\n• Translatory movement: In the superior part of the joint as the disc and the condyle traverse anteriorly along the inclines of the anterior tubercle to provide an anterior and inferior movement of the mandible."},{"question":"Describe the histology of the mandibular condyle.","answer":"Histologically, the condyle is composed of cancellous bone covered by a thin layer of compact bone. The trabeculae radiate from the neck of the mandible and reach the cortex at right angles, giving maximal strength.\nDuring the period of growth, a layer of hyaline cartilage lies underneath the fibrous covering, replaced by bone nearly at age 21.\nThe fibrous connective tissue layer: a- Superficial layer: network of strong collagenous fibers and fibroblasts beside few chondrocytes. b- Deeper layer: rich in chondroid cells and few thin collagen fibers (appositional growth zone during growth period)."},{"question":"Describe the articular disc of the TMJ.","answer":"This is an oval fibrous biconcave disc with thin central part. Behind, the disc divides into an ascending and descending limbs. Infront, the disc has no direct attachment to the mandible but passes forward to the anterior edge of the articular eminence. Some fibers of the lateral pterygoid muscle attach to the anterior border of the disc.\nUnlike the rest of the disc the looser posterior part is vascularised and is covered by a vascular synovial membrane.\nHistologically, composed of densely packed collagen fibers in three zones: upper/lower zones run parallel to surface in antero-posterior direction; middle zone collagen fibers interlace forming a network."},{"question":"Describe the articular capsule of the TMJ.","answer":"It consists of two layers:\na- Outer fibrous layer that is strengthend on the lateral suface to form the Temporomandibular ligament.\nb- Inner synovial layer of thin connective tissue lined by a layer of synovial cells which may be intermingled with connective tissue fibers and fat cells.\nBy EM: Type A (light) secretes hyaluronic acid. Type B (dark) produce protein-rich secretion.\nSynovial folds and villi protrude from its surface into the articular cavity."},{"question":"What is the synovial fluid and what are its functions?","answer":"The synovial fluid consists of small amount of a clear, straw colored viscus fluid. It is an infilterate of the blood diffused out from the rich capillary network of the synovial membrane; and contains hyaluronic acid secreted by the synovial cells. The hyaluronic acid has a high viscosity and provides the lubricating property of the fluid.\nFunctions:\n1- lubricant for the articulating surfaces.\n2- Nutrient fluid for the avascular tissue of the articulation.\n3- Clear the tissue debris, from the articular cavity caused by normal wear and tear of the articulating surfaces."},{"question":"What are the age changes of the TMJ?","answer":"• The condyle appears flattened.\n• The fibrous covering of the condyle becomes thicker and may show chondroid changes.\n• Osteoporosis of the underlying bone of the condyle is a common feature of aging.\n• There is thinning or abscence of the cartilaginous zone of the condyle.\n• The articular disc becomes thinner and exhibits hyalinization and chondroid changes.\n• The synovial folds appear fibrotic and a thick basement membrane develops that separates the synovial lining cells from the underlying stroma.\n• The wall of the blood vessels are thickened.\n• Nerves appear decreased in number in the capsule and peripheral region of the disc."}],"blocks":[{"id":"tmj-1","type":"heading","title":"TEMPORO-MANDIBULAR JOINT","content":"The mandibular articulation [The temporo-mandibular joint (TMJ)] is a bilateral joint that permits the mandible to move as a unit with two functional patterns (glinding and hinge movements)."},{"id":"tmj-2","type":"paragraph","content":"Four anatomical parts are concerned with the mandibular articulation:\nThe mandibular condyle\nThe mandibular fossa and articular eminence\nThe articular disc\nThe articular capsule"},{"id":"tmj-3","type":"paragraph","content":"At the temporo-mandibular joint, the mandibular condyle articulates with the glenoid fossa and articular eminence of the temporal bone.\nAn articular disc separates the articular surfaces so that two cavities are present:\nUpper compartment between the disc and temporal bone.\nLower compartment between the condyl and the disc.\nThe upper compartment is larger than the lower since the upper articular surface is wider."},{"id":"tmj-4","type":"heading","title":"Movements","content":""},{"id":"tmj-5","type":"list","content":["Hinge movement. In The inferior portion of the joint between the head of the condyle and the lower surface of the disc to permit opening of the mandible.","Translatory movement. In the superior part of the joint as the disc and the condyle traverse anteriorly along the inclines of the anterior tubercle to provide an anterior and inferior movement of the mandible."]},{"id":"tmj-6","type":"heading","title":"Histology and Structure","content":""},{"id":"tmj-7","type":"paragraph","content":"The joint capsule is attached below to the articular margin of the head of the condyle, and above to the margins of the glenoid fossa and articular eminence. The inner aspect of the capsule is lined by a synovial membrane.\nAt the sides, the capsule is strengthened by collateral ligaments of which the lateral temporomandibular ligament is the strongest.\nThe temporomandibular ligament is attached above to the zygoma, and below, it is attached to the lateral surfaces and posterior border of the neck of the mandible."},{"id":"tmj-8","type":"paragraph","content":"In addition there are two accessory ligaments associated with the TMJ:\n• The stylomandibular ligament attaches to the styloid process and to the posterior border of the ramus.\n• The sphenomandibular ligament extends between the spine of the sphenoid bone and the lingula of the mandible.\nThese ligaments limit the range of movement of the condyle preventing it from coming in contact with the tympanic plate behind and passing beyond the articular emineneee in front.\nBehind, the capsule is intimately united with the upper and lower attachments of the articular disc. Infront, the capsule is poorly developed."},{"id":"tmj-9","type":"subheading","title":"1- The mandibular condyle","content":""},{"id":"tmj-10","type":"paragraph","content":"The articular surfaces of the mandibular condyles are arcuate, with their axis placed in the same direction as those of the articular tubercles on the temporal bone.\nHistologically, the condyle is composed of cancellous bone covered by a thin layer of compact bone. The trabeculae are arranged in such a way that they radiate from the neck of the mandible and reach the cortex at right angles, thus giving maximal strength to the condyle.\nLarge marrow spaces are found in the cancellous bone, but they decrease in size by age. The red marrow in the condyle is myeloid of cellular and is replaced sometimes by fatty marrow in old individuals.\nDuring the period of growth, a layer of hyaline cartilage lies underneath the fibrous covering of the condyle. This cartilagenous plate grows by apposition from the deepest layers of the covering connective tissue. At the same time its deep surface is replaced by bone nearly at the age of 21 years. Remnants of this cartilage may persist in old age."},{"id":"tmj-11","type":"paragraph","content":"The fibrous connective tissue layer covering the condyle is fairly even in thickness and consists of :-\na- A superficial layer formed of a network of strong collagenous fibers and fibroblasts beside few chondrocytes that increase with age.\nb- A deeper layer which is rich in chondroid cells as long as growing cartilage is present in the condyle and few thin collagen fibers. In this zone the appositional growth of the hyaline cartilage of the condyle takes place during the period of growth."},{"id":"tmj-12","type":"subheading","title":"2- The mandibular Fossa and articular eminence","content":""},{"id":"tmj-13","type":"paragraph","content":"The roof of the mandibular fossa consists of thin layer of compact bone. The articular tubercle is composed of spongy bone covered with a thin layer of compact bone. In rare cases islands of hyaline cartilage are found in the articular tubercle.\nThe fibrous layer covering the articulating surface of the temporal bone is thin in the articular fossa and thickens rapidly on the posterior slope of the articular tubercle. In this region the fibrous tissues are arranged into three zones.\na- In the inner zone the fibers are arranged at right angles to the bony suface. In adults it shows a thin zone of calcification.\nb- In the outer zone, the fibers run parallel to the bony surface.\nc- The intermediate layer is a small transitional zone.\nA variable number of chondrocytes are found in the tissue on the temporal surface. There is no continuous cellular lining on the free surface of the fibrocartilage. Only isolated fibroblasts are situated on the surface itself which are characterized by the formation of long flat cytoplasmic processes."},{"id":"tmj-14","type":"subheading","title":"3- The articualr disc.","content":""},{"id":"tmj-15","type":"paragraph","content":"This is an oval fibrous biconcave disc with thin central part. Behind, the disc divides into an ascending and descending limbs. The former is attached with the capsule to the anterior margin of the squamous tympanic fissure, while the latter to the posterior surface of the head and to the neck of the condyle. Infront, the disc has no direct attachment to the mandible-but passes forward to the anterior edge of the articular eminence. Seme fibers of the lateral pterygoid muscle attach to the anterior border of the disc.\nUnlike the rest of the disc the looser posterior part is vascularised and is covered by a vascular synovial membrane. The synovial membrane is abscent over the articular areas of the condyle, glenoid fossa and articular eminence and also dense weight - bearing region of the disc. The central and anterior part of the disc is covered by thick fibrous tissue devoid of blood vessels and nerves, containing variable number of chondrocytes."},{"id":"tmj-16","type":"paragraph","content":"Histologically, the articular disc is composed of densely packed collagen fibers arranged in three zones. In the upper and lower zones, they run parallel to the suface in an antero posterior direction. The middle zone constitute collagen fibers that interlace with each other forming a network. Few numbers of elastic fibers are also found. The fibroblasts in the disc are elongated and send flat cytoplasmic processes.\nWith advancing age the fibroblasts develop into chondroid cells which later differentiate into true chondrocytes. Small islands of hyaline cartilage may be found in old age. The presence of chondrocyte* may increase the resistance and resilience of the fibrous tissue."},{"id":"tmj-17","type":"subheading","title":"4- The Articular Capsule :","content":""},{"id":"tmj-18","type":"paragraph","content":"It consists of two layers,\na- Outer fibrous layer that is strengthend on the lateral suface to form the Temporomandibular ligament.\nb- Inner synovial layer of thin connective tissue lined by a layer of synovial cells which may be intermingled with connective tissue fibers and fat cells. Few fibroblasts, histocytes and lymphocytes are also present. A synovial layer lines the entire articular capsule of the joint, both upper and the lower compartments.\nBy EM/it has been shown that there are two types of synovial cells. Type A (light) secretes hyaluronic acid. Type B (dark) produce protein - rich secretion.\nSynovial folds and villi protrude from its surface into the articular cavity. The synovial membrane is richly supplied by blood vessels. Three types of synovial capillaries are found, continous, fenestrated, and discontinuous.\nLymphatic vessels are observed a short distance from the synovial surface, draining into the capsular collecting lymphatic vessels."},{"id":"tmj-19","type":"subheading","title":"The synovial fluid","content":""},{"id":"tmj-20","type":"paragraph","content":"The synovial fluid consists of small amount of a clear, straw colored viscus fluid. It is an infilterate of the blood (as in tissue fluid) diffused out from the rich capillary network of the synovial membrane; and contains hyaluronic acid secreted by the synovial cells. The hyaluronic acid has a high viscosity and provides the lubricating property of the fluid.\nThe synovial fluid may contain also free cells most of which are macrophages."},{"id":"tmj-21","type":"subheading","title":"Functions:","content":""},{"id":"tmj-22","type":"list","content":["1- lubricant for the articulating surfaces.","2- Nutrient fluid for the avascular tissue of the articulation.","3- Clear the tissue debris, from the articular cavity caused by normal wear and tear of the articulating surfaces."]},{"id":"tmj-23","type":"subheading","title":"Vascular and neural supply","content":""},{"id":"tmj-24","type":"paragraph","content":"The blood supply to the TMJ is from branches of many arteries. These branches converge into the capsule of the joint. Small arteries, arterioles and capillaries pass into the posterior part of the articular disc. There is no blood vessels in the central and anterior portion of the disc.\nThe nerve supply to the TMJ is from the mandibular division of the trigeminal nerve (the same nerve that supplies the muscles of mastication).\nNerve endings for pain, temperature, touch and deep pressure are found and pass from the joint into the peripheral region of the articular disc and synovial folds. The thin central portion of the disc is free of nerves and only free nerve endings, probably for pain have been found in the peripheral region of the disc."},{"id":"tmj-25","type":"heading","title":"Age changes of the TM J","content":""},{"id":"tmj-26","type":"list","content":["The condyle appears flattened.","The fibrous covering of the condyle becomes thicker and may show chondroid changes.","Osteoporosis of the underlying bone of the condyle is a common feature of aging.","There is thinning or abscence of the cartilaginous zone of the condyle.","The articular disc becomes thinner and exhibits hyalinization and chondroid changes.","The synovial folds appear fibrotic and a thick basement membrane develops that separates the synovial lining cells from the underlying stroma.","The wall of the blood vessels are thickened.","Nerves appear decreased in number in the capsule and peripheral region of the disc."]},{"id":"tmj-27","type":"paragraph","content":"These age changes in the various components of the joint could lead to :-\n• Dysfunction in older individuals.\n• Decrease in the extensibility of the disc and capsule and result in an impairment of motion.\n• The chondroid changes to the collagenous elements may affect the degree of resiliency during mastication.\n• The alterations found in the synovial folds may lead to a decrease in the formation of synovial fluid and a loss of lubrication of the two compartments."}],"giveReasons":[{"reason":"The articular surfaces of the TMJ are covered by fibrocartilage instead of hyaline cartilage","explanation":"Because fibrocartilage is more resistant to the repeated compressive and shear forces generated during mastication than hyaline cartilage. Fibrocartilage also has a better capacity for repair and remodeling in response to functional demands. Additionally, fibrocartilage is derived from ectomesenchyme (neural crest), unlike hyaline cartilage which is mesodermal.","cat":"histological"},{"reason":"The TMJ has two separate joint compartments (upper and lower)","explanation":"Because the articular disc physically divides the joint into two functional spaces: the lower compartment (for hinge/rotation movement — mouth opening), and the upper compartment (for translatory/gliding movement — forward protrusion). This allows the complex combined movements of the mandible.","cat":"histological"},{"reason":"Synovial fluid is essential for TMJ function","explanation":"Because synovial fluid provides lubrication of the joint surfaces (reducing friction), supplies nutrition and oxygen to the avascular articular cartilage and central zone of the disc, and removes metabolic waste products from these avascular structures by diffusion.","cat":"physiological"},{"reason":"The central zone of the articular disc is avascular and aneural","explanation":"Because the central zone of the disc is subjected to the most compressive and shear forces during function. Blood vessels and nerves would be repeatedly damaged by these forces. The periphery of the disc is vascularized and innervated, providing pain sensation for protective reflexes.","cat":"histological"},{"reason":"The TMJ is supplied by the mandibular division of the trigeminal nerve","explanation":"Because the TMJ is part of the masticatory apparatus, and the trigeminal nerve (specifically the mandibular division V3) is the nerve of mastication. The same nerve supplies both the TMJ (auriculotemporal, masseteric, and deep temporal branches) and the muscles of mastication, coordinating sensory feedback from the joint with motor control of masticatory muscles.","cat":"anatomical"},{"reason":"The condylar cartilage is replaced by bone at approximately 21 years of age","explanation":"Because the condylar cartilage is a secondary growth cartilage that actively drives mandibular growth. As skeletal maturity approaches, the growth signals diminish and the remaining cartilage layer is progressively replaced by endochondral ossification, concluding mandibular growth at around age 21.","cat":"developmental"}]},{"id":14,"slug":"oral-mucosa","title":"Oral Mucosa & Gingiva","subtitle":"Oral Histology / Chapter 7 Oral Mucosa","category":"soft-tissue","summary":"Both of epithelium and lamina properia are termed as mucosa or mucous membrane. The oral mucosa composed of stratified squamous epithelium overlying a connective tissue (lamina properia). It is perforated in various regions by the ducts of salivary glands. A basement membrane lies between the epithelial and connective tissue.","keywords":["lining mucosa","masticatory mucosa","specialized mucosa","keratinized epithelium","non-keratinized epithelium","parakeratinized epithelium","lamina propria","basal layer","prickle cell layer","granular layer","keratin layer","hemidesmosome","desmosome","keratohyalin granules","keratinosome","keratolinin","involucrin","gingiva","free gingiva","attached gingiva","junctional epithelium","DGJ","gingival sulcus","gingival col","interdental papilla","taste buds","filiform","fungiform","foliate","circumvallate","submucosa","rete ridges","melanocyte","Langerhan's cells","Merkel's cells","non-keratinocytes","vermilion border","passive eruption","epithelial turnover","Fordyce's spots","mucogingival junction","gingival stippling","DGJ development","REE","reduced enamel epithelium"],"keyDefinitions":[{"term":"Oral Mucosa Definition","definition":"Both of epithelium and lamina properia are termed as mucosa or mucous membrane. The oral mucosa composed of stratified squamous epithelium overlying a connective tissue (lamina properia). It is perforated in various regions by the ducts of salivary glands. A basement membrane lies between the epithelial and connective tissue."},{"term":"Lining Mucosa","definition":"labial, buccal, soft palate, alveolar or vestibular mucosa, ventral surface of tongue, and floor of the mouth."},{"term":"Masticatory Mucosa","definition":"hard palate, dorsal surface of tongue, free and attached gingiva."},{"term":"Specialized Mucosa","definition":"dorsal surface of tongue that includes the lingual papilla and taste buds."},{"term":"Non-keratinized epithelium","definition":"is the type of epithelium without keratin layer, it is the most common form of stratified squamous epithelium in the oral cavity. The turnover and metabolic ratio of non keratinized is higher than keratinized. It has 3 layers of cells: (basal, intermediate, superficial)."},{"term":"Keratinized epithelium (Ortho-keratinized)","definition":"Associated with the masticatory and specialized mucosa, it is the least common form of stratified squamous epithelium in the oral cavity. As this tissue mature it forms keratin within its superficial cells. It has 4 layers of cells: (basal, prickle, granular, keratin)."},{"term":"Para-keratinized epithelium","definition":"Is considered as an immature form of keratinized epithelium, if it present on skin, it gives a pathogenic lesion, but it is the unique histological feature of the healthy oral cavity associated with the masticatory mucosa of attached gingiva and the dorsal surface of the tongue."},{"term":"Keratohyalin granules","definition":"are present mainly in parakeratinized areas, and few in the keratinized. They are basophilic granules (blue with E & H). The tonofilamens are more dense in quantity associated with this granules."},{"term":"Keratinosome granules (Odland bodies)","definition":"is membrane coated granules located between upper spinos cells and granular cells, contain a series of parallel lamellae known as internal lamellated structure originated from Golgi bodies, able to discharge their content (glycoprotein) into the intercellular space forming intercellular substances material which act as permeability barrier between granular and kratin cells."},{"term":"Keratolinin (involucrin)","definition":"is a sulfur rich protein present in upper ½ of the stratum spinosum, give rise to thick cell membrane forming a cornified cell envelope, this is a highly resist structure."},{"term":"Rete ridges (epithelial ridges)","definition":"Is the fold of the basement membrane to give the papillary shape of the lamina properia by intrance within the epithelium. The rete ridges increase the surface area of epithelium with lamina properia, and to provide strong junctional attachment."},{"term":"Lamina propria","definition":"Connective tissue located close to the basement membrane of epithelium with variable thickness. It provides support, nutritional and metabolic exchange into epithelium. Contains collagen and elastic fibers, penetrated by sensory nerve branches. Has 2 zones: papillary (superficial, loose CT) and dense/reticular (deep, dense CT)."},{"term":"Gingiva","definition":"Gingiva is an oral mucous membrane surrounding maxillary and mandibular teeth covering the alveolar bone with stippled surface. Its epithelium is: non-keratinized 10% (sulcus, col, JE), keratinized 15% (free gingiva), parakeratinized 75% (attached gingiva)."},{"term":"Dentinogingival Junction (DGJ) / Junctional epithelium (JE)","definition":"Is the junction between the tooth surface and the gingival tissue — the deep extension of gingival sulcus. It is less resistant to force, highly turnover, has few desmosomes, and high metabolic activity. Has 12-18 rows coronally, gradually decreasing apically."},{"term":"Gingival sulcus","definition":"The fold of free gingiva developed at the time where the tip of the crown perforates the oral mucosa. Extended coronally from the tip of the free gingiva and apically to the DGJ. Its epithelium is non-keratinized without rete ridges."},{"term":"Taste buds","definition":"Are barrel-shaped organs derived from epithelium, extended from the basement membrane to the epithelial surface of the lingual papilla (10000 buds), soft palate (2500 buds), epiglottis/larynx/pharynx (400 buds). Composed of 30-80 spindle shape cells (supporting + taste cells). Renewal time: 10 days."},{"term":"Gingival col (interdental col)","definition":"Is the concave form of interdental papilla between the buccal and lingual gingival surfaces apical to contact area of posterior teeth over the alveolar septum. It forms a vertical fold and has non-keratinized epithelium."}],"importantPoints":["The oral cavity is lined by mucous membrane which is coated by serous and mucous secretions.","The structure of oral mucosa varies according to function and type of epithelium in different regions.","The turnover of the mucosa is higher than the skin.","The junctional epithelium has the highest turnover in the oral cavity (3-5 days), while the buccal mucosa of the cheek has the lowest turnover (4-10 days).","Repair process took place similar to the skin during injury, the basal epithelial cells migrate to form new epithelial tissue.","The fibroblasts migrate to form immature connective tissue in deep injured lamina properia to form granulation tissue.","All forms of epithelium act as barrier to bacterial invasion and mechanical irritation.","Mode of attachment of epithelial cells are with the desmosome and hemidesmosome.","Non-keratinized epithelium: most common. 3 layers: basal, intermediate, superficial.","Keratinized epithelium: least common. 4 layers: basal, prickle, granular, keratin.","Para-keratinized: unique histological feature of healthy oral cavity — attached gingiva and dorsal tongue. 4 layers but granular layer may be absent, keratin layer retains nuclei.","Non-keratinocytes (~10% of epithelial cells): Langerhan's (antigen), Merkel's (touch), Melanocytes (pigment), Defence cells (immunity).","Gingival epithelium: non-keratinized 10% (sulcus, col, JE), keratinized 15%, parakeratinized 75% (attached gingiva).","DGJ has 12-18 rows coronally; high turnover (3-5 days); highly permeable to defence cells.","Gingival stippling disappears in oedema.","Lingual papillae: Filiform (most common, no taste buds), Fungiform (taste buds, red), Foliate (lateral tongue), Circumvallate (anterior to sulcus terminalis, Von Ebner's glands).","4 fundamental tastes: Salt (front), Sour (posterior sides), Sweet (tip), Bitter (posterior centre + soft palate).","Passive eruption stages I-IV: Stage IV is pathological (gingival recession)."],"histologicalFeatures":["Non-keratinized: Basal layer (stratum basale/germinativium): deepest, single cuboidal cells, germinal layer with ability for cell division.","Non-keratinized: Intermediate layer (stratum intermedium): large polyhedral-shape cells, large amount of fluid in cytoplasm, lost ability to cell division, makes bulk of non-keratinized epithelium, granular structure even in high layer without spinous appearance.","Non-keratinized: Superficial layer (stratum superficiale): not dehydrated large polyhedral flat cells, retain their nuclei, loosely arranged tonofilament with less organells.","Keratinized: Basal cell layer: undergoes mitotic cell division, attached to basement membrane by hemidesmosome, with each other by desmosomes. Two types: a) serrated type with protoplasmic processes. b) Non serrated type.","Keratinized: Prickle cell layer (stratum spinosum): large polyhydral cells attached by hemidesmosomes and tonofilaments, star-shape appearance, make main bulk of keratinized epithelium.","Keratinized: Granular cell layer (stratum granulosum): 3-5 rows of large flat cells with degenerated (pyknotic) nuclei, with keratohyalin granules, keratinosome granules (Odland bodies), and keratolinin (involucrin).","Keratinized: Keratin layer (stratum cornium): flat dehydrated cells without nuclei, cytoplasm filled with keratin as translucent dense cornified material, non living material.","Para-keratinized: 4 layers same as keratinized but granular layer may be absent; keratin layer retains clear or pyknotic nuclei."],"clinicalNotes":["Para-keratinized epithelium: if it present on skin, it gives a pathogenic lesion, but it is the unique histological feature of the healthy oral cavity.","Keratin layer: may undergo desquamatous due to abrasion and able to resist the friction and bacterial invasion.","If the keratohyalin granules increase in number, it will cause great amount of keratin filled the cell, lead to cell death."],"flashcards":[{"question":"What is the definition of oral mucosa?","answer":"Both of epithelium and lamina properia are termed as mucosa or mucous membrane. The oral mucosa composed of stratified squamous epithelium overlying a connective tissue (lamina properia). It is perforated in various regions by the ducts of salivary glands. A basement membrane lies between the epithelial and connective tissue."},{"question":"What are the characteristic features of oral mucosa?","answer":"1- The oral cavity is lined by mucous membrane which is coated by serous and mucous secretions.\n2- The structure of oral mucosa varies according to function and type of epithelium in different regions.\n3- The turnover of the mucosa is higher than the skin.\n4- The junctional epithelium has the highest turnover in the oral cavity, while the buccal mucosa of the cheek has the lowest turnover.\n5- Repair process took place similar to the skin during injury, the basal epithelial cells migrate to form new epithelial tissue.\n6- The fibroblasts migrate to form immature connective tissue in deep injured lamina properia to form granulation tissue.\n7- All forms of epithelium act as barrier to bacterial invasion and mechanical irritation.\n8- Mode of attachment of epithelial cells are with the desmosome and hemidesmosome."},{"question":"What is the classification of oral mucosa according to types of epithelium?","answer":"i) according to the types of epithelium:\nNon-keratinized epithelium.\nKeratinized epithelium (orthokeratinized, or true keratinized).\nParakeratinized epithelium.\n\nii) according to the function of mucosa:\nLining mucosa: labial, buccal, soft palate, alveolar or vestibular mucosa, ventral surface of tongue, and floor of the mouth.\nMasticatory mucosa: hard palate, dorsal surface of tongue, free and attached gingiva.\nSpecialized mucosa: dorsal surface of tongue that includes the lingual papilla and taste buds."},{"question":"Describe the layers of Non-keratinized epithelium.","answer":"is the type of epithelium without keratin layer, it is the most common form of stratified squamous epithelium in the oral cavity. The turnover and metabolic ratio of non keratinized is higher than keratinized.\nIt has 3 layers of cells:\n1/ Basal layer (stratum basale or germenativium): deepest, single cuboidal cell, germinal layer with ability for cell division.\n2/ Intermediate layer (stratum intermedium): large polyhedral-shape cells, large amount of fluid in cytoplasm, lost ability to cell division, makes bulk, granular structure even in high layer without spinous appearance.\n3/ Superficial layer (stratum superficiale): not dehydrated large polyhedral flat cells, retain their nuclei, loosely arranged tonofilament with less organells."},{"question":"Describe the layers of Keratinized epithelium.","answer":"Associated with the masticatory and specialized mucosa, it is the least common form of stratified squamous epithelium. It has 4 layers:\n1/ Basal cell layer: undergoes mitotic cell division, attached to basement membrane by hemidesmosome and with each other by desmosomes. Two types: a) serrated type with protoplasmic processes (pedicles). b) Non serrated type.\nCell junctions: i) Hemidesmosome: connect basal cell layer and underlying connective tissue. ii) Desmosomes: connect lateral borders of adjacent basal cells. iii) Other: tight junction, gap junction, close junction.\n2/ Prickle cell layer (stratum spinosum): large polyhydral cells, star-shape, attached by hemidesmosomes and tonofilaments, make main bulk of keratinized epithelium.\n3/ Granular cell layer (stratum granulosum): 3-5 rows of large flat cells with degenerated (pyknotic) nuclei. Contains: i- keratohyalin granules (basophilic). ii- keratinosome granules (Odland bodies). iii- Keratolinin (involucrin): sulfur rich protein, forms cornified cell envelope.\n4/ Keratin layer (stratum cornium): flat dehydrated cells without nuclei, cytoplasm filled with keratin as translucent dense cornified material, non living material."},{"question":"What is Para-keratinized epithelium?","answer":"Is considered as an immature form of keratinized epithelium, if it present on skin, it gives a pathogenic lesion, but it is the unique histological feature of the healthy oral cavity associated with the masticatory mucosa of attached gingiva and the dorsal surface of the tongue.\nIt has 4 layers of cells: (basal, prickle, granular, keratin):\n1/ Basal layer: same to the keratinized epithelium.\n2/ Prickle cell layer: same to the keratinized epithelium.\n3/ Granular cell layer: with degenerated and pyknotic nuclei, the granular layer may be absent.\n4/ Keratin layer: Is the most superficial keratin cells with clear or pyknotic nuclei, their cytoplasm is filled with keratin."},{"question":"What are Keratohyalin granules?","answer":"are present mainly in parakeratinized areas, and few in the keratinized. They are basophilic granules (blue with E & H). The tonofilamens are more dense in quantity associated with this granules. The keratohyalin granules will loose their nuclei and granules, decrease in size, the tonofilaments become tight together, as they move close with keratin layer."},{"question":"What are Keratinosome granules (Odland bodies)?","answer":"is membrane coated granules located between upper spinos cells and granular cells, contain a series of parallel lamellae known as internal lamellated structure originated from Golgi bodies, able to discharge their content (glycoprotein) into the intercellular space forming intercellular substances material which act as permeability barrier between granular and kratin cells, the intercellular spacse of this region contains glycolipid."},{"question":"What are the non-keratinocytes of oral epithelium?","answer":"They are non-keratin forming cells making about 10% of total epithelial tissue. They are clear cells without keratin granules, lacking desmosomes and tonofilaments except Merkel's cells:\n1- Merkel's cells: basal layer, connected to axon neuron, role in touch/pressure sensation.\n2- Langerhan's cells: bone marrow derivative, dendritic, spinous layer, antigen reaction with T-lymphocytes.\n3- Melanocytes: neural crest origin, basal layer, contain melanosomes with melanin pigment, lack desmosomes and tonofilaments.\n4- Defence cells: lymphocytes, leukocytes, mast cells, infiltrated through epithelium."},{"question":"What is the definition and features of gingiva?","answer":"Gingiva is an oral mucous membrane surrounding maxillary and mandibular teeth covering the alveolar bone with stippled surface.\nIts epithelium is:\n- non-keratinized epithelium 10%: sulcus epithelium, interdental col, and junctional epithelium.\n- keratinized epithelium 15%: free gingiva and attached gingiva.\n- parakeratinized epithelium 75%: in the attached gingiva.\nTypes: Free gingiva, Attached gingiva, Dentinogingival junction (JE)."},{"question":"Define the Dentinogingival Junction (DGJ) and describe its histology.","answer":"Definition: Is the junction between the tooth surface and the gingival tissue — the deep extension of the gingival sulcus. It is less resistant to force, highly turnover, has few desmosomes, and high metabolic activity.\nHistology — Under LM, has 12-18 rows coronally, gradually decreasing apically:\n1- external basal cells (normal basal layer): cuboidal cells on basement membrane, highly permeable to defense cells.\n2- internal basal cells (suprabasal layer): spindle shape cells, obliquely arranged.\n3- superficial flat cells: also called epithelial attachment cells, parallel to enamel surface.\n4- attachment epithelium (organic material): synthesized when superficial cells reach enamel surface.\nUnder EM:\ni) external basal lamina (lamina lucida + lamina densa) adjacent to lamina properia.\nii) internal basal lamina adjacent to enamel surface.\niv) enamel cuticle layer."},{"question":"Describe the development of DGJ.","answer":"Steps:\n1- After enamel maturation and before eruption, REE retains basal cell layer (primary epithelial attachment).\n2- As the tooth erupts, coronal portion of REE and oral epithelium fuse together; ameloblasts develop hemidesmosomes for primary attachment.\n3- Epithelial cells at fusion area degenerate and create perforation near incisal edge/cusp tip → allows crown to come out without hemorrhage.\n4- After eruption, cells at fusion area serve as primary JE (by REE), later replaced by secondary JE (by oral epithelium).\n5- REE becomes short as tooth erupts; shallow groove develops → gingival sulcus.\n6- Coronal portion goes apically, leaving cervical portion at neck → future junctional epithelium (passive eruption).\n7- Rim of oral mucosa = gingiva: inner epithelial layer (DGJ) + outer epithelial layer (free gingiva)."},{"question":"Describe the stages of passive tooth eruption.","answer":"Stage I: Bottom of sulcus and attached epithelium both at enamel surface/cervical line. Ages: 20-30 years permanent.\nStage II: Bottom of sulcus remains at enamel; attached epithelium shifts to cementum. Ages: 30-40 years.\nStage III: Bottom of sulcus at cervical line; attached epithelium at cementum → anatomic crown fully exposed. Ages: 40-50 years.\nStage IV: Both bottom of sulcus and attached epithelium at cementum → gingival recession (root exposure). Pathologic condition, over 50 years. Passive eruption never reaches this stage."},{"question":"What are the types of lingual papillae?","answer":"1- Filiform: most common, on tongue dorsum body, NO taste buds. Fine pointed conical shape. Give rough surface, tactile sensation, hairy tongue. Become smooth in glossitis.\n2- Fungiform: less in number, ON tongue surface, with taste buds. Vascularized core = red appearance. Fungal/triangle shape. Not found at sulcus terminalis.\n3- Foliate: lateral sides of tongue, few in number, with taste buds. Parallel vertical walls. More in animals, less in humans.\n4- Circumvallate (vallate): large, raised, anterior to sulcus terminalis, with taste buds. Von Ebner's glands (pure serous minor salivary gland) open at sulcus of papillae."},{"question":"What are the 4 fundamental taste sensations and their location?","answer":"Salt: front side of tongue.\nSour: posterior sides of tongue.\nSweet: anterior tip of tongue.\nBitter: posterior centre of tongue and soft palate."},{"question":"What is the epithelial turnover of different oral tissues?","answer":"Junctional epithelium: 3-5 days (highest renewal rate in oral cavity).\nSulcular epithelium: 4-6 days.\nBuccal mucosa: 4-10 days (lowest turnover).\nNon-keratinized epithelium: faster than keratinized.\nTaste buds: 10 days."}],"blocks":[{"id":"om-1","type":"heading","title":"ORAL MUCOSA","content":""},{"id":"om-2","type":"definition","title":"Definition:","content":"Both of epithelium and lamina properia are termed as mucosa or mucous membrane. The oral mucosa composed of stratified squamous epithelium overlying a connective tissue (lamina properia). It is perforated in various regions by the ducts of salivary glands. A basement membrane lies between the epithelial and connective tissue."},{"id":"om-3","type":"subheading","title":"Characteristic features of oral mucosa;","content":""},{"id":"om-4","type":"list","content":["1- The oral cavity is lined by mucous membrane which is coated by serous and mucous secretions.","2- The structure of oral mucosa varies according to function and type of epithelium in different regions.","3- The turnover of the mucosa is higher than the skin.","4- The junctional epithelium has the highest turnover in the oral cavity, while the buccal mucosa of the cheek has the lowest turnover.","5- Repair process took place similar to the skin during injury, the basal epithelial cells migrate to form new epithelial tissue.","6- The fibroblasts migrate to form immature connective tissue in deep injured lamina properia to form granulation tissue.","7- All forms of epithelium act as barrier to bacterial invasion and mechanical irritation.","8- Mode of attachment of epithelial cells are with the desmosome and hemidesmosome."]},{"id":"om-5","type":"heading","title":"Classification of oral mucosa","content":""},{"id":"om-6","type":"paragraph","content":"i) according to the types of epithelium:\nNon-keratinized epithelium.\nKeratinized epithelium (orthokeratinized, or true keratinized).\nParakeratinized epithelium."},{"id":"om-7","type":"paragraph","content":"ii) according to the function of mucosa:\nLining mucosa: labial, buccal, soft palate, alveolar or vestibular mucosa, ventral surface of tongue, and floor of the mouth.\nMasticatory mucosa: hard palate, dorsal surface of tongue, free and attached gingiva.\nSpecialized mucosa: dorsal surface of tongue that includes the lingual papilla and taste buds."},{"id":"om-8","type":"heading","title":"Non-keratinized epithelium:","content":"is the type of epithelium without keratin layer, it is the most common form of stratified squamous epithelium in the oral cavity. The turnover and metabolic ratio of non keratinized is higher than keratinized.\nIt has 3 layers of cells: (basal, intermediate, superficial),"},{"id":"om-9","type":"paragraph","content":"1/ Basal layer (stratum basale or germenativium): is the deepest, single cuboidal cell overly the basement membrane, superior to lamina properia. It is also known as germinative layer because it has ability for cell division."},{"id":"om-10","type":"paragraph","content":"2/ Intermediate layer (stratum intermedium): large polyhedral-shape cells larger than the basal cells, with large amount of fluid in their cytoplasm, they lost the ability to cell division as they migrated, it makes the bulk of the non-keratinized epithelium. These intermediate cells are with granular structure even in high layer without spinous appearance."},{"id":"om-11","type":"paragraph","content":"3/ Superficial layer (stratum superficiale): are not dehydrated large polyhedral flat cells, hard to discern and difficult to strich. The superfecial cells retain their nuclei. These cells are with loosely arranged tonofilament with less organells."},{"id":"om-12","type":"heading","title":"Keratinized epithelium: (Ortho-keratinized, True keratinized.)","content":"Associated with the masticatory and specialized mucosa, it is the least common form of stratified squamous epithelium in the oral cavity. As this tissue mature it forms keratin within its superficial cells. It has 4 layers of cells: (basal, prickle, granular, keratin):"},{"id":"om-13","type":"paragraph","content":"1/ Basal cell layer (stratum basale or stratium germinativium): undergoes mitotic cell division. The basal cell layer attached to basement membrane by hemidesmosome and with each other by desmosomes, contain large number of organells indicate cell activity to undergo mitosis, refered to germinal layer. During cell division, one of daughter cell is differentiate and move upward termed keratinocytes, the others will remain at the basal cell layer. The basal cell layer are cells synthesize DNA and undergo mitosis, with 2 types:\na) serrated type: single layer with protoplasmic processes (pedicles) project from the basal surface toward the connective tissue for attachment function.\nb) Non serrated type cells undergo mitotic division easy to move surface wise direction."},{"id":"om-14","type":"subheading","title":"Cell junction of basal cells:","content":""},{"id":"om-15","type":"paragraph","content":"i) Hemidesmosome: connect between basal cell layer and underling connective tissue, and composed of:\nsingle attachment plaque.\nAdjacent plasma membrane.\nExtracellular structure (lamina Lucida and underling lamina densa)"},{"id":"om-16","type":"paragraph","content":"ii) Desmosomes: connect the lateral porters of adjacent basal cells themselves, that attachment consists of:\nAdjacent cell membrane.\nPair of dense regions (attachment plaque)\nIntervining extracellular structures\nBasal cells have tonofilaments which course toward and may attach to the attachment plaque."},{"id":"om-17","type":"paragraph","content":"iii) Other types of cell junction like: tight junction, gap junction, and close junction."},{"id":"om-18","type":"paragraph","content":"2/ Prickle cell layer (stratum spinosum):\nThe spinous cells are large polyhydral cells attached together by hemidesmosomes and tonofilaments forming tensile supporting system for epithelium against external pressure. They make the main bulk of the keratinized epithelium. The spinosum cells appear as star-shape cells with small spins (spinosum). They are just superficial to the basal layer, these cells can shrink and loss their cytoplasm during dehydration.\nBecause of crowding, they are displaced and pushed toward the surfaces by formation of new cells from basal cells. They lost their cell division as they migrate.\nDuring preparation of the section, these cells dehydrate and shrink away from each other and appear as star shape."},{"id":"om-19","type":"paragraph","content":"3/ Granular cell layer (stratum granulosum): they are several raws 3 to 5 of large flat cells with degenerated (pyknotic) nudea, associated with different types of granules which stained as dark spots (if the granules increase in number, it will cause great amount of keratin filled the cell, lead to cell death),"},{"id":"om-20","type":"list","content":["i- keratohyalin granules: are present mainly in parakeratinized areas, and few in the keratinized. They are basophilic granules (blue with E & H). The tonofilamens are more dense in quantity associated with this granules. The keratohyalin granules will loose their nuclei and granules, decrease in size, the tonofilaments become tight together, as they move close with keratin layer.","ii- keratinosome granules (Odland bodies): is membrane coated granules located between upper spinos cells and granular cells, contain a series of parallel lamellae known as internal lamellated structure originated from Golgi bodies, able to discharge their content (glycoprotein) into the intercellular space forming intercellular substances material which act as permeability barrier between granular and kratin cells, the intercellular spacse of this region contains glycolipid.","iii- Keratolinin (involucrin): is a sulfur rich protein present in upper ½ of the stratum spinosum, give rise to thick cell membrane forming a cornified cell envelope, this is a highly resist structure."]},{"id":"om-21","type":"paragraph","content":"4/ Keratin layer (stratum cornium):\nis the most superficial layer, shows a variable thickness, and does not synthesize protein.\nhas flat dehydrated cells without nuclei and no cell content, their cytoplasm filled with keratin as translucent dense komified material. This keratin is soft in comparison to hard keratin of nail, it is non living material. This keratin may undergo desquamatous due to abrasion and able to resist the friction and bacterial invasion."},{"id":"om-22","type":"heading","title":"III- Para-keratinized epithelium:","content":"Is considered as an immature form of keratinized epithelium, if it present on skin, it gives a pathogenic lesion, but it is the unique histological feature of the healthy oral cavity associated with the masticatory mucosa of attached gingiva and the dorsal surface of the tongue."},{"id":"om-23","type":"paragraph","content":"It has 4 layers of cells: (basal, prickle, granular, keratin):\n1/ Basal layer, or stratum basale, undergoes mitotic cell division, same to the keratinized epithelium\n2/ Prickle cell layer or stratum spinosum: The spinous cells are large polyhydral cells same to the keratinized epithelium\n3/ Granular cell layer or stratum granulosum, with degenerated and pyknotic nuclea, the granular layer may be absent.\n4/ Keratin layer or stratum corneum: Is the most superficial keratin cells with clear or pyknotic nuclei, their cytoplasm is filled with keratin as translucent dense konified material same to the keratinized epithelium."},{"id":"om-24","type":"table","content":"| | Non-keratinized | Keratinized |\n|---|---|---|\n| Number of layers | 3 layers | 4 layers |\n| Intercellular space | Less space | More space |\n| Prickle appearance | Not present | Yes |\n| Cornified layer | Not present | Yes |\n| Nuclei at surface | Yes | No |\n| Turnover and mitosis | High | Less |\n| Odland bodies | Circular | Elongated |"},{"id":"om-25","type":"heading","title":"Function of epithelium:","content":""},{"id":"om-26","type":"list","content":["1- has protective barrier to bacterial invasion.","2- offer protection against dryness and mechanical irritation.","3- has protective cover for the underlying connective tissue against the passage of any foreign bodies.","4- has cell differentiation result to formation of keratin.","5- has permeable basement membrane: it is able to transmit the small particles and to filter the large molecules from the lamina properia by continuous basement membrane.","6- produce pigmentation: oral mucosa can range in color from pink to red, and brown to black color in the presence of melanin pigment."]},{"id":"om-27","type":"heading","title":"Keratinocytes:","content":"All the cells of epithelium tissue are known as keratinocytes:"},{"id":"om-28","type":"paragraph","content":"Keratinized cells: such as basal, intermediate, and superficial cells. These cells is considered also as keratinized because they able to produce keratin in abnormal condition such as heavy smokers.\nNon-keratinized cells: such as basal, prickle, granular, and keratin cells. While the epithelial tissue contains also other cells known as non-keratin cells (non-keratinocytes)."},{"id":"om-29","type":"heading","title":"NON-KERATINOCYTES:","content":"They are non-keratin forming cells include: Langerhan's cells, pigment cells, Merkel cells and defense cells. They make about 10% of total epithelial tissue, they are clear cells don't contain keratin granules, with lack of desmosomes and tonofilaments except Merkel's cell."},{"id":"om-30","type":"definition","title":"Merkel's cells:","content":"are located at the basal cell layer connected to axon neuron to play role in the pressure or touch sensation."},{"id":"om-31","type":"definition","title":"Langerhan's cells:","content":"are dendritic bone marrow derivative cells, are located between the prickle cells, with small branches, play role in antigen reaction as immune response with T-lymphocytes. Granstein cell is same to the Langerhan's cell."},{"id":"om-32","type":"definition","title":"Melanocytes:","content":"which derived from the neural crest cells are located at the basal layer. Melanocyte has small cytoplasmic granules called melanosomes which store the melanin pigment. Melanocyte is lack of desmosomes and tonofilaments. Melanocyte if stimulated by ultraviolet ray it will produce more pigment and reduced after stop exposure."},{"id":"om-33","type":"definition","title":"Defence cells:","content":"are infiltrated through epithelium to reach the surface such as lymphocytes, leukocytes, and mast cells."},{"id":"om-34","type":"table","content":"| Cells | Origin | Location | Function | Stained by |\n|---|---|---|---|---|\n| Langerhan's | Bone marrow | Spinous layer | Antigenic | Gold chloride |\n| Granstein | Bone marrow | Spinous layer | Antigenic | Gold chloride |\n| Merkel's | Neural crest | Basal layer | Touch receptor | Silver |\n| Melanocyte | Neural crest | Basal layer | Produce melanin | Dopa, and silver |\n| Defense cells | Bone marrow | All epithelium | Immunity | E&H |"},{"id":"om-35","type":"definition","title":"Rete ridges or epithelial ridges:","content":"Is the fold of the basement membrane to give the papillary shape of the lamina properia by intrance within the epithelium. The rete ridges increase the surface area of epithelium with lamina properia, and to provide strong junctional attachment. Therefore, the interface per unit area is much greater in masticatory than lining mucosa."},{"id":"om-36","type":"heading","title":"Lamina propria:","content":"The lamina propria with variable thickness provides support, nutritional and metabolic exchange into epithelium. It is connective tissue located close to the basement membrane of epithelium. It contains collagen and elastic fibers, it is penetrated by sensory nerve branches which may enter the epithelium (while blood capillaries lymphatics do not enter the epithelium)."},{"id":"om-37","type":"paragraph","content":"Lamina properia has 2 zones, without clear cut in between:\ni) Papillary zone: is the more superficial layer, consists of loose connective tissue with blood vessels, nerves, intercellular substance and capillary plexus which provide nutrition of all the mucosa. This zone with large amount of collagen fibers, and has loose connective tissue interdigitate with the basement membrane known as epithelial ridges or rete ridges.\nii) Dense or reticular zone: is the deep layer consists of dense connective tissue, with large amount of reticular fibers."},{"id":"om-38","type":"definition","title":"Submucosa:","content":"could be firm or loose attached to underlying connective tissue deep to the dense layer of lamina properia, contain fat cells, blood vessels, nerves, with subepithelial capillary plexus. It contains also loose connective tissue and may contain adipose tissue and minor salivary glands, it may overly the bone or muscle. The common cells are the fibroblast, PMN, mast cells, macrophages, and lymphocytes. The submucosa may or may not be present in some sites of oral cavity."},{"id":"om-39","type":"heading","title":"Innervation of oral mucosa","content":"The sensory nerve is located at anterior region of the oral cavity in the lamina properia and submucosa (tip of tongue, rugae palatine and lips). The sensory nerve fibers are represented by:"},{"id":"om-40","type":"list","content":["1/ Sensory free nerve ending located at lamina propria concerned with reception of touch and temperature stimuli include: Meissner and Ruffini corpuscles and Krause end bulbs.","2/ Specialized sensory cells Merkel cells for touch, and taste cells for taste sensation. The sensory nerve fibers are myelinated with various free nerve ending. The motor nerve fiber is the unmyelinated nerve fibers supply smooth muscle, blood vessels and glands."]},{"id":"om-41","type":"heading","title":"Function of oral mucosa","content":""},{"id":"om-42","type":"list","content":["1- Protection against: microbial toxins, oral environment, biting and mastication.","2- Sensation function due to the presence of: good receptor of: temperature, touch, pain, and taste. Reflexes of: swallowing, salivation, gagging, and thirst signal.","3- Has thermal regulation which play little part in regulation of body temperature.","4- Gives a moist surface due to the presence of saliva."]},{"id":"om-43","type":"heading","title":"Classification of oral mucosa according to their function","content":""},{"id":"om-44","type":"heading","title":"A) Lining mucosa:","content":"Associated with non-keratinized epithelium covers mainly the muscular part (lip and cheek vestibule, floor of the mouth, alveolar mucosa, ventral surface of the tongue, and soft palate). It has few connective tissue papilla and less pronounced rete ridges. All of the lining mucosa has same histological structure."},{"id":"om-45","type":"subheading","title":"Labial and buccal mucosa:","content":"Thin epithelium overly the lamina properia which contains extensive blood supply, adipose tissue, and minor salivary glands. It is firmly attached to underling musculature of inner lip and cheek vestibule, appear as opaque pink, shiny, moist, compressible tissue that stretches easily. The area of melanin pigment may be seen in this membrane, there is also variable number of Fordyce's spots. These spots are ectopic isolated sebaceous glands (75% of adults) scattered throughout the tissue of lip and cheek mucosa. These spots are due to misdisplaced of sebaceous glands or septum secretion."},{"id":"om-46","type":"subheading","title":"Vermilion border:","content":"is transitional region between oral mucosa and skin of lip, it is thick in infant because of suckling (suckling pad), it has non-keratinized epithelium, presented only in human, which becomes modified into keratinized epithelium in adult, differs from the skin or mucosa.\nVermilion border is red area because:"},{"id":"om-47","type":"list","content":["Epithelium is thin.","This epithelium contains eleiden (transparent protein).","The blood vessels are close to papillary layer of the lamina properia."]},{"id":"om-48","type":"subheading","title":"Floor of the mouth, and ventral tongue surface:","content":"Both of them are lining mucosa, they appear reddish color with vascular blue areas of veins, moist shiny with some mobility. Histologically, they have a very thin non-keratinized epithelium overly a lamina properia with an extensive vascular supply the connective tissue of lamina properia is broad. The submucosa of the floor of the mouth shows loose connective tissue with submandible and sublingual major salivary glands with the presence of some elastic fibers and few minor salivary glands to supply moisture."},{"id":"om-49","type":"subheading","title":"Alveolar mucosa (vestibular mucosa):","content":"Thin reddish pink nonkeratinized epithelium with blue vascular area, the papilla sometimes absent, the submucosa shows minor salivary glands and many elastic fibers."},{"id":"om-50","type":"subheading","title":"Soft palate:","content":"Clinically the posterior part of palate is soft deep pink moist surface, suitable for speech and swallowing. Histologically, it has thin non-keratinized epithelium overly thick lamina properia with deep papilla, it contains elastic layer for mobility to function as one unit. The submucosa shows also minor salivary glands giving its moisture."},{"id":"om-51","type":"heading","title":"B) Masticatory mucosa:","content":"Is part of mucosa includes free and attached gingiva, hard palate, and tongue dorsum, which has rubbery surface texture and resiliency, bound to the underling bone. Histologically, it is associated with the keratinized epithelium, with the presence of more clear rete ridges and connective tissue papillae, giving it a firm base suitable for mastication and speech, the submucosa is thin or sometimes absent."},{"id":"om-52","type":"subheading","title":"i/ Gingiva:","content":"Is part of oral mucosa covers alveolar bone of dental arch facially and lingually as masticatory type of oral mucosa."},{"id":"om-53","type":"subheading","title":"ii/ Hard palate:","content":"Is the anterior portion of palate, pink firm immobile part, its mucosa classified as masticatory type.\nIt has several anatomic parts:\ngingival region.\npalatal rugae.\nincisive papilla.\nmedian palatine raphae.\nfatty zone is the anterolateral area.\nglandular zone is the posterolateral area.\nHistologically, the epithelium is overly thick lamina properia, only the lateral portion of the hard palate have submucosa the anterior part contain adipose tissue, posterior part contains minor salivary glands. It has thin submucosa at lateral side that produces discomfort during local anesthesia. The submucosa is absent at the median portion, the lamina properia is firmly attached to underlying bone to serve as mucoperiosteum."},{"id":"om-54","type":"definition","title":"Epithelial pearls:","content":"Are keratinized epithelial cells arranged concentrically in the midline region of incisive papilla at the lamina properia, at the fusion line between palatine processes, they are remnant of Hertweg's root sheath."},{"id":"om-55","type":"subheading","title":"iii/ Specialized sensory mucosa:","content":"The dorsal surface is considered as masticatory and specialized type of mucosa. It has both ortho- and parakeratinized stratified squamus epithelium. It contains several types of lingual papilla, these papilla are found on the dorsum and the lateral surfaces of the tongue."},{"id":"om-56","type":"heading","title":"Types of lingual papillae:","content":""},{"id":"om-57","type":"definition","title":"Filiform:","content":"are the most common type located on the body of tongue dorsum does not contain taste buds, they are fine pointed conical shape, with central core, and with wide base and pointed tip turned toward the pharynx aid to guide the food toward pharynx during swallowing. Filiform papillae give rough surface of tongue, tactile sensation, pigments, hairy tongue. These papillae become smooth in case of glossitis."},{"id":"om-58","type":"definition","title":"Fungiform:","content":"are associated with the presence of taste buds located on the surface of tongue. They are less in number and have vascularized core produce red appearance. They have fungal shaped or triangle shape with wide surface and narrow base, they are not found at sulcus terminalis of the tongue."},{"id":"om-59","type":"definition","title":"Foliate:","content":"are associated with taste buds located at lateral sides of the tongue, they are few in number. It has parallel vertical walls. They are much in the animal and less in human."},{"id":"om-60","type":"definition","title":"Circumvallate (or vallate):","content":"have much number, associated with taste buds. They are large raised fungal shape located anterior to sulcus terminalis, arranged in rows facings the pharynx. The Von Ebner's minor salivary glands are presented in the submucosa of the circumvallate papillae deep to the lamina properia, this pure serous type with opening at the sulcus of the papillae."},{"id":"om-61","type":"heading","title":"Taste buds:","content":"Are barrel-shaped organ derived from epithelium, that extended from the basement membrane to the epithelial surface of the lingual papilla as high value (10000 buds) and less at soft palate (2500 buds), and in small amount in epiglottis, larynx and pharynx (400 buds). The turnover of the taste bud cells is fairly rapid with tissue renewed about 10 days."},{"id":"om-62","type":"subheading","title":"Structure of taste buds:","content":"Each taste bud is composed of 30 to 80 spindle shape cells, in 2 types of cells:\nthe supporting cells are located at the outer portion, their function to act as a capsule surround the taste cells.\nthe taste cells are located at central portion with the presence of superficial taste receptors responsible for making contact with food to produce taste sensation at the taste pore as an opening at the superficial portion of taste buds in the inferior portion. The taste buds are associated with sensory neuron process which receives the massages that send to the CNS."},{"id":"om-63","type":"subheading","title":"4 fundamental taste sensations:","content":""},{"id":"om-64","type":"list","content":["Salt sensations is seen along the front side of the tongue.","Sour sensations is seen on the posterior sides of the tongue.","Sweet sensations is seen in anterior tip of the tongue.","Bitter sensations is seen in the posterior centre of the tongue and soft palate."]},{"id":"om-65","type":"heading","title":"GINGIVA","content":""},{"id":"om-66","type":"definition","title":"Definition of gingiva:","content":"Gingiva is an oral mucous membrane surrounding maxillary and mandibular teeth covering the alveolar bone with stippled surface."},{"id":"om-67","type":"subheading","title":"The epithelium of gingiva is:","content":""},{"id":"om-68","type":"list","content":["non-keratinized epithelium 10% in the sulcus epithelium, interdental col, and junctional epithelium.","keratinized epithelium 15% as in free gingiva, and attached gingiva.","parakeratinized epithelium 75% in the attached gingiva."]},{"id":"om-69","type":"subheading","title":"Types of gingiva:","content":""},{"id":"om-70","type":"list","content":["Free gingiva, or marginal gingival.","Attached gingival.","Dentinogingival junction, gingival attachment, or junctional epithelium."]},{"id":"om-71","type":"subheading","title":"Free or marginal gingiva:","content":""},{"id":"om-72","type":"list","content":["is the part of gingiva which located close to the enamel surface but without contact.","it keeps a space with enamel surface known as gingival sulcus.","free gingiva of each tooth is continuous with the attached gingiva.","Free gingival groove: is the slight depression separate between free and attached gingiva, at the level of floor of the sulcus, and it is not clear line in some cases.","The marginal gingiva follows the scalloped pattern established by the curvature of cervical line. The part of free gingiva located between the crowns is known as interdental gingiva or papilla."]},{"id":"om-73","type":"subheading","title":"Interdental gingiva (papillary gingiva or gingival papilla):","content":"This is part of free gingiva which has triangle or pyramid-shape at the interdental space of anterior teeth, the apex is sharp with wide base. While in posterior teeth, it has concave surface with tent-shape (col)."},{"id":"om-74","type":"definition","title":"Gingival col (interdental col):","content":"is the concave form of interdental papilla between the buccal and lingual gingival surfaces apical to contact area of posterior teeth over the alveolar septum, it forms a vertical fold.\nis non visible depressed part structure of interdental papilla has non-keratinized epithelium varies in dept and width."},{"id":"om-75","type":"subheading","title":"Attached gingiva:","content":""},{"id":"om-76","type":"list","content":["It is part of gingiva which has tightly adherence to the alveolar bone surround the roots.","It is pink with melanin pigments, immobile dull firm structure.","The attached gingiva has evident gingival stippling, that stippled appearance with vertical shallow and elevated area, in case of disappear of gingival stippling in adult indicates odema.","Attached gingiva is with heavy epithelial ridges which has adaptation to mechanical force."]},{"id":"om-77","type":"subheading","title":"Mucogingival junction is the periphery between attached gingiva and:","content":""},{"id":"om-78","type":"list","content":["alveolar mucosa facially.","is the periphery between gingiva and hard palate in upper jaw lingually.","is the periphery between gingiva and floor of mouth in lower jaw lingually."]},{"id":"om-79","type":"subheading","title":"Histological struc
